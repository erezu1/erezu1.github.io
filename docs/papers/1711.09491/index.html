/g><\/g><\/svg><\/mjx-container>, <mjx-container data-tex=\"\\tau=0.1[\\text{sec}]\" class=\"MathJax\" jax=\"SVG\" style=\"--w:11.237ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"11.237ex\" height=\"2.262ex\" viewBox=\"0 -750 4966.6 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D70F\" href=\"#MJX-TEX-I-1D70F\"><\/use><use x=\"794.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(1850.6)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><use data-c=\"2E\" href=\"#MJX-TEX-N-2E\" transform=\"translate(500)\"><\/use><use data-c=\"31\" href=\"#MJX-TEX-N-31\" transform=\"translate(778)\"><\/use><\/g><use x=\"3128.6\" data-c=\"5B\" href=\"#MJX-TEX-N-5B\"><\/use><g transform=\"translate(3406.6)\"><use data-c=\"73\" href=\"#MJX-TEX-N-73\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(394)\"><\/use><use data-c=\"63\" href=\"#MJX-TEX-N-63\" transform=\"translate(838)\"><\/use><\/g><use x=\"4688.6\" data-c=\"5D\" href=\"#MJX-TEX-N-5D\"><\/use><\/g><\/g><\/svg><\/mjx-container>, Young’s modulus <mjx-container data-tex=\"E=2.5[\\text{MPa}]\" class=\"MathJax\" jax=\"SVG\" style=\"--w:13.642ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"13.642ex\" height=\"2.262ex\" viewBox=\"0 -750 6029.6 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D438\" href=\"#MJX-TEX-I-1D438\"><\/use><use x=\"1041.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2097.6)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><use data-c=\"2E\" href=\"#MJX-TEX-N-2E\" transform=\"translate(500)\"><\/use><use data-c=\"35\" href=\"#MJX-TEX-N-35\" transform=\"translate(778)\"><\/use><\/g><use x=\"3375.6\" data-c=\"5B\" href=\"#MJX-TEX-N-5B\"><\/use><g transform=\"translate(3653.6)\"><use data-c=\"4D\" href=\"#MJX-TEX-N-4D\"><\/use><use data-c=\"50\" href=\"#MJX-TEX-N-50\" transform=\"translate(917)\"><\/use><use data-c=\"61\" href=\"#MJX-TEX-N-61\" transform=\"translate(1598)\"><\/use><\/g><use x=\"5751.6\" data-c=\"5D\" href=\"#MJX-TEX-N-5D\"><\/use><\/g><\/g><\/svg><\/mjx-container> and Poisson ratio <mjx-container data-tex=\"\\nu=0.47\" class=\"MathJax\" jax=\"SVG\" style=\"--w:8.239ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"8.239ex\" height=\"1.717ex\" viewBox=\"0 -677 3641.6 759\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D708\" href=\"#MJX-TEX-I-1D708\"><\/use><use x=\"807.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(1863.6)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><use data-c=\"2E\" href=\"#MJX-TEX-N-2E\" transform=\"translate(500)\"><\/use><use data-c=\"34\" href=\"#MJX-TEX-N-34\" transform=\"translate(778)\"><\/use><use data-c=\"37\" href=\"#MJX-TEX-N-37\" transform=\"translate(1278)\"><\/use><\/g><\/g><\/g><\/svg><\/mjx-container>. A similar phase plot presented in Brinkmeyer <em>et al.<\/em> (<a href=\"#cite-BSP12\">2012<\/a>). <\/figcaption><\/figure>", "hash": "44d05557a207", "gist": {"html": "Predicted and observed stability phases of conical poppers over two geometric ratios, with computed flipping times against thickness.", "status": "ai-draft"}}, {"id": "root-p11", "kind": "paragraph", "body": "<p><strong class=\"runin\">Experimental results<\/strong> Our theory predicts that when examining viscoelastic structures, initially stable configurations will show no temporal evolution of the configuration and in particular always keep their stability. When held fixed in a non-extremal configuration <a data-def=\"stress-relaxation\">stress relaxation<\/a> could lead to new acquired stable configurations, whose stability is lost in time. These results hold for all incompressible linear viscoelastic bodies regardless of the form of the stress relaxation kernel. We next come to test these predictions by examining experimentally the response of silicone-rubber <a data-def=\"popper\">poppers<\/a>.<\/p>", "hash": "8e73040e4ec0", "gist": {"html": "Predictions to test: initially stable shapes never move; shapes held out of equilibrium may gain stability, then lose it.", "status": "ai-draft"}}, {"id": "root-p12", "kind": "paragraph", "body": "<p>We cast silicon rubber <a data-def=\"popper\">poppers<\/a> in the geometry of truncated-conical shells (FIG. <a href=\"#fig-hopper_popper\">3<\/a>a). The conical shells have an apex angle of <mjx-container data-tex=\"45^\\circ\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.25ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"3.25ex\" height=\"1.674ex\" viewBox=\"0 -718 1436.6 740\"><g transform=\"scale(1,-1)\"><g><g><g><use data-c=\"34\" href=\"#MJX-TEX-N-34\"><\/use><use data-c=\"35\" href=\"#MJX-TEX-N-35\" transform=\"translate(500)\"><\/use><\/g><g transform=\"translate(1033,404.1) scale(0.707)\"><use data-c=\"2218\" href=\"#MJX-TEX-N-2218\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, inner and outer radius radii <mjx-container data-tex=\"r_\\text{min},r_{max}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:9.255ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"9.255ex\" height=\"1.439ex\" viewBox=\"0 -442 4090.8 636\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D45F\" href=\"#MJX-TEX-I-1D45F\"><\/use><g transform=\"translate(484,-150) scale(0.707)\"><use data-c=\"6D\" href=\"#MJX-TEX-N-6D\"><\/use><use data-c=\"69\" href=\"#MJX-TEX-N-69\" transform=\"translate(833)\"><\/use><use data-c=\"6E\" href=\"#MJX-TEX-N-6E\" transform=\"translate(1111)\"><\/use><\/g><\/g><use x=\"1712.7\" data-c=\"2C\" href=\"#MJX-TEX-N-2C\"><\/use><g transform=\"translate(2157.4)\"><use data-c=\"1D45F\" href=\"#MJX-TEX-I-1D45F\"><\/use><g transform=\"translate(484,-150) scale(0.707)\"><use data-c=\"1D45A\" href=\"#MJX-TEX-I-1D45A\"><\/use><use x=\"878\" data-c=\"1D44E\" href=\"#MJX-TEX-I-1D44E\"><\/use><use x=\"1407\" data-c=\"1D465\" href=\"#MJX-TEX-I-1D465\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> and thickness <mjx-container data-tex=\"h\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.303ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"1.303ex\" height=\"1.595ex\" viewBox=\"0 -694 576 705\"><g transform=\"scale(1,-1)\"><use data-c=\"210E\" href=\"#MJX-TEX-I-210E\"><\/use><\/g><\/svg><\/mjx-container>. Sufficiently thin poppers show bistability with the inverted shape close to a mirror image of the undeformed state. As the thickness is increased this bistability is broken and when brought from rest to the inverted state the popper immediately snaps back. If the thickness is large enough this instability will persist regardless of how long we hold the conical shell in its inverted state. For intermediate values of the thickness we expect to observe unstable states that could acquire stability if held long enough in their inverted state. This <a data-def=\"acquired-stability\">acquired stability<\/a> is expected to be lost in a finite time. These three phases are plotted in FIG. <a href=\"#fig-hopper_popper\">3<\/a>c.<\/p>", "hash": "1c5fd6038d75", "gist": {"html": "Conical poppers: thin ones are bistable, thick ones snap at once, intermediate ones gain stability when held, then lose it.", "status": "ai-draft"}}, {"id": "root-p13", "kind": "paragraph", "body": "<p>The conical shell <a data-def=\"popper\">popper<\/a> geometry is completely determined by two dimensionless variables <mjx-container data-tex=\"r_{min}/h\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.559ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"6.559ex\" height=\"2.262ex\" viewBox=\"0 -750 2899.1 1000\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D45F\" href=\"#MJX-TEX-I-1D45F\"><\/use><g transform=\"translate(484,-150) scale(0.707)\"><use data-c=\"1D45A\" href to vary in time resulting in a covariant visco-elasto-plastic theory. The configurational response in such growth processes shows the evolution of <mjx-container data-tex=\"\\gbar_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"2.234ex\" viewBox=\"0 -693 1095.3 987.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> rather than directly that of <mjx-container data-tex=\"\\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"2.478ex\" height=\"2.892ex\" viewBox=\"0 -840.1 1095.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. Thus the viscoelastic response may cause a simple growth rule to appear complex, or cause an abrupt and localized growth events to seem diffuse and gradual.<\/p>", "hash": "32ef2e0703d9", "gist": {"html": "The elastic plus viscoelastic split of strain resembles elasto-plasticity; a time-dependent rest metric would add plasticity or growth.", "status": "ai-draft"}}, {"id": "root-p15", "kind": "paragraph", "body": "<p>The covariant description of viscoelasticity employing the notion of the <a data-def=\"reference-metric\">reference metric<\/a> <mjx-container data-tex=\"\\gbar_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"2.234ex\" viewBox=\"0 -693 1095.3 987.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> applies for all linear-viscoelastic materials. The result of <a data-def=\"stationarity\">metastable configuration stationarity<\/a> was, however, obtained under the restricting assumptions that the Poisson ratio associated with the elastic and viscoelastic response are similar, and that the system is brought instantaneously from its rest state to the metastable state. The former assumption may seem plausible for incompressible elastomers and gels, yet the later is expected to be violated by every physical experiment. While one could not prove full stationarity if these assumptions are lifted, the material’s response is continuous in the deviations from the idealized conditions and small deviations will result in very little motion, see Urbach and Efrati (<a href=\"#cite-UE18b\">2018<\/a>) for more details. In particular in the experiment we performed no discernible motion was observed for metastable state.<\/p>", "hash": "a544984901a8", "gist": {"html": "Stationarity assumes equal Poisson ratios and instantaneous loading; small deviations cause little motion, and none was observed.", "status": "ai-draft"}}, {"id": "root-p16", "kind": "paragraph", "body": "<p>The theory proves particularly powerful when applied to describe the <a data-def=\"delayed-instability\">delayed instability<\/a> in elastomeric thin shells. We have focused on stability classification in the present work, yet predict to be able to quantitatively describe the non-trivial dependence jumping time on the holding time in the inverted state, and in particular its divergence near the boundary between the unstable regimes and stable regime in FIG. <a href=\"#fig-hopper_popper\">3<\/a>c.<\/p>", "hash": "2e016879a529", "gist": {"html": "The theory should also give how snapping time depends on holding time, diverging near the stable phase.", "status": "ai-draft"}}, {"id": "root-p17", "kind": "paragraph", "body": "<p>The coupling of discrete singular fast deformations to slow <a data-def=\"creep\">creeping<\/a> evolution was recently suggested to underlie non-monotonous and history dependent evolution in <dfn data-def=\"athermal\">athermal systems<\/dfn>, allowing them to display glassy behavior without the need to invoke the notion of effective temperature Lahini <em>et al.<\/em> (<a href=\"#cite-LGAR17\">2017<\/a>). The analysis below ties this creeping evolution and elastic instability, to the notion of <dfn data-def=\"frustration\">frustration<\/dfn>, and the existence of a realizable stress free state, constraining the possible response such media can yield. Thus, it may provide insight not only to viscoelastic dynamics and instabilities of macroscopic systems, but may also apply to the meso-scale evolution of creeping athermal systems Matan <em>et al.<\/em> (<a href=\"#cite-KWWN02\">2002<\/a>).<\/p>", "hash": "9ba9ce445b76", "gist": {"html": "Tying creep and instability to frustration may also bear on the slow evolution of creeping athermal systems.", "status": "ai-draft"}}, {"id": "footnotes", "kind": "footnotes", "title": "Footnotes", "body": "<section class=\"footnotes\" aria-labelledby=\" /g><g transform=\"translate(510,497.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><g transform=\"translate(510,-297.3) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> is the inverse rest reference metric. We note that one could assume the material to be isotropic and uniform with respect to other metrics, for example with respect to <mjx-container data-tex=\"g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"1.666ex\" viewBox=\"0 -442 1095.3 736.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> (i.e. in the lab frame). Such theories will differ from the one presented here only in higher orders of the strain. The choice we make here is the most natural generalization for temporally evolving metrics, and is computationally favorable.<\/div><\/li><li id=\"fn2\"><a class=\"fnback\" href=\"#fnref2\" aria-label=\"Back to the text\">2<\/a><div class=\"fn-text\">The body is assumed to start with <mjx-container data-tex=\"\\gbar_{ij} = \\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.973ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"7.973ex\" height=\"2.892ex\" viewBox=\"0 -840.1 3524.1 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1373.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2428.8)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. Alternatively, <mjx-container data-tex=\"\\gbar_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"2.234ex\" viewBox=\"0 -693 1095.3 987.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> relaxes to <mjx-container data-tex=\"\\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"2.478ex\" height=\"2.892ex\" viewBox=\"0 -840.1 1095.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> independently of the behavior of the body <mjx-container data-tex=\"g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"1.666ex\" viewBox=\"0 -442 1095.3 736.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, thus after long enough relaxation we can take <mjx-container data-tex=\"\\gbar_{ij} = \\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.973ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"7.973ex\" height=\"2.892ex\" viewBox=\"0 -840.1 3524.1 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1373.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2428.8)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>.<\/div><\/li><li id=\"fn3\"><a class=\"fnback\" href=\"#fnref3\" aria-label=\"Back to the text\">3<\/a><div class=\"fn-text\">For the case of elasto-plasticity, a similar idea was first proved but never published by H. Aharony. This type of behavior was also conjecture Hayman (<a href=\"#cite-BH78\">1978<\/a>).<\/div><\/li><\/ol><\/section>", "hash": "b01b0bde079c"}, {"id": "refs", "kind": "references", "title": "References", "body": "<section class=\"references\" aria-labelledby=\"refs-h\"><h2 id=\"refs-h\">References<\/h2><ol class=\"refs\"><li id=\"cite-FSDM05\"><span class=\"reftext\"> Y.  Forterre, J. M. Skotheim, J.  Dumais, and L.  Mahadevan, Nature <strong> 433<\/strong>, 421 ( 2005)<\/span><\/li><li id=\"cite-PMVH14\"><span class=\"reftext\"> A.  Pandey, D. E. Moulton, D.  Vella, and D. P. Holmes, EPL (Europhysics Letters) <strong> 105<\/strong>, 24001 ( 2014)<\/span><\/li><li id=\"cite-GMV16\"><span class=\"reftext\"> M.  Gomez, D. E. Moulton, and D.  Vella, Nature Physics ( 2016)<\/span><\/li><li id=\"cite-FL01\"><span class=\"reftext\"> A. M. Freed and J.  Lin, Nature <strong> 411<\/strong>, 180 ( 2001)<\/span><\/li><li id=\"cite-RSA94\"><span class=\"reftext\"> Z.  Reches, G.  Schubert, and C.  Anderson, Journal of Geophysical Research: Solid Earth <strong> 99<\/strong>, 21983 ( 1994)<\/span><\/li><li id=\"cite-RC12\"><span class=\"reftext\"> R.  Christensen, <em> Theory of viscoelasticity: an introduction<\/em> ( Elsevier, 2012)<\/span><\/li><li id=\"cite-MS10\"><span class=\"reftext\"> M.  Santer, International Journal of Solids and Structures <strong> 47<\/strong>, 3263 ( 2010)<\/span><\/li><li id=\"cite-BSP12\"><span class=\"reftext\"> A.  Brinkmeyer, M.  Santer, A.  Pirrera, and P.  Weaver, International Journal of Solids and Structures <strong> 49<\/strong>, 1077 ( 2012)<\/span><\/li><li id=\"cite-KLK10\"><span class=\"reftext\"> J.  Kim, H. S. Lee, and N.  Kim, Journal of engineering mechanics <strong> 136<\/strong>, 1067 ( 2010)<\/span><\/li><li id=\"cite-AB09\"><span class=\"reftext\"> A. F. Bower, <em> Applied mechanics of solids<\/em> ( CRC press, 2009)<\/span><\/li><li id=\"cite-CN61\"><span class=\"reftext\"> B. D. Coleman and W.  Noll, Reviews of Modern Physics <strong> 33<\/strong>, 239 ( 1961)<\/span><\/li><li id=\"cite-UE18b\"><span class=\"reftext\"> E. Y. Urbach and E.  Efrati, ( 2018), unpublished<\/span><\/li><li id=\"cite-Note1\"><span class=\"reftext\">Assuming the material’s response is isotropic and homogeneous near its rest stationary state, the stiffness tensor take the form <mjx-container data-tex=\"C^{ijkl} = \\lambda \\ \\bar{g}_0^{ij} \\bar{g}_0^{kl} + 2\\mu \\ \\bar{g}_0^{ik} \\bar{g}_0^{jl}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:25.386ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.708ex;\" width=\"25.386ex\" height=\"2.945ex\" viewBox=\"0 -988.6 11220.5 1301.5\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D436\" href=\"#MJX-TEX-I-1D436\"><\/use><g transform=\"translate(845.3,363) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><use x=\"757\" data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><use x=\"1278\" data-c=\"1D459\" href=\"#MJX-TEX-I-1D459\"><\/use><\/g><\/g><use x=\"2287.4\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"3343.2\" data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><use x=\"3926.2\" data-c=\"A0\" href=\"#MJX-TEX-N-A0\"><\/use><g transform=\"translate(4176.2)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,497.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><g transform=\"translate(510,-297.3) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><g transform=\"translate(5271.5)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,363) scale(0.707)\"><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><use x=\"521\" data-c=\"1D459\" href=\"#MJX-TEX-I-1D459\"><\/use><\/g><g transform=\"translate(510,-295.7) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><use x=\"6632.8\" data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><use x=\"7633.1\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><use x=\"8133.1\" data-c=\"1D707\" href=\"#MJX-TEX-I-1D707\"><\/use><use x=\"8736.1\" data-c=\"A0\" href=\"#MJX-TEX-N-A0\"><\/use><g transform=\"translate(8986.1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,363) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><\/g><g transform=\"translate(510,-295.7) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><g transform=\"translate(10158.4)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,497.8) scale(0.707)\"><use data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><use x=\"412\" data-c=\"1D459\" href=\"#MJX-TEX-I-1D459\"><\/use><\/g><g transform=\"translate(510,-297.3) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, where <mjx-container data-tex=\"\\bar{g}_{0}^{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.708ex;\" width=\"2.478ex\" height=\"2.892ex\" viewBox=\"0 -965.2 1095.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,497.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><g transform=\"translate(510,-297.3) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> is the inverse rest reference metric. We note that one could assume the material to be isotropic and uniform with respect to other metrics, for example with respect to <mjx-container data-tex=\"g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"1.666ex\" viewBox=\"0 -442 1095.3 736.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> (i.e. in the lab frame). Such theories will differ from the one presented here only in higher orders of the strain. The choice we make here is the most natural generalization for temporally evolving metrics, and is computationally favorable.<\/span><\/li><li id=\"cite-SE10\"><span class=\"reftext\"> E.  Sharon and E.  Efrati, Soft Matter <strong> 6<\/strong>, 5693 ( 2010)<\/span><\/li><li id=\"cite-ESK09\"><span class=\"reftext\"> E.  Efrati, E.  Sharon, and R.  Kupferman, Journal of the Mechanics and Physics of Solids <strong> 57<\/strong>, 762 ( 2009)<\/span><\/li><li id=\"cite-ESK13\"><span class=\"reftext\"> E.  Efrati, E.  Sharon, and R.  Kupferman, Soft Matter <strong> 9<\/strong>, 8187 ( 2013)<\/span><\/li><li id=\"cite-Note2\"><span class=\"reftext\">The body is assumed to start with <mjx-container data-tex=\"\\bar{g}_{ij} = \\bar{g}^0_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.973ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"7.973ex\" height=\"2.892ex\" viewBox=\"0 -840.1 3524.1 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1373.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2428.8)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. Alternatively, <mjx-container data-tex=\"\\bar{g}_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"2.234ex\" viewBox=\"0 -693 1095.3 987.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> relaxes to <mjx-container data-tex=\"\\bar{g}^0_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"2.478ex\" height=\"2.892ex\" viewBox=\"0 -840.1 1095.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> independently of the behavior of the body <mjx-container data-tex=\"g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"1.666ex\" viewBox=\"0 -442 1095.3 736.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, thus after long enough relaxation we can take <mjx-container data-tex=\"\\bar{g}_{ij} = \\bar{g}^0_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.973ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"7.973ex\" height=\"2.892ex\" viewBox=\"0 -840.1 3524.1 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1373.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2428.8)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>.<\/span><\/li><li id=\"cite-NH56\"><span class=\"reftext\"> N. J. Hoff, The Aeronautical Quarterly <strong> 7<\/strong>, 1 ( 1956)<\/span><\/li><li id=\"cite-BH78\"><span class=\"reftext\"> B.  Hayman, in <em> Proceedings of the Royal Society of London A: Mathematical, Physical and Engineering Sciences<\/em>, Vol. 364 ( The Royal Society, 1978) pp. 393–414<\/span><\/li><li id=\"cite-Note3\"><span class=\"reftext\">For the case of elasto-plasticity, a similar idea was first proved but never published by H. Aharony. This type of behavior was also conjecture Hayman (<a href=\"#cite-BH78\">1978<\/a>).<\/span><\/li><li id=\"cite-EL69\"><span class=\"reftext\"> E. H. Lee ( ASME, 1969)<\/span><\/li><li id=\"cite-LGAR17\"><span class=\"reftext\"> Y.  Lahini, O.  Gottesman, A.  Amir, and S. M. Rubinstein, Physical Review Letters <strong> 118<\/strong>, 085501 ( 2017)<\/span><\/li><li id=\"cite-KWWN02\"><span class=\"reftext\"> K.  Matan, R. B. Williams, T. A. Witten, and S. R. Nagel, Physical Review Letters <strong> 88<\/strong>, 076101 ( 2002)<\/span><\/li><\/ol><\/section>", "hash": "747229ee4139"}], "gist": {"html": "<ul class=\"gist-list\">\n<li><b>Context<\/b> <span data-covers=\"root-p1 root-p2\">Viscoelastic structures, like elastomer shells, can creep, then snap; standard models give little intuition about which will.<\/span><\/li>\n<li><b>Result<\/b><ul>\n  <li data-claims=\"c-metric\"><span data-covers=\"root-p5 fig-1d_illustration\">Viscoelasticity is recast exactly as elasticity about a “reference metric”, local rest lengths that creep towards the present shape.<\/span><\/li>\n  <li data-claims=\"c-stationary\"><span data-covers=\"root-p9 fig-metric_space\">A body brought abruptly from rest into a stable shape never moves, though its stress relaxes.<\/span><\/li>\n  <li data-claims=\"c-predict\"><span data-covers=\"root-p8 root-p10 root-p11\">So late snaps need shapes unstable at rest that creep stabilised while held; that stability is eventually lost if not initially extremal.<\/span><\/li>\n  <li data-claims=\"c-poppers\"><span data-covers=\"root-p13 fig-hopper_popper\">For about 50 rubber poppers, predicted stability phases match experiment, given one measured constant.<\/span><\/li>\n<\/ul><\/li>\n<li><b>Why it matters<\/b> <span data-covers=\"root-p1 root-p2 root-p3\">Delayed instabilities were poorly understood, and evolving-stiffness models only qualitative; this allows a quantitative understanding.<\/span><\/li>\n<\/ul>", "status": "ai-draft", "variants": {"specialist": {"html": "<ul class=\"gist-list\">\n<li><b>Context<\/b> <span data-covers=\"root-p2\">Delayed instability is hard to predict: hereditary-integral models are rarely solvable, and evolving-stiffness models agree with experiment only qualitatively and miss creep at zero load.<\/span><\/li>\n<li><b>Result<\/b><ul>\n  <li data-claims=\"c-metric\"><span data-covers=\"root-p5\">An isotropic, incompressible linear viscoelastic law is exactly elasticity about a reference metric, <mjx-container data-tex=\"S^{ij}=\\tfrac12C^{ijkl}(g_{kl}-\\bar g ate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,363) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> stay collinear.<\/span><\/li>\n  <li data-claims=\"c-predict\"><span data-covers=\"root-p8 root-p10\">So delayed instability reduces to elastic stability of the rest system, <mjx-container data-tex=\"\\bar g=\\bar g^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.163ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"6.163ex\" height=\"2.351ex\" viewBox=\"0 -833.9 2724.1 1038.9\"><g transform=\"scale(1,-1)\"><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><use x=\"754.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(1810.6)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,363) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>: it needs stability acquired by creep, which is eventually lost for initially non-extremal states.<\/span><\/li>\n  <li data-claims=\"c-poppers\"><span data-covers=\"root-p12 root-p13\">For about 50 conical silicone poppers, with <mjx-container data-tex=\"\\beta=0.0928\\pm0.0077\" class=\"MathJax\" jax=\"SVG\" style=\"--w:19.633ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"19.633ex\" height=\"2.034ex\" viewBox=\"0 -705 8678 899\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"843.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(1899.6)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><use data-c=\"2E\" href=\"#MJX-TEX-N-2E\" transform=\"translate(500)\"><\/use><use data-c=\"30\" href=\"#MJX-TEX-N-30\" transform=\"translate(778)\"><\/use><use data-c=\"39\" href=\"#MJX-TEX-N-39\" transform=\"translate(1278)\"><\/use><use data-c=\"32\" href=\"#MJX-TEX-N-32\" transform=\"translate(1778)\"><\/use><use data-c=\"38\" href=\"#MJX-TEX-N-38\" transform=\"translate(2278)\"><\/use><\/g><use x=\"4899.8\" data-c=\"B1\" href=\"#MJX-TEX-N-B1\"><\/use><g transform=\"translate(5900)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><use data-c=\"2E\" href=\"#MJX-TEX-N-2E\" transform=\"translate(500)\"><\/use><use data-c=\"30\" href=\"#MJX-TEX-N-30\" transform=\"translate(778)\"><\/use><use data-c=\"30\" href=\"#MJX-TEX-N-30\" transform=\"translate(1278)\"><\/use><use data-c=\"37\" href=\"#MJX-TEX-N-37\" transform=\"translate(1778)\"><\/use><use data-c=\"37\" href=\"#MJX-TEX-N-37\" transform=\"translate(2278)\"><\/use><\/g><\/g><\/g><\/svg><\/mjx-container> from stress relaxation, the predicted bistable, delayed-snap and unstable phases agree very well with experiment.<\/span><\/li>\n<\/ul><\/li>\n<li><b>Why it matters<\/b> <span data-covers=\"root-p3\">Stationarity elucidates the subtle nature of delayed instabilities and allows their quantitative understanding;<\/span> <span data-covers=\"root-p17\">the paper suggests it may also apply to creeping athermal systems.<\/span><\/li>\n<\/ul>", "status": "ai-draft"}, "student": {"html": "<ul class=\"gist-list\">\n<li><b>Context<\/b> <span data-covers=\"root-p1 root-p2\">Rubber shells can creep slowly, then snap suddenly; standard models give little intuition about which will.<\/span><\/li>\n<li><b>Result<\/b><ul>\n  <li data-claims=\"c-metric\"><span data-covers=\"root-p5 fig-1d_illustration\">Each piece of material has preferred “reference lengths”, drifting towards its present lengths while held, back to rest once released.<\/span><\/li>\n  <li data-claims=\"c-stationary\"><span data-covers=\"root-p9 fig-metric_space\">A shell pushed suddenly from rest into an elastically stable shape never moves, though its stresses relax.<\/span><\/li>\n  <li data-claims=\"c-predict\"><span data-covers=\"root-p8 root-p10 root-p11\">So only shapes unstable at first can snap late, after creep stabilised them while held; it is lost if they started out of equilibrium.<\/span><\/li>\n  <li data-claims=\"c-poppers\"><span data-covers=\"root-p13 fig-hopper_popper\">Tests on about 50 cone-shaped rubber “poppers” match predictions using one measured number.<\/span><\/li>\n<\/ul><\/li>\n<li><b>Why it matters<\/b> <span data-covers=\"root-p1 root-p3\">Delayed snapping, from Venus flytraps to poppers, was poorly understood; this picture explains it quantitatively.<\/span><\/li>\n<\/ul>", "status": "ai-draft"}}}, "brief": {"html": "<p><span data-covers=\"root-p1 root-p2\">Jumping poppers, thin elastomer shells, creep slowly and then snap in a fraction of a second, as does the Venus flytrap leaf. Standard viscoelastic models simulate this well but are rarely solvable, so they say little about which structures will snap.<\/span> <span data-covers=\"root-p5 fig-1d_illustration\">The paper rewrites viscoelasticity as fast elasticity measured from reference lengths that slowly creep towards the present shape.<\/span> <span data-covers=\"root-p8 root-p10\">Whether a structure can snap late then reduces to its purely elastic stability at rest,<\/span> <span data-covers=\"root-p13\">and the predicted phases of conical poppers match experiment.<\/span><\/p>\n<p><span data-covers=\"root-p4\">A body's shape is described by its metric <mjx-container data-tex=\"g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"1.666ex\" viewBox=\"0 -442 1095.3 736.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) ten down without solving any dynamics.", "answeredBy": ["root-p5", "root-p6"]}, {"id": "q-stiffness", "at": {"node": "root-p2"}, "source": "ai", "status": "draft", "q": "How does this differ from modelling viscoelasticity as an evolving stiffness?", "a": "Earlier treatments of delayed instability let the material's stiffness change in time. The paper notes that these agree with experiment only qualitatively and cannot capture creep at zero load. In the metric description the stiffness is fixed and the reference lengths evolve, so a released body can keep creeping with no load, as its reference metric relaxes back towards the rest metric.", "answeredBy": ["root-p2", "fig-1d_illustration"]}, {"id": "q-kernel", "at": {"node": "root-p7"}, "source": "ai", "status": "draft", "q": "Do the results depend on the choice of the standard linear solid?", "a": "No. The stationary reference metric depends on <mjx-container data-tex=\"\\beta\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.281ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.281ex\" height=\"2.034ex\" viewBox=\"0 -705 566 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/svg><\/mjx-container> alone, and the stationarity property and its converse hold for any memory kernel. The standard linear solid, with one relaxation time, is chosen because its evolution law is a simple differential equation. The kernel matters for how fast things happen, such as the time to snap, not for which configurations are eventually stable.", "answeredBy": ["root-p7", "root-p9", "root-p11"]}, {"id": "q-no-motion", "at": {"node": "root-p9"}, "source": "ai", "status": "draft", "q": "How can the stress relax while nothing moves?", "a": "Because the relaxation happens inside the material. Starting from rest, the reference metric moves from the rest metric towards the present metric along the line joining them. The realised shape is the admissible metric closest to the reference metric, and along that line it stays the same one. So the stress drops by up to a fraction <mjx-container data-tex=\"\\beta\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.281ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.281ex\" height=\"2.034ex\" viewBox=\"0 -705 566 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/svg><\/mjx-container> while the shape stays put.", "answeredBy": ["root-p9", "fig-metric_space"]}, {"id": "q-contradiction", "at": {"node": "root-p10"}, "source": "ai", "status": "draft", "q": "A flipped popper creeps and then snaps. Does that not contradict stationarity?", "a": "No. Stationarity concerns shapes that are stable when first reached from rest; they never move. A popper that snaps late was unstable when first inverted, and only holding it inverted let creep make it stable. Its stability was acquired, and acquired stability in a shape that was not initially an equilibrium cannot last. So late snapping is predicted from the elastic stability of the rest state.", "answeredBy": ["root-p10", "root-p11"]}, {"id": "q-experiment", "at": {"node": "root-p13"}, "source": "ai", "status": "draft", "q": "What exactly was compared with experiment?", "a": "The stability phase of each of about 50 conical poppers: stable when inverted, snapping after a delay, or snapping at once. Each was inverted abruptly from rest, held for about a minute and released, and its time to snap was measured. <mjx-container data-tex=\"\\beta\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.281ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.281ex\" height=\"2.034ex\" viewBox=\"0 -705 566 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/svg><\/mjx-container> was measured independently by stress relaxation, and the phase boundaries in the plane of two geometric ratios were then computed with no free parameter fitted to the poppers.", "answeredBy": ["root-p13", "fig-hopper_popper"]}, {"id": "q-not-shown", "at": {"node": "root-p15"}, "source": "ai", "status": "draft", "q": "What does the paper not show?", "a": "Stationarity is proved only for equal elastic and viscoelastic Poisson ratios and instantaneous loading from rest; for real loading the paper argues that little motion results, citing a companion paper, where the proofs also appear. The experiment classifies stability phases but does not measure or compute how the time to snap depends on the holding time. Extensions to plasticity, growth and athermal systems are suggestions.", "answeredBy": ["root-p15", "root-p16", "root-p14"]}, {"id": "q-growth", "at": {"node": "root-p14"}, "source": "ai", "status": "draft", "q": "Why would viscoelasticity make growth look complicated?", "a": "If the rest metric itself changes in time, by plasticity or growth, the shape responds not to it directly but to the reference metric, which lags behind it viscoelastically. A simple growth rule can then appear complex, and abrupt, localised growth events can look diffuse and gradual in the observed shape.", "answeredBy": ["root-p14"]}]}</script>
<script>
// Conifer viewer. The dial chooses which document is read (gist, summary, paper, everything); each is a clean linear
// text. A tap on something in the text opens a peek (a sheet) with the related material: the paragraphs a summary
// sentence stands for, a definition, a footnote, an equation. The peek's header is the link into the paper, and
// travelling leaves a way back. Inline expansion exists only for folds (appendices, proofs, background notes).
(function () {
  'use strict';
  const mark = n => { try { performance.mark('conifer:' + n); } catch (e) {} };   // (startup phases, for measuring: see DESIGN.md)
  mark('start');
  document.querySelectorAll('link[data-font]').forEach(l => { l.media = 'all'; });   // the fonts, not blocking the first paint (build)
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = t => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const DOC = JSON.parse($('#conifer-doc').textContent);
  mark('parsed');
  const LEVELS = DOC.levels;
  const IDX = Object.fromEntries(LEVELS.map((l, i) => [l.key, i]));
  const GIST = IDX.gist ?? 0, BRIEF = IDX.brief ?? 1, SKIM = IDX.skim, PAPER = IDX.paper ?? LEVELS.length - 2, FULL = IDX.full ?? Infinity;      // (no tree declares an Everything level now: a fold opens by itself, never by depth)
  const LEVEL_HASH = LEVELS.map(l => ({ gist: 'gist', brief: 'summary', skim: 'skim', paper: 'paper', full: 'everything' })[l.key] || l.key);
  const BOX = { theorem: 'Theorem', definition: 'Definition', remark: 'Remark', proof: 'Proof', lemma: 'Lemma' };
  const HEADED = { references: 'References', footnotes: 'Footnotes', abstract: 'Abstract' };
  const titleOf = n => n.titleHtml || esc(n.title || '');
  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ------------------------------------------------------------------ the index
  const byId = new Map(), parentOf = new Map();
  (function walk(n, p) { byId.set(n.id, n); parentOf.set(n.id, p); (n.children || []).forEach(c => walk(c, n.id)); })(DOC.root, null);
  const defs = new Map((DOC.defs || []).map(d => [d.id, d]));
  const qsAt = new Map();
  (DOC.questions || []).forEach(q => { const k = q.at.node; if (!qsAt.has(k)) qsAt.set(k, []); qsAt.get(k).push(q); });
  const descendants = id => { const out = []; (function w(n) { out.push(n.id); (n.children || []).forEach(w); })(byId.get(id)); return out; };
  const questionsUnder = id => descendants(id).flatMap(i => qsAt.get(i) || []);
  const ancestors = id => { const out = []; let p = parentOf.get(id); while (p) { out.unshift(p); p = parentOf.get(p); } return out; };
  const depth = id => ancestors(id).length;
  const titled = id => { let n = byId.get(id); while (n && !n.title) n = byId.get(parentOf.get(n.id)); return n; };
  const anchorHost = new Map();          // an id inside a body (equation, footnote, figure, reference) -> the node holding it
  byId.forEach(n => { if (n.body) for (const m of n.body.matchAll(/ id="([^"]+)"/g)) anchorHost.set(m[1], n.id); });
  const words = h => (String(h || '').replace(/<[^>]+>/g, ' ').match(/[A-Za-z0-9Ͱ-Ͽ][^\s]*/g) || []).length;
  const texText = t => String(t || '').replace(/\\(?:mathcal|mathbb|mathrm|text|textrm|bf|rm)\{([^}]*)\}/g, '$1').replace(/\\([A-Za-z]+)/g, '$1').replace(/[${}]/g, '');
  const shortLabel = n => !n ? '' : n.number ? (n.kind === 'appendix' ? 'App. ' : '§') + n.number : (n.title || n.id);
  function placeName(id) { const t = titled(id); if (!t) return id; return texText(t.number ? shortLabel(t) + ' ' + t.title : t.title); }
  function placeHtml(id) { const t = titled(id); if (!t) return esc(id); return (t.number ? esc(shortLabel(t)) + ' ' : '') + titleOf(t); }
  const isFold = n => !!n.fold || n.kind === 'background';

  mark('indexed');
  // ------------------------------------------------------------------ the state
  const AUD = DOC.audiences || [];
  const state = { level: 0, over: new Map(), ledes: 'auto', chips: 'auto', theme: 'system',
    audience: (DOC.meta && DOC.meta.defaultAudience) || (AUD[0] && AUD[0].key) || '' };
  const audLabel = k => { const a = AUD.find(x => x.key === k); return a ? a.label : k; };
  const pick = t => (t && t.variants && t.variants[state.audience]) || t;
  const forMe = n => !n.audience || n.audience.includes(state.audience);
  const openByDefault = n => state.audience === 'student' && forMe(n);
  const skimHidden = () => SKIM !== undefined && state.audience === 'student';
  const ledesOn = () => state.ledes === true;                    // briefs are folded unless the reader opens them all
  const chipsOn = () => state.chips === true || (state.chips === 'auto' && state.audience !== 'specialist');
  function load() { try { const s = JSON.parse(localStorage.getItem('conifer-reader') || '{}'); ['ledes', 'chips', 'level', 'theme', 'audience'].forEach(k => { if (k in s && (k !== 'ledes' || s.lv === 2)) state[k] = s[k]; });
      if (!(state.level >= 0 && state.level < LEVELS.length)) state.level = Math.min(Math.max(+state.level || 0, 0), LEVELS.length - 1); } catch (e) {} }
  function save() { try { localStorage.setItem('conifer-reader', JSON.stringify({ lv: 2, level: state.level, ledes: state.ledes, chips: state.chips, theme: state.theme, audience: state.audience })); } catch (e) {} }
  function applyTheme() { const r = document.documentElement; if (state.theme === 'light' || state.theme === 'dark') r.dataset.theme = state.theme; else delete r.dataset.theme; }

  // terms: a mention of a defined term is a link only for the readers it is meant for
  const audienceDefs = html => html.replace(/<a data-def="([^"]+)">([\s\S]*?)<\/a>/g, (m, id, txt) => { const d = defs.get(id); return d && d.audience && !d.audience.includes(state.audience) ? txt : m; });

  // ------------------------------------------------------------------ rendering (HTML strings)
  function chip(t) {
    if (!chipsOn() || !t || !t.status) return '';
    const M = { author: ['author', 'Written by the author'], 'ai-approved': ['AI draft · approved', 'Drafted by the AI reader and checked by the author'], 'ai-draft': ['AI draft · unreviewed', 'Drafted by the AI reader; the author has not checked it yet'] };
    const m = M[t.status]; if (!m) return '';
    return `<span class="chip ${t.status}" title="${esc(m[1])}">${esc(m[0])}</span>`;
  }
  // a sentence of a summary and what it stands for: no mark in the text, a peek on a tap
  function withSpans(html, ctx) {
    if (ctx.plain) return html.replace(/<span data-covers="[^"]+">/g, '<span>');
    return html.replace(/<span data-covers="([^"]+)">/g, (m, c) => `<span class="gs" data-covers="${c}" role="button" tabindex="0" title="Show the part of the paper this stands for">`);
  }
  const stripIds = html => html.replace(/ id="([^"]*)"/g, ' id="peek-$1"');
  function qbadge(n, deep, ctx) {
    return '';
  }
  function qwords(id, deep) {
    const qs = deep ? questionsUnder(id) : (qsAt.get(id) || []);
    if (!qs.length) return '';
    return `<button type="button" class="qwords" data-q="${id}" data-deep="${deep ? 1 : 0}">${qs.length} question${qs.length > 1 ? 's' : ''}</button>`;
  }
  function qbadgeOld(n, deep, ctx) {
    if (ctx && ctx.prefix) return '';
    const qs = deep ? questionsUnder(n.id) : (qsAt.get(n.id) || []);
    if (!qs.length) return '';
    return `<button type="button" class="qbadge" data-q="${n.id}" data-deep="${deep ? 1 : 0}" title="Questions about this part" aria-label="${qs.length} question${qs.length > 1 ? 's' : ''} about this part">?<span>${qs.length}</span></button>`;
  }
  // the small controls' glyphs, drawn as lines (as every icon is: one 1.25px line, viewer.css), not typed
  const GL = {
    plus: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2.5v7M2.5 6h7"/></svg>',
    minus: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6h7"/></svg>',
    x: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6"/></svg>',
  };
  const circle = (act, key, open) => `<button type="button" class="fold-btn" data-act="toggle" data-key="${key}" title="${open ? 'Fold' : 'Open'}" aria-label="${open ? 'Fold' : 'Open'}" aria-expanded="${open}">${open ? GL.minus : GL.plus}</button>`;

  // THE FOLD PATTERN (one for everything that folds: a section's brief, a background note, an appendix, a proof).
  // A fold is a head that never moves and a body under it. The head is the same whether the fold is open or closed:
  // a circled +/− at the left and the title beside it; the whole head is the control. Only the body eases open
  // (its grid track goes from nothing to its size, so nothing is measured or redrawn) and wears the fold's box (a
  // rule at the left for a note). The head is a heading when the fold is a section (an appendix, a brief's section).
  function secHead(n, ctx, lead, foldKey) {
    const hl = Math.min(1 + depth(n.id), 5);
    const anchor = ctx.prefix ? '' : `<button type="button" class="anchor" data-copy="${n.id}" title="Copy a link to this section" aria-label="Copy a link to this section">&#182;</button>`;
    // the title's last word and what follows it (a question badge, the ¶) never part: a ¶ alone on a line reads as a stray mark
    const t = titleOf(n), tail = qbadge(n, false, ctx) + anchor, m = t.match(/^([\s\S]*?)(\S+)$/);
    const title = m && !/[<>]/.test(m[2]) ? `${m[1]}<span class="sec-last">${m[2]}${tail}</span>` : `${t}<span class="sec-last">${tail}</span>`;
    return n.title ? `<h${hl} class="sec-h" data-node="${n.id}"${foldKey ? ` data-fold="${foldKey}"` : ''}>${lead}<span class="secnum">${esc(n.number || '')}</span><span class="sec-t">${title}</span></h${hl}>` : '';
  }
  function foldBlock(n, open, L, ctx) {
    const key = ctx.prefix + n.id;
    const bg = n.kind === 'background';
    const lead = ctx.prefix ? '' : circle('toggle', key, open), fk = ctx.prefix ? '' : key;
    let head;
    if (n.kind === 'appendix' && n.children) head = secHead(n, ctx, lead, fk);
    else {
      const name = bg ? 'Background' : n.kind === 'appendix' ? esc('Appendix ' + (n.number || '')) : esc(n.title || BOX[n.kind] || 'More');
      const who = bg ? `<span class="fold-who">for ${esc((n.audience || []).map(a => audLabel(a).toLowerCase() + 's').join(' and '))}</span>` : '';
      const detail = bg ? `<span class="fold-title">${esc(n.title)} ${who}</span>` : `<span class="fold-detail">${n.kind === 'appendix' ? titleOf(n) : n.gist ? pick(n.gist).html : `${words(n.body || '')} words`}</span>`;
      head = `<div class="fold-head"${fk ? ` data-fold="${fk}"` : ''}>${lead}<span class="fold-name">${name}</span>${detail}${bg ? '' : who}</div>`;
    }
    // a closed fold in the page holds nothing until it is first opened (fillFold): the appendices, folded by default,
    // were a third of the Paper's elements, built and never seen by most readers
    const lazy = !open && !ctx.prefix && !ctx.shell;
    const inner = lazy ? '' : n.children ? wrap(n, L, ctx, true) : leaf(n, ctx, n.kind === 'proof');
    return `<div class="node fold${bg ? ' fold-bg' : ''}" data-state="${open ? 'open' : 'closed'}"${lazy ? ' data-lazy="1"' : ''} data-id="${n.id}" data-key="${key}"${ctx.prefix ? '' : ` id="${n.id}"`}>${head}<div class="fold-wrap"><div class="fold-body">${inner}</div></div></div>`;
  }
  function leaf(n, ctx, headless) {
    const key = ctx.prefix + n.id;
    const body = audienceDefs(ctx.prefix ? stripIds(n.body) : n.body);
    const box = BOX[n.kind];
    const inner = box && !headless ? body.replace(/^\s*<p>/, `<p><span class="box-head">${esc(n.title || box)}.</span> `) : box ? body.replace(/^\s*<p>/, `<p><span class="box-head">${esc(n.title || box)}.</span> `) : body;
    const head = HEADED[n.kind] ? `<h2 class="sec-h" data-node="${n.id}">${esc(n.title || HEADED[n.kind])}</h2>` : '';
    return `<div class="node leaf kind-${n.kind}" data-id="${n.id}" data-key="${key}"${ctx.prefix ? '' : ` id="${n.id}"`}>${head}${qbadge(n, false, ctx)}${inner}</div>`;
  }
  function ledeBlock(n, ctx) {
    const t = pick(n.brief);
    const who = t.status === 'author' ? 'by the author' : t.status === 'ai-approved' ? 'AI draft, approved' : t.status === 'ai-draft' ? 'AI draft' : '';
    const q = ctx.prefix ? '' : qwords(n.id, true);
    return `<div class="lede"><div class="lede-head"><span>In brief${who ? ` <span class="lede-who">· ${esc(who)}</span>` : ''}</span>${q}</div><div class="sum-body">${audienceDefs(withSpans(t.html, ctx))}</div></div>`;
  }
  function wrap(n, L, ctx, inFold) {
    const key = ctx.prefix + n.id;
    // the section's brief, at Paper depth: a fold under the title, as every fold is (a circled +/− at the left of the
    // title, which folds it as a whole); open by the reader's setting unless this one was folded or opened by hand.
    // In a peek, and inside an appendix (whose title's circle is the appendix's), the brief stands open as it is.
    const briefed = n.brief && L === PAPER && n.id !== DOC.root.id && n.title;
    const ledeKey = ctx.prefix + 'lede:' + n.id, foldable = briefed && !ctx.prefix && !inFold;
    const ledeOpen = foldable ? (ctx.over.has(ledeKey) ? ctx.over.get(ledeKey) >= 3 : ledesOn()) : ledesOn();
    const head = inFold ? '' : secHead(n, ctx, foldable ? circle('toggle', ledeKey, ledeOpen) : '', foldable ? ledeKey : '');
    const lede = foldable ? `<div class="node fold fold-lede" data-state="${ledeOpen ? 'open' : 'closed'}" data-key="${ledeKey}"><div class="fold-wrap"><div class="fold-body">${ledeBlock(n, ctx)}</div></div></div>`
      : briefed && ledeOpen ? ledeBlock(n, ctx) : '';
    const inner = ctx.shell ? '' : (n.children || []).map(c => render(c, L, ctx)).join('');   // (shell: drawn in slices, viewer.js draw)
    return `<section class="node sec kind-${n.kind}" data-id="${n.id}" data-key="${key}"${ctx.prefix || inFold ? '' : ` id="${n.id}"`}>${head}${lede}${inner}</section>`;
  }
  function render(n, inh, ctx) {
    const key = ctx.prefix + n.id;
    if (n.id === DOC.root.id && !ctx.prefix) return renderRoot(n, inh, ctx);
    if ((HEADED[n.kind] || n.kind === 'background') && inh < PAPER) return '';

      const M = svg.getScreenCTM().inverse(), pt = svg.createSVGPoint();
      pt.x = L; pt.y = T; const a = pt.matrixTransform(M);
      pt.x = R; pt.y = B; const b = pt.matrixTransform(M);
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('class', 'find-g');
      rect.setAttribute('x', a.x); rect.setAttribute('y', a.y); rect.setAttribute('width', b.x - a.x); rect.setAttribute('height', b.y - a.y);
      const rx = Math.min(b.x - a.x, b.y - a.y) * 0.18; rect.setAttribute('rx', rx); rect.setAttribute('ry', rx);
      svg.insertBefore(rect, svg.firstChild);
      return rect;
    } catch (e) { return null; }
  }

  // ------------------------------------------------------------------ finding
  // Only what is open is searched: the text inside a closed box (a background note, an appendix, a section's brief) is
  // left out, its head is not; opening or closing one searches again (viewer.js setFold).
  const CLOSED = '.fold[data-state="closed"] > .fold-wrap';
  let hits = [], at = -1, open = false, lastQ = '';
  const main = () => $('#paper');
  function textHits(q) {
    const out = [];
    const root = main(); if (!root) return out;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentNode.closest('mjx-container, .mjx-hl, .qbadge, .anchor, .fold-btn, button, ' + CLOSED) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
    const parts = []; let text = '', node;
    while ((node = walker.nextNode())) { parts.push({ node, start: text.length }); text += node.nodeValue; }
    const hay = text.toLowerCase();
    const needle = q.toLowerCase().replace(/\s+/g, ' ');
    const at = pos => { let lo = 0, hi = parts.length - 1; while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (parts[mid].start <= pos) lo = mid; else hi = mid - 1; } return { node: parts[lo].node, off: pos - parts[lo].start }; };
    let i = hay.indexOf(needle);
    while (i >= 0 && out.length < 2000) {
      const a = at(i), b = at(i + needle.length);
      const r = document.createRange(); r.setStart(a.node, a.off); r.setEnd(b.node, b.off);
      out.push({ range: r, el: a.node.parentElement });
      i = hay.indexOf(needle, i + Math.max(1, needle.length));
    }
    return out;
  }
  // a passage of words and formulas (as a selection gives it), as Epsilon finds it: the paper read as one stream, each
  // formula as its TeX between two marks, the words in any case and any spacing; a hit is the passage's words and
  // formulas in order, marked as words are (its formulas boxed)
  const BLOCKS = 'p, li, h1, h2, h3, h4, h5, h6, .display, figcaption, td, th, blockquote, .thm';
  function mixedHits(parts) {
    const root = main(); if (!root) return [];
    let text = '', last = null; const pieces = [];
    const walk = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, { acceptNode: n => {
      if (n.nodeType === 1) { if (n.matches('mjx-container[data-tex]')) return NodeFilter.FILTER_ACCEPT; if (n.matches('svg, script, style, button, .mjx-hl, .anchor') || n.matches(CLOSED)) return NodeFilter.FILTER_REJECT; return NodeFilter.FILTER_SKIP; }
      return NodeFilter.FILTER_ACCEPT; } });
    for (let n = walk.nextNode(); n; n = walk.nextNode()) {
      const blk = (n.nodeType === 1 ? n : n.parentNode).closest(BLOCKS);
      if (blk !== last) { text += '\n'; last = blk; }
      if (n.nodeType === 1) { const t = '\u0002' + texNorm(n.dataset.tex) + '\u0003'; pieces.push({ at: text.length, el: n, len: t.length }); text += t; }
      else { pieces.push({ at: text.length, node: n, len: n.data.length }); text += n.data.toLowerCase(); }
    }
    const re = new RegExp(parts.map(p => p.f != null ? '\u0002' + reEsc(texNorm(p.f)) + '\u0003' : reEsc(p.t.trim().toLowerCase()).replace(/\s+/g, '\\s+')).join('\\s*'), 'g');
    const at = k => { let lo = 0, hi = pieces.length - 1; while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (pieces[mid].at <= k) lo = mid; else hi = mid - 1; } return lo; };
    const out = []; let m;
    while ((m = re.exec(text)) && out.length < 500) {
      if (!m[0]) { re.lastIndex++; continue; }
      const i = m.index, j = i + m[0].length, a = pieces[at(i)], b = pieces[at(j - 1)], r = document.createRange();
      if (a.el) r.setStartBefore(a.el); else r.setStart(a.node, Math.max(0, i - a.at));
      if (b.el) r.setEndAfter(b.el); else r.setEnd(b.node, Math.min(b.len, j - b.at));
      const forms = pieces.slice(at(i), at(j - 1) + 1).filter(x => x.el).map(x => x.el);
      out.push({ range: r, el: (a.el || a.node.parentElement), forms });
    }
    return out;
  }
  function texHits(q) {
    const out = [], seq = glyphsOf(texNorm(q)), single = !!seq && seq.length === 1;
    $$('#paper mjx-container[data-tex]').forEach(f => {
      if (f.closest(CLOSED)) return;
      // a single symbol: wherever it is drawn (a paper's own macros for it too); more TeX: in formulas whose TeX has it
      if (!single && !texHas(f.dataset.tex, q)) return;
      const runs = seq ? glyphRuns(f, q) : null;
      if (runs && runs.length) runs.forEach(gs => out.push({ el: f, glyphs: gs }));
      else if (!single || texHas(f.dataset.tex, q)) out.push({ el: f });   // the formula as a whole
    });

  }
  function order(list) {
    const pos = h => h.range ? h.range.startContainer : h.el;
    return list.sort((x, y) => { const a = pos(x), b = pos(y); if (a === b) return 0; return a.compareDocumentPosition(b) & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1; });
  }
  function run(q, keep) {                        // keep: the reader stays where they are (a search again, after a box opened or closed)
    if (window.ConiferPaper) ConiferPaper.complete();   // (a Paper still being drawn in slices is finished first: viewer.js)
    clear();
    lastQ = q;
    const w = what(q);
    if (!w) { count(); return; }
    let list = [];
    if (w.mixed) list = mixedHits(w.mixed);          // "the trace $\mathrm{Tr}\,\rho$ is": the passage itself, words and formulas in order
    else {
      if (w.text) list = list.concat(textHits(w.text));
      if (w.tex) list = list.concat(texHits(w.tex));
    }
    hits = order(list);
    paint();
    if (!hits.length) { count(); return; }
    if (keep) {                                     // the first match from the top of the screen on, marked without moving
      const bar = $('#bar'), top = (bar ? bar.getBoundingClientRect().bottom : 0);
      let k = hits.findIndex(h => (h.range ? h.range.getBoundingClientRect() : (h.mark || h.el).getBoundingClientRect()).top >= top);
      go(k < 0 ? 0 : k, true, true);
    } else go(0, true);
  }
  function paint() {
    if (window.Highlight && CSS.highlights) {
      CSS.highlights.set('conifer-find', new Highlight(...hits.filter(h => h.range).map(h => h.range)));
    }
    hits.forEach(h => { if (h.range) { (h.forms || []).forEach(f => f.classList.add('find-f')); return; } if (h.glyphs) h.mark = markGlyphs(h.el, h.glyphs); else h.el.classList.add('find-f'); });
  }
  function clear() {
    if (window.CSS && CSS.highlights) { CSS.highlights.delete('conifer-find'); CSS.highlights.delete('conifer-find-now'); }
    $$('#paper .find-f, #paper .find-f-now').forEach(f => f.classList.remove('find-f', 'find-f-now'));
    $$('#paper .find-g').forEach(g => g.remove());
    hits = []; at = -1;
  }
  function count() {
    const c = $('#find-count'); if (!c) return;
    c.textContent = !lastQ.trim() ? '' : hits.length ? (at + 1) + ' of ' + hits.length : 'none';
  }
  function go(k, first, still) {
    if (!hits.length) return;
    at = (k + hits.length) % hits.length;
    const h = hits[at];
    if (window.Highlight && CSS.highlights) CSS.highlights.set('conifer-find-now', new Highlight(...(h.range ? [h.range] : [])));
    $$('#paper .find-f-now').forEach(f => f.classList.remove('find-f-now'));
    $$('#paper .find-g.now').forEach(g => g.classList.remove('now'));
    if (h.mark) h.mark.classList.add('now'); else if (!h.range) h.el.classList.add('find-f-now');
    (h.forms || []).forEach(f => f.classList.add('find-f-now'));   // (a passage's formulas are the one you are on too)
    const el = h.range ? (h.range.startContainer.nodeType === 3 ? h.range.startContainer.parentElement : h.range.startContainer) : h.el;
    if (still) { count(); return; }
    const r = h.range ? h.range.getBoundingClientRect() : (h.mark || el).getBoundingClientRect();
    const bar = $('#bar'); const top = (bar ? bar.getBoundingClientRect().bottom : 0) + 12;
    if (r.top < top || r.bottom > window.innerHeight - 24) { const rect = () => (h.range ? h.range.getBoundingClientRect() : (h.mark || el).getBoundingClientRect()); window.ConiferScroll.land(() => window.scrollY + rect().top - top - window.innerHeight * 0.3, !first); }
    count();
  }

  // ------------------------------------------------------------------ the field in the bar
  let timer = null;
  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // what is selected in the text, as a query: its words as they are, each formula as its TeX (as written, the way
  // the search reads formulas), spaces made single; nothing if nothing is selected in the paper, a peek or a sheet
  function selectedQuery() {
    const sel = window.getSelection(); if (!sel || !sel.rangeCount || sel.isCollapsed) return '';
    const r = sel.getRangeAt(0), at = r.commonAncestorContainer, el = at.nodeType === 1 ? at : at.parentElement;
    if (!el || !el.closest('#paper, #peek-body, #sheet-body, #pop')) return '';
    const walk = n => {
      if (n.nodeType === 3) return n.nodeValue;
      if (n.nodeType !== 1 && n.nodeType !== 11) return '';
      if (n.nodeType === 1 && n.tagName === 'MJX-CONTAINER') return ' $' + (n.getAttribute('data-tex') || '').trim() + '$ ';
      if (n.nodeType === 1 && n.matches('.qbadge, .anchor, .fold-btn, .x-btn, .eqno, .mjx-hl, script, style')) return '';
      let t = ''; n.childNodes.forEach(c => { t += walk(c); }); return t;
    };
    let q = walk(r.cloneContents()).replace(/\s+/g, ' ').trim();
    if (/^\$[^$]*\$$/.test(q) === false) q = q.replace(/^\$\s*\$|\$\s*\$$/g, '');
    return q.length > 300 ? '' : q;                 // (a whole page selected is not a query)
  }
  function show(on) {                              // the search takes the tab row (the lane, viewer.js): the labels give way to the field
    if (open === on) { if (on) { const q = selectedQuery(); if (q) { const f = $('#find-input'); f.value = q; f.focus(); run(q); } } return; }
    const picked = on ? selectedQuery() : '';        // (read before the field takes the focus, and the selection with it)
    open = on;
    const bar = $('#bar'), find = $('#find-row'); if (!bar || !find) return;
    const sb = $('.bar-search'); if (sb) sb.setAttribute('aria-label', on ? 'Close the search' : 'Search in the paper');
    if (on) {
      find.hidden = false; void find.offsetWidth;
      bar.classList.add('searching');
      if (window.ConiferLane) ConiferLane.search(true);
      const f = $('#find-input'); f.value = picked || lastQ; f.focus(); f.select(); if (f.value) run(f.value);   // (a selection is searched at once)
    } else {
      clear(); count();
      const f = $('#find-input'); if (f && document.activeElement === f) f.blur();
      bar.classList.remove('searching');
      if (window.ConiferLane) ConiferLane.search(false);
      setTimeout(() => { if (!open) find.hidden = true; }, reduced() ? 0 : 180);
    }
  }
  window.ConiferSearch = {
    open: () => show(true), close: () => show(false), toggle: () => show(!open), isOpen: () => open,
    refresh: () => { if (open && lastQ) run(lastQ, true); },
  };
  document.addEventListener('input', e => {
    if (e.target.id !== 'find-input') return;
    clearTimeout(timer);
    const q = e.target.value;
    timer = setTimeout(() => run(q), 180);
  });
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && !e.altKey && !e.shiftKey && e.key.toLowerCase() === 'f') { e.preventDefault(); show(true); return; }   // Ctrl+F / Cmd+F is this search
    if (!open) return;
    if (e.key === 'Escape') { if (document.querySelector('#pop:not([hidden]), #sheet:not([hidden]), #peek:not([hidden])')) return; e.preventDefault(); show(false); return; }   // (a layer over the page closes first)
    if (e.target.id === 'find-input' && e.key === 'Enter') { e.preventDefault(); go(at + (e.shiftKey ? -1 : 1)); }
  });
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-find]'); if (!t) return;
    const a = t.dataset.find;
    if (a === 'open') show(true); else if (a === 'close') show(false); else if (a === 'next') go(at + 1); else if (a === 'prev') go(at - 1);
  });
})();

// Conifer: copying, as Epsilon does it. A selection copied from the paper carries each formula as its TeX, $...$ in
// a line and \[...\] on a line of its own, with the paper's own macros written out so that it works anywhere; the
// standard physics and braket commands are left as they are. Nothing else about the text changes.
(function () {
  'use strict';
  const DOC = JSON.parse(document.getElementById('conifer-doc').textContent);
  const MACROS = (DOC.meta && DOC.meta.macros) || {};
  const names = Object.keys(MACROS).sort((a, b) => b.length - a.length);
  // a macro's body and how many arguments it takes, in MathJax's forms: "body" or ["body", n] or ["body", n, "default"]
  const defOf = n => { const m = MACROS[n]; return Array.isArray(m) ? { body: String(m[0]), n: +m[1] || 0, dflt: m[2] } : { body: String(m), n: 0 }; };
  function group(s, i) {                             // the brace group (or single token) starting at i: [text, end]
    while (i < s.length && /\s/.test(s[i])) i++;
    if (s[i] === '{') { let d = 0, j = i; for (; j < s.length; j++) { if (s[j] === '{') d++; else if (s[j] === '}') { d--; if (!d) return [s.slice(i + 1, j), j + 1]; } } return [s.slice(i + 1), s.length]; }
    if (s[i] === '\\') { const m = /^\\([A-Za-z]+|.)/.exec(s.slice(i)); return [m[0], i + m[0].length]; }
    return [s[i] || '', i + 1];
  }
  function expand(tex) {
    if (!names.length) return tex;
    let s = tex;
    for (let pass = 0; pass < 12; pass++) {
      let changed = false, out = '', i = 0;
      while (i < s.length) {
        if (s[i] !== '\\') { out += s[i++]; continue; }
        const m = /^\\([A-Za-z]+)/.exec(s.slice(i));
        if (!m || !MACROS.hasOwnProperty(m[1])) { out += s[i]; i++; continue; }
        const d = defOf(m[1]); let j = i + m[0].length; const args = [];
        if (d.n) {
          let k = 0;
          if (d.dflt !== undefined) { if (/^\s*\[/.test(s.slice(j))) { const e = s.indexOf(']', j); args.push(s.slice(s.indexOf('[', j) + 1, e)); j = e + 1; } else args.push(d.dflt); k = 1; }
          for (; k < d.n; k++) { const g = group(s, j); args.push(g[0]); j = g[1]; }
        }
        out += d.body.replace(/#(\d)/g, (x, q) => args[+q - 1] !== undefined ? args[+q - 1] : x) + (/[A-Za-z]/.test(s[j] || '') && !d.n ? ' ' : '');
        i = j; changed = true;

    }

  }
  function textOf(node) {                            // the text of a copied fragment, formulas as TeX
    if (node.nodeType === 3) return node.nodeValue;
    if (node.nodeType === 11) { let f = ''; node.childNodes.forEach(c => { f += textOf(c); }); return f; }
    if (node.nodeType !== 1) return '';
    if (node.tagName === 'MJX-CONTAINER') {
      const tex = expand(node.getAttribute('data-tex') || '').trim();
      return node.getAttribute('display') === 'true' ? '\n\\[ ' + tex + ' \\]\n' : '$' + tex + '$';
    }
    if (node.tagName === 'BR') return '\n';
    if (node.matches('.qbadge, .anchor, .fold-btn, .x-btn, .eqno, script, style')) return '';
    let t = '';
    node.childNodes.forEach(c => { t += textOf(c); });
    const block = /^(P|DIV|LI|H[1-6]|SECTION|FIGCAPTION|TR|BLOCKQUOTE|PRE|OL|UL|FIGURE)$/.test(node.tagName);
    return block ? t.replace(/\s+$/, '') + '\n\n' : t;
  }
  window.ConiferCopy = { expand, textOf };
  document.addEventListener('copy', e => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    const within = range.commonAncestorContainer.nodeType === 1 ? range.commonAncestorContainer : range.commonAncestorContainer.parentElement;
    if (!within.closest('#paper, #sheet-body, #peek-body, #pop')) return;
    const frag = range.cloneContents();
    if (!frag.querySelector('mjx-container')) return;        // plain text copies as the browser does

})();
