=\"#MJX-TEX-I-1D460\"><\/use><use x=\"12433.7\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"12822.7\" data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><use x=\"13342.7\" data-c=\"1D460\" href=\"#MJX-TEX-I-1D460\"><\/use><g transform=\"translate(13811.7,0) translate(0 -0.5)\"><use data-c=\"29\" href=\"#MJX-TEX-S3-29\"><\/use><\/g><\/g><use x=\"20511.5\" data-c=\"2E\" href=\"#MJX-TEX-N-2E\"><\/use><\/g><\/g><\/svg><\/mjx-container><\/div><span class=\"eqno\">(2)<\/span><\/div>\n<p class=\"cont\">Here <mjx-container data-tex=\"C^{ijkl}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.547ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"4.547ex\" height=\"1.981ex\" viewBox=\"0 -853.7 2009.7 875.7\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D436\" href=\"#MJX-TEX-I-1D436\"><\/use><g transform=\"translate(845.3,363) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><use x=\"757\" data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><use x=\"1278\" data-c=\"1D459\" href=\"#MJX-TEX-I-1D459\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> is the isotropic stiffness tensor <sup class=\"fnref\"><a href=\"#fn1\" id=\"fnref1\">1<\/a><\/sup>. <mjx-container data-tex=\"S^{ij}(t)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.552ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"5.552ex\" height=\"2.444ex\" viewBox=\"0 -830.4 2453.9 1080.4\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D446\" href=\"#MJX-TEX-I-1D446\"><\/use><g transform=\"translate(729.6,363) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1314.9\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1703.9\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"2064.9\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> denote the <dfn data-def=\"pk2\">second Piola-Kirchhoff stress<\/dfn> tensor, which through the equation above depends on the full history of the the strain tensor<\/p>\n<div class=\"display\" id=\"eq-strain_relation\"><div class=\"eqbody\"><mjx-container data-tex=\"\\e_{ij}(t) = \\tfrac 1 2 \\left(g_{ij}(t)-\\gbaro_{ij} \\right).\" class=\"MathJax\" jax=\"SVG\" display=\"true\" style=\"--w:22.843ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.892ex;\" width=\"22.843ex\" height=\"2.892ex\" viewBox=\"0 -883.9 10096.4 1278.1\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D700\" href=\"#MJX-TEX-I-1D700\"><\/use><g transform=\"translate(499,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1084.3\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1473.3\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"1834.3\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"2501.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(3556.8)\"><g><g transform=\"translate(220,394) scale(0.707)\"><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><g transform=\"translate(220,-345) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><rect width=\"553.6\" height=\"60\" x=\"120\" y=\"220\"><\/rect><\/g><\/g><g transform=\"translate(4350.4)\"><g transform=\"translate(0 -0.5)\"><use data-c=\"28\" href=\"#MJX-TEX-SO-28\"><\/use><\/g><g transform=\"translate(458)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1553.3\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1942.3\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"2303.3\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"2914.5\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><g transform=\"translate(3914.7)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,413) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-250) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><g transform=\"translate(5010,0) translate(0 -0.5)\"><use data-c=\"29\" href=\"#MJX-TEX-SO-29\"><\/use><\/g><\/g><use x=\"9818.4\" data-c=\"2E\" href=\"#MJX-TEX-N-2E\"><\/use><\/g><\/g><\/svg><\/mjx-container><\/div><span class=\"eqno\">(3)<\/span><\/div>\n<p class=\"cont\">The metric <mjx-container data-tex=\"g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"1.666ex\" viewBox=\"0 -442 1095.3 736.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> measures lengths in the material and uniquely describes the configuration of the elastic body. We have also introduced the <em>rest <a data-def=\"reference-metric\">reference metric<\/a><\/em>, <mjx-container data-tex=\"\\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"2.478ex\" height=\"2.892ex\" viewBox=\"0 -840.1 1095.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, the metric at which the system is locally stress-free and stationary. That is, if the elastic solid was to be cut to infinitesimal pieces and each of the pieces allowed to freely relax indefinitely, then the lengths in each of the pieces as given by the metric would approach the lengths given by the <a data-def=\"rest-reference-metric\">rest reference metric<\/a>, <mjx-container data-tex=\"\\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"2.478ex\" height=\"2.892ex\" viewBox=\"0 -840.1 1095.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. For a more detailed description of covariant elasticity using <dfn data-def=\"metric-tensor\">metric tensors<\/dfn> the reader is referred to Urbach and Efrati (<a href=\"#cite-UE18b\">2018<\/a>); Sharon and Efrati (<a href=\"#cite-SE10\">2010<\/a>).<\/p>", "hash": "e76b3712c24e", "gist": {"html": "Sets up linear viscoelasticity as a memory-kernel law, with strain measured as the metric minus the rest reference metric.", "status": "ai-draft"}}, {"id": "bg-linear-ve", "kind": "background", "title": "Linear viscoelasticity and spring-dashpot models", "audience": ["student", "physicist"], "fold": true, "body": "<p>In linear viscoelasticity a material responds to a strain history by adding up the responses to each past increment of strain (Boltzmann superposition). The stress is then a convolution, <mjx-container data-tex=\"\\sigma(t)=\\int G(t-s)\\dot\\varepsilon(s)\\,ds\" class=\"MathJax\" jax=\"SVG\" style=\"--w:23.316ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.691ex;\" width=\"23.316ex\" height=\"2.514ex\" viewBox=\"0 -805.5 10305.7 1111\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D70E\" href=\"#MJX-TEX-I-1D70E\"><\/use><use x=\"571\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"960\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"1321\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"1987.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(3043.6,0) translate(0 0.5)\"><use data-c=\"222B\" href=\"#MJX-TEX-SO-222B\"><\/use><\/g><use x=\"3820.2\" data-c=\"1D43A\" href=\"#MJX-TEX-I-1D43A\"><\/use><use x=\"4606.2\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"4995.2\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"5578.4\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"6578.7\" data-c=\"1D460\" href=\"#MJX-TEX-I-1D460\"><\/use><use x=\"7047.7\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><g transform=\"translate(7436.7)\"><g><use data-c=\"1D700\" href=\"#MJX-TEX-I-1D700\"><\/use><g transform=\"translate(316.3,8) translate(-250 0)\"><use data-c=\"2D9\" href=\"#MJX-TEX-N-2D9\"><\/use><\/g><\/g><\/g><use x=\"7902.7\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"8291.7\" data-c=\"1D460\" href=\"#MJX-TEX-I-1D460\"><\/use><use x=\"8760.7\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><g transform=\"translate(9149.7)\"><g><\/g><\/g><use x=\"9316.7\" data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><use x=\"9836.7\" data-c=\"1D460\" href=\"#MJX-TEX-I-1D460\"><\/use><\/g><\/g><\/svg><\/mjx-container>, where the relaxation function <mjx-container data-tex=\"G(t)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.355ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"4.355ex\" height=\"2.262ex\" viewBox=\"0 -750 1925 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D43A\" href=\"#MJX-TEX-I-1D43A\"><\/use><use x=\"786\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1175\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"1536\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> is the stress that follows a unit step of strain. Spring-dashpot models build such laws from ideal parts: a spring gives stress proportional to strain, a dashpot stress proportional to strain rate. A spring and dashpot in series (a Maxwell element) relax all stress, like a fluid. Adding a second spring in parallel gives the <a data-def=\"sls\">standard linear solid<\/a>, whose stress relaxes from an instantaneous modulus to a smaller long-time one with a single time <mjx-container data-tex=\"\\tau\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.17ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.029ex;\" width=\"1.17ex\" height=\"1.005ex\" viewBox=\"0 -431 517 444\"><g transform=\"scale(1,-1)\"><use data-c=\"1D70F\" href=\"#MJX-TEX-I-1D70F\"><\/use><\/g><\/svg><\/mjx-container>. Every linear <a data-def=\"viscoelastic-solid\">viscoelastic solid<\/a> has such an instantaneous and a long-time stiffness. In the paper's form, <mjx-container data-tex=\"G(t)=C(1-\\beta+\\beta\\phi(t))\" class=\"MathJax\" jax=\"SVG\" style=\"--w:24.001ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"24.001ex\" height=\"2.262ex\" viewBox=\"0 -750 10608.4 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D43A\" href=\"#MJX-TEX-I-1D43A\"><\/use><use x=\"786\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1175\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"1536\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"2202.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"3258.6\" data-c=\"1D436\" href=\"#MJX-TEX-I-1D436\"><\/use><use x=\"4018.6\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"4407.6\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"5129.8\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"6130\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"6918.2\" data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><use x=\"7918.4\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"8484.4\" data-c=\"1D719\" href=\"#MJX-TEX-I-1D719\"><\/use><use x=\"9080.4\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"9469.4\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"9830.4\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"10219.4\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>: <mjx-container data-tex=\"\\beta\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.281ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.281ex\" height=\"2.034ex\" viewBox=\"0 -705 566 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/svg><\/mjx-container> is the fraction of stiffness lost, and the kernel <mjx-container data-tex=\"\\phi\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.348ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"1.348ex\" height=\"2.034ex\" viewBox=\"0 -694 596 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D719\" href=\"#MJX-TEX-I-1D719\"><\/use><\/g><\/svg><\/mjx-container> says how fast.<\/p>"}, {"id": "bg-metric-strain", "kind": "background", "title": "Strain from metrics", "audience": ["student"], "fold": true, "body": "<p>Label each material point by coordinates <mjx-container data-tex=\"x^i\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.034ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"2.034ex\" height=\"1.904ex\" viewBox=\"0 -830.4 899 841.4\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D465\" href=\"#MJX-TEX-I-1D465\"><\/use><g transform=\"translate(605,363) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> that move with the body. The metric <mjx-container data-tex=\"g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"1.666ex\" viewBox=\"0 -442 1095.3 736.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> gives the length of a small material segment in the deformed body, <mjx-container data-tex=\"dl^2=g_{ij}dx^idx^j\" class=\"MathJax\" jax=\"SVG\" style=\"--w:14.861ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"14.861ex\" height=\"2.552ex\" viewBox=\"0 -833.9 6568.7 1128.2\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><g transform=\"translate(520)\"><use data-c=\"1D459\" href=\"#MJX-TEX-I-1D459\"><\/use><g transform=\"translate(331,363) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><use x=\"1532.3\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2588.1)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"3683.4\" data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><g transform=\"translate(4203.4)\"><use data-c=\"1D465\" href=\"#MJX-TEX-I-1D465\"><\/use><g transform=\"translate(605,363) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><use x=\"5102.3\" data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><g transform=\"translate(5622.3)\"><use data-c=\"1D465\" href=\"#MJX-TEX-I-1D465\"><\/use><g transform=\"translate(605,363) scale(0.707)\"><use data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>; in terms of the deformation gradient <mjx-container data-tex=\"F\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.695ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"1.695ex\" height=\"1.538ex\" viewBox=\"0 -680 749 680\"><g transform=\"scale(1,-1)\"><use data-c=\"1D439\" href=\"#MJX-TEX-I-1D439\"><\/use><\/g><\/svg><\/mjx-container> it is <mjx-container data-tex=\"F^TF\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.828ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"4.828ex\" height=\"1.904ex\" viewBox=\"0 -841.7 2134.1 841.7\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D439\" href=\"#MJX-TEX-I-1D439\"><\/use><g transform=\"translate(837.3,363) scale(0.707)\"><use data-c=\"1D447\" href=\"#MJX-TEX-I-1D447\"><\/use><\/g><\/g><use x=\"1385.1\" data-c=\"1D439\" href=\"#MJX-TEX-I-1D439\"><\/use><\/g><\/g><\/svg><\/mjx-container>. A rest <a data-def=\"reference-metric\">reference metric<\/a> <mjx-container data-tex=\"\\bar g^0_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"2.478ex\" height=\"2.892ex\" viewBox=\"0 -840.1 1095.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> gives the same segment's length in the stress-free state. Half their difference, <mjx-container data-tex=\"\\varepsilon_{ij}=\\tfrac12(g_{ij}-\\bar g^0_{ij})\" class=\"MathJax\" jax=\"SVG\" style=\"--w:16.747ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"16.747ex\" height=\"2.948ex\" viewBox=\"0 -864.9 7402.4 1303\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D700\" href=\"#MJX-TEX-I-1D700\"><\/use><g transform=\"translate(499,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1362.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2417.8)\"><g><g transform=\"translate(220,394) scale(0.707)\"><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><g transform=\"translate(220,-345) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><rect width=\"553.6\" height=\"60\" x=\"120\" y=\"220\"><\/rect><\/g><\/g><use x=\"3211.4\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><g transform=\"translate(3600.4)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"4917.9\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><g transform=\"translate(5918.1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"7013.4\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>, is the Green–Lagrange strain: it vanishes under rigid rotations and measures stretching exactly even when rotations are large, as in a shell turned inside out. The stress that pairs with this strain in the elastic energy is the <a data-def=\"pk2\">second Piola–Kirchhoff stress<\/a> <mjx-container data-tex=\"S^{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.975ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"2.975ex\" height=\"1.929ex\" viewBox=\"0 -830.4 1314.9 852.4\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D446\" href=\"#MJX-TEX-I-1D446\"><\/use><g transform=\"translate(729.6,363) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, defined in the material coordinates rather than in the lab. For small strains both reduce to the familiar linear strain and Cauchy stress. Because a metric is defined pointwise, the reference metric need not come from any shape, which is what lets the paper make it evolve.<\/p>"}, {"id": "root-p5", "kind": "paragraph", "body": "<p>Eq. <a href=\"#eq-tensor_linear_viscoelasticity\">(2)<\/a> predicts that instantaneous incremental deformations <mjx-container data-tex=\"\\Delta g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.363ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"4.363ex\" height=\"2.286ex\" viewBox=\"0 -716 1928.3 1010.2\"><g transform=\"scale(1,-1)\"><g><use data-c=\"394\" href=\"#MJX-TEX-N-394\"><\/use><g transform=\"translate(833)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> lead to linear stress increments <mjx-container data-tex=\"\\Delta S^{ij} = C^{ijkl} \\tfrac{1}{2} \\Delta g_{kl}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:18.68ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.781ex;\" width=\"18.68ex\" height=\"2.737ex\" viewBox=\"0 -864.9 8256.8 1209.9\"><g transform=\"scale(1,-1)\"><g><use data-c=\"394\" href=\"#MJX-TEX-N-394\"><\/use><g transform=\"translate(833)\"><use data-c=\"1D446\" href=\"#MJX-TEX-I-1D446\"><\/use><g transform=\"translate(729.6,363) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"2425.7\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(3481.4)\"><use data-c=\"1D436\" href=\"#MJX-TEX-I-1D436\"><\/use><g transform=\"translate(845.3,363) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><use x=\"757\" data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><use x=\"1278\" data-c=\"1D459\" href=\"#MJX-TEX-I-1D459\"><\/use><\/g><\/g><g transform=\"translate(5491.1)\"><g><g transform=\"translate(220,394) scale(0.707)\"><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><g transform=\"translate(220,-345) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><rect width=\"553.6\" height=\"60\" x=\"120\" y=\"220\"><\/rect><\/g><\/g><use x=\"6284.6\" data-c=\"394\" href=\"#MJX-TEX-N-394\"><\/use><g transform=\"translate(7117.6)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><use x=\"521\" data-c=\"1D459\" href=\"#MJX-TEX-I-1D459\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> as one would predict for a purely elastic response. Inspired by this instantaneous elastic-like response we define the time-dependent <em><a data-def=\"reference-metric\">reference metric<\/a><\/em> <mjx-container data-tex=\"\\gbar_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"2.234ex\" viewBox=\"0 -693 1095.3 987.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> of the body such as to satisfy<\/p>\n<div class=\"display\" id=\"eq-stress_relation\"><div class=\"eqbody\"><mjx-container data-tex=\"S^{ij}(t) = C^{ijkl}\\tfrac{1}{2} \\left(g_{kl}(t)- \\gbar_{kl}(t) \\right).\" class=\"MathJax\" jax=\"SVG\" display=\"true\" style=\"--w:30.374ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.781ex;\" width=\"30.374ex\" height=\"2.825ex\" viewBox=\"0 -903.7 13425.3 1248.7\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D446\" href=\"#MJX-TEX-I-1D446\"><\/use><g transform=\"translate(729.6,413) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1314.9\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1703.9\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"2064.9\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"2731.7\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(3787.4)\"><use data-c=\"1D436\" href=\"#MJX-TEX-I-1D436\"><\/use><g transform=\"translate(845.3,413) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><use x=\"757\" data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><use x=\"1278\" data-c=\"1D459\" href=\"#MJX-TEX-I-1D459\"><\/use><\/g><\/g><g transform=\"translate(5797.1)\"><g><g transform=\"translate(220,394) scale(0.707)\"><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><g transform=\"translate(220,-345) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><rect width=\"553.6\" height=\"60\" x=\"120\" y=\"220\"><\/rect><\/g><\/g><g transform=\"translate(6590.6)\"><use data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><g transform=\"translate(389)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><use x=\"521\" data-c=\"1D459\" href=\"#MJX-TEX-I-1D459\"><\/use><\/g><\/g><use x=\"1528.1\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1917.1\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"2278.1\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"2889.3\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><g transform=\"translate(3889.6)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><use x=\"521\" data-c=\"1D459\" href=\"#MJX-TEX-I-1D459\"><\/use><\/g><\/g><use x=\"5028.7\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"5417.7\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"5778.7\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"6167.7\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><use x=\"13147.3\" data-c=\"2E\" href=\"#MJX-TEX-N-2E\"><\/use><\/g><\/g><\/svg><\/mjx-container><\/div><span class=\"eqno\">(4)<\/span><\/div>\n<p class=\"cont\">The temporal evolution of the reference metric can be deduced from <a href=\"#eq-tensor_linear_viscoelasticity\">2<\/a>, <a href=\"#eq-strain_relation\">3<\/a>, ??, <a href=\"#eq-stress_relation\">4<\/a>, and reads<\/p>\n<div class=\"display\" id=\"eq-gbar_evolution_rule\"><div class=\"eqbody\"><mjx-container data-tex=\"\\gbar_{ij}(t) = (1-\\b)\\ \\gbaro_{ij} - \\b \\int_{-\\infty}^{t} \\dot \\phi(t-s)\\ g_{ij}(s)\\ ds.\" class=\"MathJax\" jax=\"SVG\" display=\"true\" style=\"--w:44.193ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -2.159ex;\" width=\"44.193ex\" height=\"5.622ex\" viewBox=\"0 -1530.7 19533.3 2485\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1095.3\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1484.3\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"1845.3\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"2512.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"3567.8\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"3956.8\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"4679.1\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"5679.3\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"6245.3\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"6634.3\" data-c=\"A0\" href=\"#MJX-TEX-N-A0\"><\/use><g transform=\"translate(6884.3)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,413) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-250) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"8201.8\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"9202\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><g transform=\"translate(9934.7)\"><g transform=\"translate(0 1)\"><use data-c=\"222B\" href=\"#MJX-TEX-LO-222B\"><\/use><\/g><g transform=\"translate(1046.4,1088.1) scale(0.707)\"><use data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><\/g><g transform=\"translate(589,-896.4) scale(0.707)\"><use data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"778\" data-c=\"221E\" href=\"#MJX-TEX-N-221E\"><\/use><\/g><\/g><g transform=\"translate(11997.6)\"><g><use data-c=\"1D719\" href=\"#MJX-TEX-I-1D719\"><\/use><g transform=\"translate(381.3,250) translate(-250 0)\"><use data-c=\"2D9\" href=\"#MJX-TEX-N-2D9\"><\/use><\/g><\/g><\/g><use x=\"12593.6\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"12982.6\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"13565.8\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"14566\" data-c=\"1D460\" href=\"#MJX-TEX-I-1D460\"><\/use><use x=\"15035\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"15424\" data-c=\"A0\" href=\"#MJX-TEX-N-A0\"><\/use><g transform=\"translate(15674)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"16769.3\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"17158.3\" data-c=\"1D460\" href=\"#MJX-TEX-I-1D460\"><\/use><use x=\"17627.3\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"18016.3\" data-c=\"A0\" href=\"#MJX-TEX-N-A0\"><\/use><use x=\"18266.3\" data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><use x=\"18786.3\" data-c=\"1D460\" href=\"#MJX-TEX-I-1D460\"><\/use><use x=\"19255.3\" data-c=\"2E\" href=\"#MJX-TEX-N-2E\"><\/use><\/g><\/g><\/svg><\/mjx-container><\/div><span class=\"eqno\">(5)<\/span><\/div>\n<p class=\"cont\">It is important to stress that equations <a href=\"#eq-stress_relation\">(4)<\/a> and <a href=\"#eq-gbar_evolution_rule\">(5)<\/a> are completely equivalent to Eq. <a href=\"#eq-tensor_linear_viscoelasticity\">(2)<\/a>. However the notion of a reference metric allows a more intuitive understanding of viscoelastic behavior. Note that <mjx-container data-tex=\"\\gbar_{ij}(t)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.055ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"5.055ex\" height=\"2.363ex\" viewBox=\"0 -750 2234.3 1044.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1095.3\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1484.3\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"1845.3\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> remains unchanged by instantaneous variations of <mjx-container data-tex=\"g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"1.666ex\" viewBox=\"0 -442 1095.3 736.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. We may thus consider it as the slow state variable describing the viscoelastic evolution of the material. At each moment in time we may consider the system as an elastic system with respect to the reference metric <mjx-container data-tex=\"\\gbar_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"2.234ex\" viewBox=\"0 -693 1095.3 987.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> Efrati <em>et al.<\/em> (<a href=\"#cite-ESK09\">2009<\/a>); Efrati <em>et al.<\/em> (<a href=\"#cite-ESK13\">2013<\/a>). The dimensionless factor <mjx-container data-tex=\"\\beta\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.281ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.281ex\" height=\"2.034ex\" viewBox=\"0 -705 566 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/svg><\/mjx-container> can be shown by Eq. <a href=\"#eq-tensor_linear_viscoelasticity\">(2)<\/a> to quantify the fraction of stress asymptotically relaxed in a constant displacement experiment starting from rest. <mjx-container data-tex=\"\\b\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.281ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.281ex\" height=\"2.034ex\" viewBox=\"0 -705 566 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/svg><\/mjx-container> is thus a measure of the <dfn data-def=\"beta\">degree of viscoelasticity<\/dfn> in the system. For a prescribed configuration given by the metric <mjx-container data-tex=\"g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"1.666ex\" viewBox=\"0 -442 1095.3 736.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> the reference metric <mjx-container data-tex=\"\\gbar_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"2.234ex\" viewBox=\"0 -693 1095.3 987.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> will asymptotically approach the stationary solution of Eq. <a href=\"#eq-gbar_evolution_rule\">(5)<\/a>:<\/p>\n<div class=\"display\" id=\"eq-gbar_stationary_condition\"><div class=\"eqbody\"><mjx-container data-tex=\"\\gbar^\\text{stat}_{ij} = \\b g_{ij} + (1-\\b)\\gbaro_{ij}.\" class=\"MathJax\" jax=\"SVG\" display=\"true\" style=\"--w:23.528ex\ nsform=\"translate(510,-250) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"10121.3\" data-c=\"2E\" href=\"#MJX-TEX-N-2E\"><\/use><\/g><\/g><\/svg><\/mjx-container><\/div><span class=\"eqno\">(6)<\/span><\/div>\n<p class=\"cont\">Therefore, <mjx-container data-tex=\"\\b\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.281ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.281ex\" height=\"2.034ex\" viewBox=\"0 -705 566 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/svg><\/mjx-container> also measures the material’s propensity to change its reference metric toward the realized metric in its present configuration. <mjx-container data-tex=\"\\b=0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.429ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"5.429ex\" height=\"2.034ex\" viewBox=\"0 -705 2399.6 899\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"843.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1899.6\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container> describes a purely elastic material, where the reference metric remains <mjx-container data-tex=\"\\gbar_{ij}=\\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.973ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"7.973ex\" height=\"2.892ex\" viewBox=\"0 -840.1 3524.1 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1373.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2428.8)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> for all times <sup class=\"fnref\"><a href=\"#fn2\" id=\"fnref2\">2<\/a><\/sup>. <mjx-container data-tex=\"\\b=1\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.429ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"5.429ex\" height=\"2.034ex\" viewBox=\"0 -705 2399.6 899\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"843.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1899.6\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><\/svg><\/mjx-container> describes a viscoelastic fluid where the <a data-def=\"rest-reference-metric\">rest reference metric<\/a> <mjx-container data-tex=\"\\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"2.478ex\" height=\"2.892ex\" viewBox=\"0 -840.1 1095.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> has no meaning and the material approaches arbitrarily close to <mjx-container data-tex=\"g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"1.666ex\" viewBox=\"0 -442 1095.3 736.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, diminishing the stress to zero in relaxation.<\/p>", "hash": "e533d8d70ded", "gist": {"html": "An exactly equivalent reference metric, the slow state variable, relaxes towards <mjx-container data-tex=\"\\beta g+(1-\\beta)\\bar g^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:14.13ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"14.13ex\" height=\"2.452ex\" viewBox=\"0 -833.9 6245.4 1083.9\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"566\" data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><use x=\"1265.2\" data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><use x=\"2265.4\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"2654.4\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"3376.7\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"4376.9\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"4942.9\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><g transform=\"translate(5331.9)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,363) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>; <mjx-container data-tex=\"\\beta\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.281ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.281ex\" height=\"2.034ex\" viewBox=\"0 -705 566 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/svg><\/mjx-container> measures viscoelasticity.", "status": "ai-draft"}}, {"id": "bg-reference-metric", "kind": "background", "title": "Elasticity with respect to a non-Euclidean reference metric", "audience": ["student", "physicist"], "fold": true, "body": "<p>In ordinary elasticity the stress-free state is a shape in space, and strain is measured from it. Incompatible, or non-Euclidean, elasticity generalises this: each small piece of material carries its own preferred lengths, a <a data-def=\"reference-metric\">reference metric<\/a> <mjx-container data-tex=\"\\bar g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"2.234ex\" viewBox=\"0 -693 1095.3 987.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, and nothing requires that a body realising all of them at once exists in flat space. When the reference metric is Euclidean, with vanishing curvature, the body can relax to zero stress. When it is not, as in swelling gels or growing leaves, no configuration is stress-free; the body settles into the shape whose metric, necessarily Euclidean, is closest to <mjx-container data-tex=\"\\bar g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"2.234ex\" viewBox=\"0 -693 1095.3 987.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> in the sense of the elastic energy, and keeps residual stress. The equilibrium shape thus solves a minimisation over <a data-def=\"euclidean-metric\">Euclidean metrics<\/a> with the reference metric as data. The paper treats a viscoelastic body at each instant as such an elastic body, whose reference metric drifts in time.<\/p>"}, {"id": "root-p6", "kind": "paragraph", "body": "<p><strong class=\"runin\">The <dfn data-def=\"quasi-static\">quasi static approximation<\/dfn><\/strong> Viscoelastic systems are dissipative, thus the notion of an elastic free energy is ill defined. Nonetheless, the virtual work of displacements performed over a short period <mjx-container data-tex=\"\\Delta t \\rightarrow 0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.352ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"7.352ex\" height=\"1.67ex\" viewBox=\"0 -716 3249.6 738\"><g transform=\"scale(1,-1)\"><g><use data-c=\"394\" href=\"#MJX-TEX-N-394\"><\/use><use x=\"833\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"1471.8\" data-c=\"2192\" href=\"#MJX-TEX-N-2192\"><\/use><use x=\"2749.6\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container>, coincides with the <dfn data-def=\"energy-functional\">instantaneous elastic energy functional<\/dfn> Efrati <em>et al.<\/em> (<a href=\"#cite-ESK09\">2009<\/a>)<\/p>\n<div class=\"display\" id=\"eq-energy_functional\"><div class=\"eqbody\"><mjx-container data-tex=\"E\\left[\\e^\\text{el}_{ij}\\right]=\\int \\frac{1}{2}C^{ijkl} \\e^\\text{el}_{ij} \\e^\\text{el}_{kl}\\ \\sqrt{|\\gbaro|}\\ d^3x,\" class=\"MathJax\" jax=\"SVG\" display=\"true\" style=\"--w:34.505ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -1.948ex;\" width=\"34.505ex\" height=\"5.027ex\" viewBox=\"0 -1361 15251.3 2222\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D438\" href=\"#MJX-TEX-I-1D438\"><\/use><g transform=\"translate(930.7)\"><g transform=\"translate(0 -0.5)\"><use data-c=\"5B\" href=\"#MJX-TEX-SO-5B\"><\/use><\/g><g transform=\"translate(417)\"><use data-c=\"1D700\" href=\"#MJX-TEX-I-1D700\"><\/use><g transform=\"translate(499,413) scale(0.707)\"><use data-c=\"65\" href=\"#MJX-TEX-N-65\"><\/use><use data-c=\"6C\" href=\"#MJX-TEX-N-6C\" transform=\"translate(444)\"><\/use><\/g><g transform=\"translate(499,-247) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><g transform=\"translate(1501.3,0) translate(0 -0.5)\"><use data-c=\"5D\" href=\"#MJX-TEX-SO-5D\"><\/use><\/g><\/g><use x=\"3126.7\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(4182.5,0) translate(0 1)\"><use data-c=\"222B\" href=\"#MJX-TEX-LO-222B\"><\/use><\/g><g transform=\"translate(5293.2)\"><use x=\"220\" y=\"676\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"220\" y=\"-686\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><rect width=\"700\" height=\"60\" x=\"120\" y=\"220\"><\/rect><\/g><g transform=\"translate(6233.2)\"><use data-c=\"1D436\" href=\"#MJX-TEX-I-1D436\"><\/use><g transform=\"translate(845.3,413) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D45 o analyze both numerically and theoretically compared with the full dynamics.<\/p>", "hash": "005c9b032767", "gist": {"html": "Elasticity is fast, so at each moment the shape minimises the elastic energy measured from the current reference metric.", "status": "ai-draft"}}, {"id": "root-p7", "kind": "paragraph", "body": "<p>As seen from Eq. <a href=\"#eq-gbar_stationary_condition\">(6)<\/a>, the long time stability of a body depends only on <mjx-container data-tex=\"\\b\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.281ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.281ex\" height=\"2.034ex\" viewBox=\"0 -705 566 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/svg><\/mjx-container>, and not on the specific <a data-def=\"memory-kernel\">memory kernel<\/a>. It is thus instructive to choose the model of <dfn data-def=\"sls\">standard linear solid<\/dfn> (SLS), which is the simplest model capable of exhibiting <a data-def=\"creep\">creeping<\/a> motion, a finite <a data-def=\"stress-relaxation\">stress relaxation<\/a> characterized by <mjx-container data-tex=\"0&lt;\\b&lt;1\" class=\"MathJax\" jax=\"SVG\" style=\"--w:9.577ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"9.577ex\" height=\"2.034ex\" viewBox=\"0 -705 4233.1 899\"><g transform=\"scale(1,-1)\"><g><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><use x=\"777.8\" data-c=\"3C\" href=\"#MJX-TEX-N-3C\"><\/use><use x=\"1833.6\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"2677.3\" data-c=\"3C\" href=\"#MJX-TEX-N-3C\"><\/use><use x=\"3733.1\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><\/svg><\/mjx-container> and possess only a single time scale <mjx-container data-tex=\"\\tau\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.17ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.029ex;\" width=\ 1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"2303.3\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"2914.5\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><g transform=\"translate(3914.7)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,413) scale(0.707)\"><use data-c=\"73\" href=\"#MJX-TEX-N-73\"><\/use><use data-c=\"74\" href=\"#MJX-TEX-N-74\" transform=\"translate(394)\"><\/use><use data-c=\"61\" href=\"#MJX-TEX-N-61\" transform=\"translate(783)\"><\/use><use data-c=\"74\" href=\"#MJX-TEX-N-74\" transform=\"translate(1283)\"><\/use><\/g><g transform=\"translate(510,-247) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"5657\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"6046\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"6407\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><g transform=\"translate(6796,0) translate(0 -0.5)\"><use data-c=\"29\" href=\"#MJX-TEX-SO-29\"><\/use><\/g><\/g><use x=\"9433.5\" data-c=\"2E\" href=\"#MJX-TEX-N-2E\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container><\/div><\/div>\n<p class=\"cont\">This equation is identical to Eq. <a href=\"#eq-gbar_evolution_rule\">(5)<\/a> under the SLS memory kernel, cast in a more intuitive differential equation.<\/p>", "hash": "d78a2ada51b6", "gist": {"html": "Long-time stability depends only on <mjx-container data-tex=\"\\beta\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.281ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.281ex\" height=\"2.034ex\" viewBox=\"0 -705 566 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/svg><\/mjx-container>; in the standard linear solid the reference metric relaxes exponentially to its stationary value.", "status": "ai-draft"}}, {"id": "root-p8", "kind": "paragraph", "body": "<p><strong class=\"runin\">Metastable <a data-def=\"stationarity\">configuration-stationarity<\/a><\/strong> A given <a data-def=\"reference-metric\">reference metric<\/a> <mjx-container data-tex=\"\\gbar_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"2.234ex\" viewBox=\"0 -693 1095.3 987.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> can yield multiple elastically stable configurations in the <a data-def=\"energy-functional\">instantaneous elastic energy functional<\/a> <a href=\"#eq-energy_functional\">(7)<\/a>. As the reference metric evolves viscoelastically according to Eq. <a href=\"#eq-gbar_evolution_rule\">(5)<\/a> it could acquire new stable configurations, merge existing stable points or cause stable elastic configurations to lose their stability. The latter phenomenon, termed <em><a data-def=\"delayed-instability\">delayed instability<\/a><\/em>, manifests as a slow viscoelastic evolution followed by a rapid snap to a near stable configuration. This phenomenon was also termed temporary bistability Santer (<a href=\"#cite-MS10\">2010<\/a>), pseudo bistability Brinkmeyer <em>et al.<\/em> (<a href=\"#cite-BSP12\">2012<\/a>) or <a data-def=\"creep\">creep<\/a> buckling Hoff (<a href=\"#cite-NH56\">1956<\/a>); Hayman (<a href=\"#cite-BH78\">1978<\/a>) and forms the main difficulty in predicting the stability of visco-elastic structures. Here we show that the question of stability of the viscoelastic system reduces to examining the purely elastic stability of the rest system where <mjx-container data-tex=\"\\gbar_{ij}=\\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.973ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"7.973ex\" height=\"2.892ex\" viewBox=\"0 -840.1 3524.1 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1373.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2428.8)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>.<\/p>", "hash": "d8892802bffe", "gist": {"html": "Creep can destroy elastic stability, a delayed instability; its prediction reduces to the elastic stability of the rest system.", "status": "ai-draft"}}, {"id": "bg-snap", "kind": "background", "title": "Elastic stability and snap-through", "audience": ["student"], "fold": true, "body": "<p>An elastic structure at rest sits at a local minimum of its elastic energy among the shapes it can take. Equilibria are the extrema of that energy, and an equilibrium has stability when the Hessian, the matrix of second derivatives of the energy, is positive definite, so that every small change raises the energy. Shells and arches can have two stable shapes, like a <a data-def=\"popper\">popper<\/a>'s natural and inverted forms. If a slowly changing parameter flattens the energy around one minimum until it merges with a nearby saddle, the Hessian gains a zero eigenvalue and the minimum disappears. Nothing then holds the structure, and it jumps, in a time set by elasticity and inertia, to another minimum: a <a data-def=\"snap-through\">snap-through<\/a>. Before that moment the motion is slow and simply follows the parameter. In a <a data-def=\"delayed-instability\">delayed instability<\/a> the slowly changing parameter is the <a data-def=\"creep\">creeping<\/a> <a data-def=\"reference-metric\">reference metric<\/a>.<\/p>"}, {"id": "root-p9", "kind": "paragraph", "body": "<p>Starting from rest, and deforming fast into a local elastic stable configuration will result in a stationary configuration, i.e. a configuration that will display no temporal variation despite the continuous evolution of the <a data-def=\"reference-metric\">reference metric<\/a> and the relaxation of the corresponding stress <sup class=\"fnref\"><a href=\"#fn3\" id=\"fnref3\">3<\/a><\/sup>. To show this claim it suffices to assume that <mjx-container data-tex=\"g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"1.666ex\" viewBox=\"0 -442 1095.3 736.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> in Eq. <a href=\"#eq-gbar_evolution_rule\">(5)<\/a> is constant in time to obtain <mjx-container data-tex=\"\\gbar_{ij}(t)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.055ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"5.055ex\" height=\"2.363ex\" viewBox=\"0 -750 2234.3 1044.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1095.3\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1484.3\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"1845.3\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> and show that the constant <mjx-container data-tex=\"g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"1.666ex\" viewBox=\"0 -442 1095.3 736.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> satisfies the equilibrium equation <a href=\"#eq-minimaztion_condition\">(8)<\/a> with respect to the obtained <mjx-container data-tex=\"\\gbar_{ij}(t)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.055ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"5.055ex\" height=\"2.363ex\" viewBox=\"0 -750 2234.3 1044.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1095.3\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1484.3\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"1845.3\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>. Conversely, if a system converges to a fixed stable state (where the configuration as well as the reference metric do not evolve), the corresponding configuration must also be <a data-def=\"extremal\">extremal<\/a> with respect to the <a data-def=\"rest-reference-metric\">rest reference metric<\/a>. This again could be shown by substituting Eq. <a href=\"#eq-gbar_stationary_condition\">(6)<\/a> into Eq. <a href=\"#eq-minimaztion_condition\">(8)<\/a>. We note that these results are not limited to a particular <a data-def=\"memory-kernel\">memory kernel<\/a>. Intuitively, both claims are due to <dfn data-def=\"collinearity\">collinearity<\/dfn> of <mjx-container data-tex=\"g_{ij},\\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.962ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"5.962ex\" height=\"2.892ex\" viewBox=\"0 -840.1 2635.2 1278.1\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1095.3\" data-c=\"2C\" href=\"#MJX-TEX-N-2C\"><\/use><g transform=\"translate(1539.9)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> and <mjx-container data-tex=\"\\gbar_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"2.234ex\" viewBox=\"0 -693 1095.3 987.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> under the appropriate initial conditions, see FIG. <a href=\"#fig-metric_space\">2<\/a>. For explicit proof see Urbach and Efrati (<a href=\"#cite-UE18b\">2018<\/a>).<\/p>", "hash": "b22c824d458f", "gist": {"html": "Brought abruptly from rest into a stable shape, a body never moves while its stress relaxes, for any memory kernel.", "status": "ai-draft"}}, {"id": "root-p10", "kind": "paragraph", "body": "<p><strong class=\"runin\">Acquired elastic stability and <a data-def=\"delayed-instability\">delayed instability<\/a><\/strong> When an appropriately cut elastic cone is flipped inside out and laid on the table (FIG. <a href=\"#fig-hopper_popper\">3<\/a>a) it <a data-def=\"creep\">creeps<\/a> for a few seconds and snaps back to its original shape. This phenomena of delayed instability seems to contradict the <a data-def=\"stationarity\">metastable configuration stationarity<\/a> described above. However, when examined carefully this stationarity property is not only reconciled with observations but to a large degree explains them quantitatively. A particular corollary of the configuration stationarity property is that instability could be observed only for initially unstable configurations. Had the system displayed stability at its initial state one can show that the state remains a local minimum of the elastic energy. Thus delayed instability can only be observed for states whose stability was acquired by the viscoelastic evolution Santer (<a href=\"#cite-MS10\">2010<\/a>); Brinkmeyer <em>et al.<\/em> (<a href=\"#cite-BSP12\">2012<\/a>). One can show that <dfn data-def=\"acquired-stability\">acquired stability<\/dfn> in configurations that were not <a data-def=\"extremal\">extremal<\/a> initially (e.g. saddle points) cannot persist indefinitely and must be eventually lost.<\/p>", "hash": "109c03f6662a", "gist": {"html": "Delayed snaps need stability acquired by creep; acquired stability of a shape not initially extremal is eventually lost.", "status": "ai-draft"}}, {"id": "fig-metric_space", "kind": "figure", "title": "Figure 2", "body": "<figure class=\"float figure\" id=\"fig-metric_space\"><p><span class=\"l2m-pic\"><img src=\"img/0c498b209c902657.svg\" loading=\"lazy\" decoding=\"async\" alt=\"\" style=\"width:20.508em\"><\/span><\/p><figcaption><span class=\"capname\">Figure 2.<\/span> A schematic representation of the metrics <a data-def=\"collinearity\">collinearity<\/a>. The minimization of the metric <mjx-container data-tex=\"g\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.079ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"1.079ex\" height=\"1.464ex\" viewBox=\"0 -442 477 647\"><g transform=\"scale(1,-1)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><\/g><\/svg><\/mjx-container> (marked by a full black circle) is constrained and performed with respect to the subset of metrics that correspond to realizable configurations (thick black line). Such metrics are in particular orientation preserving and Euclidean. Given a <a data-def=\"reference-metric\">reference metric<\/a> <mjx-container data-tex=\"\\gbar\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.079ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"1.079ex\" height=\"2.032ex\" viewBox=\"0 -693 477 898\"><g transform=\"scale(1,-1)\"><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> (marked by a full gray circle) the realized metric will correspond to the closest point from the set of admissible metrics to <mjx-container data-tex=\"\\gbar\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.079ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"1.079ex\" height=\"2.032ex\" viewBox=\"0 -693 477 898\"><g transform=\"scale(1,-1)\"><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> according to the distance function given by the <a data-def=\"energy-functional\">instantaneous elastic energy<\/a> <a href=\"#eq-energy_functional\">(7)<\/a>. Starting from rest, <mjx-container data-tex=\"\\gbar\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.079ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"1.079ex\" height=\"2.032ex\" viewBox=\"0 -693 477 898\"><g transform=\"scale(1,-1)\"><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> evolves from <mjx-container data-tex=\"\\gbaro\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.067ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"2.067ex\" height=\"2.351ex\" viewBox=\"0 -833.9 913.6 1038.9\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,363) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> towards the <mjx-container data-tex=\"g\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.079ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"1.079ex\" height=\"1.464ex\" viewBox=\"0 -442 477 647\"><g transform=\"scale(1,-1)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><\/g><\/svg><\/mjx-container>, which remains the closest admissible metric to <mjx-container data-tex=\"\\gbar\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.079ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"1.079ex\" height=\"2.032ex\" viewBox=\"0 -693 477 898\"><g transform=\"scale(1,-1)\"><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> due to collinearity of the three metrics. As <mjx-container data-tex=\"g\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.079ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"1.079ex\" height=\"1.464ex\" viewBox=\"0 -442 477 647\"><g transform=\"scale(1,-1)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><\/g><\/svg><\/mjx-container> remains stationary, the evolution of <mjx-container data-tex=\"\\gbar\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.079ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"1.079ex\" height=\"2.032ex\" viewBox=\"0 -693 477 898\"><g transform=\"scale(1,-1)\"><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> will preserve the collinearity, approaching asymptotically <mjx-container data-tex=\"\\gbar^{\\text{stat}}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.942ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"3.942ex\" height=\"2.269ex\" viewBox=\"0 -797.9 1742.3 1002.9\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,363) scale(0.707)\"><g><use data-c=\"73\" href=\"#MJX-TEX-N-73\"><\/use><use data-c=\"74\" href=\"#MJX-TEX-N-74\" transform=\"translate(394)\"><\/use><use data-c=\"61\" href=\"#MJX-TEX-N-61\" transform=\"translate(783)\"><\/use><use data-c=\"74\" href=\"#MJX-TEX-N-74\" transform=\"translate(1283)\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, which is also collinear. We stress that throughout this evolution <mjx-container data-tex=\"g\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.079ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"1.079ex\" height=\"1.464ex\" viewBox=\"0 -442 477 647\"><g transform=\"scale(1,-1)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><\/g><\/svg><\/mjx-container> remains unchanged, thus no variation of the configuration will be observed despite the <a data-def=\"stress-relaxation\">stress relaxation<\/a>. <\/figcaption><\/figure>", "hash": "7af5b774f0d8", "gist": {"html": "Actual, reference and rest metrics stay collinear, so the realised shape stays put while the reference metric evolves.", "status": "ai-draft"}}, {"id": "fig-hopper_popper", "kind": "figure", "title": "Figure 3", "body": "<figure class=\"float figure\" id=\"fig-hopper_pop
