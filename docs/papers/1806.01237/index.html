 transform=\"scale(1,-1)\"><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(714,-150) scale(0.707)\"><use data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> unchanged. The force under such conditions will increase by <mjx-container data-tex=\"\\Delta F = k \\Delta L\" class=\"MathJax\" jax=\"SVG\" style=\"--w:11.2ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"11.2ex\" height=\"1.805ex\" viewBox=\"0 -716 4950.6 798\"><g transform=\"scale(1,-1)\"><g><use data-c=\"394\" href=\"#MJX-TEX-N-394\"><\/use><use x=\"833\" data-c=\"1D439\" href=\"#MJX-TEX-I-1D439\"><\/use><use x=\"1859.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"2915.6\" data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><use x=\"3436.6\" data-c=\"394\" href=\"#MJX-TEX-N-394\"><\/use><use x=\"4269.6\" data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/svg><\/mjx-container>, similar to a simple spring of stiffness <mjx-container data-tex=\"k\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.179ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"1.179ex\" height=\"1.595ex\" viewBox=\"0 -694 521 705\"><g transform=\"scale(1,-1)\"><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><\/g><\/svg><\/mjx-container>. Motivated by the temporal scale separation between the elastic response of viscoelastic solids and their typical creep rate we seek to rephrase the force equations as a simple elastic spring. By setting the <em><dfn data-def=\"reference-length\">reference length<\/dfn><\/em><\/p>\n<div class=\"display\"><div class=\"eqbody\"><mjx-container data-tex=\"\\bar L = (1-\\beta)\\bar{L}^0 +\\beta\\tilde L ^{0}+ \\beta L_d,\" class=\"MathJax\" jax=\"SVG\" display=\"true\" style=\"--w:27.834ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"27.834ex\" height=\"2.808ex\" viewBox=\"0 -991 12302.7 1241\"><g transform=\"scale(1,-1)\"><g><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><use x=\"958.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"2014.6\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"2403.6\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"3125.8\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"4126\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"4692\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><g transform=\"translate(5081)\"><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(714,413) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><use x=\"6420.8\" data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><use x=\"7421\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><g transform=\"translate(7987)\"><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,573) translate(-250 0)\"><use data-c=\"7E\" href=\"#MJX-TEX-N-7E\"><\/use><\/g><\/g><\/g><g transform=\"translate(714,413) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><use x=\"9326.8\" data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><use x=\"10327\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><g transform=\"translate(10893)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(714,-150) scale(0.707)\"><use data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><\/g><\/g><use x=\"12024.7\" data-c=\"2C\" href=\"#MJX-TEX-N-2C\"><\/use><\/g><\/g><\/svg><\/mjx-container><\/div><\/div>\n<p class=\"cont\">and substituting in eq.<a href=\"#eq-sls_force_relation\">(1)<\/a> we obtain<\/p>\n<div class=\"display\" id=\"eq-force_relation\"><div class=\"eqbody\"><mjx-container data-tex=\"F = -k (L-\\bar L).\" class=\"MathJax\" jax=\"SVG\" display=\"true\" style=\"--w:15.887ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"15.887ex\" height=\"2.679ex\" viewBox=\"0 -934 7022 1184\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D439\" href=\"#MJX-TEX-I-1D439\"><\/use><use x=\"1026.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"2082.6\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"2860.6\" data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><use x=\"3381.6\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"3770.6\" data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><use x=\"4673.8\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><g transform=\"translate(5674)\"><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><use x=\"6355\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"6744\" data-c=\"2E\" href=\"#MJX-TEX-N-2E\"><\/use><\/g><\/g><\/svg><\/mjx-container><\/div><span class=\"eqno\">(3)<\/span><\/div>\n<p class=\"cont\">This is supplemented by the closure relation describing the temporal evolution of the reference length<\/p>\n<div class=\"display\" id=\"eq-sls_L_bar_DE\"><div class=\"eqbody\"><mjx-container data-tex=\"\\dot {\\bar L} = - \\frac{1}{\\tau}\\left( \\b (\\bar L - L) + (1-\\b)(\\bar L - \\bar L ^0) \\right),\" class=\"MathJax\" jax=\"SVG\" display=\"true\" style=\"--w:39ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -1.581ex;\" width=\"39ex\" height=\"4.618ex\" viewBox=\"0 -1342 17237.9 2041\"><g transform=\"scale(1,-1)\"><g><g><g><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate( ainer data-tex=\"\\tau\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.17ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.029ex;\" width=\"1.17ex\" height=\"1.005ex\" viewBox=\"0 -431 517 444\"><g transform=\"scale(1,-1)\"><use data-c=\"1D70F\" href=\"#MJX-TEX-I-1D70F\"><\/use><\/g><\/svg><\/mjx-container>, arranged to form a <a data-def=\"von-mises-truss\">von-Mises truss<\/a> Bažant and Cedolin (<a href=\"#cite-ZPB91\">1991<\/a>) as illustrated in figure <a href=\"#fig-sls_von_mises_truss_diagram\">2<\/a>. The truss is composed of a point mass that moves along the <mjx-container data-tex=\"z\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.052ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"1.052ex\" height=\"1.025ex\" viewBox=\"0 -442 465 453\"><g transform=\"scale(1,-1)\"><use data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><\/g><\/svg><\/mjx-container> axis. It is connected to two diagonal SLS’s of stiffness <mjx-container data-tex=\"k_1\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.166ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.339ex;\" width=\"2.166ex\" height=\"1.91ex\" viewBox=\"0 -694 957.6 844\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><g transform=\"translate(554,-150) scale(0.707)\"><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> that create a bi-stable elastic potential. The symmetry of this potential is broken by a vertical SLS of stiffness <mjx-container data-tex=\"k_2\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.166ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.339ex;\" width=\"2.166ex\" height=\"1.91ex\" viewBox=\"0 -694 957.6 844\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><g transform=\"translate(554,-150) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. The <a data-def=\"rest-length\">rest lengths<\/a> are chosen such that the system is relaxed and stationary at position <mjx-container data-tex=\"z = 1\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.2ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"5.2ex\" height=\"1.692ex\" viewBox=\"0 -666 2298.6 748\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><use x=\"742.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1798.6\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><\/svg><\/mjx-container> at rest lengths <mjx-container data-tex=\"\\bar L^0_1 = \\sqrt{2}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:8.607ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.673ex;\" width=\"8.607ex\" height=\"2.846ex\" viewBox=\"0 -960.5 3804.1 1257.8\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(714,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(714,-297.3) scale(0.707)\"><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><use x=\"1395.3\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2451.1)\"><use x=\"853\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><use x=\"0\" y=\"100.5\" data-c=\"221A\" href=\"#MJX-TEX-N-221A\"><\/use><rect width=\"500\" height=\"60\" x=\"853\" y=\"840.5\"><\/rect><\/g><\/g><\/g><\/svg><\/mjx-container> and <mjx-container data-tex=\"\\bar L^0_2 = 0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.677ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.673ex;\" width=\"6.677ex\" height=\"2.786ex\" viewBox=\"0 -934 2951.1 e x=\"4338.9\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"5394.7\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"5894.7\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> (see FIG. <a href=\"#fig-sls_von_mises_truss_lengths_space\">3<\/a>).<\/p>", "hash": "c93d4427afdb", "gist": {"html": "The truss's energy is the squared distance between the reference point and the curve of admissible lengths.", "status": "ai-draft"}}, {"id": "bg-snap", "kind": "background", "title": "Elastic stability, bistability and snap-through", "audience": ["student"], "fold": true, "body": "<p>A structure in quasi-static equilibrium sits at a stationary point of its elastic energy <mjx-container data-tex=\"E(q)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.529ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"4.529ex\" height=\"2.262ex\" viewBox=\"0 -750 2002 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D438\" href=\"#MJX-TEX-I-1D438\"><\/use><use x=\"764\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1153\" data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><use x=\"1613\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>, where the generalized forces <mjx-container data-tex=\"-\\partial E/\\partial q\" class=\"MathJax\" jax=\"SVG\" style=\"--w:8.222ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"8.222ex\" height=\"2.262ex\" viewBox=\"0 -750 3634 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"778\" data-c=\"1D715\" href=\"#MJX-TEX-I-1D715\"><\/use><use x=\"1344\" data-c=\"1D438\" href=\"#MJX-TEX-I-1D438\"><\/use><use x=\"2108\" data-c=\"2F\" href=\"#MJX-TEX-N-2F\"><\/use><use x=\"2608\" data-c=\"1D715\" href=\"#MJX-TEX-I-1D715\"><\/use><use x=\"3174\" data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><\/g><\/g><\/svg><\/mjx-container> vanish. The equilibrium is stable when it is a local minimum, which for a smooth energy means that the Hessian <mjx-container data-tex=\"\\partial^2E/\\partial q_a\\partial q_b\" class=\"MathJax\" jax=\"SVG\" style=\"--w:11.732ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"11.732ex\" height=\"2.452ex\" viewBox=\"0 -833.9 5185.7 1083.9\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D715\" href=\"#MJX-TEX-I-1D715\"><\/use><g transform=\"translate(650.8,363) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><use x=\"1054.3\" data-c=\"1D438\" href=\"#MJX-TEX-I-1D438\"><\/use><use x=\"1818.3\" data-c=\"2F\" href=\"#MJX-TEX-N-2F\"><\/use><use x=\"2318.3\" data-c=\"1D715\" href=\"#MJX-TEX-I-1D715\"><\/use><g transform=\"translate(2884.3)\"><use data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><g transform=\"translate(479,-150) scale(0.707)\"><use data-c=\"1D44E\" href=\"#MJX-TEX-I-1D44E\"><\/use><\/g><\/g><use x=\"3787.4\" data-c=\"1D715\" href=\"#MJX-TEX-I-1D715\"><\/use><g transform=\"translate(4353.4)\"><use data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><g transform=\"translate(479,-150) scale(0.707)\"><use data-c=\"1D44F\" href=\"#MJX-TEX-I-1D44F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> is positive definite; a maximum or a saddle is unstable. A bistable structure has two minima, like a shallow arch or a shell that can be inverted. When a slowly varied parameter, such as a load, deforms the energy so that a minimum merges with a neighbouring saddle, the lowest eigenvalue of the Hessian reaches zero and the minimum disappears. The structure then jumps dynamically to the remaining minimum, releasing stored energy: <a data-def=\"snap-through\">snap-through<\/a>. The <a data-def=\"von-mises-truss\">von Mises truss<\/a>, two bars meeting at a loaded point, is the textbook example of elastic stability and snap-through. In the paper the slowly varied parameter is the set of <a data-def=\"reference-length\">reference lengths<\/a>, moved by relaxation.<\/p>"}, {"id": "sec-sls_von_Mises_truss-p2", "kind": "paragraph", "body": "<p>To understand the dynamics of the system, we choose the following protocol; the mass is taken from rest, where <mjx-container data-tex=\"L_i=\\bar L_i = \\bar L_i^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:13.123ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.682ex;\" width=\"13.123ex\" height=\"2.795ex\" viewBox=\"0 -934 5800.6 1235.6\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(714,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><use x=\"1285.7\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2341.5)\"><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(714,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><use x=\"3627.2\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(4683)\"><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(714,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(714,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, abruptly to <mjx-container data-tex=\"z=-1\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.961ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"6.961ex\" height=\"1.692ex\" viewBox=\"0 -666 3076.6 748\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><use x=\"742.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1798.6\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"2576.6\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><\/svg><\/mjx-container> and held there for a finite time. That is, at <mjx-container data-tex=\"t=0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.965ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"4.965ex\" height=\"1.692ex\" viewBox=\"0 -666 2194.6 748\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"638.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1694.6\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container> the <a data-def=\"reference-length\">reference lengths<\/a> <mjx-container data-tex=\"\\mathbf{\\bar L}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.566ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"1.566ex\" height=\"2.167ex\" viewBox=\"0 -958 692 958\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D40B\" href=\"#MJX-TEX-B-1D40B\"><\/use><g transform=\"translate(346,251) translate(-287.5 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-B-AF\"><\/use><\/g><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> are at the <a data-def=\"rest-length\">rest length<\/a> values <mjx-container data-tex=\"\\mathbf{\\bar L^0}=(\\sqrt{2},0)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:12.649ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"12.649ex\" height=\"2.739ex\" viewBox=\"0 -960.5 5590.8 1210.5\"><g transform=\"scale(1,-1)\"><g><g><g><g><g><use data-c=\"1D40B\" href=\"#MJX-TEX-B-1D40B\"><\/use><g transform=\"translate(346,251) translate(-287.5 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-B-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(725,363) scale(0.707)\"><use data-c=\"1D7CE\" href=\"#MJX-TEX-B-1D7CE\"><\/use><\/g><\/g><\/g><use x=\"1459.4\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"2515.1\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><g transform=\"translate(2904.1)\"><use x=\"853\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><use x=\"0\" y=\"100.5\" data-c=\"221A\" href=\"#MJX-TEX-N-221A\"><\/use><rect width=\"500\" height=\"60\" x=\"853\" y=\"840.5\"><\/rect><\/g><use x=\"4257.1\" data-c=\"2C\" href=\"#MJX-TEX-N-2C\"><\/use><use x=\"4701.8\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><use x=\"5201.8\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> whereas the springs are held at the configuration <mjx-container data-tex=\"\\mathbf{L}_\\text{hold} = (\\sqrt{2},2 \\a)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:16.201ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"16.201ex\" height=\"2.739ex\" viewBox=\"0 -960.5 7160.7 1210.5\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D40B\" href=\"#MJX-TEX-B-1D40B\"><\/use><g transform=\"translate(725,-150) scale(0.707)\"><use data-c=\"68\" href=\"#MJX-TEX-N-68\"><\/use><use data-c=\"6F\" href=\"#MJX-TEX-N-6F\" transform=\"translate(556)\"><\/use><use data-c=\"6C\" href=\"#MJX-TEX-N-6C\" transform=\"translate(1056)\"><\/use><use data-c=\"64\" href=\"#MJX-TEX-N-64\" transform=\"translate(1334)\"><\/use><\/g><\/g><use x=\"2389.2\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"3445\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><g transform=\"translate(3834)\"><use x=\"853\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><use x=\"0\" y=\"100.5\" data-c=\"221A\" href=\"#MJX-TEX-N-221A\"><\/use><rect width=\"500\" height=\"60\" x=\"853\" y=\"840.5\"><\/rect><\/g><use x=\"5187\" data-c=\"2C\" href=\"#MJX-TEX-N-2C\"><\/use><use x=\"5631.7\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><use x=\"6131.7\" data-c=\"1D6FC\" href=\"#MJX-TEX-I-1D6FC\"><\/use><use x=\"6771.7\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>. By Eq. <a href=\"#eq-sls_L_bar_DE\">4<\/a> during the holding the reference lengths <mjx-container data-tex=\"\\mathbf{\\bar L}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.566ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"1.566ex\" height=\"2.167ex\" viewBox=\"0 -958 692 958\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D40B\" href=\"#MJX-TEX-B-1D40B\"><\/use><g transform=\"translate(346,251) translate(-287.5 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-B-AF\"><\/use><\/g><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> evolve along the line connecting <mjx-container data-tex=\"\\mathbf{\\bar L^0}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.673ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"2.673ex\" height=\"2.167ex\" viewBox=\"0 -958 1181.6 958\"><g transform=\"scale(1,-1)\"><g><g><g><g><g><use data-c=\"1D40B\" href=\"#MJX-TEX-B-1D40B\"><\/use><g transform=\"translate(346,251) translate(-287.5 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-B-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(725,363) scale(0.707)\"><use data-c=\"1D7CE\" href=\"#MJX-TEX-B-1D7CE\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> and <mjx-container data-tex=\"\\mathbf{L}_\\text{hold}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.777ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.357ex;\" width=\"4.777ex\" height=\"1.909ex\" viewBox=\"0 -686 2111.4 843.8\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D40B\" href=\"#MJX-TEX-B-1D40B\"><\/use><g transform=\"translate(725,-150) scale(0.707)\"><use data-c=\"68\" href=\"#MJX-TEX-N-68\"><\/use><use data-c=\"6F\" href=\"#MJX-TEX-N-6F\" transform=\"translate(556)\"><\/use><use data-c=\"6C\" href=\"#MJX-TEX-N-6C\" transform=\"translate(1056)\"><\/use><use data-c=\"64\" href=\"#MJX-TEX-N-64\" transform=\"translate(1334)\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> up to a stationary position between them (See FIG. <a href=\"#fig-sls_von_mises_truss_lengths_space\">3<\/a>). We note that due to the relaxation the reference lengths assume values not on the curve of <a data-def=\"admissible-lengths\">admissible lengths<\/a>, <mjx-container data-tex=\"\\mathbf{L}(z)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.378ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"4.378ex\" height=\"2.262ex\" viewBox=\"0 -750 1935 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D40B\" href=\"#MJX-TEX-B-1D40B\"><\/use><use x=\"692\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1081\" data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><use x=\"1546\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>, and therefore do not correspond to any realizable configuration of the system. Nevertheless <mjx-container data-tex=\"\\mathbf{\\bar L}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.566ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"1.566ex\" height=\"2.167ex\" viewBox=\"0 -958 692 958\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D40B\" href=\"#MJX-TEX-B-1D40B\"><\/use><g transform=\"translate(346,251) translate(-287.5 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-B-AF\"><\/use><\/g><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> might have stable realizable configurations. An elastic equilibrium corresponds to a point of minimal “distance” according to <a href=\"#eq-vmt_norm_energy\">(7)<\/a> between <mjx-container data-tex=\"L(z)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.353ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"4.353ex\" height=\"2.262ex\" viewBox=\"0 -750 1924 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><use x=\"681\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><us 1D467\"><\/use><use x=\"1546\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> perpendicularly. During the holding, the <a data-def=\"reference-length\">reference lengths<\/a> <mjx-container data-tex=\"\\mathbf{\\bar L}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.566ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"1.566ex\" height=\"2.167ex\" viewBox=\"0 -958 692 958\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D40B\" href=\"#MJX-TEX-B-1D40B\"><\/use><g transform=\"translate(346,251) translate(-287.5 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-B-AF\"><\/use><\/g><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> approache <mjx-container data-tex=\"\\mathbf{L}_\\text{hold}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.777ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.357ex;\" width=\"4.777ex\" height=\"1.909ex\" viewBox=\"0 -686 2111.4 843.8\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D40B\" href=\"#MJX-TEX-B-1D40B\"><\/use><g transform=\"translate(725,-150) scale(0.707)\"><use data-c=\"68\" href=\"#MJX-TEX-N-68\"><\/use><use data-c=\"6F\" href=\"#MJX-TEX-N-6F\" transform=\"translate(556)\"><\/use><use data-c=\"6C\" href=\"#MJX-TEX-N-6C\" transform=\"translate(1056)\"><\/use><use data-c=\"64\" href=\"#MJX-TEX-N-64\" transform=\"translate(1334)\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. However, still there is only one stable distance minimizing solution, which in turn is obtained by slightly perturbing the rest solution <mjx-container data-tex=\"\\mathbf{\\bar L}=\\mathbf{\\bar L^0}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.256ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"7.256ex\" height=\"2.353ex\" viewBox=\"0 -958 3207.1 1040\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D40B\" href=\"#MJX-TEX-B-1D40B\"><\/use><g transform=\"translate(346,251) translate(-287.5 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-B-AF\"><\/use><\/g><\/g><\/g><\/g><use x=\"969.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2025.6)\"><g><g><g><use data-c=\"1D40B\" href=\"#MJX-TEX-B-1D40B\"><\/use><g transform=\"translate(346,251) translate(-287.5 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-B-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(725,363) scale(0.707)\"><use data-c=\"1D7CE\" href=\"#MJX-TEX-B-1D7CE\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. In other words, the elastic potential remain mono-stable along the entire relaxation. Upon release from <mjx-container data-tex=\"\\mathbf{L}_\\text{hold}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.777ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.357ex;\" width=\"4.777ex\" height=\"1.909ex\" viewBox=\"0 -686 2111.4 843.8\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D40B\" href=\"#MJX-TEX-B-1D40B\"><\/use><g transform=\"translate(725,-150) scale(0.707)\"><use data-c=\"68\" href=\"#MJX-TEX-N-68\"><\/use><use data-c=\"6F\" href=\"#MJX-TEX-N-6F\" transform=\"translate(556)\"><\/use><use data-c=\"6C\" href=\"#MJX-TEX-N-6C\" transform=\"translate(1056)\"><\/use><use data-c=\"64\" href=\"#MJX-TEX-N-64\" transform=\"translate(1334)\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, the configuration will snap to <mjx-container data-tex=\"\\mathbf{L}_\\text{s}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.384ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.357ex;\" width=\"2.384ex\" height=\"1.909ex\" viewBox=\"0 -686 1053.6 843.8\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D40B\" href=\"#MJX-TEX-B-1D40B\"><\/use><g transform=\"translate(725,-150) scale(0.707)\"><use data-c=\"73\" href=\"#MJX-TEX-N-73\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> and evolve back with <mjx-container data-tex=\"\\mathbf{\\bar L}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.566ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"1.566ex\" height=\"2.167ex\" viewBox=\"0 -958 692 958\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D40B\" href=\"#MJX-TEX-B-1D40B\"><\/use><g transform=\"translate(346,251) translate(-287.5 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-B-AF\"><\/use><\/g><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> to <mjx-container data-tex=\"\\mathbf{\\bar L^0}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.673ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"2.673ex\" height=\"2.167ex\" viewBox=\"0 -958 1181.6 958\"><g transform=\"scale(1,-1)\"><g><g><g><g><g><use data-c=\"1D40B\" href=\"#MJX-TEX-B-1D40B\"><\/use><g transform=\"translate(346,251) translate(-287.5 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-B-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(725,363) scale(0.707)\"><use data-c=\"1D7CE\" href=\"#MJX-TEX-B-1D7CE\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. Put in more conventional terms the relaxation of the forces during the holding was not enough to stabilize the mass near the position of relaxation and when released it snaps back to a position near its original rest position.<\/p>", "hash": "e5a22e41b446", "gist": {"html": "With a stiff vertical spring the truss stays monostable throughout and snaps back on release.", "status": "ai-draft"}}, {"id": "sec-sls_von_Mises_truss-p4", "kind": "paragraph", "body": "<p>The second limit to consider is that of small <mjx-container data-tex=\"\\a \\rightarrow 0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.099ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"6.099ex\" height=\"1.557ex\" viewBox=\"0 -666 2695.6 688\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D6FC\" href=\"#MJX-TEX-I-1D6FC\"><\/use><use x=\"917.8\" data-c=\"2192\" href=\"#MJX-TEX-N-2192\"><\/use><use x=\"2195.6\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container>, FIG. <a href=\"#fig-sls_von_mises_truss_lengths_space\">3<\/a>c. Low values of <mjx-container data-tex=\"\\a\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.448ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"1.448ex\" height=\"1.025ex\" viewBox=\"0 -442 640 453\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FC\" href=\"#MJX-TEX-I-1D6FC\"><\/use><\/g><\/svg><\/mjx-container> diminish the value of the eccentricity towards unity, shrink the hyperbola vertically and transform the two asymptotic lines to become closer to parallel. Thus, as expected, the <a data-def=\"rest-length\">rest lengths<\/a> <mjx-container data-tex=\"\\mathbf{\\bar L^0}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.673ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"2.673ex\" height=\"2.167ex\" viewBox=\"0 -958 1181.6 958\"><g transform=\"scale(1,-1)\"><g><g><g><g><g><use data-c=\"1D40B\" href=\"#MJX-TEX-B-1D40B\"><\/use><g transform=\"translate(346,251) translate(-287.5 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-B-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(725,363) scale(0.707)\"><use data-c=\"1D7CE\" href=\"#MJX-TEX-B-1D7CE\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> is now associated with two stable points; the original rest position and another stable point, <mjx-container data-tex=\"\\mathbf{L}_\\text{i}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.198ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.339ex;\" width=\"2.198ex\" height=\"1.891ex\" viewBox=\"0 -686 971.6 836\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D40B\" href=\"#MJX-TEX-B-1D40B\"><\/use><g transform=\"translate(725,-150) scale(0.707)\"><use data-c=\"69\" href=\"#MJX-TEX-N-69\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, situated closer to the inverted configuration <mjx-container data-tex=\"\\mathbf{L}_\\text{hold}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.777ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.357ex;\" width=\"4.777ex\" height=\"1.909ex\" viewBox=\"0 -686 2111.4 843.8\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D40B\" href=\"#MJX-TEX-B-1D40B\"><\/use><g transform=\"translate(725,-150) scale(0.707)\"><use data-c=\"68\" href=\"#MJX-TEX-N-68\"><\/use><use data-c=\"6F\" href=\"#MJX-TEX-N-6F\" transform=\"translate(556)\"><\/use><use data-c=\"6C\" href=\"#MJX-TEX-N-6C\" transform=\"translate(1056)\"><\/use><use data-c=\"64\" href=\"#MJX-TEX-N-64\" transform=\"translate(1334)\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, and associated with <mjx-container data-tex=\"z&lt;0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.2ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.09ex;\" width=\"5.2ex\" height=\"1.597ex\" viewBox=\"0 -666 2298.6 706\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><use x=\"742.8\" data-c=\"3C\" href=\"#MJX-TEX-N-3C\"><\/use><use x=\"1798.6\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container>. During relaxation the position of the two stable configurations also evolve slightly, <mjx-container data-tex=\"\\mathbf{L}_\\text{s}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.384ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.357ex;\" width=\"2.384ex\" height=\"1.909ex\" viewBox=\"0 -686 1053.6 843.8\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D40B\" href=\"#MJX-TEX-B-1D40B\"><\/use><g transform=\"translate(725,-150) scale(0.707)\"><use data-c=\"73\" href=\"#MJX-TEX-N-73\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> for some another <mjx-container data-tex=\"z&gt;0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.2ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"verti class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.09ex;\" width=\"5.2ex\" height=\"1.597ex\" viewBox=\"0 -666 2298.6 706\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><use x=\"742.8\" data-c=\"3C\" href=\"#MJX-TEX-N-3C\"><\/use><use x=\"1798.6\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container>. However, the <a data-def=\"reference-length\">reference length<\/a> <mjx-container data-tex=\"\\mathbf{\\bar L}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.566ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"1.566ex\" height=\"2.167ex\" viewBox=\"0 -958 692 958\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D40B\" href=\"#MJX-TEX-B-1D40B\"><\/use><g transform=\"translate(346,251) translate(-287.5 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-B-AF\"><\/use><\/g><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> continuously evolves towards collinearity with <mjx-container data-tex=\"\\mathbf{L}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.566ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"1.566ex\" height=\"1.552ex\" viewBox=\"0 -686 692 686\"><g transform=\"scale(1,-1)\"><use data-c=\"1D40B\" href=\"#MJX-TEX-B-1D40B\"><\/use><\/g><\/svg><\/mjx-container> and <mjx-container data-tex=\"\\mathbf{\\bar L^{0}}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.673ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"2.673ex\" height=\"2.167ex\" viewBox=\"0 -958 1181.6 958\"><g transform=\"scale(1,-1)\"><g><g><g><g><g><use data-c=\"1D40B\" href=\"#MJX-TEX-B-1D40B\"><\/use><g transform=\"translate(346,251) translate(-287.5 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-B-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(725,363) scale(0.707)\"><use data-c=\"1D7CE\" href=\"#MJX-TEX-B-1D7CE\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. However, as no state other than the trivial one is stable with respect to <mjx-container data-tex=\"\\mathbf{\\bar L}=\\mathbf{\\bar L^0}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.256ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"7.256ex\" height=\"2.353ex\" viewBox=\"0 -958 3207.1 1040\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D40B\" href=\"#MJX-TEX-B-1D40B\"><\/use><g transform=\"translate(346,251) translate(-287.5 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-B-AF\"><\/use><\/g><\/g><\/g><\/g><use x=\"969.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2025.6)\"><g><g><g><use data-c=\"1D40B\" href=\"#MJX-TEX-B-1D40B\"><\/use><g transform=\"translate(346,251) translate(-287.5 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-B-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(725,363) scale(0.707)\"><use data-c=\"1D7CE\" href=\"#MJX-TEX-B-1D7CE\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> such a process cannot converge to a stable state and thus must at some time loose stability.<\/p>", "hash": "14d3ec861951", "gist": {"html": "At intermediate stiffness the stability acquired while held must be lost: no inverted state is stable at rest.", "status": "ai-draft"}}, {"id": "sec-sls_von_Mises_truss-p7", "kind": "paragraph", "body": "<p>The <a data-def=\"von-mises-truss\">Von-Mises truss<\/a> SLS models displays non-trivial phenomenology of instabilities of viscoelastic systems, all of which are intuitively explained through the graphical representation. If the system at rest can be brought to another locally stable equilibrium, then the equilibrium point will remain unchanged despite the visco-elastic evolution. In particular it will never become unstable. Conversely, state that lose stability at a finite time must have not been stable with respect to their rest state and their stability must have been acquired through relaxation. Last, every acquired stable point cannot remain stable indefinitely and must become unstable. The results obtained here were obtained for the specific geometry and constitutive relations of the Von-Mises SLS system. However, they remain valid for rather general linear visco-elastic systems. In appendix <a href=\"#app-1d_sls_systems\"><\/a> we show that they hold for an arbitrary collection of SLS’s provided the mass they are connected to is constrained to move along a line and they all share the same <mjx-container data-tex=\"\\b\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.281ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.281ex\" height=\"2.034ex\" viewBox=\"0 -705 566 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/svg><\/mjx-container> and <mjx-container data-tex=\"\\tau\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.17ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.029ex;\" width=\"1.17ex\" height=\"1.005ex\" viewBox=\"0 -431 517 444\"><g transform=\"scale(1,-1)\"><use data-c=\"1D70F\" href=\"#MJX-TEX-I-1D70F\"><\/use><\/g><\/svg><\/mjx-container>. We next come to generalize these result for the general isotropic and <a data-def=\"incompressible\">incompressible<\/a> three dimensional linearly viscoelastic continua.<\/p>", "hash": "4ebda9975b76", "gist": {"html": "Rest-stable states never destabilize; states that lose stability had acquired it, and acquired stability is eventually lost.", "status": "ai-draft"}}], "gist": {"html": "Holding a viscoelastic truss inverted gives three phases: never bistable, always bistable, or bistable for a while.", "status": "ai-draft"}, "brief": {"html": "<p><span data-covers=\"sec-sls_von_Mises_truss-p1\">In a von Mises truss of three standard linear solids, the elastic energy is the squared distance between the reference lengths and the curve of lengths the truss can take.<\/span> <span data-covers=\"sec-sls_von_Mises_truss-p2\">Holding the mass inverted pulls the reference point straight towards the held lengths; stable states are where normals from it meet the curve.<\/span> <span data-covers=\"sec-sls_von_Mises_truss-p3 sec-sls_von_Mises_truss-p4 sec-sls_von_Mises_truss-p6\">As the stiffness ratio <mjx-container data-tex=\"\\alpha\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.448ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"1.448ex\" height=\"1.025ex\" viewBox=\"0 -442 640 453\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FC\" href=\"#MJX-TEX-I-1D6FC\"><\/use><\/g><\/svg><\/mjx-container> falls, the truss is never bistable, bistable only for a while after release, or always bistable.<\/span> <span data-covers=\"sec-sls_von_Mises_truss-p5 sec-sls_von_Mises_truss-p7\">A stable state reached from rest never moves, and only acquired stability is lost.<\/span><\/p>", "status": "ai-draft"}}], "gist": {"html": "In one dimension, evolving rest lengths explain when a truss of viscoelastic springs acquires and then loses stability.", "status": "ai-draft"}, "brief": {"html": "<p><span data-covers=\"section-II-A-p1\">A standard linear solid behaves at every instant like a spring of stiffness <mjx-container data-tex=\"k\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.179ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"1.179ex\" height=\"1.595ex\" viewBox=\"0 -694 521 705\"><g transform=\"scale(1,-1)\"><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><\/g><\/svg><\/mjx-container>, whose reference length relaxes partly towards the current length and partly back to its rest length.<\/span> <span data-covers=\"sec-sls_von_Mises_truss-p1 sec-sls_von_Mises_truss-p2\">For a truss of three such elements, the elastic energy becomes a squared distance in a plane of lengths, so stability can be read off a drawing.<\/span> <span data-covers=\"sec-sls_von_Mises_truss-p6 sec-sls_von_Mises_truss-p7\">Holding the truss inverted can create a second stable state that is later lost, while a stable state reached from rest never moves; an appendix extends both rules to any such assembly on a line.<\/span><\/p>", "status": "ai-draft"}}, {"id": "sec-metric_linear_viscoelasticity", "kind": "section", "number": "III", "title": "Metric linear viscoelasticity", "titleHtml": "Metric linear viscoelasticity", "children": [{"id": "sec-metric_linear_viscoelasticity-p1", "kind": "paragraph", "body": "<p>We now turn to discuss linear viscoelasticity of continuous bodies. Such systems are amenable to a geometric reformulation similar to what we did for the SLS model. Here we need to exploit an infinitesimal analog of the evolving <a data-def=\"reference-length\">reference lengths<\/a>, which we achive by resorting to an elastic description using metric tensors.<\/p>", "hash": "d2347cfe0cd5", "gist": {"html": "Continuous bodies need an infinitesimal reference length: a metric tensor.", "status": "ai-draft"}}, {"id": "bg-metric", "kind": "background", "title": "Metric tensors and strain in elasticity", "audience": ["student", "physicist"], "fold": true, "body": "<p>Label each material point by coordinates <mjx-container data-tex=\"x^i\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.034ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"2.034ex\" height=\"1.904ex\" viewBox=\"0 -830.4 899 841.4\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D465\" href=\"#MJX-TEX-I-1D465\"><\/use><g transform=\"translate(605,363) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> that move with it. A configuration places the point at <mjx-container data-tex=\"\\mathbf r(x)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.127ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"4.127ex\" height=\"2.262ex\" viewBox=\"0 -750 1824 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D42B\" href=\"#MJX-TEX-B-1D42B\"><\/use><use x=\"474\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"863\" data-c=\"1D465\" href=\"#MJX-TEX-I-1D465\"><\/use><use x=\"1435\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> in space, and the squared distance between neighbouring points is <mjx-container data-tex=\"g_{ij}dx^idx^j\" class=\"MathJax\" jax=\"SVG\" style=\"--w:9.006ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"9.006ex\" height=\"2.544ex\" viewBox=\"0 -830.4 3980.6 1124.6\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1095.3\" data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><g transform=\"translate(1615.3)\"><use data-c=\"1D465\" href=\"#MJX-TEX-I-1D465\"><\/use><g transform=\"translate(605,363) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><use x=\"2514.2\" data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><g transform=\"translate(3034.2)\"><use data-c=\"1D465\" href=\"#MJX-TEX-I-1D465\"><\/use><g transform=\"translate(605,363) scale(0.707)\"><use data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> with <mjx-container data-tex=\"g_{ij}=\\partial_i\\mathbf r\\cdot\\partial_j\\mathbf r\" class=\"MathJax\" jax=\"SVG\" style=\"--w:13.264ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"13.264ex\" height=\"2.283ex\" viewBox=\"0 -715 5862.6 1009.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1373.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2428.8)\"><use data-c=\"1D715\" href=\"#MJX-TEX-I-1D715\"><\/use><g transform=\"translate(564,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><use x=\"3286.8\" data-c=\"1D42B\" href=\"#MJX-TEX-B-1D42B\"><\/use><use x=\"3983\" data-c=\"22C5\" href=\"#MJX-TEX-N-22C5\"><\/use><g transform=\"translate(4483.2)\"><use data-c=\"1D715\" href=\"#MJX-TEX-I-1D715\"><\/use><g transform=\"translate(564,-150) scale(0.707)\"><use data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"5388.6\" data-c=\"1D42B\" href=\"#MJX-TEX-B-1D42B\"><\/use><\/g><\/g><\/svg><\/mjx-container>, the metric induced by the configuration. Rigid motions leave <mjx-container data-tex=\"g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"1.666ex\" viewBox=\"0 -442 1095.3 736.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> unchanged, so the metric records exactly the deformation. If the body would be stress-free with lengths given by a <a data-def=\"reference-metric\">reference metric<\/a> <mjx-container data-tex=\"\\bar g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"2.234ex\" viewBox=\"0 -693 1095.3 987.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, the natural strain is <mjx-container data-tex=\"\\varepsilon_{ij}=\\tfrac12(g_{ij}-\\bar g_{ij})\" class=\"MathJax\" jax=\"SVG\" style=\"--w:16.747ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.781ex;\" width=\"16.747ex\" height=\"2.737ex\" viewBox=\"0 -864.9 7402.4 1209.9\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D700\" href=\"#MJX-TEX-I-1D700\"><\/use><g transform=\"translate(499,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1362.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2417.8)\"><g><g transform=\"translate(220,394) scale(0.707)\"><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><g transform=\"translate(220,-345) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><rect width=\"553.6\" height=\"60\" x=\"120\" y=\"220\"><\/rect><\/g><\/g><use x=\"3211.4\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><g transform=\"translate(3600.4)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"4917.9\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><g transform=\"translate(5918.1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"7013.4\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>, the Green–Lagrange strain, and the elastic energy density is quadratic in it, with indices raised by a metric. For an ordinary body <mjx-container data-tex=\"\\bar g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"2.234ex\" viewBox=\"0 -693 1095.3 987.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> is the metric of its relaxed shape, but it can be any metric, even one that no shape in space realizes, as in growing tissue. The paper treats a viscoelastic body in these metric tensors: at each instant elastic, about a reference metric that slowly changes.<\/p>"}, {"id": "sec-viscoelastic_continuum", "kind": "section", "number": "III A", "title": "Linear viscoelastic continuum", "titleHtml": "Linear viscoelastic continuum", "children": [{"id": "sec-viscoelastic_continuum-p1", "kind": "paragraph", "body": "<p>We start by equipping the body with a material (or Lagrangian) coordinate system <mjx-container data-tex=\"x^1,x^2,x^3\" class=\"MathJax\" jax=\"SVG\" style=\"--w:8.857ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"8.857ex\" height=\"2.326ex\" viewBox=\"0 -833.9 3915 1027.9\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D465\" href=\"#MJX-TEX-I-1D465\"><\/use><g transform=\"translate(605,363) scale(0.707)\"><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><use x=\"1008.6\" data-c=\"2C\" href=\"#MJX-TEX-N-2C\"><\/use><g transform=\"translate(1453.2)\"><use data-c=\"1D465\" href=\"#MJX-TEX-I-1D465\"><\/use><g transform=\"translate(605,363) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><use x=\"2461.8\" data-c=\"2C\" href=\"#MJX-TEX-N-2C\"><\/use><g transform=\"translate(2906.4)\"><use data-c=\"1D465\" href=\"#MJX-TEX-I-1D465\"><\/use><g transform=\"translate(605,363) scale(0.707)\"><use data-c=\"33\" href=\"#MJX-TEX-N-33\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. <mjx-container data-tex=\"\\textbf{r}(x^i,t)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.689ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"6.689ex\" height=\"2.444ex\" viewBox=\"0 -830.4 2956.6 1080.4\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D42B\" href=\"#MJX-TEX-B-1D42B\"><\/use><use x=\"474\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><g transform=\"translate(863)\"><use data-c=\"1D465\" href=\"#MJX-TEX-I-1D465\"><\/use><g transform=\"translate(605,363) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><use x=\"1762\" data-c=\"2C\" href=\"#MJX-TEX-N-2C\"><\/use><use x=\"2206.6\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"2567.6\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> is the configuration of the body at time <mjx-container data-tex=\"t\" class=\"MathJax\" jax=\"SVG\" style=\"--w:0.817ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"0.817ex\" height=\"1.441ex\" viewBox=\"0 -626 361 637\"><g transform=\"scale(1,-1)\"><use data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><\/g><\/svg><\/mjx-container> in <mjx-container data-tex=\"\\mathbb{R}^3\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.621ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"2.621ex\" height=\"1.885ex\" viewBox=\"0 -833.2 1158.6 833.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"211D\" href=\"#MJX-TEX-D-211D\"><\/use><g transform=\"translate(755,363) scale(0.707)\"><use data-c=\"33\" href=\"#MJX-TEX-N-33\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. The configuration manifest itself on the coordinate system (up to time dependent rigid motions) by the <dfn data-def=\"induced-metric\">induced Euclidean metric<\/dfn> <mjx-container data-tex=\"g_{ij}=\\partial_i \\textbf{r}\\cdot \\partial_j \\textbf{r}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:13.264ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"13.264ex\" height=\"2.283ex\" viewBox=\"0 -715 5862.6 1009.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1373.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2428.8)\"><use data-c=\"1D715\" href=\"#MJX-TEX-I-1D715\"><\/use><g transform=\"translate(564,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><use x=\"3286.8\" data-c=\"1D42B\" href=\"#MJX-TEX-B-1D42B\"><\/use><use x=\"3983\" data-c=\"22C5\" href=\"#MJX-TEX-N-22C5\"><\/use><g transform=\"translate(4483.2)\"><use data-c=\"1D715\" href=\"#MJX-TEX-I-1D715\"><\/use><g transform=\"translate(564,-150) scale(0.707)\"><use data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"5388.6\" data-c=\"1D42B\" href=\"#MJX-TEX-B-1D42B\"><\/use><\/g><\/g><\/svg><\/mjx-container>, which measure the infinitesimal lengths in the solid Efrati <em>et al.<\/em> (<a href=\"#cite-ESK09\">2009<\/a>). In analogy with <mjx-container data-tex=\"\\bar L^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.528ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"2.528ex\" height=\"2.113ex\" viewBox=\"0 -934 1117.6 934\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(714,363) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> we define the <em>rest <a data-def=\"reference-metric\">reference metric<\/a><\/em> <mjx-container data-tex=\"\\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"2.478ex\" height=\"2.892ex\" viewBox=\"0 -840.1 1095.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> as the metric on which the body is locally stress-free and stationary. That is, if the body was to be cut to infinitesimal pieces and each of the pieces allowed to freely relax indefinitely, then the lengths of each piece will approach those represented by the <dfn data-def=\"rest-reference-metric\">rest reference metric<\/dfn> <mjx-container data-tex=\"\\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"2.478ex\" height=\"2.892ex\" viewBox=\"0 -840.1 1095.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. The strain tensor of the body is<\/p>\n<div class=\"display\" id=\"eq-strain_relation\"><div class=\"eqbody\"><mjx-container data-tex=\"\\e_{ij}(t) = \\tfrac 1 2 \\left(g_{ij}(t)-\\gbaro_{ij} \\right).\" class=\"MathJax\" jax=\"SVG\" display=\"true\" style=\"--w:22.843ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.892ex;\" width=\"22.843ex\" height=\"2.892ex\" viewBox=\"0 -883.9 10096.4 1278.1\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D700\" href=\"#MJX-TEX-I-1D700\"><\/use><g transform=\"translate(499,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1084.3\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1473.3\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"1834.3\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"2501.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(3556.8)\"><g><g transform=\"translate(220,394) scale(0.707)\"><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><g transform=\"translate(220,-345) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><rect width=\"553.6\" height=\"60\" x=\"120\" y=\"220\"><\/rect><\/g><\/g><g transform=\"translate(4350.4)\"><g transform=\"translate(0 -0.5)\"><use data-c=\"28\" href=\"#MJX-TEX-SO-28\"><\/use><\/g><g transform=\"translate(458)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use dat -container>. <mjx-container data-tex=\"\\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"2.478ex\" height=\"2.892ex\" viewBox=\"0 -840.1 1095.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> was described above as the only stationary stress-free configuration. By Eq. <a href=\"#eq-strain_relation\">(8)<\/a>, <mjx-container data-tex=\"S^{ij}(t)=0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:9.7ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"9.7ex\" height=\"2.444ex\" viewBox=\"0 -830.4 4287.4 1080.4\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D446\" href=\"#MJX-TEX-I-1D446\"><\/use><g transform=\"translate(729.6,363) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1314.9\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1703.9\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"2064.9\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"2731.7\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"3787.4\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container> for all <mjx-container data-tex=\"t\" class=\"MathJax\" jax=\"SVG\" style=\"--w:0.817ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"0.817ex\ a-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1314.9\" data-c=\"5B\" href=\"#MJX-TEX-N-5B\"><\/use><g transform=\"translate(1592.9)\"><use data-c=\"1D700\" href=\"#MJX-TEX-I-1D700\"><\/use><g transform=\"translate(499,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"2677.2\" data-c=\"5D\" href=\"#MJX-TEX-N-5D\"><\/use><\/g><\/g><\/svg><\/mjx-container> around the zero function, and obtain a linear functional<\/p>\n<div class=\"display\" id=\"eq-tensor_linear_viscoelasticity\"><div class=\"eqbody\"><mjx-container data-tex=\"S^{ij}(t) = C^{ijkl}\\e_{kl} + \\int_{-\\infty}^t \\Phi^{ijkl}(t-s) \\e_{kl}(s)\\ ds.\" class=\"MathJax\" jax=\"SVG\" display=\"true\" style=\"--w:42.653ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -2.159ex;\" width=\"42.653ex\" height=\"5.622ex\" viewBox=\"0 -1530.7 18852.5 2485\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D446\" href=\"#MJX-TEX-I-1D446\"><\/use><g transform=\"translate(729.6,413) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1314.9\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1703.9\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"2064.9\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"2731.7\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(3787.4)\"><use data-c=\"1D436\" href=\"#MJX-TEX-I-1D436\"><\/use><g transform=\"translate(845.3,413) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><use x=\"757\" data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><use x=\"1278\" data-c=\"1D459\" href=\"#MJX-TEX-I-1D459\"><\/use><\/g><\/g><g transform=\"translate(5797.1)\"><use data-c=\"1D700\" href=\"#MJX-TEX-I-1D700\"><\/use
