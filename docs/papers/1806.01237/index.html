 Pirrera, and P.  Weaver, International Journal of Solids and Structures <strong> 49<\/strong>, 1077 ( 2012)<\/span><\/li><li id=\"cite-Zen48\"><span class=\"reftext\"> C.  Zener, <em> Elasticity and Anelasticity of Metals<\/em> ( University of Chicago Press, 1948) google-Books-ID: FKcZAAAAIAAJ<\/span><\/li><li id=\"cite-AB09\"><span class=\"reftext\"> A. F. Bower, <em> Applied mechanics of solids<\/em> ( CRC press, 2009)<\/span><\/li><li id=\"cite-ZPB91\"><span class=\"reftext\"> Z.  Bažant and L.  Cedolin, <a href=\"https://books.google.co.il/books?id=0PiHE6rV7ZYC\"><em> Stability of Structures: Elastic, Inelastic, Fracture, and Damage Theories<\/em><\/a>, Dover books on engineering ( Dover Publications, 1991)<\/span><\/li><li id=\"cite-ESK09\"><span class=\"reftext\"> E.  Efrati, E.  Sharon, and R.  Kupferman, Journal of the Mechanics and Physics of Solids <strong> 57<\/strong>, 762 ( 2009)<\/span><\/li><li id=\"cite-LL86\"><span class=\"reftext\"> L. D. Landau and E.  Lifshitz, Course of Theoretical Physics <strong> 3<\/strong>, 109 ( 1986)<\/span><\/li><li id=\"cite-CN61\"><span class=\"reftext\"> B. D. Coleman and W.  Noll, Reviews of Modern Physics <strong> 33<\/strong>, 239 ( 1961)<\/span><\/li><li id=\"cite-ESK13\"><span class=\"reftext\"> E.  Efrati, E.  Sharon, and R.  Kupferman, Soft Matter <strong> 9<\/strong>, 8187 ( 2013)<\/span><\/li><li id=\"cite-Note1\"><span class=\"reftext\">For the case of elasto-plasticity, a similar idea was first proved but never published by H. Aharony. This type of behavior was also conjecture Hayman (<a href=\"#cite-BH78\">1978<\/a>).<\/span><\/li><li id=\"cite-EL69\"><span class=\"reftext\"> E. H. Lee ( ASME, 1969)<\/span><\/li><li id=\"cite-BH78\"><span class=\"reftext\"> B.  Hayman, Proceedings of the Royal Society of London A: Mathematical, Physical and Engineering Sciences <strong> 364<\/strong>, 393 ( 1978)<\/span><\/li><li id=\"cite-NH56\"><span class=\"reftext\"> N. J. Hoff, The Aeronautical Quarterly <strong> 7<\/strong>, 1 ( 1956)<\/span><\/li><li id=\"cite-Note2\"><span class=\"reftext\">Technically, another possibility is that the point will continuously progress to one of the rest elastic system extremum points.<\/span><\/li><\/ol><\/section>", "hash": "6fd486c00517"}], "gist": {"html": "<ul class=\"gist-list\">\n<li><b>Context<\/b> <span data-covers=\"section-I-p2 section-I-p3\">Rubbery solids can creep, then snap, though relaxation should only stabilize them.<\/span><\/li>\n<li><b>Result<\/b><ul>\n  <li data-claims=\"c-metric\"><span data-covers=\"section-II-A-p1 sec-viscoelastic_continuum-p2 sec-quasi_static_approximation-p2\">Viscoelasticity becomes elasticity about a reference metric drifting from rest towards recent shapes.<\/span><\/li>\n  <li data-claims=\"c-stationary\"><span data-covers=\"sec-stationary_states-p2 sec-stationary_states-p3\">In incompressible isotropic solids, a stable shape reached suddenly from rest never moves or destabilizes.<\/span><\/li>\n  <li data-claims=\"c-loss\"><span data-covers=\"sec-stationary_states-p1 sec-transient_stability_loss-p2 sec-transient_stability_loss-p3\">In incompressible isotropic solids only acquired stability can be lost, and it always is unless the shape is a rest equilibrium.<\/span><\/li>\n  <li data-claims=\"c-truss\"><span data-covers=\"sec-sls_von_Mises_truss-p3 sec-sls_von_Mises_truss-p4 sec-sls_von_Mises_truss-p6\">A spring–dashpot truss illustrates the rules: bistability absent, lasting, or acquired then lost.<\/span><\/li>\n  <li data-claims=\"c-popper\"><span data-covers=\"sec-transient_stability_loss-p1 sec-transient_stability_loss-p2 sec-transient_stability_loss-p3\">Rubber “jumping poppers” that snap back late had acquired their inverted stability.<\/span><\/li>\n<\/ul><\/li>\n<li><b>Why it matters<\/b> <span data-covers=\"section-I-p3 section-V-p1 section-V-p3\">Rules expected to hold for any memory kernel give insight into stability over time, where simulations were relied on.<\/span><\/li>\n<\/ul>", "status": "ai-draft", "variants": {"specialist": {"html": "<ul class=\"gist-list\">\n<li><b>Context<\/b> <span data-covers=\"section-I-p2 section-I-p3\">Linear relaxation lowers stresses, so should never destabilize a metastable state; yet viscoelastic solids creep, then snap.<\/span><\/li>\n<li><b>Result<\/b><ul>\n  <li data-claims=\"c-metric\"><span data-covers=\"sec-viscoelastic_continuum-p2 sec-quasi_static_approximation-p2\">Viscoelasticity becomes elasticity about a reference metric <mjx-container data-tex=\"\\bar g_{ij}(t)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.055ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"5.055ex\" height=\"2.363ex\" viewBox=\"0 -750 2234.3 1044.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1095.3\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1484.3\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"1845.3\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>, untouched by fast deformations, relaxing from the rest metric <mjx-container data-tex=\"\\bar g^0_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"2.478ex\" height=\"2.892ex\" viewBox=\"0 -840.1 1095.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> towards past configurations.<\/span><\/li>\n  <li data-claims=\"c-stationary\"><span data-covers=\"sec-stationary_states-p3 sec-stationary_states-p5\">For isotropic incompressible media, a rest-stable configuration imposed abruptly from rest stays static and stable for any scalar kernel, its elastic strain shrinking by <mjx-container data-tex=\"1-\\beta+\\beta\\phi(t)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:13.149ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"13.149ex\" height=\"2.262ex\" viewBox=\"0 -750 5811.9 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"722.2\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"1722.4\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"2510.7\" data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><use x=\"3510.9\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"4076.9\" data-c=\"1D719\" href=\"#MJX-TEX-I-1D719\"><\/use><use x=\"4672.9\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"5061.9\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"5422.9\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>.<\/span><\/li>\n  <li data-claims=\"c-loss\"><span data-covers=\"section-IV-A-p1 sec-stationary_states-p1 sec-transient_stability_loss-p3\">As <mjx-container data-tex=\"\\bar g^{\\rm stat}=\\beta g+(1-\\beta)\\bar g^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:21.089ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"21.089ex\" height=\"2.452ex\" viewBox=\"0 -833.9 9321.3 1083.9\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,363) scale(0.707)\"><use data-c=\"73\" href=\"#MJX-TEX-N-73\"><\/use><use x=\"394\" data-c=\"74\" href=\"#MJX-TEX-N-74\"><\/use><use x=\"783\" data-c=\"61\" href=\"#MJX-TEX-N-61\"><\/use><use x=\"1283\" data-c=\"74\" href=\"#MJX-TEX-N-74\"><\/use><\/g><\/g><use x=\"2020.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"3075.8\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"3641.8\" data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><use x=\"4341.1\" data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><use x=\"5341.3\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"5730.3\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"6452.5\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"7452.7\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"8018.7\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><g transform=\"translate(8407.7)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,363) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, stationary configurations are rest extremals: only acquired stability can be lost, and non-extremals lose it,<\/span> <span data-covers=\"sec-stationary_states-p2\">while rest saddles may stabilize permanently.<\/span><\/li>\n  <li data-claims=\"c-truss\"><span data-covers=\"sec-sls_von_Mises_truss-p6 sec-sls_von_Mises_truss-p7\">A three-SLS von Mises truss illustrates the rules in three phases,<\/span> <span data-covers=\"app-1d_sls_systems-p4 app-1d_sls_systems-p6\">proved for any mass on a line tied by equally relaxing SLS elements.<\/span><\/li>\n  <li data-claims=\"c-popper\"><span data-covers=\"sec-transient_stability_loss-p2 sec-transient_stability_loss-p3\">Jumping poppers that snap late had acquired their stability; inverted non-extremal shapes cannot be kept.<\/span><\/li>\n<\/ul><\/li>\n<li><b>Why it matters<\/b> <span data-covers=\"section-I-p3 section-V-p1 section-V-p3\">Rules expected to hold for any memory kernel give insight where simulations were relied on, elucidating subtle viscoelastic instabilities.<\/span><\/li>\n<\/ul>", "status": "ai-draft"}, "student": {"html": "<ul class=\"gist-list\">\n<li><b>Context<\/b> <span data-covers=\"section-I-p2 section-I-p3\">Rubbery materials can creep slowly, then snap, though relaxing stresses should only stabilize them.<\/span><\/li>\n<li><b>Result<\/b><ul>\n  <li data-claims=\"c-metric\"><span data-covers=\"section-II-A-p1 sec-viscoelastic_continuum-p2 sec-quasi_static_approximation-p2\">A viscoelastic solid acts as an elastic one whose preferred lengths drift towards recent shapes.<\/span><\/li>\n  <li data-claims=\"c-stationary\"><span data-covers=\"sec-stationary_states-p2 sec-stationary_states-p3\">Pushed quickly from rest into another stable shape, an incompressible solid stays put.<\/span><\/li>\n  <li data-claims=\"c-loss\"><span data-covers=\"sec-stationary_states-p1 sec-transient_stability_loss-p2 sec-transient_stability_loss-p3\">Only stability created by relaxation can be lost, and a shape not balanced at rest always loses it.<\/span><\/li>\n  <li data-claims=\"c-truss\"><span data-covers=\"sec-sls_von_Mises_truss-p3 sec-sls_von_Mises_truss-p4 sec-sls_von_Mises_truss-p6\">In a spring–dashpot truss, relaxation leaves one stable state, keeps two, or briefly adds one.<\/span><\/li>\n  <li data-claims=\"c-popper\"><span data-covers=\"sec-transient_stability_loss-p1 sec-transient_stability_loss-p2 sec-transient_stability_loss-p3\">“Jumping poppers” that snap back late had gained their inverted stability by relaxing.<\/span><\/li>\n<\/ul><\/li>\n<li><b>Why it matters<\/b> <span data-covers=\"section-I-p3 section-V-p3\">Simple rules, not simulations alone, may tell when rubber-like structures snap over time.<\/span><\/li>\n<\/ul>", "status": "ai-draft"}}}, "brief": {"html": "<p><span data-covers=\"section-I-p1 section-I-p2\">Rubber-like solids relax stress and creep, yet keep part of their stress indefinitely. Some creep slowly and then snap, as jumping poppers, rubber shells turned inside out, do: delayed stability loss.<\/span> <span data-covers=\"section-I-p3\">Laws tying stress to the whole strain history through a memory kernel simulate this well but explain little, and relaxation, which lowers stresses, seems bound to stabilize.<\/span> <span data-covers=\"section-V-p1 section-V-p2\">The paper finds that intuition right for states reached abruptly from rest, and traces viscoelastic instabilities to stability that relaxation itself created.<\/span><\/p>\n<p><span data-covers=\"section-II-A-p1\">A standard linear solid, a spring in parallel with a spring and a dashpot in series, acts at every instant as one spring, <mjx-container data-tex=\"F=-k(L-\\bar L)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:15.258ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"15.258ex\" height=\"2.679ex\" viewBox=\"0 -934 6744 1184\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D439\" href=\"#MJX-TEX-I-1D439\"><\/use><use x=\"1026.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"2082.6\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"2860.6\" data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><use x=\"3381.6\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"3770.6\" data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><use x=\"4673.8\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><g transform=\"translate(5674)\"><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><use x=\"6355\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>, about a reference length <mjx-container data-tex=\"\\bar L\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.541ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"1.541ex\" height=\"2.113ex\" viewBox=\"0 -934 681 934\"><g transform=\"scale(1,-1)\"><g><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. Viscous flow moves <mjx-container data-tex=\"\\bar L\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.541ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"1.541ex\" height=\"2.113ex\" viewBox=\"0 -934 681 934\"><g transform=\"scale(1,-1)\"><g><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> towards both the current length and the rest length <mjx-container data-tex=\"\\bar L^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.528ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"2.528ex\" height=\"2.113ex\" viewBox=\"0 -934 1117.6 934\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(714,363) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, weighted by <mjx-container data-tex=\"\\beta\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.281ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.281ex\" height=\"2.034ex\" viewBox=\"0 -705 566 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/svg><\/mjx-container>, the fraction of force relaxed at long times.<\/span> <span data-covers=\"sec-viscoelastic_continuum-p1 sec-viscoelastic_continuum-p2\">For a continuum the stress is likewise elastic in the difference between the actual metric <mjx-container data-tex=\"g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"1.666ex\" viewBox=\"0 -442 1095.3 736.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> and a reference metric <mjx-container data-tex=\"\\bar g_{ij}(t)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.055ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"5.055ex\" height=\"2.363ex\" viewBox=\"0 -750 2234.3 1044.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1095.3\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1484.3\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"1845.3\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>. Fast deformations leave <mjx-container data-tex=\"\\bar g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"2.234ex\" viewBox=\"0 -693 1095.3 987.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> unchanged, so it is the slow state variable, drifting from the rest metric <mjx-container data-tex=\"\\bar g^0_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"2.478ex\" height=\"2.892ex\" viewBox=\"0 -840.1 1095.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> towards recent shapes.<\/span> <span data-covers=\"sec-quasi_static_approximation-p1 sec-quasi_static_approximation-p2\">Because elasticity is fast, the body always takes the admissible shape closest to <mjx-container data-tex=\"\\bar g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"2.234ex\" viewBox=\"0 -693 1095.3 987.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> in elastic energy.<\/span><\/p>\n<p><span data-covers=\"sec-sls_von_Mises_truss-p1 sec-sls_von_Mises_truss-p2\">In a von Mises truss of three such elements, the energy is the squared distance from the reference point to the curve of lengths the truss can take. Stable states are therefore feet of normals to that curve.<\/span> <span data-covers=\"sec-sls_von_Mises_truss-p3 sec-sls_von_Mises_truss-p4\">Held inverted, the truss is never bistable when its symmetry-breaking spring is stiff, and always bistable when it is soft.<\/span> <span data-covers=\"sec-sls_von_Mises_truss-p6\">In between, relaxation creates an inverted stable state that is lost some time after release: a delayed instability.<\/span> <span data-covers=\"app-1d_sls_systems-p3 app-1d_sls_systems-p6\">An appendix proves the rules for any such assembly on a line sharing <mjx-container data-tex=\"\\beta\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.281ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.281ex\" height=\"2.034ex\" viewBox=\"0 -705 566 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/svg><\/mjx-container> and the relaxation time.<\/span><\/p>\n<p><span data-covers=\"section-IV-A-p1\">For isotropic incompressible solids the reference metric relaxes towards <mjx-container data-tex=\"\\bar g^{\\rm stat}_{ij}=\\beta g_{ij}+(1-\\beta)\\bar g^0_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:22.899ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"22.899ex\" height=\"2.892ex\" viewBox=\"0 -840.1 10121.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,363) scale(0.707)\"><use data-c=\"73\" href=\"#MJX-TEX-N-73\"><\/use><use x=\"394\" data-c=\"74\" href=\"#MJX-TEX-N-74\"><\/use><use x=\"783\" data-c=\"61\" href=\"#MJX-TEX-N-61\"><\/use><use x=\"1283\" data-c=\"74\" href=\"#MJX-TEX-N-74\"><\/use><\/g><g transform=\"translate(510,-292.2) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"2020.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"3075.8\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><g transform=\"translate(3641.8)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"4959.3\" data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><use x=\"5959.6\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"6348.6\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"7070.8\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"8071\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"8637\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><g transform=\"translate(9026)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, whatever the memory kernel.<\/span> <span data-covers=\"sec-stationary_states-p1 sec-stationary_states-p2\">So stationary forces are <mjx-container data-tex=\"(1-\\beta)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.938ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"6.938ex\" height=\"2.262ex\" viewBox=\"0 -750 3066.4 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"389\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"1111.2\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"2111.4\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"2677.4\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> times those of the rest elastic system: every stationary configuration is an equilibrium of the body at rest, and relaxation adds a positive term to its stiffness.<\/span> <span data-covers=\"sec-stationary_states-p3 sec-stationary_states-p5\">A body brought suddenly from rest into a stable shape therefore never moves or loses stability, because its reference metric slides straight towards that shape.<\/span> <span data-covers=\"sec-transient_stability_loss-p2 sec-transient_stability_loss-p3\">Only acquired stability can be lost, and stability acquired away from rest equilibria always is. A popper that snaps late had acquired its stability, and one unstable at rest cannot be kept inverted indefinitely.<\/span><\/p>\n<p><span data-covers=\"sec-stationary_states-p4\">The proofs need a scalar memory kernel, so they hold exactly for incompressible solids and approximately near incompressibility.<\/span> <span data-covers=\"section-V-p3\">Instabilities also need a curved set of admissible shapes, which a single element lacks; in continua relaxation can instead leave a non-Euclidean reference metric and residual stress.<\/span> <span data-covers=\"sec-transient_stability_loss-p1 fig-hopper_popper\">For poppers the text applies the rules qualitatively and gives simulated flip times; the comparison with experiments that the abstract mentions is not shown here.<\/span> <span data-covers=\"section-V-p4\">A rest metric that itself evolves, for growth or plasticity, is left open.<\/span><\/p>", "status": "ai-draft"}}, "defs": [{"id": "elastomeric-solid", "term": "elastomeric solid", "aliases": ["elastomeric solids"], "html": "A solid made of long polymer chains cross-linked into a network, such as latex or silicone rubber, or the proteins elastin and resilin in tissues. Elastomers are soft, stretch reversibly beyond 100% strain, and are viscoelastic: they creep and relax stress, yet keep their shape's topology.", "at": {"node": "section-I-p1", "quote": "Elastomeric solids are ubiquitous materials"}}, {"id": "stress-relaxation", "term": "stress relaxation", "html": "The gradual drop of the force a body supports while held at a fixed deformation. In elastomeric solids it is only fractional: a finite part of the stress remains however long one waits. The paper's <mjx-container data-tex=\"\\beta\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.281ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.281ex\" height=\"2.034ex\" viewBox=\"0 -705 566 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/svg><\/mjx-container> is the fraction that relaxes.", "at": {"node": "section-I-p1", "quote": "they also show stress relaxation"}}, {"id": "creep", "term": "creep", "html": "The slow, continuing deformation of a body under a constant load, the counterpart of stress relaxation at fixed deformation. In elastomers it is dissipative yet reversible. In delayed stability loss, a slow creep precedes a sudden snap.", "at": {"node": "section-I-p1", "quote": "creep under a constant load"}}, {"id": "delayed-stability-loss", "term": "delayed stability loss", "aliases": ["delayed instability", "delayed instabilities"], "html": "A fast elastic instability, such as a snap, that follows a period of slow creep, so that a seemingly stable state gives way only after a delay. Examples are the Venus fly-trap, jumping poppers and, outside elastomers, some earthquakes. The paper also calls it delayed instability.", "at": {"node": "section-I-p2", "quote": "delayed stability loss, in which a fast instability"}}, {"id": "snap-through", "term": "snap through", "aliases": ["snap-through", "snap though"], "html": "A sudden jump of an elastic structure, typically a shell or an arch, from one shape to another, when the shape it holds stops being a minimum of its elastic energy. The stored elastic energy is released quickly.", "at": {"node": "section-I-p2", "quote": "passive snap through of thin elastomeric shells"}}, {"id": "jumping-popper", "term": "jumping popper", "aliases": ["jumping poppers", "popper", "poppers"], "html": "A thin rubber shell that can be turned inside out. Very thin poppers are nearly isometrically bistable and stay inverted; thick ones have a single stable shape; suitably cut ones creep for a few seconds after inversion and then snap back.", "at": {"node": "section-I-p2", "quote": "known as jumping poppers"}}, {"id": "memory-kernel", "term": "memory kernel", "html": "In linear viscoelasticity, the function that weights past strains in the present stress, through an integral over the strain history. It fades with time, so recent history matters most. In the paper its long-time weight <mjx-container data-tex=\"\\beta\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.281ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.281ex\" height=\"2.034ex\" viewBox=\"0 -705 566 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/svg><\/mjx-container> dominates questions of stability; its form only influences the timing.", "at": {"node": "section-I-p3", "quote": "a material dependent memory kernel"}}, {"id": "rest-length", "term": "rest length", "aliases": ["rest lengths"], "html": "The length at which a spring exerts no force. The paper uses it in two senses: in the introduction for the evolving length of a viscoelastic element (in the body its reference length <mjx-container data-tex=\"\\bar L\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.541ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"1.541ex\" height=\"2.113ex\" viewBox=\"0 -934 681 934\"><g transform=\"scale(1,-1)\"><g><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>), and in the body for the fixed length <mjx-container data-tex=\"\\bar L^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.528ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"2.528ex\" height=\"2.113ex\" viewBox=\"0 -934 1117.6 934\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(714,363) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> the element would reach if left free indefinitely.", "at": {"node": "section-I-p4", "quote": "temporally evolving rest lengths"}}, {"id": "sls", "term": "standard linear solid", "html": "The simplest spring–dashpot model with both a finite instantaneous stiffness and only partial stress relaxation: a spring <mjx-container data-tex=\"(1-\\beta)k\" class=\"MathJax\" jax=\"SVG\" style=\"--w:8.116ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"8.116ex\" height=\"2.262ex\" viewBox=\"0 -750 3587.4 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"389\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"1111.2\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"2111.4\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"2677.4\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"3066.4\" data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><\/g><\/g><\/svg><\/mjx-container> in parallel with a spring <mjx-container data-tex=\"\\beta k\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.459ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"2.459ex\" height=\"2.034ex\" viewBox=\"0 -705 1087 899\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"566\" data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><\/g><\/g><\/svg><\/mjx-container> and a dashpot of viscosity <mjx-container data-tex=\"\\eta\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.124ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.489ex;\" width=\"1.124ex\" height=\"1.489ex\" viewBox=\"0 -442 497 658\"><g transform=\"scale(1,-1)\"><use data-c=\"1D702\" href=\"#MJX-TEX-I-1D702\"><\/use><\/g><\/svg><\/mjx-container> in series. Abbreviated SLS; its relaxation time is <mjx-container data-tex=\"\\tau=\\eta/\\beta k\" class=\"MathJax\" jax=\"SVG\" style=\"--w:8.902ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"8.902ex\" height=\"2.262ex\" viewBox=\"0 -750 3934.6 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D70F\" href=\"#MJX-TEX-I-1D70F\"><\/use><use x=\"794.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1850.6\" data-c=\"1D702\" href=\"#MJX-TEX-I-1D702\"><\/use><use x=\"2347.6\" data-c=\"2F\" href=\"#MJX-TEX-N-2F\"><\/use><use x=\"2847.6\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"3413.6\" data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><\/g><\/g><\/svg><\/mjx-container>.", "at": {"node": "section-I-p4", "quote": "standard linear solid (SLS) model"}}, {"id": "von-mises-truss", "term": "von Mises truss", "aliases": ["Von-Misses truss", "von-Mises truss", "Von-Mises truss"], "html": "A classic model of snap-through: a point held by two inclined bars, with two mirror-image stable positions. Here the bars are standard linear solids, the point is a mass moving along a line, and a third, vertical element of relative stiffness <mjx-container data-tex=\"\\alpha\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.448ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"1.448ex\" height=\"1.025ex\" viewBox=\"0 -442 640 453\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FC\" href=\"#MJX-TEX-I-1D6FC\"><\/use><\/g><\/svg><\/mjx-container> breaks the symmetry.", "at": {"node": "section-I-p4", "quote": "in the form of a Von-Misses truss"}}, {"id": "transient-stability", "term": "transient elastic stability", "aliases": ["transient stability"], "html": "Stability that holds only for a time: a configuration is a local minimum of the elastic energy about the present reference lengths or metric, but stops being one as these keep relaxing. The truss at intermediate stiffness and a released inverted popper show it.", "at": {"node": "section-I-p4", "quote": "first example of transient elastic stability"}}, {"id": "stationary-state", "term": "stationary state", "aliases": ["stationary states", "stationarity"], "html": "A state that no longer changes in time. The paper uses it in two senses: for the truss, a configuration that stays fixed while its reference lengths still relax; for continua and in the appendix, a state in which both the configuration and the reference metric have stopped.", "at": {"node": "section-I-p4", "quote": "stability and stationarity of a general 1D"}}, {"id": "reference-length", "term": "reference length", "aliases": ["reference lengths"], "symbol": "<mjx-container data-tex=\"\\bar L\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.541ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"1.541ex\" height=\"2.113ex\" viewBox=\"0 -934 681 934\"><g transform=\"scale(1,-1)\"><g><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>", "html": "For one viscoelastic element, the length <mjx-container data-tex=\"\\bar L\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.541ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"1.541ex\" height=\"2.113ex\" viewBox=\"0 -934 681 934\"><g transform=\"scale(1,-1)\"><g><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> about which it acts as an ordinary spring, <mjx-container data-tex=\"F=-k(L-\\bar L)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:15.258ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"15.258ex\" height=\"2.679ex\" viewBox=\"0 -934 6744 1184\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D439\" href=\"#MJX-TEX-I-1D439\"><\/use><use x=\"1026.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"2082.6\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"2860.6\" data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><use x=\"3381.6\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"3770.6\" data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><use x=\"4673.8\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><g transform=\"translate(5674)\"><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><use x=\"6355\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>. It combines the springs' rest lengths and the dashpot's extension, so fast stretching leaves it unchanged, while viscous flow moves it towards the current length and the rest length <mjx-container data-tex=\"\\bar L^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.528ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"2.528ex\" height=\"2.113ex\" viewBox=\"0 -934 1117.6 934\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(714,363) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>.", "at": {"node": "section-II-A-p1", "quote": "By setting the reference length"}}, {"id": "instantaneous-energy", "term": "instantaneous elastic energy", "aliases": ["instanteneous elastic energy"], "html": "The elastic energy computed about the present reference lengths or metric, held fixed. A dissipative body has no true free energy, but over short times this one governs its response; for a continuum it is quadratic in the elastic strain <mjx-container data-tex=\"\\tfrac12(g_{ij}-\\bar g_{ij})\" class=\"MathJax\" jax=\"SVG\" style=\"--w:11.277ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.781ex;\" width=\"11.277ex\" height=\"2.737ex\" viewBox=\"0 -864.9 4984.6 1209.9\"><g transform=\"scale(1,-1)\"><g><g><g><g transform=\"translate(220,394) scale(0.707)\"><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><g transform=\"translate(220,-345) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><rect width=\"553.6\" height=\"60\" x=\"120\" y=\"220\"><\/rect><\/g><\/g><use x=\"793.6\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><g transform=\"translate(1182.6)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"2500.1\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><g transform=\"translate(3500.3)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"4595.6\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>.", "at": {"node": "sec-sls_von_Mises_truss-p1", "quote": "of the instanteneous elastic energy"}}, {"id": "admissible-lengths", "term": "admissible lengths", "html": "The lengths that the truss's springs can actually take together as the mass moves, <mjx-container data-tex=\"(L_1(z),\\alpha L_2(z))\" class=\"MathJax\" jax=\"SVG\" style=\"--w:14.895ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"14.895ex\" height=\"2.262ex\" viewBox=\"0 -750 6583.8 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><g transform=\"translate(389)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(714,-150) scale(0.707)\"><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><use x=\"1506.6\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1895.6\" data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><use x=\"2360.6\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"2749.6\" data-c=\"2C\" href=\"#MJX-TEX-N-2C\"><\/use><use x=\"3194.2\" data-c=\"1D6FC\" href=\"#MJX-TEX-I-1D6FC\"><\/use><g transform=\"translate(3834.2)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(714,-150) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><use x=\"4951.8\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"5340.8\" data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><use x=\"5805.8\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"6194.8\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>: a curve in the plane of normalized lengths. Reference lengths can lie anywhere in the plane, and the elastic energy is the squared distance from them to a point of the curve.", "at": {"node": "sec-sls_von_Mises_truss-p1", "quote": "a point on the admissible lengths"}}, {"id": "reference-metric", "term": "reference metric", "symbol": "<mjx-container data-tex=\"\\bar g_{ij}(t)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.055ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"5.055ex\" height=\"2.363ex\" viewBox=\"0 -750 2234.3 1044.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1095.3\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1484.3\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"1845.3\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>", "html": "The metric about which a viscoelastic body is, at each instant, simply elastic: the stress is the stiffness times half of <mjx-container data-tex=\"g_{ij}-\\bar g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.722ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"7.722ex\" height=\"2.234ex\" viewBox=\"0 -693 3413 987.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1317.5\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><g transform=\"translate(2317.7)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. Fast deformations leave it unchanged; it relaxes slowly from the rest reference metric towards recent configurations. It is the continuum analogue of the reference length.", "at": {"node": "section-I-p5", "quote": "time dependent three dimensional reference metric"}}, {"id": "metric-description", "term": "metric description", "html": "The paper's formulation of viscoelasticity: a body is described by its actual metric, the lengths it has, and by an evolving reference metric, the lengths it would locally like to have, with the stress elastic in their difference. It is covariant: written in material coordinates, valid for any choice of them.", "at": {"node": "section-I-p5", "quote": "covariant metric description"}}, {"id": "quasi-static", "term": "quasi static approximation", "aliases": ["quasi-static approximation"], "html": "Treating the motion as a sequence of elastic equilibria. Elastic responses are much faster than viscoelastic relaxation, so inertia is dropped and the configuration at each moment minimizes the instantaneous elastic energy about the current reference lengths or metric.", "at": {"node": "section-I-p5", "quote": "notions of quasi static approximation"}}, {"id": "isotropicity", "term": "isotropicity", "aliases": ["isotropy"], "html": "The paper's word for isotropy: invariance of the material response under rotations. In a body described by metrics, rotations are defined only relative to some metric, so one must say which; the paper takes stiffness and memory kernel isotropic with respect to the rest reference metric.", "at": {"node": "section-I-p5", "quote": "transient elastic stability and isotropicity"}}, {"id": "incompressible", "term": "incompressible", "aliases": ["incompressibility"], "html": "Keeping its volume under deformation (Poisson ratio <mjx-container data-tex=\"\\nu=1/2\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.61ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"7.61ex\" height=\"2.262ex\" viewBox=\"0 -750 3363.6 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D708\" href=\"#MJX-TEX-I-1D708\"><\/use><use x=\"807.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1863.6\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"2363.6\" data-c=\"2F\" href=\"#MJX-TEX-N-2F\"><\/use><use x=\"2863.6\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/svg><\/mjx-container>). The paper assumes the incompressible contraction also holds during relaxation, which makes the metric memory kernel scalar; its continuum stability claims are proved under this assumption and hold approximately near it.", "at": {"node": "section-I-p5", "quote": "isotropic and incompressible materials"}}, {"id": "induced-metric", "term": "induced Euclidean metric", "symbol": "<mjx-container data-tex=\"g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"1.666ex\" viewBox=\"0 -442 1095.3 736.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>", "html": "The metric <mjx-container data-tex=\"g_{ij}=\\partial_i\\mathbf r\\cdot\\partial_j\\mathbf r\" class=\"MathJax\" jax=\"SVG\" style=\"--w:13.264ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"13.264ex\" height=\"2.283ex\" viewBox=\"0 -715 5862.6 1009.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1373.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2428.8)\"><use data-c=\"1D715\" href=\"#MJX-TEX-I-1D715\"><\/use><g transform=\"translate(564,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><use x=\"3286.8\" data-c=\"1D42B\" href=\"#MJX-TEX-B-1D42B\"><\/use><use x=\"3983\" data-c=\"22C5\" href=\"#MJX-TEX-N-22C5\"><\/use><g transform=\"translate(4483.2)\"><use data-c=\"1D715\" href=\"#MJX-TEX-I-1D715\"><\/use><g transform=\"translate(564,-150) scale(0.707)\"><use data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"5388.6\" data-c=\"1D42B\" href=\"#MJX-TEX-B-1D42B\"><\/use><\/g><\/g><\/svg><\/mjx-container> that a configuration <mjx-container data-tex=\"\\mathbf r\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.072ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"1.072ex\" height=\"1.018ex\" viewBox=\"0 -450 474 450\"><g transform=\"scale(1,-1)\"><use data-c=\"1D42B\" href=\"#MJX-TEX-B-1D42B\"><\/use><\/g><\/svg><\/mjx-container> of the body in space induces on its material coordinates. It gives the actual distances between neighbouring material points, and fixes the configuration up to rigid motions.", "at": {"node": "sec-viscoelastic_continuum-p1", "quote": "the induced Euclidean metric"}}, {"id": "rest-reference-metric", "term": "rest reference metric", "aliases": ["rest metric"], "symbol": "<mjx-container data-tex=\"\\bar g^0_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"2.478ex\" height=\"2.892ex\" viewBox=\"0 -840.1 1095.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>", "html": "The metric on which the body is locally stress-free and stationary: the lengths each small piece would reach if cut out and left to relax indefinitely. It encodes the material's structure, is constant in time in this paper, and plays the role of the rest length <mjx-container data-tex=\"\\bar L^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.528ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"2.528ex\" height=\"2.113ex\" viewBox=\"0 -934 1117.6 934\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(714,363) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>.", "at": {"node": "sec-viscoelastic_continuum-p1", "quote": "we define the rest reference metric"}}, {"id": "piola-kirchhoff", "term": "second Piola–Kirchhoff stress", "aliases": ["second Piola-Kirchoff stress"], "symbol": "<mjx-container data-tex=\"S^{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.975ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"2.975ex\" height=\"1.929ex\" viewBox=\"0 -830.4 1314.9 852.4\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D446\" href=\"#MJX-TEX-I-1D446\"><\/use><g transform=\"translate(729.6,363) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>", "html": "A measure of stress referred to the undeformed body rather than the deformed one: contracted with a change of strain it gives the work done per unit reference volume. Here it is the work conjugate of the metric, per volume <mjx-container data-tex=\"\\sqrt{\\bar g^0}\\,d^3x\" class=\"MathJax\" jax=\"SVG\" style=\"--w:8.211ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.577ex;\" width=\"8.211ex\" height=\"2.851ex\" viewBox=\"0 -1005 3629.1 1260\"><g transform=\"scale(1,-1)\"><g><g><g transform=\"translate(1020)\"><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,289) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/g><use x=\"0\" y=\"95\" data-c=\"221A\" href=\"#MJX-TEX-SO-221A\"><\/use><rect width=\"913.6\" height=\"60\" x=\"1020\" y=\"885\"><\/rect><\/g><g transform=\"translate(1933.6)\"><g><\/g><\/g><g transform=\"translate(2100.6)\"><use data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><g transform=\"translate(553,363) scale(0.707)\"><use data-c=\"33\" href=\"#MJX-TEX-N-33\"><\/use><\/g><\/g><use x=\"3057.1\" data-c=\"1D465\" href=\"#MJX-TEX-I-1D465\"><\/use><\/g><\/g><\/svg><\/mjx-container>.", "at": {"node": "sec-viscoelastic_continuum-p1", "quote": "The second Piola-Kirchoff stress tensor"}}, {"id": "metric-memory-kernel", "term": "metric memory kernel", "symbol": "<mjx-container data-tex=\"\\hat\\Phi^{kl}_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.131ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.987ex;\" width=\"3.131ex\" height=\"3.365ex\" viewBox=\"0 -1051 1384.1 1487.4\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"3A6\" href=\"#MJX-TEX-N-3A6\"><\/use><g transform=\"translate(361,257) translate(-250 0)\"><use data-c=\"5E\" href=\"#MJX-TEX-N-5E\"><\/use><\/g><\/g><\/g><g transform=\"translate(755,363) scale(0.707)\"><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><use x=\"521\" data-c=\"1D459\" href=\"#MJX-TEX-I-1D459\"><\/use><\/g><g transform=\"translate(755,-292.2) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>", "html": "The memory kernel rewritten for the reference metric, the inverse stiffness times the stress kernel: it says how past metrics feed the present reference metric. For isotropic materials it has a scalar part <mjx-container data-tex=\"\\beta\\phi(s)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.45ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"5.45ex\" height=\"2.262ex\" viewBox=\"0 -750 2409 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"566\" data-c=\"1D719\" href=\"#MJX-TEX-I-1D719\"><\/use><use x=\"1162\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1551\" data-c=\"1D460\" href=\"#MJX-TEX-I-1D460\"><\/use><use x=\"2020\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> and a part <mjx-container data-tex=\"\\psi(s)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.294ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"4.294ex\" height=\"2.262ex\" viewBox=\"0 -750 1898 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D713\" href=\"#MJX-TEX-I-1D713\"><\/use><use x=\"651\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1040\" data-c=\"1D460\" href=\"#MJX-TEX-I-1D460\"><\/use><use x=\"1509\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> mixing components; incompressibility removes the latter.", "at": {"node": "sec-viscoelastic_continuum-p2", "quote": "is the metric memory kernel"}}, {"id": "extremal", "term": "extremal", "aliases": ["extremals"], "html": "A configuration at which the energy is stationary, so all generalized forces vanish: a minimum, a maximum or a saddle. The paper calls a configuration stable only when it is a minimum, with positive definite Hessian, so an extremal need not be stable.", "at": {"node": "sec-quasi_static_approximation-p1", "quote": "For this extremal point to be a minima"}}, {"id": "acquired-stability", "term": "acquired stability", "html": "Stability gained through stress relaxation: a configuration unstable about the rest state becomes, after the body is held in or near it, a local minimum of the instantaneous elastic energy, so it persists when released. Such states later creep and may snap, in delayed stability loss.", "at": {"node": "sec-delayed_stability_and_loss-p2", "quote": "This phenomenon is called acquired stability"}}, {"id": "homogeneity", "term": "homogeneity", "html": "Uniformity of the material's properties across the body. Since stiffness and memory kernel are densities, the paper notes that uniform depends on the volume used; it takes them constant per initial volume <mjx-container data-tex=\"\\sqrt{\\bar g^0}\\,d^3x\" class=\"MathJax\" jax=\"SVG\" style=\"--w:8.211ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.577ex;\" width=\"8.211ex\" height=\"2.851ex\" viewBox=\"0 -1005 3629.1 1260\"><g transform=\"scale(1,-1)\"><g><g><g transform=\"translate(1020)\"><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,289) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/g><use x=\"0\" y=\"95\" data-c=\"221A\" href=\"#MJX-TEX-SO-221A\"><\/use><rect width=\"913.6\" height=\"60\" x=\"1020\" y=\"885\"><\/rect><\/g><g transform=\"translate(1933.6)\"><g><\/g><\/g><g transform=\"translate(2100.6)\"><use data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><g transform=\"translate(553,363) scale(0.707)\"><use data-c=\"33\" href=\"#MJX-TEX-N-33\"><\/use><\/g><\/g><use x=\"3057.1\" data-c=\"1D465\" href=\"#MJX-TEX-I-1D465\"><\/use><\/g><\/g><\/svg><\/mjx-container>, so equal deformations of equal rest volumes cost equal energy.", "at": {"node": "section-III-D-p3", "quote": "The assumption of homogeneity"}}, {"id": "rest-elastic-system", "term": "rest elastic system", "aliases": ["rest system"], "html": "The purely elastic body whose reference metric (or reference lengths) equals the rest one, <mjx-container data-tex=\"\\bar g_{ij}=\\bar g^0_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.973ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"7.973ex\" height=\"2.892ex\" viewBox=\"0 -840.1 3524.1 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1373.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2428.8)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>: the material with all relaxation undone. “Originally stable” means stable in this system; the paper shows that stationary viscoelastic configurations are its extremals.", "at": {"node": "sec-stationary_states-p1", "quote": "extremal solutions of the rest elastic system"}}, {"id": "drucker", "term": "Drucker stability criterion", "html": "A stability postulate of continuum mechanics, here in the form that the stiffness tensor is positive definite, so any non-zero strain costs elastic energy. The paper uses it to show that relaxation adds a positive definite term to the Hessian of the stationary energy.", "at": {"node": "sec-stationary_states-p2", "quote": "Drucker stability criterion states"}}, {"id": "frustrated", "term": "geometrically frustrated", "html": "Said of a body whose reference metric is non-Euclidean, so that no shape in space realizes all its preferred lengths at once and stress remains in every configuration: residual stress. The paper notes that viscoelastic relaxation can produce such a state from a Euclidean start.", "at": {"node": "section-V-p3", "quote": "giving rise to a geometrically frustrated state"}}, {"id": "temporary-bistability", "term": "temporary bistability", "aliases": ["pseudo bistability"], "html": "Names given in recent numerical studies of shells to states that are stable only for a while after being held; they were always observed to lose stability. The paper calls the phenomenon acquired stability, which was first identified in creep buckling.", "at": {"node": "app-1d_sls_systems-p2", "quote": "this phenomenon was termed temporary bistability"}}], "questions": [{"id": "q-notation", "at": {"node": "sec
