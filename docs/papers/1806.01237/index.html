le=\"vertical-align: 0;\" width=\"2.528ex\" height=\"2.113ex\" viewBox=\"0 -934 1117.6 934\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(714,363) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> or <mjx-container data-tex=\"\\bar g^0_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"2.478ex\" height=\"2.892ex\" viewBox=\"0 -840.1 1095.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, which is fixed; <mjx-container data-tex=\"g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"1.666ex\" viewBox=\"0 -442 1095.3 736.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> is the actual metric. <mjx-container data-tex=\"\\alpha\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.448ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"1.448ex\" height=\"1.025ex\" viewBox=\"0 -442 640 453\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FC\" href=\"#MJX-TEX-I-1D6FC\"><\/use><\/g><\/svg><\/mjx-container> is the truss stiffness ratio <mjx-container data-tex=\"\\sqrt{k_2/2k_1}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:8.903ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.639ex;\" width=\"8.903ex\" height=\"2.851ex\" viewBox=\"0 -977.5 3935.1 1260\"><g transform=\"scale(1,-1)\"><g><g><g transform=\"translate(1020)\"><g><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><g transform=\"translate(554,-150) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><use x=\"957.6\" data-c=\"2F\" href=\"#MJX-TEX-N-2F\"><\/use><use x=\"1457.6\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><g transform=\"translate(1957.6)\"><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><g transform=\"translate(554,-150) scale(0.707)\"><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><\/g><use x=\"0\" y=\"67.5\" data-c=\"221A\" href=\"#MJX-TEX-SO-221A\"><\/use><rect width=\"2915.1\" height=\"60\" x=\"1020\" y=\"857.5\"><\/rect><\/g><\/g><\/g><\/svg><\/mjx-container>, but also labels generalized coordinates <mjx-container data-tex=\"\\lambda_\\alpha\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.531ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.357ex;\" width=\"2.531ex\" height=\"1.927ex\" viewBox=\"0 -694 1118.5 851.8\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,-150) scale(0.707)\"><use data-c=\"1D6FC\" href=\"#MJX-TEX-I-1D6FC\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> and a mixing term <mjx-container data-tex=\"\\alpha(x,t)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.325ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"6.325ex\" height=\"2.262ex\" viewBox=\"0 -750 2795.7 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D6FC\" href=\"#MJX-TEX-I-1D6FC\"><\/use><use x=\"640\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1029\" data-c=\"1D465\" href=\"#MJX-TEX-I-1D465\"><\/use><use x=\"1601\" data-c=\"2C\" href=\"#MJX-TEX-N-2C\"><\/use><use x=\"2045.7\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"2406.7\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>.", "answeredBy": ["section-II-A-p1", "sec-sls_von_Mises_truss-p1", "section-IV-A-p1"]}, {"id": "q-reformulation", "at": {"node": "section-II-A"}, "source": "ai", "status": "draft", "q": "Is the reference length a new physical assumption?", "a": "No. For the standard linear solid it is an exact regrouping of the springs' rest lengths and the dashpot's length, and the paper calls its equations a mere reformulation of familiar viscoelastic dynamics. What it adds is a variable that fast deformations leave unchanged, so the element is an ordinary spring at every instant, and stability questions become geometric questions about where the reference lengths have moved.", "answeredBy": ["section-II-A-p1"]}, {"id": "q-intermediate", "at": {"node": "sec-sls_von_Mises_truss"}, "source": "ai", "status": "draft", "q": "Why must the truss at intermediate stiffness snap back, rather than settle in its acquired state?", "a": "After release the reference point keeps moving, towards a stationary mix of the current lengths and the rest lengths. A stationary state would have to be an equilibrium of the truss at its rest lengths, and at this stiffness the only stable one is the original position. So the inverted state cannot become stationary, its stability is lost at some time, and the truss snaps back.", "answeredBy": ["sec-sls_von_Mises_truss-p6", "app-1d_sls_systems-p4"]}, {"id": "q-kernel", "at": {"node": "section-IV-A"}, "source": "ai", "status": "draft", "q": "Why does only <mjx-container data-tex=\"\\beta\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.281ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.281ex\" height=\"2.034ex\" viewBox=\"0 -705 566 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/svg><\/mjx-container>, and not the shape of the memory kernel, decide stability?", "a": "With a scalar kernel the reference metric relaxes towards <mjx-container data-tex=\"\\bar g^{\\rm stat}=\\beta g+(1-\\beta)\\bar g^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:21.089ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"21.089ex\" height=\"2.452ex\" viewBox=\"0 -833.9 9321.3 1083.9\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,363) scale(0.707)\"><use data-c=\"73\" href=\"#MJX-TEX-N-73\"><\/use><use x=\"394\" data-c=\"74\" href=\"#MJX-TEX-N-74\"><\/use><use x=\"783\" data-c=\"61\" href=\"#MJX-TEX-N-61\"><\/use><use x=\"1283\" data-c=\"74\" href=\"#MJX-TEX-N-74\"><\/use><\/g><\/g><use x=\"2020.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"3075.8\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"3641.8\" data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><use x=\"4341.1\" data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><use x=\"5341.3\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"5730.3\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"6452.5\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"7452.7\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"8018.7\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><g transform=\"translate(8407.7)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,363) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> whatever the kernel's shape; the kernel sets only how fast it gets there. Stationary states and their stability depend on that endpoint, hence on <mjx-container data-tex=\"\\beta\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.281ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.281ex\" height=\"2.034ex\" viewBox=\"0 -705 566 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/svg><\/mjx-container> alone, while the kernel affects the time it takes to reach an instability. That is why the exponential kernel of the standard linear solid suffices.", "answeredBy": ["section-IV-A-p1", "section-IV-A-p2", "section-II-A-p1"]}, {"id": "q-collinear", "at": {"node": "sec-stationary_states"}, "source": "ai", "status": "draft", "q": "Why does a stable shape reached abruptly from rest not creep at all, although its stresses relax?", "a": "Starting from rest, the reference metric moves along the straight line from the rest metric towards the held configuration metric, so the elastic strain only shrinks by a common factor <mjx-container data-tex=\"1-\\beta+\\beta\\phi(t)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:13.149ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"13.149ex\" height=\"2.262ex\" viewBox=\"0 -750 5811.9 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"722.2\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"1722.4\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"2510.7\" data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><use x=\"3510.9\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"4076.9\" data-c=\"1D719\" href=\"#MJX-TEX-I-1D719\"><\/use><use x=\"4672.9\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"5061.9\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"5422.9\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>. Forces that vanished at the start keep vanishing, and the Hessian stays a mix of the initial positive one and a positive stiffness term. The configuration therefore remains the closest admissible one throughout.", "answeredBy": ["sec-stationary_states-p3", "sec-stationary_states-p5"]}, {"id": "q-saddle", "at": {"node": "sec-stationary_states"}, "source": "ai", "status": "draft", "q": "Can relaxation permanently stabilize a shape that was unstable at rest?", "a": "Only if it is an extremal of the rest system, such as a saddle point. The stationary Hessian is <mjx-container data-tex=\"(1-\\beta)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.938ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"6.938ex\" height=\"2.262ex\" viewBox=\"0 -750 3066.4 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"389\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"1111.2\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"2111.4\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"2677.4\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> times the rest one plus a positive term, so a saddle can become stable indefinitely, the more easily the closer <mjx-container data-tex=\"\\beta\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.281ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.281ex\" height=\"2.034ex\" viewBox=\"0 -705 566 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/svg><\/mjx-container> is to 1. A shape that is not a rest extremal cannot be stationary, so any stability it acquires must eventually be lost.", "answeredBy": ["sec-stationary_states-p2", "sec-transient_stability_loss-p3"]}, {"id": "q-incompressible", "at": {"node": "sec-stationary_states"}, "source": "ai", "status": "draft", "q": "Why do the continuum claims need incompressibility?", "a": "The proofs use a scalar metric memory kernel, so that relaxation moves every component of the reference metric towards the same mix of current and rest metrics. A compressible isotropic material has a second kernel <mjx-container data-tex=\"\\psi\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.473ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"1.473ex\" height=\"2.034ex\" viewBox=\"0 -694 651 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D713\" href=\"#MJX-TEX-I-1D713\"><\/use><\/g><\/svg><\/mjx-container>, which mixes components through changes of volume and breaks this collinearity. The paper states that the results still hold approximately, deviating less the closer the material is to incompressible; it does not estimate the deviation.", "answeredBy": ["section-III-D-p4", "section-IV-A-p1", "sec-stationary_states-p4"]}, {"id": "q-isotropy", "at": {"node": "section-III-D"}, "source": "ai", "status": "draft", "q": "Isotropic with respect to which metric, and does the choice matter?", "a": "Rotations of a body described by metrics are defined only by a chosen metric. The paper takes the stiffness and memory kernel isotropic with respect to the rest reference metric, because isotropy reflects the material's composition, which the rest metric encodes. A material isotropic about the instantaneous reference metric is possible in principle and would need a different stiffness tensor; the paper does not treat it.", "answeredBy": ["section-III-D-p1", "section-III-D-p2"]}, {"id": "q-held", "at": {"node": "sec-transient_stability_loss"}, "source": "ai", "status": "draft", "q": "Must a popper be held inverted for it to snap back late?", "a": "The argument fixes only that a popper which snaps a finite time after inversion had acquired its stability, since a shape stable at rest and reached from rest never loses it. How it was acquired is left open: holding it inverted long enough is the presumable route. Conversely, if the inverted shape was unstable at rest, no holding or other deformation keeps it inverted for good.", "answeredBy": ["sec-transient_stability_loss-p2", "sec-transient_stability_loss-p3"]}, {"id": "q-experiments", "at": {"node": "sec-transient_stability_loss"}, "source": "ai", "status": "draft", "q": "Does the paper compare its predictions with experiments on poppers?", "a": "Not in this text. The abstract mentions quantitative agreement with experiments on silicone rubber shells, but the popper section applies the stability rules qualitatively, and its figure shows a simulated cone (<mjx-container data-tex=\"\\beta=0.3\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.189ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"7.189ex\" height=\"2.034ex\" viewBox=\"0 -705 3177.6 899\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"843.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(1899.6)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><use data-c=\"2E\" href=\"#MJX-TEX-N-2E\" transform=\"translate(500)\"><\/use><use data-c=\"33\" href=\"#MJX-TEX-N-33\" transform=\"translate(778)\"><\/use><\/g><\/g><\/g><\/svg><\/mjx-container>, <mjx-container data-tex=\"\\nu=0.47\" class=\"MathJax\" jax=\"SVG\" style=\"--w:8.239ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"8.239ex\" height=\"1.717ex\" viewBox=\"0 -677 3641.6 759\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D708\" href=\"#MJX-TEX-I-1D708\"><\/use><use x=\"807.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(1863.6)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><use data-c=\"2E\" href=\"#MJX-TEX-N-2E\" transform=\"translate(500)\"><\/use><use data-c=\"34\" href=\"#MJX-TEX-N-34\" transform=\"translate(778)\"><\/use><use data-c=\"37\" href=\"#MJX-TEX-N-37\" transform=\"translate(1278)\"><\/use><\/g><\/g><\/g><\/svg><\/mjx-container>) with flip times against thickness, noting a similar phase plot in earlier work and in a companion paper by the same authors. Measured data and a direct comparison are not shown here.", "answeredBy": ["sec-transient_stability_loss-p1", "fig-hopper_popper"]}, {"id": "q-single", "at": {"node": "section-V"}, "source": "ai", "status": "draft", "q": "Why does a single viscoelastic element show none of these instabilities?", "a": "A single element, or any purely one-dimensional system, has a trivial set of admissible states, so its elastic energy has a single minimum about any reference length. Multistability, and with it acquired and lost stability, needs a sufficiently curved set of admissible states, as in the truss. In continua the Euclidean metrics form a non-convex set, which supplies the curvature and can also leave residual stress.", "answeredBy": ["section-V-p3", "fig-sls_von_mises_truss_lengths_space"]}, {"id": "q-growth", "at": {"node": "section-V"}, "source": "ai", "status": "draft", "q": "Could the rest metric itself change, as in growth or plasticity?", "a": "In this theory it is constant. The paper suggests that letting it evolve, driven externally or by further constitutive relations, would give a covariant elasto-visco-plastic theory for growing tissue or plastic flow, in which fast growth could be masked by the slow relaxation of the reference metric. It does not develop this, and says its applicability remains to be shown.", "answeredBy": ["section-V-p4"]}]}</script>
<script>
// Conifer viewer. The dial chooses which document is read (gist, summary, paper, everything); each is a clean linear
// text. A tap on something in the text opens a peek (a sheet) with the related material: the paragraphs a summary
// sentence stands for, a definition, a footnote, an equation. The peek's header is the link into the paper, and
// travelling leaves a way back. Inline expansion exists only for folds (appendices, proofs, background notes).
(function () {
  'use strict';
  const mark = n => { try { performance.mark('conifer:' + n); } catch (e) {} };   // (startup phases, for measuring: see DESIGN.md)
  mark('start');
  document.querySelectorAll('link[data-font]').forEach(l => { l.media = 'all'; });   // the fonts, not blocking the first paint (build)
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = t => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const DOC = JSON.parse($('#conifer-doc').textContent);
  mark('parsed');
  const LEVELS = DOC.levels;
  const IDX = Object.fromEntries(LEVELS.map((l, i) => [l.key, i]));
  const GIST = IDX.gist ?? 0, BRIEF = IDX.brief ?? 1, SKIM = IDX.skim, PAPER = IDX.paper ?? LEVELS.length - 2, FULL = IDX.full ?? Infinity;      // (no tree declares an Everything level now: a fold opens by itself, never by depth)
  const LEVEL_HASH = LEVELS.map(l => ({ gist: 'gist', brief: 'summary', skim: 'skim', paper: 'paper', full: 'everything' })[l.key] || l.key);
  const BOX = { theorem: 'Theorem', definition: 'Definition', remark: 'Remark', proof: 'Proof', lemma: 'Lemma' };
  const HEADED = { references: 'References', footnotes: 'Footnotes', abstract: 'Abstract' };
  const titleOf = n => n.titleHtml || esc(n.title || '');
  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ------------------------------------------------------------------ the index
  const byId = new Map(), parentOf = new Map();
  (function walk(n, p) { byId.set(n.id, n); parentOf.set(n.id, p); (n.children || []).forEach(c => walk(c, n.id)); })(DOC.root, null);
  const defs = new Map((DOC.defs || []).map(d => [d.id, d]));
  const qsAt = new Map();
  (DOC.questions || []).forEach(q => { const k = q.at.node; if (!qsAt.has(k)) qsAt.set(k, []); qsAt.get(k).push(q); });
  const descendants = id => { const out = []; (function w(n) { out.push(n.id); (n.children || []).forEach(w); })(byId.get(id)); return out; };
  const questionsUnder = id => descendants(id).flatMap(i => qsAt.get(i) || []);
  const ancestors = id => { const out = []; let p = parentOf.get(id); while (p) { out.unshift(p); p = parentOf.get(p); } return out; };
  const depth = id => ancestors(id).length;
  const titled = id => { let n = byId.get(id); while (n && !n.title) n = byId.get(parentOf.get(n.id)); return n; };
  const anchorHost = new Map();          // an id inside a body (equation, footnote, figure, reference) -> the node holding it
  byId.forEach(n => { if (n.body) for (const m of n.body.matchAll(/ id="([^"]+)"/g)) anchorHost.set(m[1], n.id); });
  const words = h => (String(h || '').replace(/<[^>]+>/g, ' ').match(/[A-Za-z0-9Ͱ-Ͽ][^\s]*/g) || []).length;
  const texText = t => String(t || '').replace(/\\(?:mathcal|mathbb|mathrm|text|textrm|bf|rm)\{([^}]*)\}/g, '$1').replace(/\\([A-Za-z]+)/g, '$1').replace(/[${}]/g, '');
  const shortLabel = n => !n ? '' : n.number ? (n.kind === 'appendix' ? 'App. ' : '§') + n.number : (n.title || n.id);
  function placeName(id) { const t = titled(id); if (!t) return id; return texText(t.number ? shortLabel(t) + ' ' + t.title : t.title); }
  function placeHtml(id) { const t = titled(id); if (!t) return esc(id); return (t.number ? esc(shortLabel(t)) + ' ' : '') + titleOf(t); }
  const isFold = n => !!n.fold || n.kind === 'background';

  mark('indexed');
  // ------------------------------------------------------------------ the state
  const AUD = DOC.audiences || [];
  const state = { level: 0, over: new Map(), ledes: 'auto', chips: 'auto', theme: 'system',
    audience: (DOC.meta && DOC.meta.defaultAudience) || (AUD[0] && AUD[0].key) || '' };
  const audLabel = k => { const a = AUD.find(x => x.key === k); return a ? a.label : k; };
  const pick = t => (t && t.variants && t.variants[state.audience]) || t;
  const forMe = n => !n.audience || n.audience.includes(state.audience);
  const openByDefault = n => state.audience === 'student' && forMe(n);
  const skimHidden = () => SKIM !== undefined && state.audience === 'student';
  const ledesOn = () => state.ledes === true;                    // briefs are folded unless the reader opens them all
  const chipsOn = () => state.chips === true || (state.chips === 'auto' && state.audience !== 'specialist');
  function load() { try { const s = JSON.parse(localStorage.getItem('conifer-reader') || '{}'); ['ledes', 'chips', 'level', 'theme', 'audience'].forEach(k => { if (k in s && (k !== 'ledes' || s.lv === 2)) state[k] = s[k]; });
      if (!(state.level >= 0 && state.level < LEVELS.length)) state.level = Math.min(Math.max(+state.level || 0, 0), LEVELS.length - 1); } catch (e) {} }
  function save() { try { localStorage.setItem('conifer-reader', JSON.stringify({ lv: 2, level: state.level, ledes: state.ledes, chips: state.chips, theme: state.theme, audience: state.audience })); } catch (e) {} }
  function applyTheme() { const r = document.documentElement; if (state.theme === 'light' || state.theme === 'dark') r.dataset.theme = state.theme; else delete r.dataset.theme; }

  // terms: a mention of a defined term is a link only for the readers it is meant for
  const audienceDefs = html => html.replace(/<a data-def="([^"]+)">([\s\S]*?)<\/a>/g, (m, id, txt) => { const d = defs.get(id); return d && d.audience && !d.audience.includes(state.audience) ? txt : m; });

  // ------------------------------------------------------------------ rendering (HTML strings)
  function chip(t) {
    if (!chipsOn() || !t || !t.status) return '';
    const M = { author: ['author', 'Written by the author'], 'ai-approved': ['AI draft · approved', 'Drafted by the AI reader and checked by the author'], 'ai-draft': ['AI draft · unreviewed', 'Drafted by the AI reader; the author has not checked it yet'] };
    const m = M[t.status]; if (!m) return '';
    return `<span class="chip ${t.status}" title="${esc(m[1])}">${esc(m[0])}</span>`;
  }
  // a sentence of a summary and what it stands for: no mark in the text, a peek on a tap
  function withSpans(html, ctx) {
    if (ctx.plain) return html.replace(/<span data-covers="[^"]+">/g, '<span>');
    return html.replace(/<span data-covers="([^"]+)">/g, (m, c) => `<span class="gs" data-covers="${c}" role="button" tabindex="0" title="Show the part of the paper this stands for">`);
  }
  const stripIds = html => html.replace(/ id="([^"]*)"/g, ' id="peek-$1"');
  function qbadge(n, deep, ctx) {
    return '';
  }
  function qwords(id, deep) {
    const qs = deep ? questionsUnder(id) : (qsAt.get(id) || []);
    if (!qs.length) return '';
    return `<button type="button" class="qwords" data-q="${id}" data-deep="${deep ? 1 : 0}">${qs.length} question${qs.length > 1 ? 's' : ''}</button>`;
  }
  function qbadgeOld(n, deep, ctx) {
    if (ctx && ctx.prefix) return '';
    const qs = deep ? questionsUnder(n.id) : (qsAt.get(n.id) || []);
    if (!qs.length) return '';
    return `<button type="button" class="qbadge" data-q="${n.id}" data-deep="${deep ? 1 : 0}" title="Questions about this part" aria-label="${qs.length} question${qs.length > 1 ? 's' : ''} about this part">?<span>${qs.length}</span></button>`;
  }
  // the small controls' glyphs, drawn as lines (as every icon is: one 1.25px line, viewer.css), not typed
  const GL = {
    plus: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2.5v7M2.5 6h7"/></svg>',
    minus: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6h7"/></svg>',
    x: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6"/></svg>',
  };
  const circle = (act, key, open) => `<button type="button" class="fold-btn" data-act="toggle" data-key="${key}" title="${open ? 'Fold' : 'Open'}" aria-label="${open ? 'Fold' : 'Open'}" aria-expanded="${open}">${open ? GL.minus : GL.plus}</button>`;

  // THE FOLD PATTERN (one for everything that folds: a section's brief, a background note, an appendix, a proof).
  // A fold is a head that never moves and a body under it. The head is the same whether the fold is open or closed:
  // a circled +/− at the left and the title beside it; the whole head is the control. Only the body eases open
  // (its grid track goes from nothing to its size, so nothing is measured or redrawn) and wears the fold's box (a
  // rule at the left for a note). The head is a heading when the fold is a section (an appendix, a brief's section).
  function secHead(n, ctx, lead, foldKey) {
    const hl = Math.min(1 + depth(n.id), 5);
    const anchor = ctx.prefix ? '' : `<button type="button" class="anchor" data-copy="${n.id}" title="Copy a link to this section" aria-label="Copy a link to this section">&#182;</button>`;
    // the title's last word and what follows it (a question badge, the ¶) never part: a ¶ alone on a line reads as a stray mark
    const t = titleOf(n), tail = qbadge(n, false, ctx) + anchor, m = t.match(/^([\s\S]*?)(\S+)$/);

  // ------------------------------------------------------------------ finding
  // Only what is open is searched: the text inside a closed box (a background note, an appendix, a section's brief) is
  // left out, its head is not; opening or closing one searches again (viewer.js setFold).
  const CLOSED = '.fold[data-state="closed"] > .fold-wrap';
  let hits = [], at = -1, open = false, lastQ = '';

    const out = [];

    const parts = []; let text = '', node;
    while ((node = walker.nextNode())) { parts.push({ node, start: text.length }); text += node.nodeValue; }

  }
  // a passage of words and formulas (as a selection gives it), as Epsilon finds it: the paper read as one stream, each
  // formula as its TeX between two marks, the words in any case and any spacing; a hit is the passage's words and
  // formulas in order, marked as words are (its formulas boxed)
  const BLOCKS = 'p, li, h1, h2, h3, h4, h5, h6, .display, figcaption, td, th, blockquote, .thm';

    const walk = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, { acceptNode: n => {
      if (n.nodeType === 1) { if (n.matches('mjx-container[data-tex]')) return NodeFilter.FILTER_ACCEPT; if (n.matches('svg, script, style, button, .mjx-hl, .anchor') || n.matches(CLOSED)) return NodeFilter.FILTER_REJECT; return NodeFilter.FILTER_SKIP; }

    const at = k => { let lo = 0, hi = pieces.length - 1; while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (pieces[mid].at <= k) lo = mid; else hi = mid - 1; } return lo; };

  }
  function texHits(q) {

  }

    const picked = on ? selectedQuery() : '';        // (read before the field takes the focus, and the selection with it)

// Conifer: copying, as Epsilon does it. A selection copied from the paper carries each formula as its TeX, $...$ in
// a line and \[...\] on a line of its own, with the paper's own macros written out so that it works anywhere; the
// standard physics and braket commands are left as they are. Nothing else about the text changes.
(function () {
  'use strict';
  const DOC = JSON.parse(document.getElementById('conifer-doc').textContent);
  const MACROS = (DOC.meta && DOC.meta.macros) || {};

          for (; k < d.n; k++) { const g = group(s, j); args.push(g[0]); j = g[1]; }

    if (node.nodeType !== 1) return '';

    if (!within.closest('#paper, #sheet-body, #peek-body, #pop')) return;
