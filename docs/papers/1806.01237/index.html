h=\"8.135ex\" height=\"3.47ex\" viewBox=\"0 -983.7 3595.7 1533.7\"><g transform=\"scale(1,-1)\"><g><g><g transform=\"translate(1216.4,394) scale(0.707)\"><g><use data-c=\"1D6FF\" href=\"#MJX-TEX-I-1D6FF\"><\/use><g transform=\"translate(477,363) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><use x=\"880.6\" data-c=\"1D438\" href=\"#MJX-TEX-I-1D438\"><\/use><\/g><g transform=\"translate(220,-347) scale(0.707)\"><use data-c=\"1D6FF\" href=\"#MJX-TEX-I-1D6FF\"><\/use><g transform=\"translate(444)\"><g><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><use data-c=\"2E\" href=\"#MJX-TEX-N-2E\" transform=\"translate(500)\"><\/use><use data-c=\"32\" href=\"#MJX-TEX-N-32\" transform=\"translate(778)\"><\/use><\/g><g transform=\"translate(1311,-150) scale(0.707)\"><use data-c=\"1D6FC\" href=\"#MJX-TEX-I-1D6FC\"><\/use><\/g><\/g><use x=\"2257.5\" data-c=\"1D6FF\" href=\"#MJX-TEX-I-1D6FF\"><\/use><g transform=\"translate(2701.5)\"><g><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><use data-c=\"2E\" href=\"#MJX-TEX-N-2E\" transform=\"translate(500)\"><\/use><use data-c=\"32\" href=\"#MJX-TEX-N-32\" transform=\"translate(778)\"><\/use><\/g><g transform=\"translate(1311,-150) scale(0.707)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/g><\/g><rect width=\"3355.7\" height=\"60\" x=\"120\" y=\"220\"><\/rect><\/g><\/g><\/g><\/svg><\/mjx-container>, needs to be positive definite.<\/p>", "hash": "b67c8e0b4b4e", "gist": {"html": "With fast elasticity, the configuration minimizes the instantaneous elastic energy; generalized forces vanish and the Hessian is positive.", "status": "ai-draft"}}, {"id": "sec-quasi_static_approximation-p2", "kind": "paragraph", "body": "<p>Condition <a href=\"#eq-minimaztion_condition\">(15)<\/a> gives <mjx-container data-tex=\"g_{ij}(t)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.055ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"5.055ex\" height=\"2.363ex\" viewBox=\"0 -750 2234.3 1044.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1095.3\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1484.3\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"1845.3\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> as function of <mjx-container data-tex=\"\\gbar_{ij}(t)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.055ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"5.055ex\" height=\"2.363ex\" viewBox=\"0 -750 2234.3 1044.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1095.3\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1484.3\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"1845.3\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>, which in turn evolve according to Eq. <a href=\"#eq-gbar_evolution_rule\">(13)<\/a>. The quasi static evolution gives an intuitive interpretation of the slow evolution of viscoelastic bodies. Over time, the material’s configuration quickly minimizes its ’distance’ to the <a data-def=\"reference-metric\">reference metric<\/a>. The idea that in viscoelasticity bodies adapts to their configuration is implemented by the slow dynamics of the reference metric from the <a data-def=\"rest-reference-metric\">rest reference metric<\/a> toward the recent configurations. This coupled evolution of <mjx-container data-tex=\"g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"1.666ex\" viewBox=\"0 -442 1095.3 736.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> and <mjx-container data-tex=\"\\gbar_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"2.234ex\" viewBox=\"0 -693 1095.3 987.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> is also simpler to analyze both numerically and theoretically compared with the full dynamics.<\/p>", "hash": "cf37ab7347df", "gist": {"html": "The shape tracks the closest admissible metric while the reference metric drifts from rest towards recent configurations.", "status": "ai-draft"}}], "gist": {"html": "Because relaxation is slow, the body always minimizes its instantaneous elastic energy about the drifting reference metric.", "status": "ai-draft"}, "brief": {"html": "<p><span data-covers=\"sec-quasi_static_approximation-p1\">A viscoelastic body has no free energy, but over short times its virtual work equals an instantaneous elastic energy about <mjx-container data-tex=\"\\bar g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"2.234ex\" viewBox=\"0 -693 1095.3 987.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>.<\/span> <span data-covers=\"sec-quasi_static_approximation-p1\">When elastic responses are much faster than relaxation, inertia drops out: the configuration minimizes this energy, with vanishing generalized forces and a positive Hessian.<\/span> <span data-covers=\"sec-quasi_static_approximation-p2\">The motion is then a fast minimization of the distance to <mjx-container data-tex=\"\\bar g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"2.234ex\" viewBox=\"0 -693 1095.3 987.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> while <mjx-container data-tex=\"\\bar g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"2.234ex\" viewBox=\"0 -693 1095.3 987.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> slowly drifts, simpler to analyse than the full dynamics.<\/span><\/p>", "status": "ai-draft"}}, {"id": "sec-delayed_stability_and_loss", "kind": "section", "number": "III C", "title": "Acquired stability and stability loss", "titleHtml": "Acquired stability and stability loss", "children": [{"id": "sec-delayed_stability_and_loss-p1", "kind": "paragraph", "body": "<p>In section <a href=\"#sec-sls_von_Mises_truss\">II B<\/a> we describe how the evolution of the <a data-def=\"reference-length\">reference lengths<\/a> in discrete, 1D systems can result in non trivial evolution of the configuration (characterized by <mjx-container data-tex=\"z\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.052ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"1.052ex\" height=\"1.025ex\" viewBox=\"0 -442 465 453\"><g transform=\"scale(1,-1)\"><use data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><\/g><\/svg><\/mjx-container>). When the parameter <mjx-container data-tex=\"\\a\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.448ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"1.448ex\" height=\"1.025ex\" viewBox=\"0 -442 640 453\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FC\" href=\"#MJX-TEX-I-1D6FC\"><\/use><\/g><\/svg><\/mjx-container> is appropriately set the <a data-def=\"von-mises-truss\">von-Mises truss<\/a> could acquire new type of stable states; namely states that are unstable initially, but acquire stability through <a data-def=\"stress-relaxation\">stress relaxation<\/a> at a strained state. Such states also exist for continuous viscoelastic systems, and similarly to the discrete case described above can be shown in some cases to not be able to remain stable indefinitely.<\/p>", "hash": "432b3061c8e3", "gist": {"html": "Continua, like the truss, can acquire stable states through relaxation that cannot always last.", "status": "ai-draft"}}, {"id": "sec-delayed_stability_and_loss-p2", "kind": "paragraph", "body": "<p>A given <a data-def=\"reference-metric\">reference metric<\/a> <mjx-container data-tex=\"\\gbar_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"2.234ex\" viewBox=\"0 -693 1095.3 987.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> can yield multiple elastically stable configurations of the <a data-def=\"instantaneous-energy\">instantaneous elastic energy<\/a> functional <a href=\"#eq-energy_functional\">(14)<\/a>. Under external loading, as the reference metric slowly evolves viscoelastically according to Eq. <a href=\"#eq-gbar_evolution_rule\">(13)<\/a> it could acquire new stable configurations, merge existing stable points or cause stable elastic configurations to lose their stability. Acquiring stability is most easily understood by examining loading at constant displacements. Consider a body taken from rest to an initially unstable configuration <mjx-container data-tex=\"g_{ij}^\\text{hold}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.291ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.987ex;\" width=\"4.291ex\" height=\"2.919ex\" viewBox=\"0 -853.7 1896.4 1290.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,363) scale(0.707)\"><use data-c=\"68\" href=\"#MJX-TEX-N-68\"><\/use><use data-c=\"6F\" href=\"#MJX-TEX-N-6F\" transform=\"translate(556)\"><\/use><use data-c=\"6C\" href=\"#MJX-TEX-N-6C\" transform=\"translate(1056)\"><\/use><use data-c=\"64\" href=\"#MJX-TEX-N-64\" transform=\"translate(1334)\"><\/use><\/g><g transform=\"translate(510,-292.2) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. The body is held fixed at this position and the reference metric <mjx-container data-tex=\"\\gbar_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"2.234ex\" viewBox=\"0 -693 1095.3 987.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> starts from <mjx-container data-tex=\"\\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"2.478ex\" height=\"2.892ex\" viewBox=\"0 -840.1 1095.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> and slowly advances toward the metric <mjx-container data-tex=\"g_{ij}^\\text{hold}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.291ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.987ex;\" width=\"4.291ex\" height=\"2.919ex\" viewBox=\"0 -853.7 1896.4 1290.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,363) scale(0.707)\"><use data-c=\"68\" href=\"#MJX-TEX-N-68\"><\/use><use data-c=\"6F\" href=\"#MJX-TEX-N-6F\" transform=\"translate(556)\"><\/use><use data-c=\"6C\" href=\"#MJX-TEX-N-6C\" transform=\"translate(1056)\"><\/use><use data-c=\"64\" href=\"#MJX-TEX-N-64\" transform=\"translate(1334)\"><\/use><\/g><g transform=\"translate(510,-292.2) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, and the forces pushing the body away from its present state gradually relax. When releasing the body an initially unstable metrics near <mjx-container data-tex=\"g_{ij}^\\text{hold}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.291ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.987ex;\" width=\"4.291ex\" height=\"2.919ex\" viewBox=\"0 -853.7 1896.4 1290.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,363) scale(0.707)\"><use data-c=\"68\" href=\"#MJX-TEX-N-68\"><\/use><use data-c=\"6F\" href=\"#MJX-TEX-N-6F\" transform=\"translate(556)\"><\/use><use data-c=\"6C\" href=\"#MJX-TEX-N-6C\" transform=\"translate(1056)\"><\/use><use data-c=\"64\" href=\"#MJX-TEX-N-64\" transform=\"translate(1334)\"><\/use><\/g><g transform=\"translate(510,-292.2) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> might display <a data-def=\"transient-stability\">transient stability<\/a>. This phenomenon is called <em><dfn data-def=\"acquired-stability\">acquired stability<\/dfn><\/em>.<\/p>", "hash": "e5af70c21923", "gist": {"html": "A body held in an unstable shape may be stable when released: acquired stability.", "status": "ai-draft"}}, {"id": "sec-delayed_stability_and_loss-p3", "kind": "paragraph", "body": "<p>State with <a data-def=\"acquired-stability\">acquired stability<\/a> lose their stability through <em><a data-def=\"delayed-stability-loss\">delayed stability loss<\/a><\/em>. Seemingly stable state gradually <a data-def=\"creep\">creep<\/a> until at some point elastic stability is lost, and the body rapidly snaps to a near stable configuration. Both acquired stability and delayed stability loss are expected for linear viscoelastic bodies, close to multi-stability. Described quantitatively in section <a href=\"#sec-scalar_viscoelasticity\">IV<\/a> below, as the <a data-def=\"memory-kernel\">memory kernel<\/a> become comparable to the stiffness, more configurations are able to acquire stability.<\/p>", "hash": "acb002ce0365", "gist": {"html": "Acquired stability ends in delayed stability loss, a creep then a snap; both are expected near multistability.", "status": "ai-draft"}}], "gist": {"html": "Holding a continuum in an unstable shape can make it transiently stable; that acquired stability is later lost.", "status": "ai-draft"}, "brief": {"html": "<p><span data-covers=\"sec-delayed_stability_and_loss-p1 sec-delayed_stability_and_loss-p2\">As the reference metric evolves, stable configurations can appear, merge or disappear. A body held in an unstable shape relaxes towards it, and when released may stay there for a while: acquired stability.<\/span> <span data-covers=\"sec-delayed_stability_and_loss-p3\">Such states creep until they suddenly snap, which is delayed stability loss. Both are expected near multistability, and more shapes can acquire stability as the memory kernel grows comparable to the stiffness.<\/span><\/p>", "status": "ai-draft"}}, {"id": "section-III-D", "kind": "section", "number": "III D", "title": "Isotropicity and homogeneity", "titleHtml": "Isotropicity and homogeneity", "children": [{"id": "section-III-D-p1", "kind": "paragraph", "body": "<p>Considering isotropic materials the stiffness and <a data-def=\"memory-kernel\">memory kernel<\/a> tensors <mjx-container data-tex=\"C^{ijkl}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.547ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"4.547ex\" height=\"1.981ex\" viewBox=\"0 -853.7 2009.7 875.7\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D436\" href=\"#MJX-TEX-I-1D436\"><\/use><g transform=\"translate(845.3,363) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><use x=\"757\" data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><use x=\"1278\" data-c=\"1D459\" href=\"#MJX-TEX-I-1D459\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> and <mjx-container data-tex=\"\\Phi^{ijkl}(s)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.164ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"7.164ex\" height=\"2.497ex\" viewBox=\"0 -853.7 3166.4 1103.7\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"3A6\" href=\"#MJX-TEX-N-3A6\"><\/use><g transform=\"translate(755,363) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><use x=\"757\" data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><use x=\"1278\" data-c=\"1D459\" href=\"#MJX-TEX-I-1D459\"><\/use><\/g><\/g><use x=\"1919.4\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"2308.4\" data-c=\"1D460\" href=\"#MJX-TEX-I-1D460\"><\/use><use x=\"2777.4\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> further simplify. Isotropicity is the infinitesimal invariance to rotation in some configuration of the body. More generally, it is the infinitesimal invariance to orthogonal transformations induced by some metric on the body. This metric describes how each piece of the body should be deformed in order to have the same value under rotations.<\/p>", "hash": "251f4bfb1f26", "gist": {"html": "Isotropy is invariance under the rotations of some metric on the body, which must be specified.", "status": "ai-draft"}}, {"id": "section-III-D-p2", "kind": "paragraph", "body": "<p>By Eq. <a href=\"#eq-energy_functional\">(14)<\/a>, the metric associated with the stiffness is the metric used to raise the indices of the elastic strain to create the scalar energy density. In linear elasticity, in which <mjx-container data-tex=\"\\gbar_{ij} = \\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.973ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"7.973ex\" height=\"2.892ex\" viewBox=\"0 -840.1 3524.1 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1373.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2428.8)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, the stiffness is usually taken as isotropic with respect to the <a data-def=\"reference-metric\">reference metric<\/a> <mjx-container data-tex=\"\\gbar_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"2.234ex\" viewBox=\"0 -693 1095.3 987.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> Efrati <em>et al.<\/em> (<a href=\"#cite-ESK09\">2009<\/a>). This amounts to assuming the body is isotropic in the undeformed configuration. The natural generalization of this assumption to viscoelasticity is to take the stiffness as isotropic with respect to the instantaneous reference metric <mjx-container data-tex=\"\\gbar_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"2.234ex\" viewBox=\"0 -693 1095.3 987.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. This will yield isotropic response properties about the instantaneous stress free state. However, an isotropic elastic response is often intimately related to isotropic material composition and internal structure which in our case is set by the <a data-def=\"rest-reference-metric\">rest reference metric<\/a> <mjx-container data-tex=\"\\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"2.478ex\" height=\"2.892ex\" viewBox=\"0 -840.1 1095.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. Therefore, we assume here the stiffness tensor to be isotropic with respect to the rest reference metric<\/p>\n<div class=\"display\"><div class=\"eqbody\"><mjx-container data-tex=\"C^{ijkl} = \\l \\  \\gbar_0^{ij} \\gbar_0^{kl} + 2\\mu \\  \\gbar_0^{ik} \\gbar_0^{jl}.\" class=\"MathJax\" jax=\"SVG\" display=\"true\" style=\"--w:27.587ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.708ex;\" width=\"27.587ex\" height=\"2.945ex\" viewBox=\"0 -988.6 12193.5 1301.5\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D436\" href=\"#MJX-TEX-I-1D436\"><\/use><g transform=\"translate(845.3,413) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><use x=\"757\" data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><use x=\"1278\" data-c=\"1D459\" href=\"#MJX-TEX-I-1D459\"><\/use><\/g><\/g><use x=\"2287.4\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(3343.2)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><use data-c=\"2E\" href=\"#MJX-TEX-N-2E\" transform=\"translate(500)\"><\/use><use data-c=\"32\" href=\"#MJX-TEX-N-32\" transform=\"translate(778)\"><\/use><\/g><use x=\"4621.2\" data-c=\"A0\" href=\"#MJX-TEX-N-A0\"><\/use><g transform=\"translate(4871.2)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,497.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><g transform=\"translate(510,-297.3) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><g transform=\"translate(5966.5)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,413) scale(0.707)\"><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><use x=\"521\" data-c=\"1D459\" href=\"#MJX-TEX-I-1D459\"><\/use><\/g><g transform=\"translate(510,-247) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><use x=\"7327.8\" data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><use x=\"8328.1\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><use x=\"8828.1\" data-c=\"1D707\" href=\"#MJX-TEX-I-1D707\"><\/use><use x=\"9431.1\" data-c=\"A0\" href=\"#MJX-TEX-N-A0\"><\/use><g transform=\"translate(9681.1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,413) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><\/g><g transform=\"translate(510,-247) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><g transform=\"translate(10853.4)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,497.8) scale(0.707)\"><use data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><use x=\"412\" data-c=\"1D459\" href=\"#MJX-TEX-I-1D459\"><\/use><\/g><g transform=\"translate(510,-297.3) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><use x=\"11915.5\" data-c=\"2E\" href=\"#MJX-TEX-N-2E\"><\/use><\/g><\/g><\/svg><\/mjx-container><\/div><span class=\"eqno\">(16)<\/span><\/div>\n<p class=\"cont\">We note that in principle, some materials may display a different constitutive behaviors, and in particular be isotropic with respect the instantaneous reference metric <mjx-container data-tex=\"\\gbar_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"2.234ex\" viewBox=\"0 -693 1095.3 987.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> in which case the elasticity tensor should be adapted accordingly. Moreover, while it is reasonable to assume that the <a data-def=\"memory-kernel\">memory kernel<\/a> <mjx-container data-tex=\"\\Phi^{ijkl}(s)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.164ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"7.164ex\" height=\"2.497ex\" viewBox=\"0 -853.7 3166.4 1103.7\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"3A6\" href=\"#MJX-TEX-N-3A6\"><\/use><g transform=\"translate(755,363) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><use x=\"757\" data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><use x=\"1278\" data-c=\"1D459\" href=\"#MJX-TEX-I-1D459\"><\/use><\/g><\/g><use x=\"1919.4\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"2308.4\" data-c=\"1D460\" href=\"#MJX-TEX-I-1D460\"><\/use><use x=\"2777.4\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> accounting for the viscoelastic response will also be isotropic with respect to <mjx-container data-tex=\"\\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"2.478ex\" height=\"2.892ex\" viewBox=\"0 -840.1 1095.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, there is no restriction preventing it from being isotropic with respect to any linear combination of <mjx-container data-tex=\"\\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"2.478ex\" height=\"2.892ex\" viewBox=\"0 -840.1 1095.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> and <mjx-container data-tex=\"\\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"2.478ex\" height=\"2.892ex\" viewBox=\"0 -840.1 1095.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>.<\/p>", "hash": "bc449cceae6c", "gist": {"html": "The stiffness is taken isotropic about the rest metric, set by the material's composition, not the instantaneous one.", "status": "ai-draft"}}, {"id": "bg-lame", "kind": "background", "title": "Isotropic stiffness and the Poisson ratio", "audience": ["student"], "fold": true, "body": "<p>An isotropic linear elastic material has only two independent elastic constants. Its stiffness tensor can be written <mjx-container data-tex=\"C^{ijkl}=\\lambda h^{ij}h^{kl}+2\\mu h^{ik}h^{jl}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:25.15ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.489ex;\" width=\"25.15ex\" height=\"2.42ex\" viewBox=\"0 -853.7 11116.5 1069.7\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D436\" href=\"#MJX-TEX-I-1D436\"><\/use><g transform=\"translate(845.3,363) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><use x=\"757\" data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><use x=\"1278\" data-c=\"1D459\" href=\"#MJX-TEX-I-1D459\"><\/use><\/g><\/g><use x=\"2287.4\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"3343.2\" data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(3926.2)\"><use data-c=\"210E\" href=\"#MJX-TEX-I-210E\"><\/use><g transform=\"translate(609,363) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><g transform=\"translate(5120.5)\"><use data-c=\"210E\" href=\"#MJX-TEX-I-210E\"><\/use><g transform=\"translate(609,363) scale(0.707)\"><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><use x=\"521\" data-c=\"1D459\" href=\"#MJX-TEX-I-1D459\"><\/use><\/g><\/g><use x=\"6580.8\" data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><use x=\"7581.1\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><use x=\"8081.1\" data-c=\"1D707\" href=\"#MJX-TEX-I-1D707\"><\/use><g transform=\"translate(8684.1)\"><use data-c=\"210E\" href=\"#MJX-TEX-I-210E\"><\/use><g transform=\"translate(609,363) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><\/g><\/g><g transform=\"translate(9955.4)\"><use data-c=\"210E\" href=\"#MJX-TEX-I-210E\"><\/use><g transform=\"translate(609,363) scale(0.707)\"><use data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><use x=\"412\" data-c=\"1D459\" href=\"#MJX-TEX-I-1D459\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, where <mjx-container data-tex=\"h\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.303ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"1.303ex\" height=\"1.595ex\" viewBox=\"0 -694 576 705\"><g transform=\"scale(1,-1)\"><use data-c=\"210E\" href=\"#MJX-TEX-I-210E\"><\/use><\/g><\/svg><\/mjx-container> is the metric that defines rotations and <mjx-container data-tex=\"\\lambda,\\mu\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.689ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.489ex;\" width=\"3.689ex\" height=\"2.059ex\" viewBox=\"0 -694 1630.7 910\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><use x=\"583\" data-c=\"2C\" href=\"#MJX-TEX-N-2C\"><\/use><use x=\"1027.7\" data-c=\"1D707\" href=\"#MJX-TEX-I-1D707\"><\/use><\/g><\/g><\/svg><\/mjx-container> are the Lamé constants, <mjx-container data-tex=\"\\mu\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.364ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.489ex;\" width=\"1.364ex\" height=\"1.489ex\" viewBox=\"0 -442 603 658\"><g transform=\"scale(1,-1)\"><use data-c=\"1D707\" href=\"#MJX-TEX-I-1D707\"><\/use><\/g><\/svg><\/mjx-container> being the shear modulus. The energy density <mjx-container data-tex=\"\\tfrac12C^{ijkl}\\varepsilon_{ij}\\varepsilon_{kl}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:11.348ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.781ex;\" width=\"11.348ex\" height=\"2.737ex\" viewBox=\"0 -864.9 5015.6 1209.9\"><g transform=\"scale(1,-1)\"><g><g><g><g transform=\"translate(220,394) scale(0.707)\"><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><g transform=\"translate(220,-345) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><rect width=\"553.6\" height=\"60\" x=\"120\" y=\"220\"><\/rect><\/g><\/g><g transform=\"translate(793.6)\"><use data-c=\"1D436\" href=\"#MJX-TEX-I-1D436\"><\/use><g transform=\"translate(845.3,363) scale(0 g><use x=\"3702.7\" data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><use x=\"4702.9\" data-c=\"1D707\" href=\"#MJX-TEX-I-1D707\"><\/use><g transform=\"translate(5472.6)\"><use data-c=\"74\" href=\"#MJX-TEX-N-74\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(389)\"><\/use><\/g><g transform=\"translate(6420.2)\"><use data-c=\"1D700\" href=\"#MJX-TEX-I-1D700\"><\/use><g transform=\"translate(499,363) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>: one term penalizes changes of volume, the other changes of shape. An equivalent pair is Young's modulus <mjx-container data-tex=\"E\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.729ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"1.729ex\" height=\"1.538ex\" viewBox=\"0 -680 764 680\"><g transform=\"scale(1,-1)\"><use data-c=\"1D438\" href=\"#MJX-TEX-I-1D438\"><\/use><\/g><\/svg><\/mjx-container> and the Poisson ratio <mjx-container data-tex=\"\\nu=\\lambda/2(\\lambda+\\mu)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:15.007ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"15.007ex\" height=\"2.262ex\" viewBox=\"0 -750 6633 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D708\" href=\"#MJX-TEX-I-1D708\"><\/use><use x=\"807.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1863.6\" data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><use x=\"2446.6\" data-c=\"2F\" href=\"#MJX-TEX-N-2F\"><\/use><use x=\"2946.6\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><use x=\"3446.6\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"3835.6\" data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><use x=\"4640.8\" data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><use x=\"5641\" data-c=\"1D707\" href=\"#MJX-TEX-I-1D707\"><\/use><use x=\"6244\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>, the ratio of lateral contract otropy and homogeneity must refer to a metric; taking the rest metric gives a two-function memory kernel.", "status": "ai-draft"}, "brief": {"html": "<p><span data-covers=\"section-III-D-p1 section-III-D-p2\">Isotropy means invariance under the rotations of some metric, so a viscoelastic theory must say which one. The paper takes the rest metric, set by the material's composition, rather than the instantaneous reference metric.<\/span> <span data-covers=\"section-III-D-p3\">Homogeneity likewise refers to a volume: constant stiffness means equal energy per initial volume.<\/span> <span data-covers=\"section-III-D-p4\">With both choices the metric memory kernel has a scalar part <mjx-container data-tex=\"\\beta\\phi(s)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.45ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"5.45ex\" height=\"2.262ex\" viewBox=\"0 -750 2409 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"566\" data-c=\"1D719\" href=\"#MJX-TEX-I-1D719\"><\/use><use x=\"1162\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1551\" data-c=\"1D460\" href=\"#MJX-TEX-I-1D460\"><\/use><use x=\"2020\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> and a part <mjx-container data-tex=\"\\psi(s)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.294ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"4.294ex\" height=\"2.262ex\" viewBox=\"0 -750 1898 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D713\" href=\"#MJX-TEX-I-1D713\"><\/use><use x=\"651\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1040\" data-c=\"1D460\" href=\"#MJX-TEX-I-1D460\"><\/use><use x=\"1509\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>, which alone mixes the components of the metric.<\/span><\/p>", "status": "ai-draft"}}], "gist": {"html": "A continuum is elastic at each instant about a slowly evolving reference metric, the analogue of the reference length.", "status": "ai-draft"}, "brief": {"html": "<p><span data-covers=\"sec-viscoelastic_continuum-p1 sec-viscoelastic_continuum-p2\">For a continuum, the reference length becomes a reference metric <mjx-container data-tex=\"\\bar g_{ij}(t)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.055ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"5.055ex\" height=\"2.363ex\" viewBox=\"0 -750 2234.3 1044.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1095.3\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1484.3\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"1845.3\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>: the stress is elastic in the difference between the actual metric and it, and fast deformations leave it unchanged.<\/span> <span data-covers=\"sec-quasi_static_approximation-p1 sec-quasi_static_approximation-p2\">Since elastic responses are fast, the body always takes the admissible shape closest to <mjx-container data-tex=\"\\bar g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"2.234ex\" viewBox=\"0 -693 1095.3 987.2\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, which drifts from the rest metric towards recent shapes.<\/span> <span data-covers=\"sec-delayed_stability_and_loss-p2 sec-delayed_stability_and_loss-p3\">This drift can make an unstable shape transiently stable, before a delayed snap.<\/span> <span data-covers=\"section-III-D-p2 section-III-D-p4\">Isotropy and homogeneity are taken with respect to the rest metric, which leaves a memory kernel of two scalar functions.<\/span><\/p>", "status": "ai-draft"}}, {"id": "sec-scalar_viscoelasticity", "kind": "section", "number": "IV", "title": "Viscoelasticity of incompressible materials", "titleHtml": "Viscoelasticity of incompressible materials", "children": [{"id": "section-IV-A", "kind": "section", "number": "IV A", "title": "Constitutive relations", "titleHtml": "Constitutive relations", "children": [{"id": "section-IV-A-p1", "kind": "paragraph", "body": "<p>Incompressible isotropic materials are described by Poisson ratio <mjx-container data-tex=\"\\nu=\\tfrac{1}{2}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.012ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.781ex;\" width=\"6.012ex\" height=\"2.737ex\" viewBox=\"0 -864.9 2657.1 1209.9\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D708\" href=\"#MJX-TEX-I-1D708\"><\/use><use x=\"807.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(1863.6)\"><g><g transform=\"translate(220,394) scale(0.707)\"><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><g transform=\"translate(220,-345) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><rect width=\"553.6\" height=\"60\" x=\"120\" y=\"220\"><\/rect><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. The <a data-def=\"incompressible\">incompressible<\/a> Poissonian contraction is expected to hold also during the viscoelastic relaxation. Thus, we expect <mjx-container data-tex=\"\\psi(s)=0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:8.442ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"8.442ex\" height=\"2.262ex\" viewBox=\"0 -750 3731.6 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D713\" href=\"#MJX-TEX-I-1D713\"><\/use><use x=\"651\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1040\" data-c=\"1D460\" href=\"#MJX-TEX-I-1D460\"><\/use><use x=\"1509\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"2175.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"3231.6\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container>. Put in Eq. <a href=\"#eq-isotropic_memory_kernel\">(17)<\/a> and Eq <a href=\"#eq-tensor_linear_viscoelasticity\">(10)<\/a>, we obtain the following constitutive relation between stress and strain<\/p>\n<div class=\"display\" id=\"eq-scalar_tensor_linear_viscoelasticity\"><div class=\"eqbody\"><mjx-container data-tex=\"S^{ij}(t) = C^{ijkl} \\left( \\e_{kl}(t) + \\b \\int_{-\\infty}^{t} \\dot \\phi(t-s) \\e_{kl}(s)ds \\right) .\" class=\"MathJax\" jax=\"SVG\" display=\"true\" style=\"--w:47.035ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -2.159ex;\" width=\"47.035ex\" height=\"5.622ex\" viewBox=\"0 -1530.7 20789.5 2485\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D446\" href=\"#MJX-TEX-I-1D446\"><\/use><g transform=\"translate(729.6,413) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1314.9\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1703.9\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"2064.9\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"2731.7\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(3787.4)\"><use data-c=\"1D436\" href=\"#MJX-TEX-I-1D436\"><\/use><g transfor late(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> and <mjx-container data-tex=\"g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"1.666ex\" viewBox=\"0 -442 1095.3 736.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> in Eq. <a href=\"#eq-gbar_scalar_evolution_rule\">(21)<\/a>, we obtain<\/p>\n<div class=\"display\" id=\"eq-gbar_stationary_condition\"><div class=\"eqbody\"><mjx-container data-tex=\"\\gbar^\\text{stat}_{ij} = \\b g_{ij} + (1-\\b)\\gbaro_{ij}.\" class=\"MathJax\" jax=\"SVG\" display=\"true\" style=\"--w:23.528ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.892ex;\" width=\"23.528ex\" height=\"2.892ex\" viewBox=\"0 -883.9 10399.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,413) scale(0.707)\"><use data-c=\"73\" href=\"#MJX-TEX-N-73\"><\/use><use data-c=\"74\" href=\"#MJX-TEX-N-74\" transform=\"translate(394)\"><\/use><use data-c=\"61\" href=\"#MJX-TEX-N-61\" transform=\"translate(783)\"><\/use><use data-c=\"74\" href=\"#MJX-TEX-N-74\" transform=\"translate(1283)\"><\/use><\/g><g transform=\"translate(510,-247) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"2020.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"3075.8\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><g transform=\"translate(3641.8)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"4959.3\" data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><use x=\"5959.6\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"6348.6\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"7070.8\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"8071\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"8637\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><g transform=\"translate(9026)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,413) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-250) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"10121.3\" data-c=\"2E\" href=\"#MJX-TEX-N-2E\"><\/use><\/g><\/g><\/svg><\/mjx-container><\/div><span class=\"eqno\">(22)<\/span><\/div>\n<p class=\"cont\">Here <mjx-container data-tex=\"\\beta\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.281ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.281ex\" height=\"2.034ex\" viewBox=\"0 -705 566 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/svg><\/mjx-container> is shown to control the degree to which the reference metric of a viscoelastic body will approach the current configuration metric; <mjx-container data-tex=\"\\b=0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.429ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"5.429ex\" height=\"2.034ex\" viewBox=\"0 -705 2399.6 899\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"843.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1899.6\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container> describes a purely elastic material with a constant reference metric, and <mjx-container data-tex=\"\\b=1\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.429ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"5.429ex\" height=\"2.034ex\" viewBox=\"0 -705 2399.6 899\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"843.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1899.6\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><\/svg><\/mjx-container> describes a viscoelastic fluid in which no information is conserved indefinitely, asymptotically all stresses are relaxed, and the notion of the <a data-def=\"rest-reference-metric\">rest reference metric<\/a> <mjx-container data-tex=\"\\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"2.478ex\" height=\"2.892ex\" viewBox=\"0 -840.1 1095.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> has no meaning.<\/p>", "hash": "abc809fc865e", "gist": {"html": "Incompressibility removes <mjx-container data-tex=\"\\psi\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.473ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"1.473ex\" height=\"2.034ex\" viewBox=\"0 -694 651 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D713\" href=\"#MJX-TEX-I-1D713\"><\/use><\/g><\/svg><\/mjx-container>; at stationarity <mjx-container data-tex=\"\\bar g^{\\rm stat}_{ij}=\\beta g_{ij}+(1-\\beta)\\bar g^0_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:22.899ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"22.899ex\" height=\"2.892ex\" viewBox=\"0 -840.1 10121.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,363) scale(0.707)\"><use data-c=\"73\" href=\"#MJX-TEX-N-73\"><\/use><use x=\"394\" data-c=\"74\" href=\"#MJX-TEX-N-74\"><\/use><use x=\"783\" data-c=\"61\" href=\"#MJX-TEX-N-61\"><\/use><use x=\"1283\" data-c=\"74\" href=\"#MJX-TEX-N-74\"><\/use><\/g><g transform=\"translate(510,-292.2) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"2020.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"3075.8\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><g transform=\"translate(3641.8)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"4959.3\" data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><use x=\"5959.6\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"6348.6\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"7070.8\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"8071\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"8637\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><g transform=\"translate(9026)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, with <mjx-container data-tex=\"\\beta\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.281ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.281ex\" height=\"2.034ex\" viewBox=\"0 -705 566 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/svg><\/mjx-container> the relaxed stress fraction.", "status": "ai-draft"}}, {"id": "section-IV-A-p2", "kind": "paragraph", "body": "<p>As seen from Eq. <a href=\"#eq-gbar_stationary_condition\">(22)<\/a>, the long time stability of a body depends only on <mjx-container data-tex=\"\\b\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.281ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.281ex\" height=\"2.034ex\" viewBox=\"0 -705 566 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/svg><\/mjx-container>, and not on the specific <a data-def=\"memory-kernel\">memory kernel<\/a>. It is thus instructive to discuss the SLS model. The memory kernel for the SLS model is given by <mjx-container data-tex=\"\\phi(s)=e^{-\\nicefrac{s}{\\tau}}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:11.099ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"11.099ex\" height=\"2.587ex\" viewBox=\"0 -893.3 4905.6 1143.3\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D719\" href=\"#MJX-TEX-I-1D719\"><\/use><use x=\"596\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"985\" data-c=\"1D460\" href=\"#MJX-TEX-I-1D460\"><\/use><use x=\"1454\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"2120.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(3176.6)\"><use data-c=\"1D452\" href=\"#MJX-TEX-I-1D452\"><\/use><g transform=\"translate(499,363) scale(0.707)\"><use data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><g transform=\"translate(778)\"><g><\/g><g transform=\"translate(33,363) scale(0.707)\"><use data-c=\"1D460\" href=\"#MJX-TEX-I-1D460\"><\/use><\/g><\/g><g transform=\"translate(1192.6,0) scale(1.414)\"><g><\/g><\/g><use x=\"956.5\" data-c=\"2F\" href=\"#MJX-TEX-N-2F\"><\/use><g transform=\"translate(1456.5,0) scale(1.414)\"><g><\/g><\/g><g transform=\"translate(1220.3)\"><g><\/g><g transform=\"translate(33,-150) scale(0.707)\"><use data-c=\"1D70F\" href=\"#MJX-TEX-I-1D70F\"><\/use><\/g><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. In analogy to Eq. <a href=\"#eq-sls_L_bar_DE\">(4)<\/a>, the differential equation for the <a data-def=\"reference-metric\">reference metric<\/a> reads<\/p>\n<div class=\"display multi\" id=\"eq-gbar_SLS_DE\"><div class=\"eqbody\"><mjx-container data-tex=\"\\begin{align*}\n\t\t\t\\dot \\gbar_{ij}(t) =&amp; -\\frac{1}{\\tau}\\left(\\b \\left(\\gbar_{ij}(t) - g_{ij}(t) \\right) +(1-\\b) \\left(\\gbar_{ij}(t) - \\gbaro_{ij} \\right)\\right) \n\t\t\t=&amp;-\\frac{1}{\\tau}\\left( \\gbar_{ij}(t)-\\gbar^\\text{stat}_{ij} (t)\\right).\n\t\t\t\n\t\t\\end{align*}\" class=\"MathJax\" jax=\"SVG\" display=\"true\" style=\"--w:82.077ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/ \" style=\"--w:1.079ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"1.079ex\" height=\"1.464ex\" viewBox=\"0 -442 477 647\"><g transform=\"scale(1,-1)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><\/g><\/svg><\/mjx-container> is constrained and performed with respect to a subset of metrics that correspond to realizable configurations. Such metrics are in particular orientation preserving and Euclidean. This set is represented by the dashed line above. Given a <a data-def=\"reference-metric\">reference metric<\/a> <mjx-container data-tex=\"\\gbar\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.079ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"1.079ex\" height=\"2.032ex\" viewBox=\"0 -693 477 898\"><g transform=\"scale(1,-1)\"><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> the realized metric will correspond to the closest point from the set of admissible metrics to <mjx-container data-tex=\"\\gbar\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.079ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"1.079ex\" height=\"2.032ex\" viewBox=\"0 -693 477 898\"><g transform=\"scale(1,-1)\"><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> according to the distance function given by the <a data-def=\"instantaneous-energy\">instantaneous elastic energy<\/a> <a href=\"#eq-energy_functional\">(14)<\/a>. Starting from rest, <mjx-container data-tex=\"\\gbar\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.079ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"1.079ex\" height=\"2.032ex\" viewBox=\"0 -693 477 898\"><g transform=\"scale(1,-1)\"><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> evolves from <mjx-container data-tex=\"\\gbaro\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.067ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"2.067ex\" height=\"2.351ex\" viewBox=\"0 -833.9 913.6 1038.9\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,363) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> towards <mjx-container data-tex=\"g\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.079ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"1.079ex\" height=\"1.464ex\" viewBox=\"0 -442 477 647\"><g transform=\"scale(1,-1)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><\/g><\/svg><\/mjx-container>. Conversely, if <mjx-container data-tex=\"g\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.079ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"1.079ex\" height=\"1.464ex\" viewBox=\"0 -442 477 647\"><g transform=\"scale(1,-1)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><\/g><\/svg><\/mjx-container> is the closest admissible metric to <mjx-container data-tex=\"\\gbar^{\\text stat}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.899ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"3.899ex\" height=\"2.287ex\" viewBox=\"0 -805.6 1723.2 1010.6\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,363) scale(0.707)\"><use data-c=\"73\" href=\"#MJX-TEX-N-73\"><\/use><use x=\"394\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"755\" data-c=\"1D44E\" href=\"#MJX-TEX-I-1D44E\"><\/use><use x=\"1284\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> it is also such for <mjx-container data-tex=\"\\gbaro\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.067ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"2.067ex\" height=\"2.351ex\" viewBox=\"0 -833.9 913.6 1038.9\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,363) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> which is collinear with the two. <\/figcaption><\/figure>", "hash": "33ced8a24f6b", "gist": {"html": "Realized metrics are the admissible ones closest to the reference metric, which moves along a line from rest.", "status": "ai-draft"}}], "gist": {"html": "Incompressibility makes the kernel scalar, so the reference metric relaxes towards a fixed mix of current and rest metrics.", "status": "ai-draft"}, "brief": {"html": "<p><span data-covers=\"section-IV-A-p1\">An incompressible material keeps its Poisson contraction while relaxing, so the mixing part of the kernel vanishes and the reference metric relaxes towards <mjx-container data-tex=\"\\bar g^{\\rm stat}_{ij}=\\beta g_{ij}+(1-\\beta)\\bar g^0_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:22.899ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg st 8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. Similar claim can be made for general linear viscoelastic and incompressible bodies. By Eq <a href=\"#eq-gbar_stationary_condition\">(22)<\/a> at stationarity <mjx-container data-tex=\"\\gbar^\\text{stat}_{ij} = \\b g_{ij} + (1-\\b)\\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:22.899ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"22.899ex\" height=\"2.892ex\" viewBox=\"0 -840.1 10121.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,363) scale(0.707)\"><use data-c=\"73\" href=\"#MJX-TEX-N-73\"><\/use><use data-c=\"74\" href=\"#MJX-TEX-N-74\" transform=\"translate(394)\"><\/use><use data-c=\"61\" href=\"#MJX-TEX-N-61\" transform=\"translate(783)\"><\/use><use data-c=\"74\" href=\"#MJX-TEX-N-74\" transform=\"translate(1283)\"><\/use><\/g><g transform=\"translate(510,-292.2) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"2020.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"3075.8\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><g transform=\"translate(3641.8)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"4959.3\" data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><use x=\"5959.6\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"6348.6\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"7070.8\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"8071\" data-c=\"1D6 thJax\" jax=\"SVG\" style=\"--w:7.973ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"7.973ex\" height=\"2.892ex\" viewBox=\"0 -840.1 3524.1 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1373.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2428.8)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. Therefore the configuration is an extremal of the elastic energy functional with respect to the <a data-def=\"rest-reference-metric\">rest reference metric<\/a> <mjx-container data-tex=\"F^0_\\a\\left[g_{ij}\\right]=0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:11.069ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"11.069ex\" height=\"2.552ex\" viewBox=\"0 -833.9 4892.4 1128.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D439\" href=\"#MJX-TEX-I-1D439\"><\/use><g transform=\"translate(837.3,363) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(676,-247) scale(0.707)\"><use data-c=\"1D6FC\" href=\"#MJX-TEX-I-1D6FC\"><\/use><\/g><\/g><g transform=\"translate(1407.5)\"><use data-c=\"5B
