e\"><\/span><svg style=\"vertical-align: -1.244ex;\" width=\"17.609ex\" height=\"3.684ex\" viewBox=\"0 -1078.4 7783.4 1628.5\"><g transform=\"scale(1,-1)\"><g><g transform=\"translate(0 0.5)\"><use data-c=\"222B\" href=\"#MJX-TEX-SO-222B\"><\/use><\/g><g transform=\"translate(776.7)\"><use data-c=\"1D436\" href=\"#MJX-TEX-I-1D436\"><\/use><g transform=\"translate(845.3,363) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><use x=\"757\" data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><use x=\"1278\" data-c=\"1D459\" href=\"#MJX-TEX-I-1D459\"><\/use><\/g><\/g><g transform=\"translate(2786.3)\"><g transform=\"translate(220,548.1) scale(0.707)\"><use data-c=\"1D6FF\" href=\"#MJX-TEX-I-1D6FF\"><\/use><g transform=\"translate(444)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><g transform=\"translate(1539.3)\"><use data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"389\" data-c=\"1D465\" href=\"#MJX-TEX-I-1D465\"><\/use><use x=\"961\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><g transform=\"translate(443.4,-347) scale(0.707)\"><use data-c=\"1D6FF\" href=\"#MJX-TEX-I-1D6FF\"><\/use><g transform=\"translate(444)\"><g><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><use data-c=\"2E\" href=\"#MJX-TEX-N-2E\" transform=\"translate(500)\"><\/use><use data-c=\"32\" href=\"#MJX-TEX-N-32\" transform=\"translate(778)\"><\/use><\/g><g transform=\"translate(1311,-150) scale(0.707)\"><use data-c=\"1D6FC\" href=\"#MJX-TEX-I-1D6FC\"><\/use><\/g><\/g><\/g><rect width=\"2243\" height=\"60\" x=\"120\" y=\"220\"><\/rect><\/g><g transform=\"translate(5269.3)\"><g transform=\"translate(220,516.8) scale(0.707)\"><use data-c=\"1D6FF\" href=\"#MJX-TEX-I-1D6FF\"><\/use><g transform=\"translate(444)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><use x=\"521\" data-c=\"1D459\" href=\"#MJX-TEX-I-1D459\"><\/use><\/g><\/g><g transform=\"translate(1583.1)\"><use data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"389\" data-c=\"1D465\" href=\"#MJX-TEX-I-1D465\"><\/use><use x=\"961\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><g transform=\"translate(477.4,-347) scale(0.707)\"><use data-c=\"1D6FF\" href=\"#MJX-TEX-I-1D6FF\"><\/use><g transform=\"translate(444)\"><g><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><use data-c=\"2E\" href=\"#MJX-TEX-N-2E\" transform=\"translate(500)\"><\/use><use data-c=\"32\" href=\"#MJX-TEX-N-32\" transform=\"translate(778)\"><\/use><\/g><g transform=\"translate(1311,-150) scale(0.707)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/g><\/g><rect width=\"2274\" height=\"60\" x=\"120\" y=\"220\"><\/rect><\/g><\/g><\/g><\/svg><\/mjx-container> is a positive definite matrix Bower (<a href=\"#cite-AB09\">2009<\/a>). If the configuration was initially stable and <mjx-container data-tex=\"\\frac{\\d^{2}E_0}{\\d\\l_{\\a}\\d\\l_{\\b}}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:8.135ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -1.244ex;\" width=\"8.135ex\" height=\"3.613ex\" viewBox=\"0 -1046.7 3595.7 1596.8\"><g transform=\"scale(1,-1)\"><g><g><g transform=\"translate(1071.2,457.1) scale(0.707)\"><g><use data-c=\"1D6FF\" href=\"#MJX-TEX-I-1D6FF\"><\/use><g transform=\"translate(477,363) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><g transform=\"translate(880.6)\"><use data-c=\"1D438\" href=\"#MJX-TEX-I-1D438\"><\/use><g transform=\"translate(771,-150) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/g><g transform=\"translate(220,-347) scale(0.707)\"><use data-c=\"1D6FF\" href=\"#MJX-TEX-I-1D6FF\"><\/use><g transform=\"translate(444)\"><g><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><use data-c=\"2E\" href=\"#MJX-TEX-N-2E\" transform=\"translate(500)\"><\/use><use data-c=\"32\" href=\"#MJX-TEX-N-32\" transform=\"translate(778)\"><\/use><\/g><g transform=\"translate(1311,-150) scale(0.707)\"><use data-c=\"1D6FC\" href=\"#MJX-TEX-I-1D6FC\"><\/use><\/g><\/g><use x=\"2257.5\" data-c=\"1D6FF\" href=\"#MJX-TEX-I-1D6FF\"><\/use><g transform=\"translate(2701.5)\"><g><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><use data-c=\"2E\" href=\"#MJX-TEX-N-2E\" transform=\"translate(500)\"><\/use><use data-c=\"32\" href=\"#MJX-TEX-N-32\" transform=\"translate(778)\"><\/use><\/g><g transform=\"translate(1311,-150) scale(0.707)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/g><\/g><rect width=\"3355.7\" height=\"60\" x=\"120\" y=\"220\"><\/rect><\/g><\/g><\/g><\/svg><\/mjx-container> is positive definite, then the stationary Hessian is also positive definite (sum of two positive definite matrices). Thus initially stable (not only <a data-def=\"extremal\">extremal<\/a>) configuration is also stationary. But Eq. <a href=\"#eq-Hessians_static_rest\">(24)<\/a> also open the possibility for non-stable but extremal configuration of the <a data-def=\"rest-elastic-system\">rest system<\/a>, for example a saddle point, to stabilize indefinitely. Eq. <a href=\"#eq-Hessians_static_rest\">(24)<\/a> also elucidate the basic intuition that when a system is held at constant displacement, <a data-def=\"stress-relaxation\">stress relaxation<\/a> stabilizes the configuration; as we can see from the equation, originally non positive Hessian become ’more positive’ along the relaxation. Both features depend on the value of <mjx-container data-tex=\"\\b\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.281ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.281ex\" height=\"2.034ex\" viewBox=\"0 -705 566 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/svg><\/mjx-container>. As <mjx-container data-tex=\"\\b\\rightarrow 0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.931ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"5.931ex\" height=\"2.034ex\" viewBox=\"0 -705 2621.6 899\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"843.8\" data-c=\"2192\" href=\"#MJX-TEX-N-2192\"><\/use><use x=\"2121.6\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container> the system almost doesn’t change at all under relaxation and only initially stable configurations are also stationary. Conversely, as <mjx-container data-tex=\"\\b\\rightarrow 1\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.931ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"5.931ex\" height=\"2.034ex\" viewBox=\"0 -705 2621.6 899\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"843.8\" data-c=\"2192\" href=\"#MJX-TEX-N-2192\"><\/use><use x=\"2121.6\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><\/svg><\/mjx-container> the system is able to stabilize more and more configurations, and all the rest system extremals will become also stationary configurations. <br><\/p>", "hash": "25aad816f1e4", "gist": {"html": "Relaxation adds a positive term to the Hessian: rest-stable configurations are stationary, and rest saddles may stabilize indefinitely.", "status": "ai-draft"}}, {"id": "sec-stationary_states-p3", "kind": "paragraph", "body": "<p>The second phenomenon described in section <a href=\"#sec-sls_von_Mises_truss\">II B<\/a> and in appendix <a href=\"#app-1d_sls_systems\"><\/a> deals with bringing a system to a metastable state abruptly from rest. Here we take body at rest and deform it fast into some other local elastically stable configuration. We claim that the dynamics of the system’s configuration is trivial, i.e. a configuration itself will display no temporal variation despite the continuous evolution of the <a data-def=\"reference-metric\">reference metric<\/a> and the relaxation of the corresponding stress <sup class=\"fnref\"><a href=\"#fn1\" id=\"fnref1\">1<\/a><\/sup>. First, we assume that the system starts at rest, i.e. for all <mjx-container data-tex=\"t&lt;0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.965ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.09ex;\" width=\"4.965ex\" height=\"1.597ex\" viewBox=\"0 -666 2194.6 706\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"638.8\" data-c=\"3C\" href=\"#MJX-TEX-N-3C\"><\/use><use x=\"1694.6\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container> we have <mjx-container data-tex=\"g_{ij}(t)=\\gbar_{ij}(t)=\\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:18.622ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"18.622ex\" height=\"2.892ex\" viewBox=\"0 -840.1 8231 1278.1\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1095.3\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1484.3\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"1845.3\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"2512.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(3567.8)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"4663.1\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"5052.1\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"5413.1\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"6079.9\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(7135.7)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. At <mjx-container data-tex=\"t=0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.965ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"4.965ex\" height=\"1.692ex\" viewBox=\"0 -666 2194.6 748\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"638.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1694.6\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container> the system is brought abruptly to an elastically stable conifguration <mjx-container data-tex=\"g_{ij}(0)\\ne \\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:10.865ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"10.865ex\" height=\"2.892ex\" viewBox=\"0 -840.1 4802.1 1278.1\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1095.3\" dat se><use x=\"1845.3\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> on the line between the <a data-def=\"rest-reference-metric\">rest reference metric<\/a> to <mjx-container data-tex=\"g_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.666ex;\" width=\"2.478ex\" height=\"1.666ex\" viewBox=\"0 -442 1095.3 736.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>.<\/p>", "hash": "5e63ab5b5f75", "gist": {"html": "Both claims reflect collinearity: from rest, the reference metric moves on the line towards the configuration metric.", "status": "ai-draft"}}], "gist": {"html": "Stationary configurations are rest-system extremals, and rest-stable configurations reached abruptly from rest stay exactly still.", "status": "ai-draft"}, "brief": {"html": "<p><span data-covers=\"sec-stationary_states-p1\">At stationarity the generalized forces are <mjx-container data-tex=\"(1-\\beta)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.938ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"6.938ex\" height=\"2.262ex\" viewBox=\"0 -750 3066.4 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"389\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"1111.2\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"2111.4\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"2677.4\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> times those of the rest system, so stationary configurations are its extremals.<\/span> <span data-covers=\"sec-stationary_states-p2\">The stationary Hessian is <mjx-container data-tex=\"(1-\\beta)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.938ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"6.938ex\" height=\"2.262ex\" viewBox=\"0 -750 3066.4 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"389\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"1111.2\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"2111.4\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"2677.4\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> times the rest Hessian plus a positive term, so rest-stable shapes are stationary and rest saddles may stabilize for good.<\/span> <span data-covers=\"sec-stationary_states-p3 sec-stationary_states-p5\">Brought suddenly from rest into a stable shape, a body never moves: its reference metric slides along the line towards it, and the elastic strain shrinks by a common factor.<\/span> <span data-covers=\"sec-stationary_states-p4\">The proofs need a scalar kernel, which incompressibility provides.<\/span><\/p>", "status": "ai-draft"}}, {"id": "sec-transient_stability_loss", "kind": "section", "number": "IV C", "title": "Transient elastic stability and snap-through", "titleHtml": "Transient elastic stability and snap-through", "children": [{"id": "sec-transient_stability_loss-p1", "kind": "paragraph", "body": "<p>We have so far discussed the behavior of viscoelastic systems in states that are stable when arrived to from rest. We next come to discuss the complementary states that are unstable. In particular we would like to address how could they acquire stability and also in turn how this stability is lost. Jumping <a data-def=\"jumping-popper\">poppers<\/a> are thin rubber shells. Very thin poppers display almost isometric bi-stability, while thick poppers have only one elastically stable shape. However, when an appropriately cut popper is flipped inside out and laid on the table [Fig. <a href=\"#fig-hopper_popper\">(5)<\/a>] it creeps for a few seconds and snaps back to its original shape, much in the same manner systems with intermediate values of <mjx-container data-tex=\"\\a\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.448ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"1.448ex\" height=\"1.025ex\" viewBox=\"0 -442 640 453\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FC\" href=\"#MJX-TEX-I-1D6FC\"><\/use><\/g><\/svg><\/mjx-container> in the <a data-def=\"von-mises-truss\">Von-Mises truss<\/a> model of section <a href=\"#sec-sls_von_Mises_truss\">II B<\/a> acquired and lost stability.<\/p>", "hash": "9bd0f52f0ad1", "gist": {"html": "An inverted, suitably cut jumping popper creeps for seconds then snaps back, like the intermediate-stiffness truss.", "status": "ai-draft"}}, {"id": "sec-transient_stability_loss-p2", "kind": "paragraph", "body": "<p>One general corollary of the previous section is that stability loss can occur only from configurations that were “originally” unstable - not a stable configuration of the <a data-def=\"rest-elastic-system\">rest elastic system<\/a> <mjx-container data-tex=\"\\gbar_{ij}=\\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.973ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"7.973ex\" height=\"2.892ex\" viewBox=\"0 -840.1 3524.1 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1373.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2428.8)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. If the configuration was originally stable, than by the above claim it is also stationary, and its stability can never be lost. Thus a system exhibiting temporary stability followed by a <a data-def=\"snap-through\">snap though<\/a>, was necessarily away of its rest system <mjx-container data-tex=\"\\gbar_{ij}\\ne\\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.973ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"7.973ex\" height=\"2.892ex\" viewBox=\"0 -840.1 3524.1 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"1373.1\" data-c=\"2260\" href=\"#MJX-TEX-N-2260\"><\/use><g transform=\"translate(2428.8)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> before the free evolution. Therefore if a <a data-def=\"jumping-popper\">popper<\/a> snap a finite time after being inverted, its stability (prior to the snap) was necessarily acquired, presumably by holding it inverted for a long enough duration.<\/p>", "hash": "b2a6ae37d649", "gist": {"html": "Stability can be lost only if it was acquired, so a popper that snaps late had been relaxed while inverted.", "status": "ai-draft"}}, {"id": "sec-transient_stability_loss-p3", "kind": "paragraph", "body": "<p>Second, <a data-def=\"acquired-stability\">acquired stability<\/a> from configurations that were not <a data-def=\"extremal\">extremal<\/a> initially (e.g. saddle points) cannot persist indefinitely and must be eventually lost. If a configuration is stationary after a relaxation that started from rest then it must also be extremal with respect to the rest <a data-def=\"reference-metric\">reference metric<\/a>. In the case of the <a data-def=\"jumping-popper\">popper<\/a> it means that if it was originally unstable, there is no way (by holdings the popper inverted or by any other deformations) to stabilize the popper indefinitely after the external loads are removed. For such cases the inverted shapes cannot be <a data-def=\"stationary-state\">stationary states<\/a> of the system, and the popper will always eventually snap back to an rest state.<\/p>", "hash": "5f3e435d010b", "gist": {"html": "Acquired stability of a configuration that is not a rest extremal must end: such a popper always snaps back.", "status": "ai-draft"}}, {"id": "sec-transient_stability_loss-p4", "kind": "paragraph", "body": "<p><span id=\"sec-experimental_results\" class=\"anchor\"><\/span><\/p>", "hash": "da39a3ee5e6b"}, {"id": "fig-hopper_popper", "kind": "figure", "title": "Figure 5", "body": "<figure class=\"float figure\" id=\"fig-hopper_popper\"><p><span class=\"subfig\"> <span id=\"fig-hoppers\" class=\"anchor\"><\/span> <img src=\"img/d5024884c7679a8e.png\" width=\"1400\" " href=\"#MJX-TEX-N-6C\" transform=\"translate(306)\"><\/use><use data-c=\"69\" href=\"#MJX-TEX-N-69\" transform=\"translate(584)\"><\/use><use data-c=\"70\" href=\"#MJX-TEX-N-70\" transform=\"translate(862)\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. (c) The flipping time as function of the cone thickness for the two limiting cases of immediate release and long holding time. The elastic cone was simulated with geometrical properties <mjx-container data-tex=\"r_\\text{min}=10[\\text{mm}],r_{max}=25[\\text{mm}]\" class=\"MathJax\" jax=\"SVG\" style=\"--w:29.869ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"29.869ex\" height=\"2.262ex\" viewBox=\"0 -750 13201.9 1000\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D45F\" href=\"#MJX-TEX-I-1D45F\"><\/use><g transform=\"translate(484,-150) scale(0.707)\"><use data-c=\"6D\" href=\"#MJX-TEX-N-6D\"><\/use><use data-c=\"69\" href=\"#MJX-TEX-N-69\" transform=\"translate(833)\"><\/use><use data-c=\"6E\" href=\"#MJX-TEX-N-6E\" transform=\"translate(1111)\"><\/use><\/g><\/g><use x=\"1990.5\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(3046.3)\"><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use data-c=\"30\" href=\"#MJX-TEX-N-30\" transform=\"translate(500)\"><\/use><\/g><use x=\"4046.3\" data-c=\"5B\" href=\"#MJX-TEX-N-5B\"><\/use><g transform=\"translate(4324.3)\"><use data-c=\"6D\" href=\"#MJX-TEX-N-6D\"><\/use><use data-c=\"6D\" href=\"#MJX-TEX-N-6D\" transform=\"translate(833)\"><\/use><\/g><use x=\"5990.3\" data-c=\"5D\" href=\"#MJX-TEX-N-5D\"><\/use><use x=\"6268.3\" data-c=\"2C\" href=\"#MJX-TEX-N-2C\"><\/use><g transform=\"translate(6713)\"><use data-c=\"1D45F\" href=\"#MJX-TEX-I-1D45F\"><\/use><g transform=\"translate(484,-150) scale(0.707)\"><use data-c=\"1D45A\" href=\"#MJX-TEX-I-1D45A\"><\/use><use x=\"878\" data-c=\"1D44E\" href=\"#MJX-TEX-I-1D44E\"><\/use><use x=\"1407\" data-c=\"1D465\" href=\"#MJX-TEX-I-1D465\"><\/use><\/g><\/g><use x=\"8924.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(9979.9)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><use data-c=\"35\" href=\"#MJX-TEX-N-35\" transform=\"translate(500)\"><\/use><\/g><use x=\"10979.9\" data-c=\"5B\" href=\"#MJX-TEX-N-5B\"><\/use><g transform=\"translate(11257.9)\"><use data-c=\"6D\" href=\"#MJX-TEX-N-6D\"><\/use><use data-c=\"6D\" href=\"#MJX-TEX-N-6D\" transform=\"translate(833)\"><\/use><\/g><use x=\"12923.9\" data-c=\"5D\" href=\"#MJX-TEX-N-5D\"><\/use><\/g><\/g><\/svg><\/mjx-container>. The material properties taken were <mjx-container data-tex=\"\\b = 0.3\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.189ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"7.189ex\" height=\"2.034ex\" viewBox=\"0 -705 3177.6 899\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"843.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(1899.6)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><use data-c=\"2E\" href=\"#MJX-TEX-N-2E\" transform=\"translate(500)\"><\/use><use data-c=\"33\" href=\"#MJX-TEX-N-33\" transform=\"translate(778)\"><\/use><\/g><\/g><\/g><\/svg><\/mjx-container>, Young’s modulus <mjx-container data-tex=\"E=2.5[\\text{MPa}]\" class=\"MathJax\" jax=\"SVG\" style=\"--w:13.642ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"13.642ex\" height=\"2.262ex\" viewBox=\"0 -750 6029.6 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D438\" href=\"#MJX-TEX-I-1D438\"><\/use><use x=\"1041.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2097.6)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><use data-c=\"2E\" href=\"#MJX-TEX-N-2E\" transform=\"translate(500)\"><\/use><use data-c=\"35\" href=\"#MJX-TEX-N-35\" transform=\"translate(778)\"><\/use><\/g><use x=\"3375.6\" data-c=\"5B\" href=\"#MJX-TEX-N-5B\"><\/use><g transform=\"translate(3653.6)\"><use data-c=\"4D\" href=\"#MJX-TEX-N-4D\"><\/use><use data-c=\"50\" href=\"#MJX-TEX-N-50\" transform=\"translate(917)\"><\/use><use data-c=\"61\" href=\"#MJX-TEX-N-61\" transform=\"translate(1598)\"><\/use><\/g><use x=\"5751.6\" data-c=\"5D\" href=\"#MJX-TEX-N-5D\"><\/use><\/g><\/g><\/svg><\/mjx-container> and Poisson ratio <mjx-container data-tex=\"\\nu=0.47\" class=\"MathJax\" jax=\"SVG\" style=\"--w:8.239ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"8.239ex\" height=\"1.717ex\" viewBox=\"0 -677 3641.6 759\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D708\" href=\"#MJX-TEX-I-1D708\"><\/use><use x=\"807.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(1863.6)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><use data-c=\"2E\" href=\"#MJX-TEX-N-2E\" transform=\"translate(500)\"><\/use><use data-c=\"34\" href=\"#MJX-TEX-N-34\" transform=\"translate(778)\"><\/use><use data-c=\"37\" href=\"#MJX-TEX-N-37\" transform=\"translate(1278)\"><\/use><\/g><\/g><\/g><\/svg><\/mjx-container>. A similar phase plot presented in Brinkmeyer <em>et al.<\/em> (<a href=\"#cite-BSP12\">2012<\/a>) and in Urbach and Efrati (<a href=\"#cite-UE18a\">2018<\/a>). <\/figcaption><\/figure>", "hash": "7cfea8e7678e", "gist": {"html": "Poppers and the hold-release protocol; simulated flip times mark stable, acquired-stability and unstable ranges of cone thickness.", "status": "ai-draft"}}], "gist": {"html": "Only shapes unstable at rest can lose stability, and acquired stability away from rest extremals must end.", "status": "ai-draft"}, "brief": {"html": "<p><span data-covers=\"sec-transient_stability_loss-p1\">Jumping poppers, thin rubber shells, can creep for seconds after being turned inside out and then snap back, like the truss at intermediate stiffness.<\/span> <span data-covers=\"sec-transient_stability_loss-p2\">Since rest-stable shapes are stationary, a shape that loses stability was unstable at rest and had acquired its stability, presumably while held.<\/span> <span data-covers=\"sec-transient_stability_loss-p3\">A stationary shape must be a rest extremal, so an inverted popper that was unstable at rest cannot be stabilized indefinitely and always snaps back.<\/span> <span data-covers=\"fig-hopper_popper\">A simulated cone gives the flip time against thickness.<\/span><\/p>", "status": "ai-draft"}}], "gist": {"html": "For incompressible solids, stable shapes reached from rest never evolve, and only acquired stability can be lost.", "status": "ai-draft"}, "brief": {"html": "<p><span data-covers=\"section-IV-A-p1\">For incompressible materials the memory kernel is scalar, so the reference metric relaxes towards <mjx-container data-tex=\"\\bar g^{\\rm stat}_{ij}=\\beta g_{ij}+(1-\\beta)\\bar g^0_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:22.899ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"22.899ex\" height=\"2.892ex\" viewBox=\"0 -840.1 10121.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,363) scale(0.707)\"><use data-c=\"73\" href=\"#MJX-TEX-N-73\"><\/use><use x=\"394\" data-c=\"74\" href=\"#MJX-TEX-N-74\"><\/use><use x=\"783\" data-c=\"61\" href=\"#MJX-TEX-N-61\"><\/use><use x=\"1283\" data-c=\"74\" href=\"#MJX-TEX-N-74\"><\/use><\/g><g transform=\"translate(510,-292.2) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"2020.1\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"3075.8\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><g transform=\"translate(3641.8)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><use x=\"4959.3\" data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><use x=\"5959.6\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"6348.6\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"7070.8\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"8071\" data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"8637\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><g transform=\"translate(9026)\"><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>.<\/span> <span data-covers=\"sec-stationary_states-p1 sec-stationary_states-p2\">Every stationary configuration is therefore an equilibrium of the body at its rest metric, and every configuration stable there is stationary.<\/span> <span data-covers=\"sec-stationary_states-p3\">A body brought suddenly from rest into such a stable shape never moves, whatever the memory kernel.<\/span> <span data-covers=\"sec-transient_stability_loss-p2 sec-transient_stability_loss-p3\">Hence only stability acquired by relaxation can be lost, and acquired stability of shapes that are not rest equilibria must be lost, as for jumping poppers.<\/span><\/p>", "status": "ai-draft"}}, {"id": "section-V", "kind": "appendix", "number": "V", "title": "Summary and discussion", "titleHtml": "Summary and discussion", "children": [{"id": "section-V-p1", "kind": "paragraph", "body": "<p>Naively one expects <a data-def=\"stress-relaxation\">stress relaxation<\/a> to only diminish internal forces and thus act to stabilize a system rendering the notion of viscoelastic instabilities elusive. We have shown this intuition to indeed be correct; if a system is brought abruptly from its rest state into an elastically meta-stable state then stress relaxation will never cause it to lose stability. We moreover proved that in such a setting the configuration of the system will show no evolution despite the continuous vicoelastic attenuation of internal stresses.<\/p>", "hash": "a11a8c9eda85", "gist": {"html": "The naive intuition holds: a metastable state reached abruptly from rest never loses stability or moves.", "status": "ai-draft"}}, {"id": "section-V-p2", "kind": "paragraph", "body": "<p>Having formulated the viscoelastic evolution in terms of metric tensors we observed that the instantaneous <a data-def=\"reference-metric\">reference metric<\/a> evolves not only toward <mjx-container data-tex=\"g\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.079ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"1.079ex\" height=\"1.464ex\" viewBox=\"0 -442 477 647\"><g transform=\"scale(1,-1)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><\/g><\/svg><\/mjx-container>, the assumed configuration, but also toward <mjx-container data-tex=\"\\gbaro\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.067ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"2.067ex\" height=\"2.351ex\" viewBox=\"0 -833.9 913.6 1038.9\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,363) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, its <a data-def=\"rest-reference-metric\">rest metric<\/a>. When starting from rest only the former is observed. In this case the reference metric evolves along a straight line and as a result the elastic energy minimizer at time <mjx-container data-tex=\"t\" class=\"MathJax\" jax=\"SVG\" style=\"--w:0.817ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"0.817ex\" height=\"1.441ex\" viewBox=\"0 -626 361 637\"><g transform=\"scale(1,-1)\"><use data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><\/g><\/svg><\/mjx-container> with respect to <mjx-container data-tex=\"\\gbar(t)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.656ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"3.656ex\" height=\"2.262ex\" viewBox=\"0 -750 1616 1000\"><g transform=\"scale(1,-1)\"><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><use x=\"477\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"866\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"1227\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> remains the minimizer for subsequent times, as explained graphically in FIG. <a href=\"#fig-metric_space\">(4)<\/a>. For every other case, in which <mjx-container data-tex=\"\\gbar\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.079ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"1.079ex\" height=\"2.032ex\" viewBox=\"0 -693 477 898\"><g transform=\"scale(1,-1)\"><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> does not evolve solely toward <mjx-container data-tex=\"g\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.079ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"1.079ex\" height=\"1.464ex\" viewBox=\"0 -442 477 647\"><g transform=\"scale(1,-1)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><\/g><\/svg><\/mjx-container>, we expect a visible <a data-def=\"creep\">creep<\/a> and in particular such systems may display viscoelastic instabilities. We have shown that the only states that can display viscoelastic instabilities are states that are elastically unstable with respect to <mjx-container data-tex=\"\\gbaro\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.067ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"2.067ex\" height=\"2.351ex\" viewBox=\"0 -833.9 913.6 1038.9\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,363) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> but have <a data-def=\"acquired-stability\">acquired stability<\/a> through <a data-def=\"stress-relaxation\">stress relaxation<\/a>. We have also shown that every instance of such an acquired stability cannot persist indefinitely and must be lost in time.<\/p>", "hash": "58813bccbd63", "gist": {"html": "Only states unstable about the rest metric that acquired stability can snap, and that acquired stability cannot last.", "status": "ai-draft"}}, {"id": "section-V-p3", "kind": "paragraph", "body": "<p>These results are expected to hold for every isotropic and <a data-def=\"incompressible\">incompressible<\/a> linearly viscoelastic material regardless of the form of history dependence of the <a data-def=\"stress-relaxation\">stress relaxation<\/a> kernel. However, considering a single SLS system or any other purely one dimensional viscoelastic system we do not observe this rich phenomenology of instabilities due to the trivial structure of the set of admissible states. The ability of a viscoelastic system to display <a data-def=\"delayed-stability-loss\">delayed instabilities<\/a> relies on the non-trivial shape of the set of admissible states. As observed in FIG. <a href=\"#fig-sls_von_mises_truss_lengths_space\">(3)<\/a> for the SLS <a data-def=\"von-mises-truss\">Von-Misses truss<\/a>, only when the set of admissible states is sufficiently curved can it support multi-stability. For continuous media the structure of admissible (Euclidean) states is non-convex. As a result we may bring a systems that is initially at rest in an Euclidean configuration, to another Euclidean state by the application of external forces, and the viscoelastic evolution will result in a non-Euclidean instantaneous <a data-def=\"reference-metric\">reference metric<\/a>, giving rise to a <dfn data-def=\"frustrated\">geometrically frustrated<\/dfn> state. In such cases residual stress is like to appear even in lieu of multistability.<\/p>", "hash": "b539d86391f1", "gist": {"html": "Delayed instabilities need a curved set of admissible states; in continua relaxation can also leave residual stress.", "status": "ai-draft"}}, {"id": "bg-incompatible", "kind": "background", "title": "Non-Euclidean reference metrics and residual stress", "audience": ["student", "physicist"], "fold": true, "body": "<p>Not every metric is the metric of some shape in space. A metric on a three-dimensional body comes from a configuration <mjx-container data-tex=\"\\mathbf r(x)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.127ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"4.127ex\" height=\"2.262ex\" viewBox=\"0 -750 1824 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D42B\" href=\"#MJX-TEX-B-1D42B\"><\/use><use x=\"474\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"863\" data-c=\"1D465\" href=\"#MJX-TEX-I-1D465\"><\/use><use x=\"1435\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> only if it is Euclidean, which means that its Riemann curvature tensor vanishes everywhere; these are the compatibility conditions of elasticity. A <a data-def=\"reference-metric\">reference metric<\/a> with curvature, called non-Euclidean or incompatible, cannot be realized: whatever shape the body takes, some pieces are stretched or compressed relative to their preferred lengths. The body then carries residual stress even with no external load, and is said to be <a data-def=\"frustrated\">geometrically frustrated<\/a>. Such states arise in growing leaves and tissues, in swelling gels, and under non-uniform heating, and are the subject of non-Euclidean (incompatible) elasticity. The set of Euclidean metrics is not convex, so a mixture of two of them is generally non-Euclidean; this is why a reference metric relaxing between a <a data-def=\"rest-reference-metric\">rest metric<\/a> and a held one can leave a frustrated state.<\/p>"}, {"id": "section-V-p4", "kind": "paragraph", "body": "<p>While in the theory presented here the <a data-def=\"rest-reference-metric\">rest metric<\/a>, <mjx-container data-tex=\"\\gbaro_{ij}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.478ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.991ex;\" width=\"2.478ex\" height=\"2.892ex\" viewBox=\"0 -840.1 1095.3 1278.1\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(266.3,3) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(510,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(510,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"1D457\" href=\"#MJX-TEX-I-1D457\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, is assumed constant one could consider growing tissue or plastically deforming material by allowing the rest metric to vary in time. The variation could be provided by external conditions or obey some additional constitutive relations. This will result in a covariant elaso-visco-plastic theory. Such a description may provide crucial insight into growing and deforming biological polymers where a rapid growth or shrinkage events may be masked by the slow evolution of the instantaneous <a data-def=\"reference-metric\">reference metric<\/a>. The applicability of such a theory, reminiscent of the additive decomposition of strains Lee (<a href=\"#cite-EL69\">1969<\/a>); Efrati <em>et al.<\/em> (<a href=\"#cite-ESK13\">2013<\/a>), to growing and deforming tissue remains to shown.<\/p>", "hash": "95d3b5f9c0c0", "gist": {"html": "Letting the rest metric evolve could give a covariant theory of growth and plasticity, not yet tested.", "status": "ai-draft"}}], "fold": true, "gist": {"html": "Relaxation does stabilize states reached from rest; instabilities need acquired stability and a curved set of admissible shapes.", "status": "ai-draft"}, "brief": {"html": "<p><span data-covers=\"section-V-p1\">The naive intuition is right for states reached abruptly from rest: relaxation neither destabilizes nor moves them.<\/span> <span data-covers=\"section-V-p2\">When the reference metric does not evolve only towards the current shape, the body creeps and may turn unstable.<\/span> <span data-covers=\"section-V-p2 sec-transient_stability_loss-p3\">Only acquired stability can be lost, and it must be unless the shape is a rest extremal.<\/span> <span data-covers=\"section-V-p3\">They also need a curved set of admissible states, which a single spring lacks; in continua relaxation can leave residual stress.<\/span> <span data-covers=\"section-V-p4\">An evolving rest metric could describe growth or plasticity, which remains to be shown.<\/span><\/p>", "status": "ai-draft"}}, {"id": "acknowledgments", "kind": "section", "title": "Acknowledgments", "titleHtml": "Acknowledgments", "children": [{"id": "acknowledgments-p1", "kind": "paragraph", "body": "<p>The authors would like to thank D. Biron, G. Cohen, A. Grosberg, S.M. Rubinstein, E. Sharon, Y. Bar-Sinai and D. Vella for helpful discussions, as well as acknowledge the Aspen Center for Physics, which is supported by National Science Foundation grant PHY-1607761, for hosting many of these discussions.<\/p>", "hash": "777d19287806"}]}, {"id": "app-1d_sls_systems", "kind": "section", "title": "1D SLS truss and rest state stationarity", "titleHtml": "1D SLS truss and rest state stationarity", "children": [{"id": "app-1d_sls_systems-p1", "kind": "paragraph", "body": "<p>Here we examine an explicitly solvable discrete system that is more complex than the three spring truss. This system is composed of a point mass <mjx-container data-tex=\"m\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.986ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"1.986ex\" height=\"1.025ex\" viewBox=\"0 -442 878 453\"><g transform=\"scale(1,-1)\"><use data-c=\"1D45A\" href=\"#MJX-TEX-I-1D45A\"><\/use><\/g><\/svg><\/mjx-container>, free to move along the <mjx-container data-tex=\"\\hat z\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.052ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"1.052ex\" height=\"1.857ex\" viewBox=\"0 -810 465 821\"><g transform=\"scale(1,-1)\"><g><g><g><use data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><g transform=\"translate(288.1,16) translate(-250 0)\"><use data-c=\"5E\" href=\"#MJX-TEX-N-5E\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> axis whose position we denote <mjx-container data-tex=\"z(t)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.629ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"3.629ex\" height=\"2.262ex\" viewBox=\"0 -750 1604 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><use x=\"465\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"854\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"1215\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>. The mass is connected through SLS’s to <mjx-container data-tex=\"N\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.009ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"2.009ex\" height=\"1.545ex\" viewBox=\"0 -683 888 683\"><g transform=\"scale(1,-1)\"><use data-c=\"1D441\" href=\"#MJX-TEX-I-1D441\"><\/use><\/g><\/svg><\/mjx-container> pinned positions in the 2D space <mjx-container data-tex=\"(x_i,z_i)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.592ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"6.592ex\" height=\"2.262ex\" viewBox=\"0 -750 2913.6 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><g transform=\"translate(389)\"><use data-c=\"1D465\" href=\"#MJX-TEX-I-1D465\"><\/use><g transform=\"translate(605,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><use x=\"1288\" data-c=\"2C\" href=\"#MJX-TEX-N-2C\"><\/use><g transform=\"translate(1732.6)\"><use data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><g transform=\"translate(498,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><use x=\"2524.6\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>. All the SLS’s share the same <mjx-container data-tex=\"\\b,\\tau\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.456ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"3.456ex\" height=\"2.034ex\" viewBox=\"0 -705 1527.7 899\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"566\" data-c=\"2C\" href=\"#MJX-TEX-N-2C\"><\/use><use x=\"1010.7\" data-c=\"1D70F\" href=\"#MJX-TEX-I-1D70F\"><\/use><\/g><\/g><\/svg><\/mjx-container> but may differ in their stiffnesses <mjx-container data-tex=\"k_i\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.918ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.357ex;\" width=\"1.918ex\" height=\"1.927ex\" viewBox=\"0 -694 848 851.8\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><g transform=\"translate(554,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. This choice is well justified when considering large structures, or composite materials, made of many identical SLS’s. The compositions of identical SLS’s (in parallel or in series) leave <mjx-container data-tex=\"\\b\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.281ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.281ex\" height=\"2.034ex\" viewBox=\"0 -705 566 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/svg><\/mjx-container> and <mjx-container data-tex=\"\\tau\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.17ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.029ex;\" width=\"1.17ex\" height=\"1.005ex\" viewBox=\"0 -431 517 444\"><g transform=\"scale(1,-1)\"><use data-c=\"1D70F\" href=\"#MJX-TEX-I-1D70F\"><\/use><\/g><\/svg><\/mjx-container> unchanged. Thus the effective description of an SLS structure can assign different stiffnesses to distinct modes of deformations, but take <mjx-container data-tex=\"\\b\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.281ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.281ex\" height=\"2.034ex\" viewBox=\"0 -705 566 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/svg><\/mjx-container> and <mjx-container data-tex=\"\\tau\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.17ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.029ex;\" width=\"1.17ex\" height=\"1.005ex\" viewBox=\"0 -431 517 444\"><g transform=\"scale(1,-1)\"><use data-c=\"1D70F\" href=\"#MJX-TEX-I-1D70F\"><\/use><\/g><\/svg><\/mjx-container> as intrinsic material properties. The length on each of the SLS’s is denoted <mjx-container data-tex=\"L_i = \\sqrt{x_i^2 + (z_i-z)^2}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:21.01ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -1.292ex;\" width=\"21.01ex\" height=\"4.208ex\" viewBox=\"0 -1289 9286.5 1860\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(714,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><use x=\"1285.7\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2341.5)\"><g transform=\"translate(1020)\"><g><use data-c=\"1D465\" href=\"#MJX-TEX-I-1D465\"><\/use><g transform=\"translate(605,353.6) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><g transform=\"translate(605,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><use x=\"1230.8\" data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><use x=\"2231\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><g transform=\"translate(2620)\"><use data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><g transform=\"translate(498,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><use x=\"3634.2\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"4634.4\" data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><g transform=\"translate(5099.4)\"><use data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><g transform=\"translate(422,289) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/g><use x=\"0\" y=\"79\" data-c=\"221A\" href=\"#MJX-TEX-LO-221A\"><\/use><rect width=\"5924.9\" height=\"60\" x=\"1020\" y=\"1169\"><\/rect><\/g><\/g><\/g><\/svg><\/mjx-container>, and the <a data-def=\"reference-length\">reference length<\/a> and <a data-def=\"rest-length\">rest length<\/a> of each SLS is denoted <mjx-container data-tex=\"\\bar L_i\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.28ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.357ex;\" width=\"2.28ex\" height=\"2.47ex\" viewBox=\"0 -934 1008 1091.8\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(714,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> and <mjx-container data-tex=\"\\bar L^0_i\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.528ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.682ex;\" width=\"2.528ex\" height=\"2.795ex\" viewBox=\"0 -934 1117.6 1235.6\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(714,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(714,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> respectively.<\/p>", "hash": "4178b775568b", "gist": {"html": "Sets up a mass on a line tied by SLS elements, sharing <mjx-container data-tex=\"\\beta\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.281ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.281ex\" height=\"2.034ex\" viewBox=\"0 -705 566 899\"><g transform=\"scale(1,-1)\"><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><\/g><\/svg><\/mjx-container> and <mjx-container data-tex=\"\\tau\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.17ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.029ex;\" width=\"1.17ex\" height=\"1.005ex\" viewBox=\"0 -431 517 444\"><g transform=\"scale(1,-1)\"><use data-c=\"1D70F\" href=\"#MJX-TEX-I-1D70F\"><\/use><\/g><\/svg><\/mjx-container>, to fixed points.", "status": "ai-draft"}}, {"id": "app-1d_sls_systems-p2", "kind": "paragraph", "body": "<p>We assume a temporal scale separation between the fast elastic time-scale and the slow viscoelastic time shared by all the springs, and that no external time scale enters the problem. We may thus reduce the problem to studying the quasi static evolution of the system in which every configuration the system assumes minimizes the <a data-def=\"instantaneous-energy\">instantaneous elastic energy<\/a> that in turn depends on the slowly evolving <a data-def=\"reference-length\">reference lengths<\/a> <mjx-container data-tex=\"\\bar L_i\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.28ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.357ex;\" width=\"2.28ex\" height=\"2.47ex\" viewBox=\"0 -934 1008 1091.8\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(714,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>,<\/p>\n<div class=\"display\"><div class=\"eqbody\"><mjx-container data-tex=\"E(z) = \\sum_{i=1}^N \\frac{1}{2} k_i \\left(L_i-\\bar L_i\\right)^2.\" class=\"MathJax\" jax=\"SVG\" display=\"true\" style= 56\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> change in time and, as in the case of the <a data-def=\"von-mises-truss\">Von-Mises truss<\/a>, could change the shape of the instantaneous elastic energy. For example they could cause an unstable state to become stable through viscoelastic relaxation. Such states with <a data-def=\"acquired-stability\">acquired stability<\/a> in viscoelastic systems were first identified in the context of <a data-def=\"creep\">creep<\/a> buckling Hoff (<a href=\"#cite-NH56\">1956<\/a>); Hayman (<a href=\"#cite-BH78\">1978<\/a>), and revisited recently where this phenomenon was termed <dfn data-def=\"temporary-bistability\">temporary bistability<\/dfn> Santer (<a href=\"#cite-MS10\">2010<\/a>) or pseudo bistability Brinkmeyer <em>et al.<\/em> (<a href=\"#cite-BSP12\">2012<\/a>), as these states were observed numerically to always lose their stability.<\/p>", "hash": "e88b3b5a2542", "gist": {"html": "Quasi-statically the force vanishes; acquired stability, known from creep buckling, was always lost in simulations.", "status": "ai-draft"}}, {"id": "app-1d_sls_systems-p3", "kind": "paragraph", "body": "<p>In order to analyze the dynamic of the system, we differentiate the force Eq. <a href=\"#eq-sls_1d_force\">(A.2)<\/a> in time, and use Eq. <a href=\"#eq-sls_L_bar_DE\">(4)<\/a>:<\/p>\n<div class=\"display multi\"><div class=\"eqbody\"><mjx-container data-tex=\"\\begin{align*}\n\t \t\t\\frac{d^2 E}{dz^2} \\dot z &amp; = \\sum_{i=1}^N k_i \\frac{dL_i}{dz} \\dot {\\bar L}_i \n\t \t\t&amp; = \\frac{1}{\\tau} \\sum_{i=1}^N k_i \\frac{dL_i}{dz} \n\t \t\t\\left( L_i - \\bar L_i - (1-\\b)\\left(L_i-\\bar L_i ^0\\right)\\right) \n\t \t\\end{align*}\" class=\"MathJax\" jax=\"SVG\" display=\"true\" style=\"--w:71.736ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -2.804ex;\" width=\"71.736ex\" height=\"6.74ex\" viewBox=\"0 -1739.4 31707.3 2978.9\"><g transform=\"scale(1,-1)\"> mjx-container data-tex=\"z\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.052ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"1.052ex\" height=\"1.025ex\" viewBox=\"0 -442 465 453\"><g transform=\"scale(1,-1)\"><use data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><\/g><\/svg><\/mjx-container>, with respect to <a data-def=\"reference-length\">reference lengths<\/a> that equal the <a data-def=\"rest-length\">rest lengths<\/a>, <mjx-container data-tex=\"\\bar L_i = \\bar L_i^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.826ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.682ex;\" width=\"7.826ex\" height=\"2.795ex\" viewBox=\"0 -934 3459.1 1235.6\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(714,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><use x=\"1285.7\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2341.5)\"><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(714,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(714,-293.8) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. We thus obtained that when the point mass is in a convex region of the potential (<mjx-container data-tex=\"\\frac{d^2 E}{dz^2}&gt;0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.896ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.871ex;\" width=\"7.896ex\" height=\"3.097ex\" viewBox=\"0 -983.7 3490.2 1368.8\"><g transform=\"scale(1,-1)\"><g><g><g transform=\"translate(220,394) scale(0.707)\"><g><use data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><g transform=\"translate(553,363) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><use x=\"956.6\" data-c=\"1D438\" href=\"#MJX-TEX-I-1D438\"><\/use><\/g><g transform=\"translate(325.7,-377.4) scale(0.707)\"><use data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><g transform=\"translate(520)\"><use data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><g transform=\"translate(498,289) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/g><rect width=\"1416.6\" height=\"60\" x=\"120\" y=\"220\"><\/rect><\/g><use x=\"1934.4\" data-c=\"3E\" href=\"#MJX-TEX-N-3E\"><\/use><use x=\"2990.2\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container>), <mjx-container data-tex=\"z\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.052ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"1.052ex\" height=\"1.025ex\" viewBox=\"0 -442 465 453\"><g transform=\"scale(1,-1)\"><use data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><\/g><\/svg><\/mjx-container> changes continuously and the sign of <mjx-container data-tex=\"\\dot z\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.052ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"1.052ex\" height=\"1.76ex\" viewBox=\"0 -767 465 778\"><g transform=\"scale(1,-1)\"><g><g><g><use data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><g transform=\"translate(288.1,-2) translate(-250 0)\"><use data-c=\"2D9\" href=\"#MJX-TEX-N-2D9\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> remains the same as the sign of the force in the <a data-def=\"rest-elastic-system\">rest elastic system<\/a> <mjx-container data-tex=\"F^0(z)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.62ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"5.62ex\" height=\"2.452ex\" viewBox=\"0 -833.9 2483.9 1083.9\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D439\" href=\"#MJX-TEX-I-1D439\"><\/use><g transform=\"translate(837.3,363) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><use x=\"1240.9\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1629.9\" data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><use x=\"2094.9\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>. When the second derivative vanishes <mjx-container data-tex=\"\\frac{d^2 E}{dz^2}=0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.896ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.871ex;\" width=\"7.896ex\" height=\"3.097ex\" viewBox=\"0 -983.7 3490.2 1368.8\"><g transform=\"scale(1,-1)\"><g><g><g transform=\"translate(220,394) scale(0.707)\"><g><use data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><g transform=\"translate(553,363) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><use x=\"956.6\" data-c=\"1D438\" href=\"#MJX-TEX-I-1D438\"><\/use><\/g><g transform=\"translate(325.7,-377.4) scale(0.707)\"><use data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><g transform=\"translate(520)\"><use data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><g transform=\"translate(498,289) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/g><rect width=\"1416.6\" height=\"60\" x=\"120\" y=\"220\"><\/rect><\/g><use x=\"1934.4\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"2990.2\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container> the system loses its <a data-def=\"transient-stability\">transient elastic stability<\/a>, and snaps to another stable point.<\/p>", "hash": "51bd2d3eab51", "gist": {"html": "While stable, the mass creeps in the direction of the rest system's force; it snaps when stiffness vanishes.", "status": "ai-draft"}}, {"id": "app-1d_sls_systems-p4", "kind": "paragraph", "body": "<p>Immediate result of Eq. <a href=\"#eq-sls_1d_quasistatic_dynamic\">(A.3)<\/a> is that <a data-def=\"stationary-state\">stationary states<\/a> of Eqs. <a href=\"#eq-sls_1d_quasistatic_dynamic\">(A.3)<\/a> and <a href=\"#eq-sls_L_bar_DE\">(4)<\/a> are all <a data-def=\"extremal\">extremal<\/a> points of the <a data-def=\"rest-elastic-system\">rest elastic system<\/a>’s potential. That is assuming both <mjx-container data-tex=\"\\dot z =0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.2ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"5.2ex\" height=\"1.921ex\" viewBox=\"0 -767 2298.6 849\"><g transform=\"scale(1,-1)\"><g><g><g><use data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><g transform=\"translate(288.1,-2) translate(-250 0)\"><use data-c=\"2D9\" href=\"#MJX-TEX-N-2D9\"><\/use><\/g><\/g><\/g><use x=\"742.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1798.6\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container> and <mjx-container data-tex=\"\\dot{\\bar L}_i=0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.429ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.357ex;\" width=\"6.429ex\" height=\"2.968ex\" viewBox=\"0 -1154 2841.5 1311.8\"><g transform=\"scale(1,-1)\"><g><g><g><g><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(368.3,385) translate(-250 0)\"><use data-c=\"2D9\" href=\"#MJX-TEX-N-2D9\"><\/use><\/g><\/g><\/g><g transform=\"translate(714,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><use x=\"1285.7\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"2341.5\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container> implies <mjx-container data-tex=\"F^0(z)=0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:9.768ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"9.768ex\" height=\"2.452ex\" viewBox=\"0 -833.9 4317.4 1083.9\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D439\" href=\"#MJX-TEX-I-1D439\"><\/use><g transform=\"translate(837.3,363) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><use x=\"1240.9\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1629.9\" data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><use x=\"2094.9\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"2761.6\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"3817.4\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container>. This result agrees with the phenomenology of the <a data-def=\"von-mises-truss\">von-Mises truss<\/a> described above. Both the unstable and the finitely stable cases eventually result in the original position - stable point of the rest elastic system. The stable phase satisfy the claim trivially, by staying stable from the very rest. We have thus also shown that in general, any <a data-def=\"acquired-stability\">acquired stability<\/a> (initially non extremal point that has become stable), will eventually result in a snap <sup class=\"fnref\"><a href=\"#fn2\" id=\"fnref2\">2<\/a><\/sup>.<\/p>", "hash": "96f22e94c51e", "gist": {"html": "Stationary states are rest-system extremals, so acquired stability at a non-extremal point ends in a snap.", "status": "ai-draft"}}, {"id": "app-1d_sls_systems-p5", "kind": "paragraph", "body": "<p>The sign of <mjx-container data-tex=\"\\dot z\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.052ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"1.052ex\" height=\"1.76ex\" viewBox=\"0 -767 465 778\"><g transform=\"scale(1,-1)\"><g><g><g><use data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><g transform=\"translate(288.1,-2) translate(-250 0)\"><use data-c=\"2D9\" href=\"#MJX-TEX-N-2D9\"><\/use><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> in Eq. <a href=\"#eq-sls_1d_quasistatic_dynamic\">(A.3)<\/a> is independent of the <a data-def=\"reference-length\">reference lengths<\/a>. Thus, mass left on a stable point of the <a data-def=\"rest-elastic-system\">rest elastic system<\/a> <mjx-container data-tex=\"F^0(z)=0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:9.768ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"9.768ex\" height=\"2.452ex\" viewBox=\"0 -833.9 4317.4 1083.9\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D439\" href=\"#MJX-TEX-I-1D439\"><\/use><g transform=\"translate(837.3,363) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><use x=\"1240.9\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1629.9\" data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><use x=\"2094.9\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"2761.6\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"3817.4\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container> will remain static, although all the reference length <mjx-container data-tex=\"\\bar L_i\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.28ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.357ex;\" width=\"2.28ex\" height=\"2.47ex\" viewBox=\"0 -934 1008 1091.8\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(714,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> will continue to change. Intuitively, this phenomenon occurs because the relaxation takes the same force fraction of each SLS over time, preserving the vanishing total force on the point mass. One only need to check whether <mjx-container data-tex=\"\\frac{d^2 E(t)}{dz^2}&gt;0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:9.718ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.871ex;\" width=\"9.718ex\" height=\"3.375ex\" viewBox=\"0 -1106.5 4295.6 1491.6\"><g transform=\"scale(1,-1)\"><g><g><g transform=\"translate(220,516.8) scale(0.707)\"><g><use data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><g transform=\"translate(553,363) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><use x=\"956.6\" data-c=\"1D438\" href=\"#MJX-TEX-I-1D438\"><\/use><use x=\"1720.6\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"2109.6\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"2470.6\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><g transform=\"translate(728.4,-377.4) scale(0.707)\"><use data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><g transform=\"translate(520)\"><use data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><g transform=\"translate(498,289) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/g><rect width=\"2222\" height=\"60\" x=\"120\" y=\"220\"><\/rect><\/g><use x=\"2739.8\" data-c=\"3E\" href=\"#MJX-TEX-N-3E\"><\/use><use x=\"3795.6\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container> during the relaxation. The second derivative reads<\/p>\n<div class=\"display\"><div class=\"eqbody\"><mjx-container data-tex=\"\\frac{d^2 E(t)}{dz^2} = \\sum_{i=1}^N k_i \\frac{d^2L_i}{dz^2} \\left(L_i-\\bar L_i(t)\\right) + \\sum_{i=1}^N k_i \\left(\\frac{dL_i}{dz}\\right)^2\" class=\"MathJax\" jax=\"SVG\" display=\"true\" style=\"--w:51.188ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -2.819ex;\" width=\"51.188ex\" height=\"6.74ex\" viewBox=\"0 -1733 22625.1 2978.9\"><g transform=\"scale(1,-1)\"><g><g><g transform=\"translate(220,710)\"><g><use data-c=\"1D451\" href=\"#MJX /use><g transform=\"translate(520)\"><use data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><g transform=\"translate(498,289) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/g><rect width=\"2164.5\" height=\"60\" x=\"120\" y=\"220\"><\/rect><\/g><g transform=\"translate(9496.2)\"><g transform=\"translate(0 -0.5)\"><use data-c=\"28\" href=\"#MJX-TEX-LO-28\"><\/use><\/g><g transform=\"translate(597)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(714,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><use x=\"1827.2\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><g transform=\"translate(2827.4)\"><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(714,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><use x=\"3835.3\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"4224.3\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"4585.3\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><g transform=\"translate(4974.3,0) translate(0 -0.5)\"><use data-c=\"29\" href=\"#MJX-TEX-LO-29\"><\/use><\/g><\/g><use x=\"15289.8\" data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><g transform=\"translate(16290)\"><use data-c=\"2211\" href=\"#MJX-TEX-LO-2211\"><\/use><g transform=\"translate(148.2,-1087.9) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><use x=\"345\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1123\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><g transform=\"translate(408,1150) scale(0.707)\"><use data-c=\"1D441\" href=\"#MJX-TEX-I-1D441\"><\/use><\/g><\/g><g transform=\"translate(17900.7)\"><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><g transform=\"translate(554,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><g transform=\"translate(18748.6)\"><g><g transform=\"translate(0 -0.5)\"><use data-c=\"28\" href=\"#MJX-TEX-S3-28\"><\/use><\/g><g transform=\"translate(736)\"><g transform=\"translate(220,676)\"><use data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><g transform=\"translate(520)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(714,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><\/g><g transform=\"translate(491.5,-686)\"><use data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><use x=\"520\" data-c=\"1D467\" href=\"#MJX-TEX-I-1D467\"><\/use><\/g><rect width=\"1728\" height=\"60\" x=\"120\" y=\"220\"><\/rect><\/g><g transform=\"translate(2704,0) translate(0 -0.5)\"><use data-c=\"29\" href=\"#MJX-TEX-S3-29\"><\/use><\/g><\/g><g transform=\"translate(3473,1176.6) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container><\/div><span class=\"eqno\">(A.4)<\/span><\/div>\n<p class=\"cont\">Assuming the point to be at rest <mjx-container data-tex=\"\\bar L_i = \\bar L_i^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.826ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.682ex;\" width=\"7.826ex\" height=\"2.795ex\" viewBox=\"0 -934 3459.1 1235.6\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(714,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><use x=\"1285.7\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2341.5)\"><g><g><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><g transform=\"translate(368.3,244) translate(-250 0)\"><use data-c=\"AF\" href=\"#MJX-TEX-N-AF\"><\/use><\/g><\/g><\/g><g transform=\"translate(714,369.2) scale(0.707)\"><use data-
