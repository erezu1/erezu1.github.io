rtical-align: -0.05ex;\" width=\"1.801ex\" height=\"1.645ex\" viewBox=\"0 -705 796 727\"><g transform=\"scale(1,-1)\"><use data-c=\"4F\" href=\"#MJX-TEX-C-4F\"><\/use><\/g><\/svg><\/mjx-container> in <mjx-container data-tex=\"\\mathcal{Q}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.848ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.296ex;\" width=\"1.848ex\" height=\"1.891ex\" viewBox=\"0 -705 817 836\"><g transform=\"scale(1,-1)\"><use data-c=\"51\" href=\"#MJX-TEX-C-51\"><\/use><\/g><\/svg><\/mjx-container>, and <mjx-container data-tex=\"J_{i_1...i_q}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.233ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.799ex;\" width=\"5.233ex\" height=\"2.344ex\" viewBox=\"0 -683 2313 1036.1\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><g transform=\"translate(588,-150) scale(0.707)\"><g><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><g transform=\"translate(378,-150) scale(0.707)\"><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><use x=\"781.6\" data-c=\"2E\" href=\"#MJX-TEX-N-2E\"><\/use><use x=\"1059.6\" data-c=\"2E\" href=\"#MJX-TEX-N-2E\"><\/use><use x=\"1337.6\" data-c=\"2E\" href=\"#MJX-TEX-N-2E\"><\/use><g transform=\"translate(1615.6)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><g transform=\"translate(378,-150) scale(0.707)\"><use data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><\/g><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> are Gaussian random variables with variance<\/p>\n<div class=\"display\"><div class=\"eqbody\"><mjx-container data-tex=\"\\langle J_{i_1...i_q}^2\\rangle= \\frac{J^2(q-1)!}{N^{q-1}}\\;.\" class=\"MathJax\" jax=\"SVG\" display=\"true\" style=\"--w:22.132ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -1.629ex;\" width=\"22.132ex\" height=\"5.122ex\" viewBox=\"0 -1543.9 9782.5 2263.9\"><g transform=\"scale(1,-1)\"><g><use data-c=\"27E8\" href=\"#MJX-TEX-N-27E8\"><\/use><g transform=\"translate(389)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><g transform=\"translate(719.9,413) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><g transform=\"translate(588,-247) scale(0.707)\"><g><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><g transform=\"translate(378,-150) scale(0.707)\"><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><use x=\"781.6\" data-c=\"2E\" href=\"#MJX-TEX-N-2E\"><\/use><use x=\"1059.6\" data-c=\"2E\" href=\"#MJX-TEX-N-2E\"><\/use><use x=\"1337.6\" data-c=\"2E\" href=\"#MJX-TEX-N-2E\"><\/use><g transform=\"translate(1615.6)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><g transform=\"translate(378,-150) scale(0.707)\"><use data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><\/g><\/g><\/g><\/g><use x=\"2702\" data-c=\"27E9\" href=\"#MJX-TEX-N-27E9\"><\/use><use x=\"3368.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(4424.6)\"><g transform=\"translate(220,710)\"><g><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><g transform=\"translate(719.9,363) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><use x=\"1123.5\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1512.5\" data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><use x=\"2194.7\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"3194.9\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"3694.9\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"4083.9\" data-c=\"21\" href=\"#MJX-TEX-N-21\"><\/use><\/g><g transform=\"translate(1273.8,-719.9)\"><use data-c=\"1D441\" href=\"#MJX-TEX-I-1D441\"><\/use><g transform=\"translate(975.3,289) scale(0.707)\"><use data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><use x=\"460\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"1238\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><rect width=\"4561.9\" height=\"60\" x=\"120\" y=\"220\"><\/rect><\/g><g transform=\"translate(9226.5)\"><g><\/g><\/g><use x=\"9504.5\" data-c=\"2E\" href=\"#MJX-TEX-N-2E\"><\/use><\/g><\/g><\/svg><\/mjx-container><\/div><span class=\"eqno\">(2)<\/span><\/div>\n<p class=\"cont\">In the case where <mjx-container data-tex=\"\\mathcal{Q}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.848ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.296ex;\" width=\"1.848ex\" height=\"1.891ex\" viewBox=\"0 -705 817 836\"><g transform=\"scale(1,-1)\"><use data-c=\"51\" href=\"#MJX-TEX-C-51\"><\/use><\/g><\/svg><\/mjx-container> is a CFT, we will take <mjx-container data-tex=\"\\mathcal{O}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.801ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.801ex\" height=\"1.645ex\" viewBox=\"0 -705 796 727\"><g transform=\"scale(1,-1)\"><use data-c=\"4F\" href=\"#MJX-TEX-C-4F\"><\/use><\/g><\/svg><\/mjx-container> to be a primary operator of this <a data-def=\"core\">core CFT<\/a>, and equation <a href=\"#eq-disordered_CFTs\">(1)<\/a> should be interpreted in <dfn data-def=\"cpt\">conformal perturbation theory<\/dfn> in <mjx-container data-tex=\"J\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.432ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.432ex\" height=\"1.595ex\" viewBox=\"0 -683 633 705\"><g transform=\"scale(1,-1)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><\/g><\/svg><\/mjx-container>. We call such theories <dfn data-def=\"disordered-cft\">disordered CFTs<\/dfn>; the simplest example of this setup is the <a data-def=\"syk\">SYK model<\/a> itself, as a disordered free fermion theory.<\/p>", "hash": "9d390d62f893", "gist": {"html": "Defines disordered CFTs: copies of a core CFT coupled by a Gaussian random product of <mjx-container data-tex=\"q\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.041ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.041ex\" height=\"1.439ex\" viewBox=\"0 -442 460 636\"><g transform=\"scale(1,-1)\"><use data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><\/g><\/svg><\/mjx-container> primaries.", "status": "ai-draft"}}, {"id": "introduction-p4", "kind": "paragraph", "body": "<p>We will first derive self-consistency equations for the two- and four-point functions of <mjx-container data-tex=\"\\mathcal{O}_i\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.541ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.357ex;\" width=\"2.541ex\" height=\"1.952ex\" viewBox=\"0 -705 1123 862.8\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"4F\" href=\"#MJX-TEX-C-4F\"><\/use><g transform=\"translate(829,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> at leading order in <mjx-container data-tex=\"1/N\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.271ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"4.271ex\" height=\"2.262ex\" viewBox=\"0 -750 1888 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"500\" data-c=\"2F\" href=\"#MJX-TEX-N-2F\"><\/use><use x=\"1000\" data-c=\"1D441\" href=\"#MJX-TEX-I-1D441\"><\/use><\/g><\/g><\/svg><\/mjx-container> for general <a data-def=\"disordered-cft\">disordered CFTs<\/a>. These extend known results for disordered free theories like the <a data-def=\"syk\">SYK model<\/a> Maldacena and Stanford (<a href=\"#cite-Maldacena-2016hyu\">2016<\/a>); Kitaev and Suh (<a href=\"#cite-Kitaev-2017awl\">2018<\/a>)), and for spin systems Bray and Moore (<a href=\"#cite-BrayMoore\">1980<\/a>). We will also discuss similar results for the <a data-def=\"double-commutator\">double-commutator<\/a> (defined in <a href=\"#eq-double_comm\">(7)<\/a> below). Although these self-consistency equations are complicated, they are tractable in perturbation theory in <mjx-container data-tex=\"J\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.432ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.432ex\" height=\"1.595ex\" viewBox=\"0 -683 633 705\"><g transform=\"scale(1,-1)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><\/g><\/svg><\/mjx-container> and allow us to establish the existence of a <dfn data-def=\"kernel-structure\">kernel structure<\/dfn> from which we can extract the <a data-def=\"chaos-exponent\">chaos exponent<\/a> <mjx-container data-tex=\"\\lambda_L\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.596ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.339ex;\" width=\"2.596ex\" height=\"1.91ex\" viewBox=\"0 -694 1147.5 844\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,-150) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, which is the rate of growth of a double commutator. The latter is given by the fastest growing eigenvector (with eigenvalue 1) of a specific integral kernel <mjx-container data-tex=\"K_R\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.323ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.373ex;\" width=\"3.323ex\" height=\"1.918ex\" viewBox=\"0 -683 1468.7 847.8\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D43E\" href=\"#MJX-TEX-I-1D43E\"><\/use><g transform=\"translate(882,-150) scale(0.707)\"><use data-c=\"1D445\" href=\"#MJX-TEX-I-1D445\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> (see equation <a href=\"#eq-double_commutator_kernel\">(9)<\/a>), as long as this rate of growth is indeed positive Kitaev (<a href=\"#cite-KitaevTalk2\">2015<\/a>); Kitaev (<a href=\"#cite-KitaevTalk\">2015<\/a>); Larkin and Ovchinnikov (<a href=\"#cite-Larkin1969QuasiclassicalMI\">1969<\/a>). We will denote by <mjx-container data-tex=\"\\lambda_L^{\\text{ker}}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.689ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.696ex;\" width=\"3.689ex\" height=\"2.628ex\" viewBox=\"0 -853.7 1630.5 1161.5\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,363) scale(0.707)\"><g><use data-c=\"6B\" href=\"#MJX-TEX-N-6B\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(528)\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(972)\"><\/use><\/g><\/g><g transform=\"translate(616,-307.7) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> the <dfn data-def=\"putative\">putative chaos exponent<\/dfn> read from the diagonalization <mjx-container data-tex=\"K_R\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.323ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.373ex;\" width=\"3.323ex\" height=\"1.918ex\" viewBox=\"0 -683 1468.7 847.8\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D43E\" href=\"#MJX-TEX-I-1D43E\"><\/use><g transform=\"translate(882,-150) scale(0.707)\"><use data-c=\"1D445\" href=\"#MJX-TEX-I-1D445\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>.<\/p>", "hash": "eaf3e02b8032", "gist": {"html": "Large-<mjx-container data-tex=\"N\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.009ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"2.009ex\" height=\"1.545ex\" viewBox=\"0 -683 888 683\"><g transform=\"scale(1,-1)\"><use data-c=\"1D441\" href=\"#MJX-TEX-I-1D441\"><\/use><\/g><\/svg><\/mjx-container> equations give a kernel whose eigenvalue-one mode yields a putative exponent <mjx-container data-tex=\"\\lambda_L^{\\text{ker}}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.689ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.696ex;\" width=\"3.689ex\" height=\"2.628ex\" viewBox=\"0 -853.7 1630.5 1161.5\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,363) scale(0.707)\"><g><use data-c=\"6B\" href=\"#MJX-TEX-N-6B\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(528)\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(972)\"><\/use><\/g><\/g><g transform=\"translate(616,-307.7) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>.", "status": "ai-draft"}}, {"id": "fig-discontinuouschaos", "kind": "figure", "title": "Figure 1", "body": "<figure class=\"float figure\" id=\"fig-discontinuouschaos\"><p><img src=\"img/10e199e5ef56ad85.jpg\" width=\"731\" height=\"297\" loading=\"lazy\" decoding=\"async\" alt=\"\" style=\"width:80%\"><\/p><figcaption><span class=\"capname\">Figure 1.<\/span> The behaviors we find for the <a data-def=\"chaos-exponent\">chaos exponent<\/a> as a function of an <a data-def=\"exactly-marginal\">exactly marginal<\/a> disorder deformation <mjx-container data-tex=\"J\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.432ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.432ex\" height=\"1.595ex\" viewBox=\"0 -683 633 705\"><g transform=\"scale(1,-1)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><\/g><\/svg><\/mjx-container>: (a) continuous and (b) discontinuous. <mjx-container data-tex=\"\\lambda_L^{\\text{ker}}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.689ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.696ex;\" width=\"3.689ex\" height=\"2.628ex\" viewBox=\"0 -853.7 1630.5 1161.5\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,363) scale(0.707)\"><g><use data-c=\"6B\" href=\"#MJX-TEX-N-6B\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(528)\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(972)\"><\/use><\/g><\/g><g transform=\"translate(616,-307.7) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> corresponds to the dashed line and <mjx-container data-tex=\"\\lambda_L\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.596ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.339ex;\" width=\"2.596ex\" height=\"1.91ex\" viewBox=\"0 -694 1147.5 844\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,-150) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> to the solid line.<\/figcaption><\/figure>", "hash": "f8c5dca4a81c", "gist": {"html": "The two possible onsets of chaos as <mjx-container data-tex=\"J\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.432ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.432ex\" height=\"1.595ex\" viewBox=\"0 -683 633 705\"><g transform=\"scale(1,-1)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><\/g><\/svg><\/mjx-container> grows: continuous, or discontinuous when <mjx-container data-tex=\"\\lambda_L^{\\text{ker}}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.689ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.696ex;\" width=\"3.689ex\" height=\"2.628ex\" viewBox=\"0 -853.7 1630.5 1161.5\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,363) scale(0.707)\"><g><use data-c=\"6B\" href=\"#MJX-TEX-N-6B\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(528)\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(972)\"><\/use><\/g><\/g><g transform=\"translate(616,-307.7) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> starts negative.", "status": "ai-draft"}}, {"id": "introduction-p5", "kind": "paragraph", "body": "<p>We will be interested in computing the <a data-def=\"chaos-exponent\">chaos exponent<\/a> <mjx-container data-tex=\"\\lambda_L\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.596ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.339ex;\" width=\"2.596ex\" height=\"1.91ex\" viewBox=\"0 -694 1147.5 844\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,-150) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> as a function of <mjx-container data-tex=\"J\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.432ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.432ex\" height=\"1.595ex\" viewBox=\"0 -683 633 705\"><g transform=\"scale(1,-1)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><\/g><\/svg><\/mjx-container>, as it is varied from weak to strong coupling. The diagonalization of <mjx-container data-tex=\"K_R\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.323ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.373ex;\" width=\"3.323ex\" height=\"1.918ex\" viewBox=\"0 -683 1468.7 847.8\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D43E\" href=\"#MJX-TEX-I-1D43E\"><\/use><g transform=\"translate(882,-150) scale(0.707)\"><use data-c=\"1D445\" href=\"#MJX-TEX-I-1D445\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> is a difficult process, which can usually be done only when conformal invariance is restored. Normally, the disorder is a relevant deformation. To compute the chaos one first flow to the IR CFT (which is equivalent to take <mjx-container data-tex=\"J=\\infty\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.712ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"6.712ex\" height=\"1.731ex\" viewBox=\"0 -683 2966.6 765\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><use x=\"910.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1966.6\" data-c=\"221E\" href=\"#MJX-TEX-N-221E\"><\/use><\/g><\/g><\/svg><\/mjx-container>) and find the chaos exponent there Murugan <em>et al.<\/em> (<a href=\"#cite-Murugan-2017eto\">2017<\/a>). In this work we focus on cases where the averaged interacting theory is conformally invariant for all <mjx-container data-tex=\"J\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.432ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.432ex\" height=\"1.595ex\" viewBox=\"0 -683 633 705\"><g transform=\"scale(1,-1)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><\/g><\/svg><\/mjx-container>. This can be done by demanding that the disorder interaction itself be <a data-def=\"exactly-marginal\">exactly marginal<\/a>, in which case the theory is conformally invariant for every realization of the couplings, and the space of <mjx-container data-tex=\"J\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.432ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.432ex\" height=\"1.595ex\" viewBox=\"0 -683 633 705\"><g transform=\"scale(1,-1)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><\/g><\/svg><\/mjx-container>’s forms a <dfn data-def=\"conformal-manifold\">conformal manifold<\/dfn> <sup class=\"fnref\"><a href=\"#fn1\" id=\"fnref1\">1<\/a><\/sup>. The disorder average is then simply a non-uniform average over this conformal manifold, with no RG-related complications (for recent discussions of averages over conformal manifolds see Maloney and Witten (<a href=\"#cite-Maloney-2020nni\">2020<\/a>); Afkhami-Jeddi <em>et al.<\/em> (<a href=\"#cite-Afkhami-Jeddi-2020ezh\">2021<\/a>), and for the marginal case see Berkooz <em>et al.<\/em> (<a href=\"#cite-Berkooz-2017efq\">2017<\/a>)).<\/p>", "hash": "b58028a0ac1c", "gist": {"html": "Exactly marginal disorder keeps the theory conformal at every <mjx-container data-tex=\"J\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.432ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.432ex\" height=\"1.595ex\" viewBox=\"0 -683 633 705\"><g transform=\"scale(1,-1)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><\/g><\/svg><\/mjx-container>, so the average is over a conformal manifold.", "status": "ai-draft"}}, {"id": "bg-marginal", "kind": "background", "title": "Relevant, marginal and exactly marginal couplings", "audience": ["student"], "fold": true, "body": "<p>A CFT in <mjx-container data-tex=\"d\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.176ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.023ex;\" width=\"1.176ex\" height=\"1.593ex\" viewBox=\"0 -694 520 704\"><g transform=\"scale(1,-1)\"><use data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><\/g><\/svg><\/mjx-container> spacetime dimensions deformed by <mjx-container data-tex=\"g\\int d^dx\\,\\mathcal O\" class=\"MathJax\" jax=\"SVG\" style=\"--w:8.882ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.691ex;\" width=\"8.882ex\" height=\"2.623ex\" viewBox=\"0 -853.7 3926 1159.2\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(643.7,0) translate(0 0.5)\"><use data-c=\"222B\" href=\"#MJX-TEX-SO-222B\"><\/use><\/g><g transform=\"translate(1420.3)\"><use data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><g transform=\"translate(553,363) scale(0.707)\"><use data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><\/g><\/g><use x=\"2391\" data-c=\"1D465\" href=\"#MJX-TEX-I-1D465\"><\/use><g transform=\"translate(2963)\"><g><\/g><\/g><use x=\"3130\" data-c=\"4F\" href=\"#MJX-TEX-C-4F\"><\/use><\/g><\/g><\/svg><\/mjx-container>, with <mjx-container data-tex=\"\\mathcal O\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.801ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.801ex\" height=\"1.645ex\" viewBox=\"0 -705 796 727\"><g transform=\"scale(1,-1)\"><use data-c=\"4F\" href=\"#MJX-TEX-C-4F\"><\/use><\/g><\/svg><\/mjx-container> of dimension <mjx-container data-tex=\"\\Delta\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.885ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"1.885ex\" height=\"1.62ex\" viewBox=\"0 -716 833 716\"><g transform=\"scale(1,-1)\"><use data-c=\"394\" href=\"#MJX-TEX-N-394\"><\/use><\/g><\/svg><\/mjx-container>, gives the coupling <mjx-container data-tex=\"g\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.079ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.464ex;\" width=\"1.079ex\" height=\"1.464ex\" viewBox=\"0 -442 477 647\"><g transform=\"scale(1,-1)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><\/g><\/svg><\/mjx-container> a mass dimension <mjx-container data-tex=\"d-\\Delta\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.827ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"5.827ex\" height=\"1.805ex\" viewBox=\"0 -716 2575.4 798\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><use x=\"742.2\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"1742.4\" data-c=\"394\" href=\"#MJX-TEX-N-394\"><\/use><\/g><\/g><\/svg><\/mjx-container>. If <mjx-container data-tex=\"\\Delta&lt;d\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.078ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.09ex;\" width=\"6.078ex\" height=\"1.71ex\" viewBox=\"0 -716 2686.6 756\"><g transform=\"scale(1,-1)\"><g><use data-c=\"394\" href=\"#MJX-TEX-N-394\"><\/use><use x=\"1110.8\" data-c=\"3C\" href=\"#MJX-TEX-N-3C\"><\/use><use x=\"2166.6\" data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><\/g><\/g><\/svg><\/mjx-container> the coupling is relevant: it grows towards the infrared and the theory flows to another fixed point. If <mjx-container data-tex=\"\\Delta&gt;d\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.078ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.09ex;\" width=\"6.078ex\" height=\"1.71ex\" viewBox=\"0 -716 2686.6 756\"><g transform=\"scale(1,-1)\"><g><use data-c=\"394\" href=\"#MJX-TEX-N-394\"><\/use><use x=\"1110.8\" data-c=\"3E\" href=\"#MJX-TEX-N-3E\"><\/use><use x=\"2166.6\" data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><\/g><\/g><\/svg><\/mjx-container> it is irrelevant. If <mjx-container data-tex=\"\\Delta=d\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.078ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"6.078ex\" height=\"1.805ex\" viewBox=\"0 -716 2686.6 798\"><g transform=\"scale(1,-1)\"><g><use data-c=\"394\" href=\"#MJX-TEX-N-394\"><\/use><use x=\"1110.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"2166.6\" data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><\/g><\/g><\/svg><\/mjx-container> it is classically marginal, but quantum corrections usually generate a beta function at second order, <mjx-container data-tex=\"\\beta_g\\propto g^2\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.315ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.667ex;\" width=\"7.315ex\" height=\"2.554ex\" viewBox=\"0 -833.9 3233.4 1128.9\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><g transform=\"translate(599,-150) scale(0.707)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><\/g><\/g><use x=\"1264.1\" data-c=\"221D\" href=\"#MJX-TEX-N-221D\"><\/use><g transform=\"translate(2319.8)\"><use data-c=\"1D454\" href=\"#MJX-TEX-I-1D454\"><\/use><g transform=\"translate(510,363) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, set by the operator's three-point function with itself, so it becomes marginally relevant or irrelevant. A coupling whose beta function vanishes to all orders is <a data-def=\"exactly-marginal\">exactly marginal<\/a>, and its values form a <a data-def=\"conformal-manifold\">conformal manifold<\/a> of CFTs. Exact marginality is rare without supersymmetry. In SYK the random coupling is relevant, so its chaos is computed only at the infrared fixed point; the paper chooses exactly marginal random couplings to avoid the flow.<\/p>"}, {"id": "introduction-p6", "kind": "paragraph", "body": "<p>Surprisingly, we will find models where <mjx-container data-tex=\"\\lambda_L^{\\text{ker}}(J)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.881ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.696ex;\" width=\"6.881ex\" height=\"2.628ex\" viewBox=\"0 -853.7 3041.5 1161.5\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,363) scale(0.707)\"><g><use data-c=\"6B\" href=\"#MJX-TEX-N-6B\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(528)\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(972)\"><\/use><\/g><\/g><g transform=\"translate(616,-307.7) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"1630.5\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"2019.5\" data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><use x=\"2652.5\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> is negative at weak coupling. This signals a breakdown of the approximations involved in the computation, and so in this case the true <a data-def=\"chaos-exponent\">chaos exponent<\/a> simply vanishes, <mjx-container data-tex=\"\\lambda_L= 0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.745ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.339ex;\" width=\"6.745ex\" height=\"1.91ex\" viewBox=\"0 -694 2981.1 844\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,-150) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"1425.3\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"2481.1\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container>. In other words, we have<\/p>\n<div class=\"display\"><div class=\"eqbody\"><mjx-container data-tex=\"\\lambda_L=\\max(0,\\lambda_L^{\\text{ker}})\\;.\" class=\"MathJax\" jax=\"SVG\" display=\"true\" style=\"--w:18.668ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.583ex;\" width=\"18.668ex\" height=\"2.628ex\" viewBox=\"0 -903.7 8251.3 1161.5\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,-150) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"1425.3\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2481.1)\"><use data-c=\"6D\" href=\"#MJX-TEX-N-6D\"><\/use><use data-c=\"61\" href=\"#MJX-TEX-N-61\" transform=\"translate(833)\"><\/use><use data-c=\"78\" href=\"#MJX-TEX-N-78\" transform=\"translate(1333)\"><\/use><\/g><use x=\"4342.1\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"4731.1\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><use x=\"5231.1\" data-c=\"2C\" href=\"#MJX-TEX-N-2C\"><\/use><g transform=\"translate(5675.8)\"><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,413) scale(0.707)\"><g><use data-c=\"6B\" href=\"#MJX-TEX-N-6B\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(528)\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(972)\"><\/use><\/g><\/g><g transform=\"translate(616,-257.7) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"7306.3\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><g transform=\"translate(7695.3)\"><g><\/g><\/g><use x=\"7973.3\" data-c=\"2E\" href=\"#MJX-TEX-N-2E\"><\/use><\/g><\/g><\/svg><\/mjx-container><\/div><span class=\"eqno\">(3)<\/span><\/div>\n<p class=\"cont\">As a result, there are two possible behaviors for the onset of chaos: either the theory undergoes a continuous <dfn data-def=\"transition\">transition into chaos<\/dfn> as in figure <a href=\"#fig-discontinuouschaos\">1a<\/a> or a discontinuous transition as in figure <a href=\"#fig-discontinuouschaos\">1b<\/a>, corresponding to whether <mjx-container data-tex=\"\\lambda_L^{\\text{ker}}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.689ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.696ex;\" width=\"3.689ex\" height=\"2.628ex\" viewBox=\"0 -853.7 1630.5 1161.5\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,363) scale(0.707)\"><g><use data-c=\"6B\" href=\"#MJX-TEX-N-6B\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(528)\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(972)\"><\/use><\/g><\/g><g transform=\"translate(616,-307.7) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> is non-negative or negative at small enough <mjx-container data-tex=\"J\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.432ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.432ex\" height=\"1.595ex\" viewBox=\"0 -683 633 705\"><g transform=\"scale(1,-1)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><\/g><\/svg><\/mjx-container> respectively.<sup class=\"fnref\"><a href=\"#fn2\" id=\"fnref2\">2<\/a><\/sup><\/p>", "hash": "757b35880c8e", "gist": {"html": "When <mjx-container data-tex=\"\\lambda_L^{\\text{ker}}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.689ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.696ex;\" width=\"3.689ex\" height=\"2.628ex\" viewBox=\"0 -853.7 1630.5 1161.5\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,363) scale(0.707)\"><g><use data-c=\"6B\" href=\"#MJX-TEX-N-6B\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(528)\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(972)\"><\/use><\/g><\/g><g transform=\"translate(616,-307.7) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> is negative at weak coupling there is no chaos, so the onset can be discontinuous.", "status": "ai-draft"}}, {"id": "introduction-p7", "kind": "paragraph", "body": "<p>The discontinuous <a data-def=\"transition\">transition into chaos<\/a> is a surprising result, and it is tempting to compare it to similar results in classical chaos, the most famous one being the <dfn data-def=\"kam\">KAM theorem<\/dfn>. In order to sharpen the comparison, we also discuss what a single <a data-def=\"core\">core CFT<\/a> should obey in order for the transition into chaos to be discontinuous. Similar works on the onset of quantum chaos include Stanford (<a href=\"#cite-Stanford-2015owe\">2016<\/a>); de Mello Koch <em>et al.<\/em> (<a href=\"#cite-deMelloKoch-2019ywq\">2019<\/a>); Chowdhury and Swingle (<a href=\"#cite-Chowdhury-2017jzb\">2017<\/a>); Steinberg and Swingle (<a href=\"#cite-Steinberg-2019uqb\">2019<\/a>); Maldacena and Stanford (<a href=\"#cite-Maldacena-2016hyu\">2016<\/a>); Peng (<a href=\"#cite-Peng-2018zap\">2018<\/a>), and Lian <em>et al.<\/em> (<a href=\"#cite-Lian-2019axs\">2019<\/a>); Hu and Lian (<a href=\"#cite-Hu-2021hsj\">2021<\/a>) are especially relevant.<\/p>", "hash": "edc33b7243e0", "gist": {"html": "The discontinuous onset invites comparison with the KAM theorem; the paper asks what a core CFT must obey for it.", "status": "ai-draft"}}, {"id": "bg-kam", "kind": "background", "title": "The KAM theorem and the onset of classical chaos", "audience": ["physicist", "student"], "fold": true, "body": "<p>An integrable Hamiltonian system with <mjx-container data-tex=\"n\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.357ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"1.357ex\" height=\"1.025ex\" viewBox=\"0 -442 600 453\"><g transform=\"scale(1,-1)\"><use data-c=\"1D45B\" href=\"#MJX-TEX-I-1D45B\"><\/use><\/g><\/svg><\/mjx-container> degrees of freedom has <mjx-container data-tex=\"n\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.357ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"1.357ex\" height=\"1.025ex\" viewBox=\"0 -442 600 453\"><g transform=\"scale(1,-1)\"><use data-c=\"1D45B\" href=\"#MJX-TEX-I-1D45B\"><\/use><\/g><\/svg><\/mjx-container> conserved quantities in involution, and its motion winds around invariant <mjx-container data-tex=\"n\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.357ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"1.357ex\" height=\"1.025ex\" viewBox=\"0 -442 600 453\"><g transform=\"scale(1,-1)\"><use data-c=\"1D45B\" href=\"#MJX-TEX-I-1D45B\"><\/use><\/g><\/svg><\/mjx-container>-dimensional tori in phase space, quasi-periodically and without chaos. The Kolmogorov–Arnold–Moser (KAM) theorem says what happens when such a system is perturbed by a small, smooth term of strength <mjx-container data-tex=\"\\epsilon\" class=\"MathJax\" jax=\"SVG\" style=\"--w:0.919ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"0.919ex\" height=\"1ex\" viewBox=\"0 -431 406 442\"><g transform=\"scale(1,-1)\"><use data-c=\"1D716\" href=\"#MJX-TEX-I-1D716\"><\/use><\/g><\/svg><\/mjx-container>: tori whose frequencies are sufficiently irrational survive, slightly deformed, and they fill most of phase space, a fraction tending to one as <mjx-container data-tex=\"\\epsilon\\to0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.569ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"5.569ex\" height=\"1.557ex\" viewBox=\"0 -666 2461.6 688\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D716\" href=\"#MJX-TEX-I-1D716\"><\/use><use x=\"683.8\" data-c=\"2192\" href=\"#MJX-TEX-N-2192\"><\/use><use x=\"1961.6\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container>. Chaos appears only in thin layers around destroyed resonant tori, and spreads over phase space only at larger perturbations. Chaos therefore does not take over as soon as integrability is broken; the onset of widespread chaos happens at a finite perturbation. The paper's discontinuous transition, with a quantum <a data-def=\"chaos-exponent\">chaos exponent<\/a> that stays zero up to a finite disorder strength, is what it compares with this classical result.<\/p>"}, {"id": "introduction-p8", "kind": "paragraph", "body": "<p>We will apply our formalism to two classes of examples where the disorder interaction is <a data-def=\"exactly-marginal\">exactly marginal<\/a>. The first class is disordered <dfn data-def=\"gff\">generalized free fields<\/dfn> in <mjx-container data-tex=\"1\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.131ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"1.131ex\" height=\"1.507ex\" viewBox=\"0 -666 500 666\"><g transform=\"scale(1,-1)\"><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/svg><\/mjx-container>d (following Gross and Rosenhaus (<a href=\"#cite-Gross-2017vhb\">2017<\/a>)) and in <mjx-container data-tex=\"2\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.131ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"1.131ex\" height=\"1.507ex\" viewBox=\"0 -666 500 666\"><g transform=\"scale(1,-1)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/svg><\/mjx-container>d. The second class is the disordered <mjx-container data-tex=\"\\mathcal{N}=2\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.363ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"6.363ex\" height=\"1.971ex\" viewBox=\"0 -789 2812.6 871\"><g transform=\"scale(1,-1)\"><g><use data-c=\"4E\" href=\"#MJX-TEX-C-4E\"><\/use><use x=\"1256.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"2312.6\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/svg><\/mjx-container> supersymmetric (SUSY) <mjx-container data-tex=\"A_{q-1}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.665ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.65ex;\" width=\"4.665ex\" height=\"2.27ex\" viewBox=\"0 -716 2062 1003.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D434\" href=\"#MJX-TEX-I-1D434\"><\/use><g transform=\"translate(783,-150) scale(0.707)\"><use data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><use x=\"460\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"1238\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> <dfn data-def=\"minimal-model\">minimal models<\/dfn>. In practice, we will only discuss the simplest case of the <mjx-container data-tex=\"A_2\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.685ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.339ex;\" width=\"2.685ex\" height=\"1.959ex\" viewBox=\"0 -716 1186.6 866\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D434\" href=\"#MJX-TEX-I-1D434\"><\/use><g transform=\"translate(783,-150) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> minimal model here. We will find a discontinuous transition in the former and a continuous transition in the latter.<\/p>", "hash": "db98c2f4f537", "gist": {"html": "Examples: disordered generalized free fields (a discontinuous onset) and a disordered <mjx-container data-tex=\"\\mathcal N=2\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.363ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"6.363ex\" height=\"1.971ex\" viewBox=\"0 -789 2812.6 871\"><g transform=\"scale(1,-1)\"><g><use data-c=\"4E\" href=\"#MJX-TEX-C-4E\"><\/use><use x=\"1256.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"2312.6\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/svg><\/mjx-container> minimal model (a continuous one).", "status": "ai-draft"}}, {"id": "introduction-p9", "kind": "paragraph", "body": "<p>More details and discussions on the computations and results can be found in the companion paper Berkooz <em>et al.<\/em> (<a href=\"#cite-Berkooz-2021ehv\">2021<\/a>).<\/p>", "hash": "881e75d12ae0"}], "gist": {"html": "With exactly marginal disorder the chaos exponent can be followed from weak coupling, where chaos may switch on only at finite coupling.", "status": "ai-draft"}, "brief": {"html": "<p><span data-covers=\"introduction-p1 introduction-p2\">Averaging over random couplings, as in the SYK model, makes the chaos exponent computable at large <mjx-container data-tex=\"N\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.009ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"2.009ex\" height=\"1.545ex\" viewBox=\"0 -683 888 683\"><g transform=\"scale(1,-1)\"><use data-c=\"1D441\" href=\"#MJX-TEX-I-1D441\"><\/use><\/g><\/svg><\/mjx-container>; the paper does this for <mjx-container data-tex=\"N\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.009ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"2.009ex\" height=\"1.545ex\" viewBox=\"0 -683 888 683\"><g transform=\"scale(1,-1)\"><use data-c=\"1D441\" href=\"#MJX-TEX-I-1D441\"><\/use><\/g><\/svg><\/mjx-container> copies of any core theory.<\/span> <span data-covers=\"introduction-p5\">Normally the disorder is relevant and the exponent is found only at infinite coupling, but exactly marginal disorder keeps the theory conformal at every coupling.<\/span> <span data-covers=\"introduction-p6 introduction-p7\">Then the putative exponent can be negative at weak coupling, so chaos may switch on only at a finite coupling, which the paper compares with the KAM theorem.<\/span><\/p>", "status": "ai-draft"}}, {"id": "disorder-around-a-nontrivial-cft", "kind": "section", "title": "Disorder around a nontrivial CFT", "titleHtml": "Disorder around a nontrivial CFT", "children": [{"id": "the-kernel-structure-of-the-four-point-function", "kind": "section", "title": "The kernel structure of the four-point function", "titleHtml": "The kernel structure of the four-point function", "children": [{"id": "the-kernel-structure-of-the-four-point-function-p1", "kind": "paragraph", "body": "<p>We start by writing a self-consistency equation for the averaged two-point function of <a href=\"#eq-disordered_CFTs\">(1)<\/a>,<\/p>\n<div class=\"display\"><div class=\"eqbody\"><mjx-container data-tex=\"G(x)= \\langle \\mathcal{O}_i(x)\\mathcal{O}_i(0) \\rangle\\;.\" class=\"MathJax\" jax=\"SVG\" display=\"true\" style=\"--w:21.895ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"21.895ex\" height=\"2.262ex\" viewBox=\"0 -750 9677.5 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D43A\" href=\"#MJX-TEX-I-1D43A\"><\/use><use x=\"786\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1175\" data-c=\"1D465\" href=\"#MJX-TEX-I-1D465\"><\/use><use x=\"1747\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"2413.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"3469.6\" data-c=\"27E8\" href=\"#MJX-TEX-N-27E8\"><\/use><g transform=\"translate(3858.6)\"><use data-c=\"4F\" href=\"#MJX-TEX-C-4F\"><\/use><g transform=\"translate(829,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><use x=\"4981.5\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"5370.5\" data-c=\"1D465\" href=\"#MJX-TEX-I-1D465\"><\/use><use x=\"5942.5\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><g transform=\"translate(6331.5)\"><use data-c=\"4F\" href=\"#MJX-TEX-C-4F\"><\/use><g transform=\"translate(829,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><use x=\"7454.5\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"7843.5\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><use x=\"8343.5\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"8732.5\" data-c=\"27E9\" href=\"#MJX-TEX-N-27E9\"><\/use><g transform=\"translate(9121.5)\"><g><\/g><\/g><use x=\"9399.5\" data-c=\"2E\" href=\"#MJX-TEX-N-2E\"><\/use><\/g><\/g><\/svg><\/mjx-container><\/div><span class=\"eqno\">(4)<\/span><\/div>\n<p class=\"cont\">Using the <mjx-container data-tex=\"G-\\Sigma\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.177ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"6.177ex\" height=\"1.781ex\" viewBox=\"0 -705 2730.4 787\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D43A\" href=\"#MJX-TEX-I-1D43A\"><\/use><use x=\"1008.2\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"2008.4\" data-c=\"3A3\" href=\"#MJX-TEX-N-3A3\"><\/use><\/g><\/g><\/svg><\/mjx-container> formalism Maldacena and Stanford (<a href=\"#cite-Maldacena-2016hyu\">2016<\/a>); Kitaev (<a href=\"#cite-KitaevTalk\">2015<\/a>), it can be shown that <mjx-container data-tex=\"G\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.778ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.778ex\" height=\"1.645ex\" viewBox=\"0 -705 786 727\"><g transform=\"scale(1,-1)\"><use data-c=\"1D43A\" href=\"#MJX-TEX-I-1D43A\"><\/use><\/g><\/svg><\/mjx-container> obeys a generalized <dfn data-def=\"sd\">Schwinger-Dyson (SD) equation<\/dfn> at leading order in <mjx-container data-tex=\"1/N\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.271ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"4.271ex\" height=\"2.262ex\" viewBox=\"0 -750 1888 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"500\" data-c=\"2F\" href=\"#MJX-TEX-N-2F\"><\/use><use x=\"1000\" data-c=\"1D441\" href=\"#MJX-TEX-I-1D441\"><\/use><\/g><\/g><\/svg><\/mjx-container>, which appears diagrammatically in figure <a href=\"#fig-sdeqsfull\">2a<\/a>.<\/p>", "hash": "942002e9f981", "gist": {"html": "The averaged two-point function obeys a generalised Schwinger–Dyson equation at leading order in <mjx-container data-tex=\"1/N\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.271ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"4.271ex\" height=\"2.262ex\" viewBox=\"0 -750 1888 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"500\" data-c=\"2F\" href=\"#MJX-TEX-N-2F\"><\/use><use x=\"1000\" data-c=\"1D441\" href=\"#MJX-TEX-I-1D441\"><\/use><\/g><\/g><\/svg><\/mjx-container>.", "status": "ai-draft"}}, {"id": "bg-syk", "kind": "background", "title": "The SYK model at large N: self-energy and ladders", "audience": ["student"], "fold": true, "body": "<p>In the <a data-def=\"syk\">SYK model<\/a>, <mjx-container data-tex=\"N\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.009ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" wi hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"11.162ex\" height=\"2.452ex\" viewBox=\"0 -833.9 4933.4 1083.9\"><g transform=\"scale(1,-1)\"><g><use data-c=\"221D\" href=\"#MJX-TEX-N-221D\"><\/use><g transform=\"translate(1055.8)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><g transform=\"translate(719.9,363) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><use x=\"2179.2\" data-c=\"2F\" href=\"#MJX-TEX-N-2F\"><\/use><g transform=\"translate(2679.2)\"><use data-c=\"1D441\" href=\"#MJX-TEX-I-1D441\"><\/use><g transform=\"translate(975.3,363) scale(0.707)\"><use data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><use x=\"460\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"1238\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. Averaging over the couplings ties pairs of interaction vertices together, and at large <mjx-container data-tex=\"N\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.009ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"2.009ex\" height=\"1.545ex\" viewBox=\"0 -683 888 683\"><g transform=\"scale(1,-1)\"><use data-c=\"1D441\" href=\"#MJX-TEX-I-1D441\"><\/use><\/g><\/svg><\/mjx-container> only “melonic” diagrams survive. The averaged propagator <mjx-container data-tex=\"G\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.778ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.778ex\" height=\"1.645ex\" viewBox=\"0 -705 786 727\"><g transform=\"scale(1,-1)\"><use data-c=\"1D43A\" href=\"#MJX-TEX-I-1D43A\"><\/use><\/g><\/svg><\/mjx-container> then obeys a closed Schwinger–Dyson equation, <mjx-container data-tex=\"G^{-1}=G_0^{-1}-\\Sigma\" class=\"MathJax\" jax=\"SVG\" style=\"--w:15.437ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.708ex;\" width=\"15.437ex\" height=\"2.705ex\" viewBox=\"0 -882.5 6823.4 1195.4\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D43A\" href=\"#MJX-TEX-I-1D43A\"><\/use><g transform=\"translate(819,363) scale(0.707)\"><use data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"778\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><use x=\"2050.5\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(3106.2)\"><use data-c=\"1D43A\" href=\"#MJX-TEX-I-1D43A\"><\/use><g transform=\"translate(819,411.6) scale(0.707)\"><use data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"778\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><g transform=\"translate(819,-297.3) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><use x=\"5101.1\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"6101.4\" data-c=\"3A3\" href=\"#MJX-TEX-N-3A3\"><\/use><\/g><\/g><\/svg><\/mjx-container> with self-energy <mjx-container data-tex=\"\\Sigma=J^2G^{q-1}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:11.939ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"11.939ex\" height=\"2.072ex\" viewBox=\"0 -833.9 5277 915.9\"><g transform=\"scale(1,-1)\"><g><use data-c=\"3A3\" href=\"#MJX-TEX-N-3A3\"><\/use><use x=\"999.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2055.6)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><g transform=\"translate(719.9,363) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><g transform=\"translate(3179)\"><use data-c=\"1D43A\" href=\"#MJX-TEX-I-1D43A\"><\/use><g transform=\"translate(819,363) scale(0.707)\"><use data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><use x=\"460\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"1238\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>; this can be packaged as the saddle point of a bilocal action in <mjx-container data-tex=\"G\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.778ex\"><sp " href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/svg><\/mjx-container> points.", "status": "ai-draft"}}], "gist": {"html": "Two- and four-point functions obey SYK-like equations with a ladder kernel built from all core correlators.", "status": "ai-draft"}, "brief": {"html": "<p><span data-covers=\"the-kernel-structure-of-the-four-point-function-p1 the-kernel-structure-of-the-four-point-function-p2\">At leading order in <mjx-container data-tex=\"1/N\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.271ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"4.271ex\" height=\"2.262ex\" viewBox=\"0 -750 1888 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"500\" data-c=\"2F\" href=\"#MJX-TEX-N-2F\"><\/use><use x=\"1000\" data-c=\"1D441\" href=\"#MJX-TEX-I-1D441\"><\/use><\/g><\/g><\/svg><\/mjx-container> the averaged two-point function obeys a Schwinger–Dyson equation like SYK's, except that every correlator of the core CFT enters, through theory-independent “subtracted” combinations.<\/span> <span data-covers=\"the-kernel-structure-of-the-four-point-function-p3\">The connected four-point function is again a sum of ladders, <mjx-container data-tex=\"C=\\sum_nK^nF_0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:14.369ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.663ex;\" width=\"14.369ex\" height=\"2.36ex\" viewBox=\"0 -750 6351.3 1043.1\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D436\" href=\"#MJX-TEX-I-1D436\"><\/use><use x=\"1037.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2093.6)\"><use data-c=\"2211\" href=\"#MJX-TEX-SO-2211\"><\/use><g transform=\"translate(1089,-285.4) scale(0.707)\"><use data-c=\"1D45B\" href=\"#MJX-TEX-I-1D45B\"><\/use><\/g><\/g><g transform=\"translate(3823.5)\"><use data-c=\"1D43E\" href=\"#MJX-TEX-I-1D43E\"><\/use><g transform=\"translate(974,363) scale(0.707)\"><use data-c=\"1D45B\" href=\"#MJX-TEX-I-1D45B\"><\/use><\/g><\/g><g transform=\"translate(5271.8)\"><use data-c=\"1D439\" href=\"#MJX-TEX-I-1D439\"><\/use><g transform=\"translate(676,-150) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, now with a far more complicated kernel.<\/span> <span data-covers=\"the-kernel-structure-of-the-four-point-function-p4\">Still, at order <mjx-container data-tex=\"J^{2n}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.502ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"3.502ex\" height=\"1.937ex\" viewBox=\"0 -833.9 1547.7 855.9\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><g transform=\"translate(719.9,363) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><use x=\"500\" data-c=\"1D45B\" href=\"#MJX-TEX-I-1D45B\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> only correlators of up to <mjx-container data-tex=\"2n+2\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.386ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"6.386ex\" height=\"1.692ex\" viewBox=\"0 -666 2822.4 748\"><g transform=\"scale(1,-1)\"><g><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><use x=\"500\" data-c=\"1D45B\" href=\"#MJX-TEX-I-1D45B\"><\/use><use x=\"1322.2\" data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><use x=\"2322.4\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/svg><\/mjx-container> points are needed, so the kernel can be computed perturbatively.<\/span><\/p>", "status": "ai-draft"}}, {"id": "the-double-commutator-and-chaos", "kind": "section", "title": "The double-commutator and chaos", "titleHtml": "The double-commutator and chaos", "children": [{"id": "the-double-commutator-and-chaos-p1", "kind": "paragraph", "body": "<p>A similar analysis also applies to the computation of the <a data-def=\"double-commutator\">double-commut \"><g transform=\"scale(1,-1)\"><use data-c=\"34\" href=\"#MJX-TEX-N-34\"><\/use><\/g><\/svg><\/mjx-container>-point functions <a href=\"#eq-conn_four\">(5)<\/a>, <a href=\"#eq-double_comm\">(7)<\/a> satisfies a “retarded” version of the <a data-def=\"kernel-structure\">kernel structure<\/a> of figure <a href=\"#fig-fullkernel\">3a<\/a>:<\/p>\n<div class=\"display\" id=\"eq-double_commutator_kernel\"><div class=\"eqbody\"><mjx-container data-tex=\"W_R=\\sum_{n=0}^\\infty K_R^n F_0 \\ \\Longrightarrow\\ (1-K_R)W_R = F_0\\;,\" class=\"MathJax\" jax=\"SVG\" display=\"true\" style=\"--w:41.293ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -2.819ex;\" width=\"41.293ex\" height=\"6.354ex\" viewBox=\"0 -1562.5 18251.7 2808.5\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D44A\" href=\"#MJX-TEX-I-1D44A\"><\/use><g transform=\"translate(977,-150) scale(0.707)\"><use data-c=\"1D445\" href=\"#MJX-TEX-I-1D445\"><\/use><\/g><\/g><use x=\"1841.5\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2897.2)\"><use data-c=\"2211\" href=\"#MJX-TEX-LO-2211\"><\/use><g transform=\"translate(58,-1087.9) scale(0.707)\"><use data-c=\"1D45B\" href=\"#MJX-TEX-I-1D45B\"><\/use><use x=\"600\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1378\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(368.4,1150) scale(0.707)\"><use data-c=\"221E\" href=\"#MJX-TEX-N-221E\"><\/use><\/g><\/g><g transform=\"translate(4507.9)\"><use data-c=\"1D43E\" href=\"#MJX-TEX-I-1D43E\"><\/use><g transform=\"translate(974,413) scale(0.707)\"><use data-c=\"1D45B\" href=\"#MJX-TEX-I-1D45B\"><\/use><\/g><g transform=\"translate(882,-257.7) scale(0.707)\"><use data-c=\"1D445\" href=\"#MJX-TEX-I-1D445\"><\/use><\/g><\/g><g transform=\"translate(5976.6)\"><use data-c=\"1D439\" href=\"#MJX-TEX-I-1D439\"><\/use><g transform=\"translate(676,-150) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><use x=\"7056.2\" data-c=\"A0\" href=\"#MJX-TEX-N-A0\"><\/use><use x=\"7583.9\" data-c=\"27F9\" href=\"#MJX-TEX-N-27F9\"><\/use><use x=\"9499.7\" data-c=\"A0\" href=\"#MJX-TEX-N-A0\"><\/use><use x=\"9749.7\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"10138.7\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"10860.9\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><g transform=\"translate(11861.2)\"><use data-c=\"1D43E\" href=\"#MJX-TEX-I-1D43E\"><\/use><g transform=\"translate(882,-150) scale(0.707)\"><use data-c=\"1D445\" href=\"#MJX-TEX-I-1D445\"><\/use><\/g><\/g><use x=\"13329.9\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><g transform=\"translate(13718.9)\"><use data-c=\"1D44A\" href=\"#MJX-TEX-I-1D44A\"><\/use><g transform=\"translate(977,-150) scale(0.707)\"><use data-c=\"1D445\" href=\"#MJX-TEX-I-1D445\"><\/use><\/g><\/g><use x=\"15560.3\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(16616.1)\"><use data-c=\"1D439\" href=\"#MJX-TEX-I-1D439\"><\/use><g transform=\"translate(676,-150) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><g transform=\"translate(17695.7)\"><g><\/g><\/g><use x=\"17973.7\" data-c=\"2C\" href=\"#MJX-TEX-N-2C\"><\/use><\/g><\/g><\/svg><\/mjx-container><\/div><span class=\"eqno\">(9)<\/span><\/div>\n<p class=\"cont\">with <mjx-container data-tex=\"K_R\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.323ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.373ex;\" width=\"3.323ex\" height=\"1.918ex\" viewBox=\"0 -683 1468.7 847.8\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D43E\" href=\"#MJX-TEX-I-1D43E\"><\/use><g transform=\"translate(882,-150) scale(0.707)\"><use data-c=\"1D445\" href=\"#MJX-TEX-I-1D445\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> the <dfn data-def=\"retarded-kernel\">retarded kernel<\/dfn> Kitaev (<a href=\"#cite-KitaevTalk2\">2015<\/a>). The retarded kernel is composed of the same diagrams as in figure <a href=\"#fig-fullkernel\">3a<\/a>, where one plugs in specific analytic continuations in time of the <mjx-container data-tex=\"n\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.357ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"1.357ex\" height=\"1.025ex\" viewBox=\"0 -442 600 453\"><g transform=\"scale(1,-1)\"><use data-c=\"1D45B\" href=\"#MJX-TEX-I-1D45B\"><\/use><\/g><\/svg><\/mjx-container>-point functions.<\/p>", "hash": "3e0cfa8acb2a", "gist": {"html": "The double commutator obeys the same ladder, with a retarded kernel <mjx-container data-tex=\"K_R\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.323ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.373ex;\" width=\"3.323ex\" height=\"1.918ex\" viewBox=\"0 -683 1468.7 847.8\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D43E\" href=\"#MJX-TEX-I-1D43E\"><\/use><g transform=\"translate(882,-150) scale(0.707)\"><use data-c=\"1D445\" href=\"#MJX-TEX-I-1D445\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> built from real-time continued correlators.", "status": "ai-draft"}}, {"id": "bg-eigenvalue", "kind": "background", "title": "The chaos exponent as a kernel eigenvalue", "audience": ["physicist", "student"], "fold": true, "body": "<p>If the <a data-def=\"double-commutator\">double commutator<\/a> obeys a ladder equation <mjx-container data-tex=\"(1-K_R)W_R=F_0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:17.977ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"17.977ex\" height=\"2.262ex\" viewBox=\"0 -750 7945.9 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"389\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"1111.2\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><g transform=\"translate(2111.4)\"><use data-c=\"1D43E\" href=\"#MJX-TEX-I-1D43E\"><\/use><g transform=\"translate(882,-150) scale(0.707)\"><use data-c=\"1D445\" href=\"#MJX-TEX-I-1D445\"><\/use><\/g><\/g><use x=\"3580.1\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><g transform=\"translate(3969.1)\"><use data-c=\"1D44A\" href=\"#MJX-TEX-I-1D44A\"><\/use><g transform=\"translate(977,-150) scale(0.707)\"><use data-c=\"1D445\" href=\"#MJX-TEX-I-1D445\"><\/use><\/g><\/g><use x=\"5810.6\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(6866.4)\"><use data-c=\"1D439\" href=\"#MJX-TEX-I-1D439\"><\/use><g transform=\"translate(676,-150) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, its late-time behaviour is governed by the kernel alone. The source <mjx-container data-tex=\"F_0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.442ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.375ex;\" width=\"2.442ex\" height=\"1.913ex\" viewBox=\"0 -680 1079.6 845.6\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D439\" href=\"#MJX-TEX-I-1D439\"><\/use><g transform=\"translate(676,-150) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, a single rung, does not grow, while the ladder sums an unbounded number of rungs. A late-time growing piece of <mjx-container data-tex=\"W_R\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.538ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.373ex;\" width=\"3.538ex\" height=\"1.918ex\" viewBox=\"0 -683 1563.7 847.8\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D44A\" href=\"#MJX-TEX-I-1D44A\"><\/use><g transform=\"translate(977,-150) scale(0.707)\"><use data-c=\"1D445\" href=\"#MJX-TEX-I-1D445\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> must therefore solve the homogeneous equation <mjx-container data-tex=\"K_RW_R=W_R\" class=\"MathJax\" jax=\"SVG\" style=\"--w:13.415ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.373ex;\" width=\"13.415ex\" height=\"1.918ex\" viewBox=\"0 -683 5929.6 847.8\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D43E\" href=\"#MJX-TEX-I-1D43E\"><\/use><g transform=\"translate(882,-150) scale(0.707)\"><use data-c=\"1D445\" href=\"#MJX-TEX-I-1D445\"><\/use><\/g><\/g><g transform=\"translate(1468.7)\"><use data-c=\"1D44A\" href=\"#MJX-TEX-I-1D44A\"><\/use><g transform=\"translate(977,-150) scale(0.707)\"><use data-c=\"1D445\" href=\"#MJX-TEX-I-1D445\"><\/use><\/g><\/g><use x=\"3310.2\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(4365.9)\"><use data-c=\"1D44A\" href=\"#MJX-TEX-I-1D44A\"><\/use><g transform=\"translate(977,-150) scale(0.707)\"><use data-c=\"1D445\" href=\"#MJX-TEX-I-1D445\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>: it is an eigenfunction of the <a data-def=\"retarded-kernel\">retarded kernel<\/a> with eigenvalue one. Because the averaged theory is conformal, one can try a function of definite growth, <mjx-container data-tex=\"\\propto e^{\\lambda(t_1+t_2)/2}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:11.204ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"11.204ex\" height=\"2.046ex\" viewBox=\"0 -893.3 4952.3 904.3\"><g transform=\"scale(1,-1)\"><g><use data-c=\"221D\" href=\"#MJX-TEX-N-221D\"><\/use><g transform=\"translate(1055.8)\"><use data-c=\"1D452\" href=\"#MJX-TEX-I-1D452\"><\/use><g transform=\"translate(499,363) scale(0.707)\"><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><use x=\"583\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><g transform=\"translate(972)\"><use data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><g transform=\"translate(394,-150) scale(0.707)\"><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><use x=\"1769.6\" data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><g transform=\"translate(2547.6)\"><use data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><g transform=\"translate(394,-150) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><use x=\"3345.1\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"3734.1\" data-c=\"2F\" href=\"#MJX-TEX-N-2F\"><\/use><use x=\"4234.1\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, which the kernel maps to itself times an eigenvalue <mjx-container data-tex=\"k_R(\\lambda)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.66ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"5.66ex\" height=\"2.262ex\" viewBox=\"0 -750 2501.7 1000\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><g transform=\"translate(554,-150) scale(0.707)\"><use data-c=\"1D445\" href=\"#MJX-TEX-I-1D445\"><\/use><\/g><\/g><use x=\"1140.7\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1529.7\" data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><use x=\"2112.7\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>. The <a data-def=\"chaos-exponent\">chaos exponent<\/a> is then the largest <mjx-container data-tex=\"\\lambda\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.319ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.027ex;\" width=\"1.319ex\" height=\"1.597ex\" viewBox=\"0 -694 583 706\"><g transform=\"scale(1,-1)\"><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><\/g><\/svg><\/mjx-container> with <mjx-container data-tex=\"k_R(\\lambda)=1\" class=\"MathJax\" jax=\"SVG\" style=\"--w:9.808ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"9.808ex\" height=\"2.262ex\" viewBox=\"0 -750 4335.2 1000\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><g transform=\"translate(554,-150) scale(0.707)\"><use data-c=\"1D445\" href=\"#MJX-TEX-I-1D445\"><\/use><\/g><\/g><use x=\"1140.7\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1529.7\" data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><use x=\"2112.7\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"2779.5\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"3835.2\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><\/svg><\/mjx-container>. This is how <mjx-container data-tex=\"\\lambda_L\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.596ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.339ex;\" width=\"2.596ex\" height=\"1.91ex\" viewBox=\"0 -694 1147.5 844\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,-150) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> was computed in SYK by Kitaev and by Maldacena and Stanford, and the paper applies it to the retarded kernel of a general <a data-def=\"disordered-cft\">disordered CFT<\/a>.<\/p>"}, {"id": "the-double-commutator-and-chaos-p3", "kind": "paragraph", "body": "<p>If <mjx-container data-tex=\"\\lambda_L&gt;0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.745ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.339ex;\" width=\"6.745ex\" height=\"1.91ex\" viewBox=\"0 -694 2981.1 844\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,-150) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"1425.3\" data-c=\"3E\" href=\"#MJX-TEX-N-3E\"><\/use><use x=\"2481.1\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container>, the <a data-def=\"kernel-structure\">ladder structure<\/a> (however complicated) allows us to compute it in cases where the averaged correlator has conformal symmetry (see Murugan <em>et al.<\/em> (<a href=\"#cite-Murugan-2017eto\">2017<\/a>) for a review). This is done by finding the largest solution <mjx-container data-tex=\"\\lambda_L^{\\text{ker}}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.689ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.696ex;\" width=\"3.689ex\" height=\"2.628ex\" viewBox=\"0 -853.7 1630.5 1161.5\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,363) scale(0.707)\"><g><use data-c=\"6B\" href=\"#MJX-TEX-N-6B\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(528)\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(972)\"><\/use><\/g><\/g><g transform=\"translate(616,-307.7) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> of the equation <mjx-container data-tex=\"k_R(\\lambda_L^{\\text{ker}})=1\" class=\"MathJax\" jax=\"SVG\" style=\"--w:12.178ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.696ex;\" width=\"12.178ex\" height=\"2.628ex\" viewBox=\"0 -853.7 5382.7 1161.5\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><g transform=\"translate(554,-150) scale(0.707)\"><use data-c=\"1D445\" href=\"#MJX-TEX-I-1D445\"><\/use><\/g><\/g><use x=\"1140.7\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><g transform=\"translate(1529.7)\"><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,363) scale(0.707)\"><g><use data-c=\"6B\" href=\"#MJX-TEX-N-6B\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(528)\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(972)\"><\/use><\/g><\/g><g transform=\"translate(616,-307.7) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"3160.2\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"3827\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"4882.7\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><\/svg><\/mjx-container>, where <mjx-co "MathJax\" jax=\"SVG\" style=\"--w:9.808ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"9.808ex\" height=\"2.262ex\" viewBox=\"0 -750 4335.2 1000\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><g transform=\"translate(554,-150) scale(0.707)\"><use data-c=\"1D445\" href=\"#MJX-TEX-I-1D445\"><\/use><\/g><\/g><use x=\"1140.7\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1529.7\" data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><use x=\"2112.7\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"2779.5\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"3835.2\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><\/svg><\/mjx-container> is <mjx-container data-tex=\"\\lambda_L\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.596ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.339ex;\" width=\"2.596ex\" height=\"1.91ex\" viewBox=\"0 -694 1147.5 844\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,-150) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> if positive; otherwise there is no chaos.", "status": "ai-draft"}}, {"id": "the-double-commutator-and-chaos-p4", "kind": "paragraph", "body": "<p>Importantly, if <mjx-container data-tex=\"J\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.432ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.432ex\" height=\"1.595ex\" viewBox=\"0 -683 633 705\"><g transform=\"scale(1,-1)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><\/g><\/svg><\/mjx-container> is <a data-def=\"exactly-marginal\">exactly marginal<\/a>, <mjx-container data-tex=\"k_R(\\lambda_L)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.937ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"6.937ex\" height=\"2.262ex\" viewBox=\"0 -750 3066.2 1000\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><g transform=\"translate(554,-150) scale(0.707)\"><use data-c=\"1D445\" href=\"#MJX-TEX-I-1D445\"><\/use><\/g><\/g><use x=\"1140.7\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><g transform=\"translate(1529.7)\"><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,-150) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"2677.2\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> can be found perturbatively in <mjx-container data-tex=\"J\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.432ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.432ex\" height=\"1.595ex\" viewBox=\"0 -683 633 705\"><g transform=\"scale(1,-1)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><\/g><\/svg><\/mjx-container>. As a result, one can compute <mjx-container data-tex=\"\\lambda_L^{\\text{ker}}(J)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.881ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.696ex;\" width=\"6.881ex\" height=\"2.628ex\" viewBox=\"0 -853.7 3041.5 1161.5\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,363) scale(0.707)\"><g><use data-c=\"6B\" href=\"#MJX-TEX-N-6B\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(528)\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(972)\"><\/use><\/g><\/g><g transform=\"translate(616,-307.7) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"1630.5\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"2019.5\" data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><use x=\"2652.5\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> in orders of <mjx-container data-tex=\"J\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.432ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.432ex\" height=\"1.595ex\" viewBox=\"0 -683 633 705\"><g transform=\"scale(1,-1)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><\/g><\/svg><\/mjx-container> by using finitely many <a data-def=\"core\">core CFT<\/a> correlation functions at every order. The leading order of the equation is explicitly<\/p>\n<div class=\"display\" id=\"eq-k_in_pert_theory\"><div class=\"eqbody\"><mjx-container data-tex=\"\\begin{split}\n    &amp; k_R(\\lambda) = \\frac{J^2}{4} \\int d^2 x_3 d^2 x_4 \\exp(\\lambda/2 (t_3+t_4-t_1-t_2)) \\\\\n    &amp;\\cdot \\langle [\\mathcal{O}(\\beta/2+i t_2), \\mathcal{O}(\\beta/2+i t_4)]\n    [\\mathcal{O}(i t_1), \\mathcal{O}(i t_3)]\\rangle_0 \n    \\\\\n    &amp;\\cdot \\frac{G_{lr,\\Delta(q-1)+\\frac{\\lambda}{2}}(3,4)}{G_{lr,\\Delta+\\frac{\\lambda}{2}}(1,2)} +O(J^4)\\;,\n\\end{split}\" class=\"MathJax\" jax=\"SVG\" display=\"true\" style=\"--w:50.447ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -7.266ex;\" width=\"50.447ex\" height=\"15.663ex\" viewBox=\"0 -3711.4 22297.5 6922.8\"><g transform=\"scale(1,-1)\"><g><g data-mml-node=\"mtable\"><g transform=\"translate(0,2201.5)\"><g><\/g><g><g><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><g transform=\"translate(554,-150) scale(0.707)\"><use data-c=\"1D445\" href=\"#MJX-TEX-I-1D445\"><\/use><\/g><\/g><use x=\"1140.7\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1529.7\" data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><use x=\"2112.7\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"2779.5\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(3835.2)\"><g transform=\"translate(220,676)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><g transform=\"translate(719.9,
