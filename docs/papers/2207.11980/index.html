"><use data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><g transform=\"translate(394,-150) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><use x=\"5590.1\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"5979.1\" data-c=\"2F\" href=\"#MJX-TEX-N-2F\"><\/use><use x=\"6479.1\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><g transform=\"translate(6979.1,0) translate(0 -0.5)\"><use data-c=\"29\" href=\"#MJX-TEX-SO-29\"><\/use><\/g><\/g><\/g><\/g><\/g><\/g><\/g><\/svg><\/mjx-container><\/div><span class=\"eqno\">(12)<\/span><\/div>\n<p class=\"cont\">for some <mjx-container data-tex=\"\\lambda_L^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.596ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.7ex;\" width=\"2.596ex\" height=\"2.601ex\" viewBox=\"0 -840.1 1147.5 1149.4\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(616,-309.4) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. Note that the CFTs are decoupled and so <mjx-container data-tex=\"\\lambda_L^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.596ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.7ex;\" width=\"2.596ex\" height=\"2.601ex\" viewBox=\"0 -840.1 1147.5 1149.4\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(616,-309.4) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> is a property of a single core CFT. However, we emphasize that it is not a <a data-def=\"chaos-exponent\">chaos exponent<\/a> in a single core CFT (as we take <mjx-container data-tex=\"t_1,t_2\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.615ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"4.615ex\" height=\"1.855ex\" viewBox=\"0 -626 2039.8 820\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><g transform=\"translate(394,-150) scale(0.707)\"><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><use x=\"797.6\" data-c=\"2C\" href=\"#MJX-TEX-N-2C\"><\/use><g transform=\"translate(1242.2)\"><use data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><g transform=\"translate(394,-150) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> to be larger then any timescale of the core CFT); in fact, for unitary theories in <mjx-container data-tex=\"2d\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.308ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.023ex;\" width=\"2.308ex\" height=\"1.593ex\" viewBox=\"0 -694 1020 704\"><g transform=\"scale(1,-1)\"><g><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><use x=\"500\" data-c=\"1D451\" href=\"#MJX-TEX-I-1D451\"><\/use><\/g><\/g><\/svg><\/mjx-container> it is always non-positive, <mjx-container data-tex=\"\\lambda_L^0\\le 0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.745ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.7ex;\" width=\"6.745ex\" height=\"2.601ex\" viewBox=\"0 -840.1 2981.1 1149.4\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(616,-309.4) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"1425.3\" data-c=\"2264\" href=\"#MJX-TEX-N-2264\"><\/use><use x=\"2481.1\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container> Caron-Huot (<a href=\"#cite-Caron-Huot-2017vep\">2017<\/a>).<\/p>", "hash": "a64f3189c469", "gist": {"html": "At <mjx-container data-tex=\"J=0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.58ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"5.58ex\" height=\"1.731ex\" viewBox=\"0 -683 2466.6 765\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><use x=\"910.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1966.6\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container> the double commutator still has a late-time exponent <mjx-container data-tex=\"\\lambda_L^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.596ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.7ex;\" width=\"2.596ex\" height=\"2.601ex\" viewBox=\"0 -840.1 1147.5 1149.4\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(616,-309.4) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, set by one core CFT but not chaos.", "status": "ai-draft"}}, {"id": "the-double-commutator-and-chaos-p7", "kind": "paragraph", "body": "<p>Surprisingly, under reasonable physical assumptions it can be shown that <mjx-container data-tex=\"\\lambda_L^{\\text{ker}}(J=0^+)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:12.462ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.696ex;\" width=\"12.462ex\" height=\"2.628ex\" viewBox=\"0 -853.7 5508.2 1161.5\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,363) scale(0.707)\"><g><use data-c=\"6B\" href=\"#MJX-TEX-N-6B\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(528)\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(972)\"><\/use><\/g><\/g><g transform=\"translate(616,-307.7) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"1630.5\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"2019.5\" data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><use x=\"2930.3\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(3986)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><g transform=\"translate(533,363) scale(0.707)\"><use data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><\/g><\/g><use x=\"5119.2\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> and <mjx-container data-tex=\"\\lambda_L^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.596ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.7ex;\" width=\"2.596ex\" height=\"2.601ex\" viewBox=\"0 -840.1 1147.5 1149.4\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(616,-309.4) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> are equal Berkooz <em>et al.<\/em> (<a href=\"#cite-Berkooz-2021ehv\">2021<\/a>). This amounts to showing that the integral <a href=\"#eq-k_in_pert_theory\">(10)<\/a> diverges for <mjx-container data-tex=\"\\lambda \\le \\lambda_L^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.932ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.7ex;\" width=\"6.932ex\" height=\"2.601ex\" viewBox=\"0 -840.1 3064.1 1149.4\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><use x=\"860.8\" data-c=\"2264\" href=\"#MJX-TEX-N-2264\"><\/use><g transform=\"translate(1916.6)\"><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\  data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> satisfies<\/p>\n<div class=\"display\" id=\"eq-continuity\"><div class=\"eqbody\"><mjx-container data-tex=\"\\lambda_L^{\\text{ker}}(J=0^+) = \\lambda_L^0.\" class=\"MathJax\" jax=\"SVG\" display=\"true\" style=\"--w:18.704ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.601ex;\" width=\"18.704ex\" height=\"2.645ex\" viewBox=\"0 -903.7 8267.3 1169.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,413) scale(0.707)\"><g><use data-c=\"6B\" href=\"#MJX-TEX-N-6B\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(528)\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(972)\"><\/use><\/g><\/g><g transform=\"translate(616,-257.7) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"1630.5\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"2019.5\" data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><use x=\"2930.3\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(3986)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><g transform=\"translate(533,413) scale(0.707)\"><use data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><\/g><\/g><use x=\"5119.2\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"5786\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(6841.7)\"><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,413) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(616,-265.5) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"7989.3\" data-c=\"2E\" href=\"#MJX-TEX-N-2E\"><\/use><\/g><\/g><\/svg><\/mjx-container><\/div><span class=\"eqno\">(13)<\/span><\/div>\n<p class=\"cont\">The LHS is calculated through the kernel equation <mjx-container data-tex=\"k_R(\\lambda)=1\" class=\"MathJax\" jax=\"SVG\" style=\"--w:9.808ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"9.808ex\" height=\"2.262ex\" viewBox=\"0 -750 4335.2 1000\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><g transform=\"translate(554,-150) scale(0.707)\"><use data-c=\"1D445\" href=\"#MJX-TEX-I-1D445\"><\/use><\/g><\/g><use x=\"1140.7\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1529.7\" data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><use x=\"2112.7\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"2779.5\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"3835.2\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><\/svg><\/mjx-container> in the limit <mjx-container data-tex=\"J=0^+\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.013ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"7.013ex\" height=\"1.939ex\" viewBox=\"0 -775.2 3099.7 857.2\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><use x=\"910.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(1966.6)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><g transform=\"translate(533,363) scale(0.707)\"><use data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, and the RHS is a property of the <a data-def=\"core\">core CFT<\/a>. We can interpret the result by noticing that <mjx-container data-tex=\"\\lambda_L^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.596ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.7ex;\" width=\"2.596ex\" height=\"2.601ex\" viewBox=\"0 -840.1 1147.5 1149.4\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(616,-309.4) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> describes the core CFT <a data-def=\"double-commutator\">double-commutator<\/a> behavior at large time scales. At arbitrarily weak coupling this behavior seems to control the <mjx-container data-tex=\"1\\ll t \\ll \\log N\" class=\"MathJax\" jax=\"SVG\" style=\"--w:14.264ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.466ex;\" width=\"14.264ex\" height=\"2.036ex\" viewBox=\"0 -694 6304.8 900\"><g transform=\"scale(1,-1)\"><g><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"777.8\" data-c=\"226A\" href=\"#MJX-TEX-N-226A\"><\/use><use x=\"2055.6\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><use x=\"2694.3\" data-c=\"226A\" href=\"#MJX-TEX-N-226A\"><\/use><g transform=\"translate(3972.1)\"><use data-c=\"6C\" href=\"#MJX-TEX-N-6C\"><\/use><use data-c=\"6F\" href=\"#MJX-TEX-N-6F\" transform=\"translate(278)\"><\/use><use data-c=\"67\" href=\"#MJX-TEX-N-67\" transform=\"translate(778)\"><\/use><\/g><use x=\"5250.1\" data-c=\"2061\" href=\"#MJX-TEX-N-2061\"><\/use><use x=\"5416.8\" data-c=\"1D441\" href=\"#MJX-TEX-I-1D441\"><\/use><\/g><\/g><\/svg><\/mjx-container> behavior of the disordered theory double-commutator. The result is striking: in order to determine the type of <a data-def=\"transition\">transition into chaos<\/a>, it is enough to find (the sign of) <mjx-container data-tex=\"\\lambda_L^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.596ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.7ex;\" width=\"2.596ex\" height=\"2.601ex\" viewBox=\"0 -840.1 1147.5 1149.4\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(616,-309.4) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> in a single core CFT. Below we give one example for each type of transition into chaos. In both cases we find that our conjecture <a href=\"#eq-continuity\">(13)<\/a> holds.<\/p>", "hash": "93b1800950d3", "gist": {"html": "Conjectures <mjx-container data-tex=\"\\lambda_L^{\\text{ker}}(0^+)=\\lambda_L^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:13.626ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.7ex;\" width=\"13.626ex\" height=\"2.631ex\" viewBox=\"0 -853.7 6022.7 1163.1\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,363) scale(0.707)\"><g><use data-c=\"6B\" href=\"#MJX-TEX-N-6B\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(528)\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(972)\"><\/use><\/g><\/g><g transform=\"translate(616,-307.7) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"1630.5\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><g transform=\"translate(2019.5)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><g transform=\"translate(533,363) scale(0.707)\"><use data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><\/g><\/g><use x=\"3152.6\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"3819.4\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(4875.2)\"><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(616,-309.4) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, so a single core CFT decides whether chaos sets in continuously.", "status": "ai-draft"}}], "gist": {"html": "The retarded kernel gives <mjx-container data-tex=\"\\lambda_L^{\\text{ker}}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.689ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.696ex;\" width=\"3.689ex\" height=\"2.628ex\" viewBox=\"0 -853.7 1630.5 1161.5\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,363) scale(0.707)\"><g><use data-c=\"6B\" href=\"#MJX-TEX-N-6B\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(528)\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(972)\"><\/use><\/g><\/g><g transform=\"translate(616,-307.7) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>; its weak-coupling limit, conjecturally a single core CFT's <mjx-container data-tex=\"\\lambda_L^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.596ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.7ex;\" width=\"2.596ex\" height=\"2.601ex\" viewBox=\"0 -840.1 1147.5 1149.4\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(616,-309.4) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, sets the onset.", "status": "ai-draft"}, "brief": {"html": "<p><span data-covers=\"the-double-commutator-and-chaos-p2 the-double-commutator-and-chaos-p3\">The double commutator obeys a retarded version of the ladder, and the largest <mjx-container data-tex=\"\\lambda\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.319ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.027ex;\" width=\"1.319ex\" height=\"1.597ex\" viewBox=\"0 -694 583 706\"><g transform=\"scale(1,-1)\"><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><\/g><\/svg><\/mjx-container> at which the retarded kernel has eigenvalue one gives the chaos exponent if it is positive, and no chaos otherwise.<\/span> <span data-covers=\"the-double-commutator-and-chaos-p4 the-double-commutator-and-chaos-p5\">For exactly marginal disorder that eigenvalue is a series in <mjx-container data-tex=\"J\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.432ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.432ex\" height=\"1.595ex\" viewBox=\"0 -683 633 705\"><g transform=\"scale(1,-1)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><\/g><\/svg><\/mjx-container>, whose leading term already fixes the sign of the exponent at weak coupling, and so the type of onset.<\/span> <span data-covers=\"the-double-commutator-and-chaos-p6 the-double-commutator-and-chaos-p7\">The paper conjectures <mjx-container data-tex=\"\\lambda_L^{\\text{ker}}(0^+)=\\lambda_L^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:13.626ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.7ex;\" width=\"13.626ex\" height=\"2.631ex\" viewBox=\"0 -853.7 6022.7 1163.1\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,363) scale(0.707)\"><g><use data-c=\"6B\" href=\"#MJX-TEX-N-6B\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(528)\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(972)\"><\/use><\/g><\/g><g transform=\"translate(616,-307.7) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"1630.5\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><g transform=\"translate(2019.5)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><g transform=\"translate(533,363) scale(0.707)\"><use data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><\/g><\/g><use x=\"3152.6\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"3819.4\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(4875.2)\"><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(616,-309.4) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, the late-time exponent of the decoupled core CFT.<\/span><\/p>", "status": "ai-draft"}}], "gist": {"html": "Any disordered CFT keeps SYK's ladder structure; for marginal disorder, weak coupling fixes the type of onset.", "status": "ai-draft"}, "brief": {"html": "<p><span data-covers=\"the-kernel-structure-of-the-four-point-function-p1 the-kernel-structure-of-the-four-point-function-p3\">Around any core CFT, the large-<mjx-container data-tex=\"N\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.009ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"2.009ex\" height=\"1.545ex\" viewBox=\"0 -683 888 683\"><g transform=\"scale(1,-1)\"><use data-c=\"1D441\" href=\"#MJX-TEX-I-1D441\"><\/use><\/g><\/svg><\/mjx-container> disorder average keeps the structure known from SYK: a self-consistent two-point function and a four-point function built as a ladder.<\/span> <span data-covers=\"the-double-commutator-and-chaos-p2 the-double-commutator-and-chaos-p3\">The double commutator obeys a real-time version of the ladder, and the growth rate at which its kernel has eigenvalue one is the chaos exponent, when positive.<\/span> <span data-covers=\"the-double-commutator-and-chaos-p4 the-double-commutator-and-chaos-p5\">For exactly marginal disorder this can be expanded in the coupling, and the leading order decides whether chaos sets in continuously.<\/span> <span data-covers=\"the-double-commutator-and-chaos-p7\">The paper conjectures that this is decided by one core CFT alone.<\/span><\/p>", "status": "ai-draft"}}, {"id": "examples-of-the-onset-of-chaos", "kind": "section", "title": "Examples of the Onset of chaos", "titleHtml": " <\/svg><\/mjx-container> in the following.<\/p>", "hash": "45f30a42c57b", "gist": {"html": "Generalized free fields are non-local toy models with no stress tensor; conformal invariance lets one set <mjx-container data-tex=\"\\beta=2\\pi\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.718ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"6.718ex\" height=\"2.034ex\" viewBox=\"0 -705 2969.6 899\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D6FD\" href=\"#MJX-TEX-I-1D6FD\"><\/use><use x=\"843.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1899.6\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><use x=\"2399.6\" data-c=\"1D70B\" href=\"#MJX-TEX-I-1D70B\"><\/use><\/g><\/g><\/svg><\/mjx-container>.", "status": "ai-draft"}}, {"id": "disordered-generalized-free-fields-p2", "kind": "paragraph", "body": "<p>In <mjx-container data-tex=\"1\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.131ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"1.131ex\" height=\"1.507ex\" viewBox=\"0 -666 500 666\"><g transform=\"scale(1,-1)\"><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/svg><\/mjx-container>d, the generalized free fermion model is called the “<dfn data-def=\"csyk\">cSYK<\/dfn>” model and was introduced in Gross and Rosenhaus (<a href=\"#cite-Gross-2017vhb\">2017<\/a>). Explicitly, the action is<\/p>\n<div class=\"display\"><div class=\"eqbody\"><mjx-container data-tex=\"S=S_0+S_\\text{SYK}\" class=\"MathJax\" jax=\"SVG\" display=\"true\" style=\"--w:14.525ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.375ex;\" width=\"14.525ex\" height=\"1.97ex\" viewBox=\"0 -705 6420.2 870.6\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D446\" href=\"#MJX-TEX-I-1D446\"><\/use><use x=\"922.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(1978.6)\"><use data-c=\"1D446\" href=\"#MJX-TEX-I-1D446\"><\/use><g transf use><g transform=\"translate(783,-150) scale(0.707)\"><use data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><use x=\"460\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"1238\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> minimal models are exactly marginal, so every realization is conformal.", "status": "ai-draft"}}, {"id": "bg-minimal", "kind": "background", "title": "N=2 minimal models as Landau–Ginzburg theories", "audience": ["student"], "fold": true, "body": "<p>A two-dimensional <mjx-container data-tex=\"\\mathcal N=2\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.363ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"6.363ex\" height=\"1.971ex\" viewBox=\"0 -789 2812.6 871\"><g transform=\"scale(1,-1)\"><g><use data-c=\"4E\" href=\"#MJX-TEX-C-4E\"><\/use><use x=\"1256.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"2312.6\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/svg><\/mjx-container> theory of one chiral superfield <mjx-container data-tex=\"\\Phi\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.633ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"1.633ex\" height=\"1.545ex\" viewBox=\"0 -683 722 683\"><g transform=\"scale(1,-1)\"><use data-c=\"3A6\" href=\"#MJX-TEX-N-3A6\"><\/use><\/g><\/svg><\/mjx-container> with superpotential <mjx-container data-tex=\"W=\\Phi^q\" class=\"MathJax\" jax=\"SVG\" style=\"--w:7.945ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"7.945ex\" height=\"1.731ex\" viewBox=\"0 -683 3511.8 765\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D44A\" href=\"#MJX-TEX-I-1D44A\"><\/use><use x=\"1325.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2381.6)\"><use data-c=\"3A6\" href=\"#MJX-TEX-N-3A6\"><\/use><g transform=\"translate(755,363) scale(0.707)\"><use data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> flows in the infrared to a superconformal fixed point, the <mjx-container data-tex=\"A_{q-1}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.665ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.65ex;\" width=\"4.665ex\" height=\"2.27ex\" viewBox=\"0 -716 2062 1003.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D434\" href=\"#MJX-TEX-I-1D434\"><\/use><g transform=\"translate(783,-150) scale(0.707)\"><use data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><use x=\"460\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"1238\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> <a data-def=\"minimal-model\">minimal model<\/a>, with central charge <mjx-container data-tex=\"c=3(q-2)/q\" class=\"MathJax\" jax=\"SVG\" style=\"--w:13.998ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"13.998ex\" height=\"2.262ex\" viewBox=\"0 -750 6187 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D450\" href=\"#MJX-TEX-I-1D450\"><\/use><use x=\"710.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1766.6\" data-c=\"33\" href=\"#MJX-TEX-N-33\"><\/use><use x=\"2266.6\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"2655.6\" data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><use x=\"3337.8\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"4338\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><use x=\"4838\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"5227\" data-c=\"2F\" href=\"#MJX-TEX-N-2F\"><\/use><use x=\"5727\" data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><\/g><\/g><\/svg><\/mjx-container>. A theory of chiral superfields defined by its superpotential in this way is called a Landau–Ginzburg theory. The superpotential is not renormalized and must have R-charge 2, which fixes the R-charge of <mjx-container data-tex=\"\\Phi\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.633ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"1.633ex\" height=\"1.545ex\" viewBox=\"0 -683 722 683\"><g transform=\"scale(1,-1)\"><use data-c=\"3A6\" href=\"#MJX-TEX-N-3A6\"><\/use><\/g><\/svg><\/mjx-container> to <mjx-container data-tex=\"2/q\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.303ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"3.303ex\" height=\"2.262ex\" viewBox=\"0 -750 1460 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><use x=\"500\" data-c=\"2F\" href=\"#MJX-TEX-N-2F\"><\/use><use x=\"1000\" data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><\/g><\/g><\/svg><\/mjx-container> and its scaling dimension to <mjx-container data-tex=\"1/q\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.303ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"3.303ex\" height=\"2.262ex\" viewBox=\"0 -750 1460 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"500\" data-c=\"2F\" href=\"#MJX-TEX-N-2F\"><\/use><use x=\"1000\" data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><\/g><\/g><\/svg><\/mjx-container>. Its powers <mjx-container data-tex=\"\\Phi^k\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.655ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"2.655ex\" height=\"1.932ex\" viewBox=\"0 -853.7 1173.4 853.7\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"3A6\" href=\"#MJX-TEX-N-3A6\"><\/use><g transform=\"translate(755,363) scale(0.707)\"><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> with <mjx-container data-tex=\"k\\le q-2\" class=\"MathJax\" jax=\"SVG\" style=\"--w:9.133ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"9.133ex\" height=\"2.009ex\" viewBox=\"0 -694 4037 888\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><use x=\"798.8\" data-c=\"2264\" href=\"#MJX-TEX-N-2264\"><\/use><use x=\"1854.6\" data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><use x=\"2536.8\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"3537\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/svg><\/mjx-container> form the chiral ring. A superpotential term built from <mjx-container data-tex=\"q\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.041ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"1.041ex\" height=\"1.439ex\" viewBox=\"0 -442 460 636\"><g transform=\"scale(1,-1)\"><use data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><\/g><\/svg><\/mjx-container> chiral fields of dimension <mjx-container data-tex=\"1/q\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.303ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"3.303ex\" height=\"2.262ex\" viewBox=\"0 -750 1460 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"500\" data-c=\"2F\" href=\"#MJX-TEX-N-2F\"><\/use><use x=\"1000\" data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><\/g><\/g><\/svg><\/mjx-container> is classically marginal. Results of Green, Komargodski, Seiberg, Tachikawa and Wecht, and of Kol, show that, absent continuous non-R global symmetries, such terms are <a data-def=\"exactly-marginal\">exactly marginal<\/a>. For <mjx-container data-tex=\"q=3\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.189ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"5.189ex\" height=\"1.943ex\" viewBox=\"0 -665 2293.6 859\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><use x=\"737.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1793.6\" data-c=\"33\" href=\"#MJX-TEX-N-33\"><\/use><\/g><\/g><\/svg><\/mjx-container>, <mjx-container data-tex=\"c=1\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.128ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"5.128ex\" height=\"1.692ex\" viewBox=\"0 -666 2266.6 748\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D450\" href=\"#MJX-TEX-I-1D450\"><\/use><use x=\"710.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1766.6\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><\/svg><\/mjx-container> and the model is a free compact boson at a specific radius, so its chiral field is a vertex operator whose correlators are all known.<\/p>"}, {"id": "disordered-minimal-models-p2", "kind": "paragraph", "body": "<p>We can now attempt to compute <mjx-container data-tex=\"\\lambda_L(J)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.789ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"5.789ex\" height=\"2.262ex\" viewBox=\"0 -750 2558.5 1000\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,-150) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"1147.5\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1536.5\" data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><use x=\"2169.5\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> in perturbation theory. This computation is generically difficult, and so we focus on the case <mjx-container data-tex=\"q=3\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.189ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"5.189ex\" height=\"1.943ex\" viewBox=\"0 -665 2293.6 859\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><use x=\"737.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1793.6\" data-c=\"33\" href=\"#MJX-TEX-N-33\"><\/use><\/g><\/g><\/svg><\/mjx-container>, where a <a data-def=\"core\">core CFT<\/a> has central charge <mjx-container data-tex=\"c=1\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.128ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"5.128ex\" height=\"1.692ex\" viewBox=\"0 -666 2266.6 748\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D450\" href=\"#MJX-TEX-I-1D450\"><\/use><use x=\"710.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1766.6\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><\/svg><\/mjx-container> and so corresponds to the free compact boson at a specific radius. We can identify the operators <mjx-container data-tex=\"\\tilde{\\Phi}_i\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.373ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.357ex;\" width=\"2.373ex\" height=\"2.599ex\" viewBox=\"0 -991 1049 1148.8\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"3A6\" href=\"#MJX-TEX-N-3A6\"><\/use><g transform=\"translate(361,573) translate(-250 0)\"><use data-c=\"7E\" href=\"#MJX-TEX-N-7E\"><\/use><\/g><\/g><\/g><g transform=\"translate(755,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> in terms of vertex operators of the <mjx-container data-tex=\"c=1\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.128ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"5.128ex\" height=\"1.692ex\" viewBox=\"0 -666 2266.6 748\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D450\" href=\"#MJX-TEX-I-1D450\"><\/use><use x=\"710.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1766.6\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><\/svg><\/mjx-container> boson, and as a result we can read off all <mjx-container data-tex=\"n\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.357ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"1.357ex\" height=\"1.025ex\" viewBox=\"0 -442 600 453\"><g transform=\"scale(1,-1)\"><use data-c=\"1D45B\" href=\"#MJX-TEX-I-1D45B\"><\/use><\/g><\/svg><\/mjx-container>-point functions of the <mjx-container data-tex=\"\\tilde{\\Phi}_i\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.373ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.357ex;\" width=\"2.373ex\" height=\"2.599ex\" viewBox=\"0 -991 1049 1148.8\"><g transform=\"scale(1,-1)\"><g><g><g><g><use data-c=\"3A6\" href=\"#MJX-TEX-N-3A6\"><\/use><g transform=\"translate(361,573) translate(-250 0)\"><use data-c=\"7E\" href=\"#MJX-TEX-N-7E\"><\/use><\/g><\/g><\/g><g transform=\"translate(755,-150) scale(0.707)\"><use data-c=\"1D456\" href=\"#MJX-TEX-I-1D456\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. Using this result to compute the leading contribution to the <a data-def=\"retarded-kernel\">retarded kernel<\/a> at small <mjx-container data-tex=\"J\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.432ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.432ex\" height=\"1.595ex\" viewBox=\"0 -683 633 705\"><g transform=\"scale(1,-1)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><\/g><\/svg><\/mjx-container> given in <a href=\"#eq-k_in_pert_theory\">(10)<\/a>, we find that at small <mjx-container data-tex=\"J\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.432ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.432ex\" height=\"1.595ex\" viewBox=\"0 -683 633 705\"><g transform=\"scale(1,-1)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><\/g><\/svg><\/mjx-container> the exponent <mjx-container data-tex=\"\\lambda_L^{\\text{ker}}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.689ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.696ex;\" width=\"3.689ex\" height=\"2.628ex\" viewBox=\"0 -853.7 1630.5 1161.5\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,363) scale(0.707)\"><g><use data-c=\"6B\" href=\"#MJX-TEX-N-6B\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(528)\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(972)\"><\/use><\/g><\/g><g transform=\"translate(616,-307.7) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> approaches zero. As a result, we expect a continuous <a data-def=\"transition\">transition into chaos<\/a> in this model, as in figure <a href=\"#fig-discontinuouschaos\">1a<\/a>. In particular, the value of <mjx-container data-tex=\"\\lambda_L^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.596ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.7ex;\" width=\"2.596ex\" height=\"2.601ex\" viewBox=\"0 -840.1 1147.5 1149.4\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(616,-309.4) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> in a single <mjx-container data-tex=\"A_2\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.685ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.339ex;\" width=\"2.685ex\" height=\"1.959ex\" viewBox=\"0 -716 1186.6 866\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D434\" href=\"#MJX-TEX-I-1D434\"><\/use><g transform=\"translate(783,-150) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> <a data-def=\"minimal-model\">minimal model<\/a> is also zero, so that the conjecture <a href=\"#eq-continuity\">(13)<\/a> is again obeyed.<\/p>", "hash": "c0046592eab4", "gist": {"html": "At <mjx-container data-tex=\"q=3\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.189ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"5.189ex\" height=\"1.943ex\" viewBox=\"0 -665 2293.6 859\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><use x=\"737.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1793.6\" data-c=\"33\" href=\"#MJX-TEX-N-33\"><\/use><\/g><\/g><\/svg><\/mjx-container>, a <mjx-container data-tex=\"c=1\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.128ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"5.128ex\" height=\"1.692ex\" viewBox=\"0 -666 2266.6 748\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D450\" href=\"#MJX-TEX-I-1D450\"><\/use><use x=\"710.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1766.6\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><\/svg><\/mjx-container> boson per copy, <mjx-container data-tex=\"\\lambda_L^{\\text{ker}}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.689ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.696ex;\" width=\"3.689ex\" height=\"2.628ex\" viewBox=\"0 -853.7 1630.5 1161.5\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,363) scale(0.707)\"><g><use data-c=\"6B\" href=\"#MJX-TEX-N-6B\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(528)\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(972)\"><\/use><\/g><\/g><g transform=\"translate(616,-307.7) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> and <mjx-container data-tex=\"\\lambda_L^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.596ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.7ex;\" width=\"2.596ex\" height=\"2.601ex\" viewBox=\"0 -840.1 1147.5 1149.4\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(616,-309.4) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> both vanish: a continuous onset is expected.", "status": "ai-draft"}}], "gist": {"html": "For the disordered <mjx-container data-tex=\"A_2\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.685ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.339ex;\" width=\"2.685ex\" height=\"1.959ex\" viewBox=\"0 -716 1186.6 866\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D434\" href=\"#MJX-TEX-I-1D434\"><\/use><g transform=\"translate(783,-150) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> minimal model <mjx-container data-tex=\"\\lambda_L^{\\text{ker}}\\to0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:8.339ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.696ex;\" width=\"8.339ex\" height=\"2.628ex\" viewBox=\"0 -853.7 3686 1161.5\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,363) scale(0.707)\"><g><use data-c=\"6B\" href=\"#MJX-TEX-N-6B\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(528)\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(972)\"><\/use><\/g><\/g><g transform=\"translate(616,-307.7) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"1908.3\" data-c=\"2192\" href=\"#MJX-TEX-N-2192\"><\/use><use x=\"3186\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container> at weak coupling, so a continuous onset is expected.", "status": "ai-draft"}, "brief": {"html": "<p><span data-covers=\"disordered-minimal-models-p1\">Copies of the <mjx-container data-tex=\"\\mathcal N=2\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.363ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"6.363ex\" height=\"1.971ex\" viewBox=\"0 -789 2812.6 871\"><g transform=\"scale(1,-1)\"><g><use data-c=\"4E\" href=\"#MJX-TEX-C-4E\"><\/use><use x=\"1256.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"2312.6\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/svg><\/mjx-container> <mjx-container data-tex=\"A_{q-1}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.665ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.65ex;\" width=\"4.665ex\" height=\"2.27ex\" viewBox=\"0 -716 2062 1003.2\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D434\" href=\"#MJX-TEX-I-1D434\"><\/use><g transform=\"translate(783,-150) scale(0.707)\"><use data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><use x=\"460\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"1238\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> minimal model coupled by random superpotential terms are conformal for every realization, because every classically marginal operator there is exactly marginal.<\/span> <span data-covers=\"disordered-minimal-models-p2\">For <mjx-container data-tex=\"q=3\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.189ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"5.189ex\" height=\"1.943ex\" viewBox=\"0 -665 2293.6 859\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><use x=\"737.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1793.6\" data-c=\"33\" href=\"#MJX-TEX-N-33\"><\/use><\/g><\/g><\/svg><\/mjx-container> each copy is a <mjx-container data-tex=\"c=1\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.128ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"5.128ex\" height=\"1.692ex\" viewBox=\"0 -666 2266.6 748\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D450\" href=\"#MJX-TEX-I-1D450\"><\/use><use x=\"710.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1766.6\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><\/svg><\/mjx-container> compact boson, whose correlators are all known. The leading kernel then gives a putative exponent that tends to zero at weak coupling, so a continuous onset is expected.<\/span><\/p>", "status": "ai-draft"}}], "gist": {"html": "Disordered generalized free fields switch chaos on discontinuously, the <mjx-container data-tex=\"A_2\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.685ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.339ex;\" width=\"2.685ex\" height=\"1.959ex\" viewBox=\"0 -716 1186.6 866\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D434\" href=\"#MJX-TEX-I-1D434\"><\/use><g transform=\"translate(783,-150) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> minimal model continuously; both obey the conjecture.", "status": "ai-draft"}, "brief": {"html": "<p><span data-covers=\"disordered-generalized-free-fields-p5 disordered-generalized-free-fields-p6\">For disordered generalized free fields in 1d and 2d the putative exponent tends to <mjx-container data-tex=\"-2\\Delta\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.776ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"4.776ex\" height=\"1.805ex\" viewBox=\"0 -716 2111 798\"><g transform=\"scale(1,-1)\"><g><use data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"778\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><use x=\"1278\" data-c=\"394\" href=\"#MJX-TEX-N-394\"><\/use><\/g><\/g><\/svg><\/mjx-container> at weak coupling, so there is no chaos until a finite coupling: the onset is discontinuous.<\/span> <span data-covers=\"disordered-minimal-models-p2\">For the disordered <mjx-container data-tex=\"\\mathcal N=2\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.363ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"6.363ex\" height=\"1.971ex\" viewBox=\"0 -789 2812.6 871\"><g transform=\"scale(1,-1)\"><g><use data-c=\"4E\" href=\"#MJX-TEX-C-4E\"><\/use><use x=\"1256.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"2312.6\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/svg><\/mjx-container> <mjx-container data-tex=\"A_2\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.685ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.339ex;\" width=\"2.685ex\" height=\"1.959ex\" viewBox=\"0 -716 1186.6 866\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D434\" href=\"#MJX-TEX-I-1D434\"><\/use><g transform=\"translate(783,-150) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> minimal model it tends to zero instead, and a continuous onset is expected.<\/span> <span data-covers=\"disordered-generalized-free-fields-p5 disordered-minimal-models-p2\">In both classes the weak-coupling limit equals the late-time exponent <mjx-container data-tex=\"\\lambda_L^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.596ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.7ex;\" width=\"2.596ex\" height=\"2.601ex\" viewBox=\"0 -840.1 1147.5 1149.4\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(616,-309.4) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> of a single core CFT, as conjectured.<\/span><\/p>", "status": "ai-draft"}}, {"id": "acknowledgments", "kind": "section", "title": "Acknowledgments", "titleHtml": "Acknowledgments", "children": [{"id": "acknowledgments-p1", "kind": "paragraph", "body": "<p>We would like to thank O. Aharony, N. Brukner, C. Choi, Y. Jia, R.R. Kalloor, B. Lian, J. Maldacena, O. Mamroud, M. Mezei, M. Rangamani, V. Rosenhaus, D. Tong and M. Watanabe for useful conversations. This work was partly funded by an Israel Science Foundation center for excellence grant (grant number 2289/18), by grant no. 2018068 from the United States-Israel Binational Science Foundation (BSF), by the Minerva foundation with funding from the Federal German Ministry for Education and Research, by the German Research Foundation through a German-Israeli Project Cooperation (DIP) grant “Holography and the Swampland&quot;, and by a research grant from Martin Eisenstein. MB is the incumbent of the Charles and David Wolfson Professorial Chair of Theoretical Physics.<\/p>", "hash": "7d4fb10635b3"}]}, {"id": "footnotes", "kind": "footnotes", "title": "Footnotes", "body": "<section class=\"footnotes\" aria-labelledby=\"notes-h\"><h2 id=\"notes-h\">Notes<\/h2><ol class=\"fnlist\"><li id=\"fn1\"><a class=\"fnback\" href=\"#fnref1\" aria-label=\"Back to the text\">1<\/a><div class=\"fn-text\">It is important that <mjx-container data-tex=\"\\mathcal{O}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.801ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.801ex\" height=\"1.645ex\" viewBox=\"0 -705 796 727\"><g transform=\"scale(1,-1)\"><use data-c=\"4F\" href=\"#MJX-TEX-C-4F\"><\/use><\/g><\/svg><\/mjx-container> itself does not obtain an anomalous dimension as a function of <mjx-container data-tex=\"J\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.432ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.432ex\" height=\"1.595ex\" viewBox=\"0 -683 633 705\"><g transform=\"scale(1,-1)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><\/g><\/svg><\/mjx-container>, which will be the case in the examples in this letter.<\/div><\/li><li id=\"fn2\"><a class=\"fnback\" href=\"#fnref2\" aria-label=\"Back to the text\">2<\/a><div class=\"fn-text\">We implicitly assumed that the chaos exponent increases monotonically with the strength of the disorder <mjx-container data-tex=\"J\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.432ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.432ex\" height=\"1.595ex\" viewBox=\"0 -683 633 705\"><g transform=\"scale(1,-1)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><\/g><\/svg><\/mjx-container>. As we start with N decoupled systems it is reasonable, but not necessarily true. For example, an integrable deformation keeps the exponent at zero, but these are hard to come by in this context.<\/div><\/li><\/ol><\/section>", "hash": "85324b8c16be"}, {"id": "refs", "kind": "references", "title": "References", "body": "<section class=\"references\" aria-labelledby=\"refs-h\"><h2 id=\"refs-h\">References<\/h2><ol class=\"refs\"><li id=\"cite-PhysRevLett.70.3339\"><span class=\"reftext\"> S.  Sachdev and J.  Ye, <a href=\"\\doibase 10.1103/PhysRevLett.70.3339\"> Phys. Rev. Lett. <strong> 70<\/strong>, 3339 ( 1993)<\/a><\/span><\/li><li id=\"cite-KitaevTalk\"><span class=\"reftext\"> A.  Kitaev, <a href=\"https://online.kitp.ucsb.edu/online/entangled15/kitaev/\">“ A simple model of quantum holography,” <\/a> ( 2015 a), talks at KITP<\/span><\/li><li id=\"cite-Maldacena-2016hyu\"><span class=\"reftext\"> J.  Maldacena and D.  Stanford, <a href=\"\\doibase 10.1103/PhysRevD.94.106002\"> Phys. Rev. D <strong> 94<\/strong>, 106002 ( 2016)<\/a>, <a href=\"http://arxiv.org/abs/1604.07818\">arXiv:1604.07818 [hep-th]<\/a><\/span><\/li><li id=\"cite-Kitaev-2017awl\"><span class=\"reftext\"> A.  Kitaev and S. egrable deformation keeps the exponent at zero, but these are hard to come by in this context.<\/span><\/li><li id=\"cite-Stanford-2015owe\"><span class=\"reftext\"> D.  Stanford, <a href=\"\\doibase 10.1007/JHEP10(2016)009\"> JHEP <strong> 10<\/strong>, 009 ( 2016)<\/a>, <a href=\"http://arxiv.org/abs/1512.07687\">arXiv:1512.07687 [hep-th]<\/a><\/span><\/li><li id=\"cite-deMelloKoch-2019ywq\"><span class=\"reftext\"> R.  de Mello Koch, W.  LiMing, H. J. R. Van Zyl, and J. a. P. Rodrigues, <a href=\"\\doibase 10.1016/j.physletb.2019.04.044\"> Phys. Lett. B <strong> 793<\/strong>, 169 ( 2019)<\/a>, <a href=\"http://arxiv.org/abs/1902.06409\">arXiv:1902.06409 [hep-th]<\/a><\/span><\/li><li id=\"cite-Chowdhury-2017jzb\"><span class=\"reftext\"> D.  Chowdhury and B.  Swingle, <a href=\"\\doibase 10.1103/PhysRevD.96.065005\"> Phys. Rev. D <strong> 96<\/strong>, 065005 ( 2017)<\/a>, <a href=\"http://arxiv.org/abs/1703.02545\">arXiv:1703.02545 [cond-mat.str-el]<\/a><\/span><\/li><li id=\"cite-Steinberg-2019uqb\"><span class=\"reftext\"> J.  Steinberg and B.  Swingle, <a href=\"\\doibase 10.1103/PhysRevD.99.076007\"> Phys. Rev. D <strong> 99<\/strong>, 076007 ( 2019)<\/a>, <a href=\"http://arxiv.org/abs/1901.04984\">arXiv:1901.04984 [cond-mat.str-el]<\/a><\/span><\/li><li id=\"cite-Hu-2021hsj\"><span class=\"reftext\"> Y.  Hu and B.  Lian, ( 2021), <a href=\"http://arxiv.org/abs/2109.13263\">arXiv:2109.13263 [cond-mat.str-el]<\/a><\/span><\/li><li id=\"cite-Berkooz-2021ehv\"><span class=\"reftext\"> M.  Berkooz, A.  Sharon, N.  Silberstein, and E. Y. Urbach, ( 2021), <a href=\"http://arxiv.org/abs/2111.06108\">arXiv:2111.06108 [hep-th]<\/a><\/span><\/li><li id=\"cite-Caron-Huot-2017vep\"><span class=\"reftext\"> S.  Caron-Huot, <a href=\"\\doibase 10.1007/JHEP09(2017)078\"> JHEP <strong> 09<\/strong>, 078 ( 2017)<\/a>, <a href=\"http://arxiv.org/abs/1703.00278\">arXiv:1703.00278 [hep-th]<\/a><\/span><\/li><li id=\"cite-Maldacena-2015waa\"><span class=\"reftext\"> J.  Maldacena, S. H. Shenker, and D.  Stanford, <a href=\"\\doibase 10.1007/JHEP08(2016)106\"> JHEP <strong> 08<\/strong>, 106 ( 2016)<\/a>, <a href=\"http://arxiv.org/abs/1503.01409\">arXiv:1503.01409 [hep-th]<\/a><\/span><\/li><li id=\"cite-Green-2010da\"><span class=\"reftext\"> D.  Green, Z.  Komargodski, N.  Seiberg, Y.  Tachikawa, and B.  Wecht, <a href=\"\\doibase\n 10.1007/JHEP06(2010)106\"> JHEP <strong> 06<\/strong>, 106 ( 2010)<\/a>, <a href=\"http://arxiv.org/abs/1005.3546\">arXiv:1005.3546 [hep-th]<\/a><\/span><\/li><li id=\"cite-Kol-2002zt\"><span class=\"reftext\"> B.  Kol, <a href=\"\\doibase 10.1088/1126-6708/2002/09/046\"> JHEP <strong> 09<\/strong>, 046 ( 2002)<\/a>, <a href=\"http://arxiv.org/abs/hep-th/0205141\">arXiv:hep-th/0205141<\/a><\/span><\/li><li id=\"cite-Kol-2010ub\"><span class=\"reftext\"> B.  Kol, ( 2010), <a href=\"http://arxiv.org/abs/1005.4408\">arXiv:1005.4408 [hep-th]<\/a><\/span><\/li><\/ol><\/section>", "hash": "b5e71b534153"}], "gist": {"html": "<ul class=\"gist-list\">\n<li><b>Context<\/b> <span data-covers=\"introduction-p1 introduction-p5\">SYK-like disorder gives the chaos exponent <mjx-container data-tex=\"\\lambda_L\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.596ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.339ex;\" width=\"2.596ex\" height=\"1.91ex\" viewBox=\"0 -694 1147.5 844\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,-150) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, usually only at infinite coupling. How does chaos start?<\/span><\/li>\n<li><b>Result<\/b><ul>\n  <li data-claims=\"c-kernel\"><span data-covers=\"the-kernel-structure-of-the-four-point-function-p1 the-kernel-structure-of-the-four-point-function-p3 the-double-commutator-and-chaos-p2\">Randomly coupled copies of any CFT obey SYK-like large-<mjx-container data-tex=\"N\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.009ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"2.009ex\" height=\"1.545ex\" viewBox=\"0 -683 888 683\"><g transform=\"scale(1,-1)\"><use data-c=\"1D441\" href=\"#MJX-TEX-I-1D441\"><\/use><\/g><\/svg><\/mjx-container> equations; their ladder kernel gives a putative exponent.<\/span><\/li>\n  <li data-claims=\"c-marginal\"><span data-covers=\"the-double-commutator-and-chaos-p3 the-double-commutator-and-chaos-p4\">Exactly marginal disorder keeps the theory conformal at every coupling, so <mjx-container data-tex=\"\\lambda_L\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.596ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.339ex;\" width=\"2.596ex\" height=\"1.91ex\" viewBox=\"0 -694 1147.5 844\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,-150) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> can be followed from weak to strong.<\/span><\/li>\n  <li data-claims=\"c-gff\"><span data-covers=\"disordered-generalized-free-fields-p5 disordered-generalized-free-fields-p6\">Disordered generalized free fields have weak-coupling putative exponent <mjx-container data-tex=\"-2\\Delta&lt;0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:8.924ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"8.924ex\" height=\"1.805ex\" viewBox=\"0 -716 3944.6 798\"><g transform=\"scale(1,-1)\"><g><use data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"778\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><use x=\"1278\" data-c=\"394\" href=\"#MJX-TEX-N-394\"><\/use><use x=\"2388.8\" data-c=\"3C\" href=\"#MJX-TEX-N-3C\"><\/use><use x=\"3444.6\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container>: a discontinuous onset, at finite coupling.<\/span><\/ /span><\/li>\n<li><b>Result<\/b><ul>\n  <li data-claims=\"c-kernel\"><span data-covers=\"the-kernel-structure-of-the-four-point-function-p1 the-kernel-structure-of-the-four-point-function-p3 the-double-commutator-and-chaos-p2\">Randomly coupled copies of any conformal theory obey SYK-like equations; a ladder kernel gives a putative exponent.<\/span><\/li>\n  <li data-claims=\"c-marginal\"><span data-covers=\"the-double-commutator-and-chaos-p3 the-double-commutator-and-chaos-p4\">If the coupling never runs (exactly marginal), the theory stays conformal, so <mjx-container data-tex=\"\\lambda_L\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.596ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.339ex;\" width=\"2.596ex\" height=\"1.91ex\" viewBox=\"0 -694 1147.5 844\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,-150) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> can be followed from weak to strong.<\/span><\/li>\n  <li data-claims=\"c-gff\"><span data-covers=\"disordered-generalized-free-fields-p5 disordered-generalized-free-fields-p6\">Disordered generalized free fields have a negative putative exponent at weak coupling: a discontinuous onset, at finite coupling.<\/span><\/li>\n  <li data-claims=\"c-minimal\"><span data-covers=\"disordered-minimal-models-p2\">A disordered supersymmetric minimal model's exponent tends to zero at small coupling: chaos should start continuously.<\/span><\/li>\n<\/ul><\/li>\n<li><b>Why it matters<\/b> <span data-covers=\"introduction-p7\">The paper calls the discontinuous transition into chaos surprising, comparing it with classical KAM theory.<\/span><\/li>\n<\/ul>", "status": "ai-draft"}}}, "brief": {"html": "<p><span data-covers=\"introduction-p1\">The chaos exponent <mjx-container data-tex=\"\\lambda_L\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.596ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.339ex;\" width=\"2.596ex\" height=\"1.91ex\" viewBox=\"0 -694 1147.5 844\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,-150) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> is the growth rate of a thermal double commutator, a quantum Lyapunov exponent. Averaging over random couplings, as in the SYK model, makes it computable at large <mjx-container data-tex=\"N\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.009ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"2.009ex\" height=\"1.545ex\" viewBox=\"0 -683 888 683\"><g transform=\"scale(1,-1)\"><use data-c=\"1D441\" href=\"#MJX-TEX-I-1D441\"><\/use><\/g><\/svg><\/mjx-container>.<\/span> <span data-covers=\"introduction-p5\">But such disorder is usually relevant, so <mjx-container data-tex=\"\\lambda_L\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.596ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.339ex;\" width=\"2.596ex\" height=\"1.91ex\" viewBox=\"0 -694 1147.5 844\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,-150) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> is found only in the infrared, at effectively infinite coupling.<\/span> <span data-covers=\"introduction-p3 introduction-p5\">The paper couples <mjx-container data-tex=\"N\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.009ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"2.009ex\" height=\"1.545ex\" viewBox=\"0 -683 888 683\"><g transform=\"scale(1,-1)\"><use data-c=\"1D441\" href=\"#MJX-TEX-I-1D441\"><\/use><\/g><\/svg><\/mjx-container> copies of a core CFT by random, exactly marginal interactions of strength <mjx-container data-tex=\"J\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.432ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.432ex\" height=\"1.595ex\" viewBox=\"0 -683 633 705\"><g transform=\"scale(1,-1)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><\/g><\/svg><\/mjx-container>, and follows <mjx-container data-tex=\"\\lambda_L\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.596ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.339ex;\" width=\"2.596ex\" height=\"1.91ex\" viewBox=\"0 -694 1147.5 844\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,-150) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> from weak to strong coupling.<\/span> <span data-covers=\"disordered-generalized-free-fields-p5 disordered-minimal-models-p2\">Chaos then sets in either at once or only at a finite coupling: disordered generalized free fields show the second, a disordered minimal model the first.<\/span> <span data-covers=\"introduction-p7\">The paper compares the delayed onset with classical chaos, above all the KAM theorem.<\/span><\/p>\n<p><span data-covers=\"the-kernel-structure-of-the-four-point-function-p1 the-kernel-structure-of-the-four-point-function-p2\">At leading order in <mjx-container data-tex=\"1/N\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.271ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"4.271ex\" height=\"2.262ex\" viewBox=\"0 -750 1888 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"500\" data-c=\"2F\" href=\"#MJX-TEX-N-2F\"><\/use><use x=\"1000\" data-c=\"1D441\" href=\"#MJX-TEX-I-1D441\"><\/use><\/g><\/g><\/svg><\/mjx-container> the averaged two-point function obeys a Schwinger–Dyson equation like SYK's, but every correlator of the core CFT enters it, through theory-independent “subtracted” combinations.<\/span> <span data-covers=\"the-kernel-structure-of-the-four-point-function-p3\">The four-point function is still a sum of ladders built from one kernel.<\/span> <span data-covers=\"the-double-commutator-and-chaos-p2 the-double-commutator-and-chaos-p3\">So is the double commutator, with a retarded kernel. The largest <mjx-container data-tex=\"\\lambda\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.319ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.027ex;\" width=\"1.319ex\" height=\"1.597ex\" viewBox=\"0 -694 583 706\"><g transform=\"scale(1,-1)\"><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><\/g><\/svg><\/mjx-container> at which that kernel has eigenvalue one, <mjx-container data-tex=\"\\lambda_L^{\\text{ker}}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.689ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.696ex;\" width=\"3.689ex\" height=\"2.628ex\" viewBox=\"0 -853.7 1630.5 1161.5\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,363) scale(0.707)\"><g><use data-c=\"6B\" href=\"#MJX-TEX-N-6B\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(528)\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(972)\"><\/use><\/g><\/g><g transform=\"translate(616,-307.7) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, is the chaos exponent when positive; otherwise there is no chaos, and <mjx-container data-tex=\"\\lambda_L=\\max(0,\\lambda_L^{\\text{ker}})\" class=\"MathJax\" jax=\"SVG\" style=\"--w:17.41ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.696ex;\" width=\"17.41ex\" height=\"2.628ex\" viewBox=\"0 -853.7 7695.3 1161.5\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,-150) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"1425.3\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(2481.1)\"><use data-c=\"6D\" href=\"#MJX-TEX-N-6D\"><\/use><use data-c=\"61\" href=\"#MJX-TEX-N-61\" transform=\"translate(833)\"><\/use><use data-c=\"78\" href=\"#MJX-TEX-N-78\" transform=\"translate(1333)\"><\/use><\/g><use x=\"4342.1\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"4731.1\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><use x=\"5231.1\" data-c=\"2C\" href=\"#MJX-TEX-N-2C\"><\/use><g transform=\"translate(5675.8)\"><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,363) scale(0.707)\"><g><use data-c=\"6B\" href=\"#MJX-TEX-N-6B\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(528)\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(972)\"><\/use><\/g><\/g><g transform=\"translate(616,-307.7) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"7306.3\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>.<\/span><\/p>\n<p><span data-covers=\"introduction-p5 the-double-commutator-and-chaos-p4\">With exactly marginal disorder every realization is conformal, and the kernel's eigenvalue is a series in <mjx-container data-tex=\"J\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.432ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.432ex\" height=\"1.595ex\" viewBox=\"0 -683 633 705\"><g transform=\"scale(1,-1)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><\/g><\/svg><\/mjx-container>, each order needing finitely many core correlators.<\/span> <span data-covers=\"the-double-commutator-and-chaos-p5\">The leading order fixes <mjx-container data-tex=\"\\lambda_L^{\\text{ker}}(0^+)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:8.013ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.696ex;\" width=\"8.013ex\" height=\"2.628ex\" viewBox=\"0 -853.7 3541.6 1161.5\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,363) scale(0.707)\"><g><use data-c=\"6B\" href=\"#MJX-TEX-N-6B\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(528)\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(972)\"><\/use><\/g><\/g><g transform=\"translate(616,-307.7) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"1630.5\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><g transform=\"translate(2019.5)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><g transform=\"translate(533,363) scale(0.707)\"><use data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><\/g><\/g><use x=\"3152.6\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container>, and its sign decides the onset: continuous if positive, discontinuous if negative.<\/span> <span data-covers=\"the-double-commutator-and-chaos-p6 the-double-commutator-and-chaos-p7\">The paper conjectures <mjx-container data-tex=\"\\lambda_L^{\\text{ker}}(0^+)=\\lambda_L^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:13.626ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.7ex;\" width=\"13.626ex\" height=\"2.631ex\" viewBox=\"0 -853.7 6022.7 1163.1\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,363) scale(0.707)\"><g><use data-c=\"6B\" href=\"#MJX-TEX-N-6B\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(528)\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(972)\"><\/use><\/g><\/g><g transform=\"translate(616,-307.7) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"1630.5\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><g transform=\"translate(2019.5)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><g transform=\"translate(533,363) scale(0.707)\"><use data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><\/g><\/g><use x=\"3152.6\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"3819.4\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(4875.2)\"><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(616,-309.4) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>, the late-time exponent of the double commutator of one decoupled core CFT, never positive in unitary 2d theories. A single core CFT would then decide how chaos sets in.<\/span><\/p>\n<p><span data-covers=\"disordered-generalized-free-fields-p2 disordered-generalized-free-fields-p3\">In 1d the cSYK model couples generalized free fermions of dimension <mjx-container data-tex=\"\\Delta=1/q\" class=\"MathJax\" jax=\"SVG\" style=\"--w:8.205ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"8.205ex\" height=\"2.262ex\" viewBox=\"0 -750 3626.6 1000\"><g transform=\"scale(1,-1)\"><g><use data-c=\"394\" href=\"#MJX-TEX-N-394\"><\/use><use x=\"1110.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"2166.6\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><use x=\"2666.6\" data-c=\"2F\" href=\"#MJX-TEX-N-2F\"><\/use><use x=\"3166.6\" data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><\/g><\/g><\/svg><\/mjx-container>, and its kernel is known in closed form.<\/span> <span data-covers=\"disordered-generalized-free-fields-p5\">The putative exponent rises to the maximal value 1 at strong coupling but tends to <mjx-container data-tex=\"-2\\Delta\" class=\"MathJax\" jax=\"SVG\" style=\"--w:4.776ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"4.776ex\" height=\"1.805ex\" viewBox=\"0 -716 2111 798\"><g transform=\"scale(1,-1)\"><g><use data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"778\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><use x=\"1278\" data-c=\"394\" href=\"#MJX-TEX-N-394\"><\/use><\/g><\/g><\/svg><\/mjx-container> at weak coupling. So there is no chaos below a finite coupling, and <mjx-container data-tex=\"\\lambda_L^0=-2\\Delta\" class=\"MathJax\" jax=\"SVG\" style=\"--w:10.389ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.7ex;\" width=\"10.389ex\" height=\"2.601ex\" viewBox=\"0 -840.1 4592.1 1149.4\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(616,-309.4) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"1425.3\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"2481.1\" data-c=\"2212\" href=\"#MJX-TEX-N-2212\"><\/use><use x=\"3259.1\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><use x=\"3759.1\" data-c=\"394\" href=\"#MJX-TEX-N-394\"><\/use><\/g><\/g><\/svg><\/mjx-container> agrees with the conjecture.<\/span> <span data-covers=\"disordered-generalized-free-fields-p6\">The 2d supersymmetric version, conformal even at finite <mjx-container data-tex=\"N\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.009ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"2.009ex\" height=\"1.545ex\" viewBox=\"0 -683 888 683\"><g transform=\"scale(1,-1)\"><use data-c=\"1D441\" href=\"#MJX-TEX-I-1D441\"><\/use><\/g><\/svg><\/mjx-container>, behaves the same way.<\/span> <span data-covers=\"disordered-minimal-models-p1 disordered-minimal-models-p2\">Copies of the supersymmetric <mjx-container data-tex=\"A_2\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.685ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.339ex;\" width=\"2.685ex\" height=\"1.959ex\" viewBox=\"0 -716 1186.6 866\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D434\" href=\"#MJX-TEX-I-1D434\"><\/use><g transform=\"translate(783,-150) scale(0.707)\"><use data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> minimal model, each a <mjx-container data-tex=\"c=1\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.128ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"5.128ex\" height=\"1.692ex\" viewBox=\"0 -666 2266.6 748\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D450\" href=\"#MJX-TEX-I-1D450\"><\/use><use x=\"710.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1766.6\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><\/svg><\/mjx-container> boson, are exactly marginally coupled. Their leading kernel gives an exponent tending to zero, so a continuous onset is expected, again with <mjx-container data-tex=\"\\lambda_L^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.596ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.7ex;\" width=\"2.596ex\" height=\"2.601ex\" viewBox=\"0 -840.1 1147.5 1149.4\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(616,-309.4) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> matching.<\/span><\/p>\n<p><span data-covers=\"the-double-commutator-and-chaos-p7\">The equality of <mjx-container data-tex=\"\\lambda_L^{\\text{ker}}(0^+)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:8.013ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"ver
