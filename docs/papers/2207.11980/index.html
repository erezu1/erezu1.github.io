, at effectively infinite coupling. If the disorder is exactly marginal, every realization of the couplings is conformal, the average is over a conformal manifold, and the kernel's eigenvalue can be expanded order by order in <mjx-container data-tex=\"J\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.432ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.432ex\" height=\"1.595ex\" viewBox=\"0 -683 633 705\"><g transform=\"scale(1,-1)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><\/g><\/svg><\/mjx-container>. Only then can one see how chaos starts at weak coupling.", "answeredBy": ["introduction-p5", "the-double-commutator-and-chaos-p4"]}, {"id": "q-lambda0", "at": {"node": "the-double-commutator-and-chaos-p7"}, "source": "ai", "status": "draft", "q": "Why should a single, undeformed core CFT decide how chaos sets in?", "a": "At weak coupling the leading term of <mjx-container data-tex=\"k_R(\\lambda)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.66ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.566ex;\" width=\"5.66ex\" height=\"2.262ex\" viewBox=\"0 -750 2501.7 1000\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D458\" href=\"#MJX-TEX-I-1D458\"><\/use><g transform=\"translate(554,-150) scale(0.707)\"><use data-c=\"1D445\" href=\"#MJX-TEX-I-1D445\"><\/use><\/g><\/g><use x=\"1140.7\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><use x=\"1529.7\" data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><use x=\"2112.7\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> is an integral of a core CFT commutator, and <mjx-container data-tex=\"\\lambda_L^{\\text{ker}}(0^+)\" class=\"MathJax\" jax=\"SVG\" style=\"--w:8.013ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.696ex;\" width=\"8.013ex\" height=\"2.628ex\" viewBox=\"0 -853.7 3541.6 1161.5\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,363) scale(0.707)\"><g><use data-c=\"6B\" href=\"#MJX-TEX-N-6B\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(528)\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(972)\"><\/use><\/g><\/g><g transform=\"translate(616,-307.7) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"1630.5\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><g transform=\"translate(2019.5)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><g transform=\"translate(533,363) scale(0.707)\"><use data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><\/g><\/g><use x=\"3152.6\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><\/g><\/g><\/svg><\/mjx-container> is the largest <mjx-container data-tex=\"\\lambda\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.319ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.027ex;\" width=\"1.319ex\" height=\"1.597ex\" viewBox=\"0 -694 583 706\"><g transform=\"scale(1,-1)\"><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><\/g><\/svg><\/mjx-container> at which it diverges. The divergence comes from large negative times, where the core CFT's double commutator behaves as <mjx-container data-tex=\"e^{\\lambda_L^0t}\" class=\"MathJax\" jax=\"SVG\" style=\"--w:3.655ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.025ex;\" width=\"3.655ex\" height=\"2.19ex\" viewBox=\"0 -957 1615.7 968\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D452\" href=\"#MJX-TEX-I-1D452\"><\/use><g transform=\"translate(499,363) scale(0.707)\"><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(616,-309.4) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"1147.5\" data-c=\"1D461\" href=\"#MJX-TEX-I-1D461\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container>. So, under reasonable assumptions argued in a companion paper, the two agree, and the paper conjectures this in general.", "answeredBy": ["the-double-commutator-and-chaos-p5", "the-double-commutator-and-chaos-p7"]}, {"id": "q-large-j", "at": {"node": "disordered-generalized-free-fields"}, "source": "ai", "status": "draft", "q": "What happens at strong disorder in the examples?", "a": "For the 1d cSYK model the putative exponent approaches the maximal value <mjx-container data-tex=\"\\lambda_L=1\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.745ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.339ex;\" width=\"6.745ex\" height=\"1.91ex\" viewBox=\"0 -694 2981.1 844\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,-150) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"1425.3\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"2481.1\" data-c=\"31\" href=\"#MJX-TEX-N-31\"><\/use><\/g><\/g><\/svg><\/mjx-container> at large <mjx-container data-tex=\"J\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.432ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.432ex\" height=\"1.595ex\" viewBox=\"0 -683 633 705\"><g transform=\"scale(1,-1)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><\/g><\/svg><\/mjx-container>, as in the SYK model, for any <mjx-container data-tex=\"\\Delta\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.885ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: 0;\" width=\"1.885ex\" height=\"1.62ex\" viewBox=\"0 -716 833 716\"><g transform=\"scale(1,-1)\"><use data-c=\"394\" href=\"#MJX-TEX-N-394\"><\/use><\/g><\/svg><\/mjx-container>. For the 2d <mjx-container data-tex=\"\\mathcal N=2\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.363ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.186ex;\" width=\"6.363ex\" height=\"1.971ex\" viewBox=\"0 -789 2812.6 871\"><g transform=\"scale(1,-1)\"><g><use data-c=\"4E\" href=\"#MJX-TEX-C-4E\"><\/use><use x=\"1256.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"2312.6\" data-c=\"32\" href=\"#MJX-TEX-N-32\"><\/use><\/g><\/g><\/svg><\/mjx-container> generalized free fields it approaches the value of the 2d supersymmetric versions of SYK. Between weak and strong coupling both curves are computed exactly, which is what exact marginality buys.", "answeredBy": ["disordered-generalized-free-fields-p5", "disordered-generalized-free-fields-p6", "fig-GFFchaos"]}, {"id": "q-kam", "at": {"node": "introduction-p7"}, "source": "ai", "status": "draft", "q": "How far does the comparison with the KAM theorem go?", "a": "The paper calls it tempting: in both, weak perturbations leave a system without chaos, which appears only beyond a finite strength. To sharpen the comparison it asks what a single core CFT must obey for the onset to be discontinuous, and answers through the conjecture, <mjx-container data-tex=\"\\lambda_L^0&lt;0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:6.745ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.7ex;\" width=\"6.745ex\" height=\"2.601ex\" viewBox=\"0 -840.1 2981.1 1149.4\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(616,-309.4) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"1425.3\" data-c=\"3C\" href=\"#MJX-TEX-N-3C\"><\/use><use x=\"2481.1\" data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><\/g><\/svg><\/mjx-container>. It does not formulate or prove a quantum analogue of the theorem.", "answeredBy": ["introduction-p7", "the-double-commutator-and-chaos-p7"]}, {"id": "q-not-shown", "at": {"node": "disordered-minimal-models"}, "source": "ai", "status": "draft", "q": "What does the paper not show?", "a": "The equality <mjx-container data-tex=\"\\lambda_L^{\\text{ker}}(0^+)=\\lambda_L^0\" class=\"MathJax\" jax=\"SVG\" style=\"--w:13.626ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.7ex;\" width=\"13.626ex\" height=\"2.631ex\" viewBox=\"0 -853.7 6022.7 1163.1\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,363) scale(0.707)\"><g><use data-c=\"6B\" href=\"#MJX-TEX-N-6B\"><\/use><use data-c=\"65\" href=\"#MJX-TEX-N-65\" transform=\"translate(528)\"><\/use><use data-c=\"72\" href=\"#MJX-TEX-N-72\" transform=\"translate(972)\"><\/use><\/g><\/g><g transform=\"translate(616,-307.7) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><use x=\"1630.5\" data-c=\"28\" href=\"#MJX-TEX-N-28\"><\/use><g transform=\"translate(2019.5)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><g transform=\"translate(533,363) scale(0.707)\"><use data-c=\"2B\" href=\"#MJX-TEX-N-2B\"><\/use><\/g><\/g><use x=\"3152.6\" data-c=\"29\" href=\"#MJX-TEX-N-29\"><\/use><use x=\"3819.4\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><g transform=\"translate(4875.2)\"><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,369.2) scale(0.707)\"><use data-c=\"30\" href=\"#MJX-TEX-N-30\"><\/use><\/g><g transform=\"translate(616,-309.4) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> is a conjecture, argued in a companion paper under reasonable assumptions and checked in the two examples. For the minimal model only the leading weak-coupling kernel is computed, for <mjx-container data-tex=\"q=3\" class=\"MathJax\" jax=\"SVG\" style=\"--w:5.189ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.439ex;\" width=\"5.189ex\" height=\"1.943ex\" viewBox=\"0 -665 2293.6 859\"><g transform=\"scale(1,-1)\"><g><use data-c=\"1D45E\" href=\"#MJX-TEX-I-1D45E\"><\/use><use x=\"737.8\" data-c=\"3D\" href=\"#MJX-TEX-N-3D\"><\/use><use x=\"1793.6\" data-c=\"33\" href=\"#MJX-TEX-N-33\"><\/use><\/g><\/g><\/svg><\/mjx-container>, so the continuous onset is expected rather than followed to strong coupling. The classification assumes <mjx-container data-tex=\"\\lambda_L\" class=\"MathJax\" jax=\"SVG\" style=\"--w:2.596ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.339ex;\" width=\"2.596ex\" height=\"1.91ex\" viewBox=\"0 -694 1147.5 844\"><g transform=\"scale(1,-1)\"><g><g><use data-c=\"1D706\" href=\"#MJX-TEX-I-1D706\"><\/use><g transform=\"translate(616,-150) scale(0.707)\"><use data-c=\"1D43F\" href=\"#MJX-TEX-I-1D43F\"><\/use><\/g><\/g><\/g><\/g><\/svg><\/mjx-container> grows monotonically with <mjx-container data-tex=\"J\" class=\"MathJax\" jax=\"SVG\" style=\"--w:1.432ex\"><span class=\"mjx-hl\" aria-hidden=\"true\"><\/span><svg style=\"vertical-align: -0.05ex;\" width=\"1.432ex\" height=\"1.595ex\" viewBox=\"0 -683 633 705\"><g transform=\"scale(1,-1)\"><use data-c=\"1D43D\" href=\"#MJX-TEX-I-1D43D\"><\/use><\/g><\/svg><\/mjx-container>.", "answeredBy": ["the-double-commutator-and-chaos-p7", "disordered-minimal-models-p2", "footnotes"]}]}</script>
<script>
// Conifer viewer. The dial chooses which document is read (gist, summary, paper, everything); each is a clean linear
// text. A tap on something in the text opens a peek (a sheet) with the related material: the paragraphs a summary
// sentence stands for, a definition, a footnote, an equation. The peek's header is the link into the paper, and
// travelling leaves a way back. Inline expansion exists only for folds (appendices, proofs, background notes).
(function () {
  'use strict';
  const mark = n => { try { performance.mark('conifer:' + n); } catch (e) {} };   // (startup phases, for measuring: see DESIGN.md)
  mark('start');
  document.querySelectorAll('link[data-font]').forEach(l => { l.media = 'all'; });   // the fonts, not blocking the first paint (build)
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = t => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const DOC = JSON.parse($('#conifer-doc').textContent);
  mark('parsed');
  const LEVELS = DOC.levels;
  const IDX = Object.fromEntries(LEVELS.map((l, i) => [l.key, i]));
  const GIST = IDX.gist ?? 0, BRIEF = IDX.brief ?? 1, SKIM = IDX.skim, PAPER = IDX.paper ?? LEVELS.length - 2, FULL = IDX.full ?? Infinity;      // (no tree declares an Everything level now: a fold opens by itself, never by depth)
  const LEVEL_HASH = LEVELS.map(l => ({ gist: 'gist', brief: 'summary', skim: 'skim', paper: 'paper', full: 'everything' })[l.key] || l.key);
  const BOX = { theorem: 'Theorem', definition: 'Definition', remark: 'Remark', proof: 'Proof', lemma: 'Lemma' };
  const HEADED = { references: 'References', footnotes: 'Footnotes', abstract: 'Abstract' };
  const titleOf = n => n.titleHtml || esc(n.title || '');
  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ------------------------------------------------------------------ the index
  const byId = new Map(), parentOf = new Map();
  (function walk(n, p) { byId.set(n.id, n); parentOf.set(n.id, p); (n.children || []).forEach(c => walk(c, n.id)); })(DOC.root, null);
  const defs = new Map((DOC.defs || []).map(d => [d.id, d]));
  const qsAt = new Map();
  (DOC.questions || []).forEach(q => { const k = q.at.node; if (!qsAt.has(k)) qsAt.set(k, []); qsAt.get(k).push(q); });
  const descendants = id => { const out = []; (function w(n) { out.push(n.id); (n.children || []).forEach(w); })(byId.get(id)); return out; };
  const questionsUnder = id => descendants(id).flatMap(i => qsAt.get(i) || []);
  const ancestors = id => { const out = []; let p = parentOf.get(id); while (p) { out.unshift(p); p = parentOf.get(p); } return out; };
  const depth = id => ancestors(id).length;
  const titled = id => { let n = byId.get(id); while (n && !n.title) n = byId.get(parentOf.get(n.id)); return n; };
  const anchorHost = new Map();          // an id inside a body (equation, footnote, figure, reference) -> the node holding it
  byId.forEach(n => { if (n.body) for (const m of n.body.matchAll(/ id="([^"]+)"/g)) anchorHost.set(m[1], n.id); });
  const words = h => (String(h || '').replace(/<[^>]+>/g, ' ').match(/[A-Za-z0-9Ͱ-Ͽ][^\s]*/g) || []).length;
  const texText = t => String(t || '').replace(/\\(?:mathcal|mathbb|mathrm|text|textrm|bf|rm)\{([^}]*)\}/g, '$1').replace(/\\([A-Za-z]+)/g, '$1').replace(/[${}]/g, '');
  const shortLabel = n => !n ? '' : n.number ? (n.kind === 'appendix' ? 'App. ' : '§') + n.number : (n.title || n.id);
  function placeName(id) { const t = titled(id); if (!t) return id; return texText(t.number ? shortLabel(t) + ' ' + t.title : t.title); }
  function placeHtml(id) { const t = titled(id); if (!t) return esc(id); return (t.number ? esc(shortLabel(t)) + ' ' : '') + titleOf(t); }
  const isFold = n => !!n.fold || n.kind === 'background';

  mark('indexed');
  // ------------------------------------------------------------------ the state
  const AUD = DOC.audiences || [];
  const state = { level: 0, over: new Map(), ledes: 'auto', chips: 'auto', theme: 'system',
    audience: (DOC.meta && DOC.meta.defaultAudience) || (AUD[0] && AUD[0].key) || '' };
  const audLabel = k => { const a = AUD.find(x => x.key === k); return a ? a.label : k; };
  const pick = t => (t && t.variants && t.variants[state.audience]) || t;
  const forMe = n => !n.audience || n.audience.includes(state.audience);
  const openByDefault = n => state.audience === 'student' && forMe(n);
  const skimHidden = () => SKIM !== undefined && state.audience === 'student';
  const ledesOn = () => state.ledes === true;                    // briefs are folded unless the reader opens them all
  const chipsOn = () => state.chips === true || (state.chips === 'auto' && state.audience !== 'specialist');
  function load() { try { const s = JSON.parse(localStorage.getItem('conifer-reader') || '{}'); ['ledes', 'chips', 'level', 'theme', 'audience'].forEach(k => { if (k in s && (k !== 'ledes' || s.lv === 2)) state[k] = s[k]; });
      if (!(state.level >= 0 && state.level < LEVELS.length)) state.level = Math.min(Math.max(+state.level || 0, 0), LEVELS.length - 1); } catch (e) {} }
  function save() { try { localStorage.setItem('conifer-reader', JSON.stringify({ lv: 2, level: state.level, ledes: state.ledes, chips: state.chips, theme: state.theme, audience: state.audience })); } catch (e) {} }
  function applyTheme() { const r = document.documentElement; if (state.theme === 'light' || state.theme === 'dark') r.dataset.theme = state.theme; else delete r.dataset.theme; }

  // terms: a mention of a defined term is a link only for the readers it is meant for
  const audienceDefs = html => html.replace(/<a data-def="([^"]+)">([\s\S]*?)<\/a>/g, (m, id, txt) => { const d = defs.get(id); return d && d.audience && !d.audience.includes(state.audience) ? txt : m; });
